<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Florume Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Florume — العود والعنبر: محايدات مائلة للبنفسجي مع لون عنبري واحد */
:root {
  --bg: #f4f2f5;
  --surface: #ffffff;
  --surface-2: #efebf1;
  --ink: #221b26;
  --ink-2: #4a4150;
  --muted: #6e6574;
  --line: #e2dde6;
  --accent: #9c5712;
  --accent-strong: #7d450c;
  --accent-ink: #ffffff;
  --accent-soft: #f5e8d8;
  --side: #1f1823;
  --side-ink: #e9e2ec;
  --side-muted: #a397a8;
  --good: #1d7549;
  --good-soft: #e1f2e8;
  --warn: #9a6400;
  --warn-soft: #fbefd6;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --info: #2b5c96;
  --info-soft: #e2ecf8;
  --mute-soft: #ebe8ed;
  --shadow: 0 1px 2px rgba(34, 27, 38, .06), 0 8px 24px rgba(34, 27, 38, .06);
  --radius: 10px;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141016; --surface: #1d1820; --surface-2: #27212b; --ink: #eee8f0; --ink-2: #cfc6d3; --muted: #a79dac; --line: #342d38;
    --accent: #e0a15a; --accent-strong: #eeb676; --accent-ink: #1c1206; --accent-soft: #3b2b19;
    --side: #0f0c11; --side-ink: #e9e2ec; --side-muted: #968a9b;
    --good: #62c394; --good-soft: #17301f; --warn: #e3b453; --warn-soft: #342811; --bad: #f18179; --bad-soft: #3a1a18; --info: #86b4ea; --info-soft: #172a40; --mute-soft: #2a252e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141016; --surface: #1d1820; --surface-2: #27212b; --ink: #eee8f0; --ink-2: #cfc6d3; --muted: #a79dac; --line: #342d38;
  --accent: #e0a15a; --accent-strong: #eeb676; --accent-ink: #1c1206; --accent-soft: #3b2b19;
  --side: #0f0c11; --side-ink: #e9e2ec; --side-muted: #968a9b;
  --good: #62c394; --good-soft: #17301f; --warn: #e3b453; --warn-soft: #342811; --bad: #f18179; --bad-soft: #3a1a18; --info: #86b4ea; --info-soft: #172a40; --mute-soft: #2a252e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.num, th.num { text-align: left; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: plaintext; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: .86em; direction: ltr; unicode-bidi: plaintext; }
.muted { color: var(--muted); }
.cur { color: var(--muted); font-size: .8em; font-weight: 500; }
.good-text { color: var(--good); } .bad-text { color: var(--bad); } .warn-text { color: var(--warn); }
.strong { font-weight: 700; }

/* ---------- الهيكل ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); padding: 22px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; padding-inline: 8px; }
.brand b { font-family: var(--display); font-size: 1.45rem; font-weight: 600; letter-spacing: .02em; display: block; line-height: 1.2; }
.brand small { color: var(--side-muted); font-size: .75rem; }
.brand-drop { width: 30px; height: 38px; flex: none; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; background: linear-gradient(160deg, #f2c27f, #9c5712 70%); position: relative; }
.brand-drop::before { content: ""; position: absolute; top: -7px; left: 50%; width: 10px; height: 9px; transform: translateX(-50%); background: #cfc4d4; border-radius: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: var(--side-muted); text-decoration: none; padding: 9px 12px; border-radius: 8px; font-weight: 500; transition: background .15s, color .15s; }
.nav a:hover { color: var(--side-ink); background: rgba(255, 255, 255, .05); }
.nav a[aria-current="page"] { color: var(--side-ink); background: rgba(224, 161, 90, .16); box-shadow: inset -3px 0 0 #e0a15a; }
.side-foot { margin-top: auto; color: var(--side-muted); font-size: .75rem; letter-spacing: .08em; padding-inline: 12px; direction: ltr; text-align: right; }
.main { padding: 26px clamp(16px, 3vw, 36px) 60px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
#main { display: flex; flex-direction: column; gap: 20px; }

.demo-banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 10px 14px; border-radius: var(--radius); }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--display); font-weight: 600; font-size: 1.85rem; line-height: 1.25; }
.page-head p { margin: 4px 0 0; max-width: 68ch; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.doc-tools { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.section-title { font-size: 1rem; font-weight: 600; margin-bottom: 10px; color: var(--ink-2); }
.sub-title { font-size: .95rem; font-weight: 600; margin: 8px 0 0; color: var(--ink-2); }

/* ---------- عناصر ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-small { padding: 5px 10px; font-size: .88rem; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.file-btn { position: relative; }
.link-btn { background: none; border: 0; padding: 2px 4px; color: var(--accent); cursor: pointer; font-weight: 500; border-radius: 4px; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--bad); }
.icon-btn { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; background: var(--mute-soft); color: var(--muted); }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-info { background: var(--info-soft); color: var(--info); }

input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
input[type="number"], input[type="date"] { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.invalid { border-color: var(--bad) !important; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: .85rem; font-weight: 500; color: var(--ink-2); }
.field small { color: var(--muted); font-size: .78rem; }
.req { color: var(--bad); font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 14px; }
.span-2 { grid-column: span 2; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input[type="search"] { flex: 1 1 260px; width: auto; }
.filters select { width: auto; }
.period { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.period select, .period input { width: auto; border: 0; padding: 5px 8px; background: transparent; }
.period input { max-width: 150px; }

/* ---------- المؤشرات ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpis-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi-label { color: var(--muted); font-size: .84rem; font-weight: 500; }
.kpi-value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.kpi-note { color: var(--muted); font-size: .8rem; }
.kpi.good .kpi-value { color: var(--good); }
.kpi.bad .kpi-value { color: var(--bad); }

.position { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; }
.pos-grid > div { display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-inline-start: 1px solid var(--line); }
.pos-grid > div:first-child { border-inline-start: 0; padding-inline-start: 0; }
.pos-grid span { color: var(--muted); font-size: .82rem; }
.pos-grid b { font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.pos-grid .strong b { color: var(--accent); }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.list li:last-child { border-bottom: 0; }
.list li > span:first-child, .list li > .link-btn + span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); padding: 14px 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.empty p { margin: 0; }

/* ---------- الرسوم ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .axis { stroke: var(--muted); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .bar { fill: color-mix(in srgb, var(--accent) 55%, var(--surface)); transition: fill .15s; }
.chart .bar.last { fill: var(--accent); }
.chart .bar.neg { fill: var(--bad); }
.chart .hit { fill: transparent; }
.chart .bar-g:hover .bar { fill: var(--accent-strong); }
.chart .bar-g:hover .hit { fill: color-mix(in srgb, var(--accent) 7%, transparent); }
.tip { position: fixed; z-index: 60; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); padding: 4px 10px; border-radius: 6px; font-size: .82rem; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }

.hbars { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.hbars li { display: grid; grid-template-columns: minmax(110px, 160px) 1fr auto; gap: 10px; align-items: center; }
.hbars b { font-variant-numeric: tabular-nums; min-width: 70px; text-align: left; }
.hbar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }

/* ---------- الجداول ---------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel .table-wrap, .statement .table-wrap, .modal .table-wrap, .je .table-wrap { border-radius: 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--surface-2); white-space: nowrap; letter-spacing: .01em; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 0; }
.empty-row { text-align: center; color: var(--muted); padding: 26px; }
.row-actions { white-space: nowrap; text-align: left; }
.status-select { width: auto; padding: 3px 8px; font-size: .84rem; font-weight: 600; border-radius: 999px; }
.s-pending { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.s-shipped { background: var(--info-soft); color: var(--info); border-color: transparent; }
.s-delivered { background: var(--good-soft); color: var(--good); border-color: transparent; }
.s-returned { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.s-cancelled { background: var(--mute-soft); color: var(--muted); border-color: transparent; }

table.lines td { padding: 6px; }
table.lines td:first-child { min-width: 220px; }
table.lines input, table.lines select { padding: 6px 8px; }
table.lines .l-qty { width: 80px; }
table.lines .l-price, table.lines .l-cost, table.lines .c-amount { width: 120px; }
.l-stock { display: block; font-size: .76rem; margin-top: 2px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 12px; }
.summary div { display: flex; flex-direction: column; }
.summary span { font-size: .8rem; color: var(--muted); }
.summary b { font-variant-numeric: tabular-nums; }
.summary .strong b { color: var(--accent); font-size: 1.1rem; }

/* ---------- الخزينة ---------- */
.acc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.acc-card { text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.acc-card span { color: var(--muted); font-size: .78rem; }
.acc-card strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.acc-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.acc-card.courier { cursor: default; background: var(--surface-2); }

/* ---------- التقارير ---------- */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.report { display: flex; flex-direction: column; gap: 14px; }
.report h2 { font-size: 1.15rem; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.report h2 small { font-weight: 400; font-size: .85rem; }
.statement { display: flex; flex-direction: column; gap: 14px; max-width: 900px; }
.statement .grid-2 > div { display: flex; flex-direction: column; gap: 14px; }
table.fin td { padding: 8px 14px; }
table.fin tr.sub td:first-child { padding-inline-start: 30px; color: var(--ink-2); }
table.fin tr.head td { font-weight: 700; background: var(--surface-2); }
table.fin tr.total td { font-weight: 700; border-top: 1px solid var(--ink-2); }
table.fin tr.grand td { font-weight: 700; font-size: 1.08rem; background: var(--accent-soft); color: var(--accent-strong); }
table.fin tr.grand.neg td { background: var(--bad-soft); color: var(--bad); }
.journal { display: flex; flex-direction: column; gap: 10px; }
.je { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.je-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; font-size: .9rem; }
.je-head .mono { color: var(--muted); }
.je .table-wrap { border: 0; }
.je-lines td { padding: 4px 10px; border: 0; font-size: .9rem; }
.je-lines td.num { width: 130px; }
.je-lines .cr-acc { padding-inline-start: 40px; color: var(--ink-2); }

/* ---------- الفاتورة ---------- */
.invoice { display: flex; flex-direction: column; gap: 14px; }
.inv-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
.brand-mark { font-family: var(--display); font-size: 1.6rem; font-weight: 600; color: var(--accent); }
.inv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.inv-party { display: flex; flex-direction: column; }
.invoice tr.grand td { color: var(--accent-strong); font-size: 1.05rem; }
.internal { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; font-size: .88rem; color: var(--muted); }

/* ---------- النوافذ ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 14, 24, .55); }
.modal-card { position: relative; background: var(--surface); border-radius: 14px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shadow); }
.modal-card.wide { width: min(1000px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 1.1rem; font-weight: 600; }
.modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); justify-content: flex-start; flex-wrap: wrap; }
.confirm-text { margin: 0; font-size: 1rem; }
.export-box { width: 100%; min-height: 260px; font-family: var(--mono); font-size: .8rem; direction: ltr; text-align: left; }
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; z-index: 70; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); transition: opacity .3s, transform .3s; max-width: min(420px, calc(100vw - 32px)); }
.toast-bad { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }
.settings-form { gap: 14px; }
.settings-form .btn-primary { align-self: flex-start; }
.danger-title { color: var(--bad); margin-top: 8px; }
.imp-sheets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.imp-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface-2); }
.imp-box.bad { background: var(--bad-soft); border-color: transparent; }
.imp-box.warn { background: var(--warn-soft); border-color: transparent; }
.imp-box ul { margin: 6px 0 0; padding-inline-start: 20px; }
.imp-box summary { cursor: pointer; font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: auto; }

/* ---------- الهاتف ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { min-width: 0; position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; padding: 10px 16px; gap: 8px; flex-direction: column; }
  .brand small, .side-foot { display: none; }
  .brand b { font-size: 1.15rem; }
  .brand-drop { width: 18px; height: 24px; }
  .brand-drop::before { top: -5px; width: 7px; height: 6px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .nav a { white-space: nowrap; padding: 6px 12px; font-size: .9rem; }
  .nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 #e0a15a; }
  .main { padding: 18px 16px 50px; }
  .page-head h1 { font-size: 1.5rem; }

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>
<script>
/*
 * محرك المحاسبة — Florume
 * دوال نقية (بدون واجهة) تحسب: تكلفة المخزون بالمتوسط المرجح، تكلفة الشحنات الواصلة (Landed Cost)،
 * أرصدة الموردين بالعملة الأجنبية وفروق العملة، والقيود اليومية المزدوجة وكل التقارير المالية.
 * القيود لا تُخزَّن؛ تُولَّد من المستندات في كل مرة، فأي تعديل على مستند ينعكس فورًا وبدون تعارض.
 */
(function (root) {
  'use strict';

  const EPS = 0.005;
  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const num = (n) => Number(n) || 0;

  // ---------- دليل الحسابات ----------
  const COA = [
    { code: '1100', name: 'النقدية والبنوك والمحافظ', type: 'asset' },
    { code: '1200', name: 'مستحقات لدى شركات الشحن', type: 'asset' },
    { code: '1300', name: 'المخزون', type: 'asset' },
    { code: '1310', name: 'بضاعة في الطريق', type: 'asset' },
    { code: '2100', name: 'الموردين', type: 'liability' },
    { code: '3100', name: 'رأس المال', type: 'equity' },
    { code: '3200', name: 'المسحوبات الشخصية', type: 'equity' },
    { code: '4100', name: 'المبيعات', type: 'revenue' },
    { code: '4110', name: 'خصومات المبيعات', type: 'revenue', contra: true },
    { code: '4120', name: 'مردودات المبيعات', type: 'revenue', contra: true },
    { code: '4200', name: 'إيراد الشحن المحصل من العملاء', type: 'revenue' },
    { code: '4300', name: 'أرباح فروق العملة', type: 'revenue', other: true },
    { code: '4900', name: 'إيرادات أخرى', type: 'revenue', other: true },
    { code: '5100', name: 'تكلفة البضاعة المباعة', type: 'expense', cogs: true },
    { code: '5200', name: 'مصاريف شحن الطلبات', type: 'expense' },
    { code: '5210', name: 'مصاريف المرتجعات', type: 'expense' },
    { code: '5300', name: 'إعلانات وتسويق', type: 'expense' },
    { code: '5400', name: 'تغليف وتعبئة', type: 'expense' },
    { code: '5500', name: 'رواتب وعمولات', type: 'expense' },
    { code: '5600', name: 'إيجار ومرافق', type: 'expense' },
    { code: '5700', name: 'عمولات بنكية وتحويلات', type: 'expense' },
    { code: '5800', name: 'عجز وتوالف المخزون', type: 'expense' },
    { code: '5810', name: 'تسترات وعينات وهدايا', type: 'expense' },
    { code: '5900', name: 'خسائر فروق العملة', type: 'expense', other: true },
    { code: '5950', name: 'اشتراكات وبرامج', type: 'expense' },
    { code: '5990', name: 'مصروفات أخرى', type: 'expense' },
  ];
  const COA_MAP = Object.fromEntries(COA.map((a) => [a.code, a]));

  // التصنيفات المتاحة في شاشة المصروفات
  const EXPENSE_CATEGORIES = ['5300', '5400', '5200', '5500', '5600', '5700', '5950', '5990'];

  // حالات الطلب التي تُحسب فيها المبيعات
  const BOOKED = new Set(['shipped', 'delivered', 'returned']);

  const isDebitNature = (code) => {
    const a = COA_MAP[baseCode(code)];
    if (!a) return true;
    if (a.contra) return true;
    if (a.code === '3200') return true;
    return a.type === 'asset' || a.type === 'expense';
  };
  const baseCode = (code) => String(code).split(':')[0];
  const cashCode = (accountId) => '1100:' + accountId;

  const byDateThen = (priority) => (a, b) =>
    a.date < b.date ? -1 : a.date > b.date ? 1 : (priority[a.kind] || 0) - (priority[b.kind] || 0) || a.seq - b.seq;

  // ---------- حسابات الطلب ----------
  function saleTotals(sale) {
    const gross = round2((sale.items || []).reduce((s, it) => s + num(it.qty) * num(it.price), 0));
    const discount = round2(num(sale.discount));
    const shipping = round2(num(sale.shippingCharged));
    const net = round2(gross - discount);
    return { gross, discount, net, shipping, total: round2(net + shipping) };
  }

  // ---------- تكلفة الشحنة الواصلة ----------
  function shipmentCosting(shipment) {
    const rate = num(shipment.rate) || 1;
    const lines = (shipment.items || []).map((it) => {
      const foreign = num(it.qty) * num(it.unitCost);
      return { productId: it.productId, qty: num(it.qty), unitCost: num(it.unitCost), foreign, egp: foreign * rate };
    });
    const goodsForeign = round2(lines.reduce((s, l) => s + l.foreign, 0));
    const goodsEGP = round2(lines.reduce((s, l) => s + l.egp, 0));
    const extras = round2((shipment.costs || []).reduce((s, c) => s + num(c.amount), 0));
    const totalQty = lines.reduce((s, l) => s + l.qty, 0);
    lines.forEach((l) => {
      // توزيع المصاريف بنسبة القيمة، وإن كانت القيمة صفرًا فبنسبة الكمية
      const share = goodsEGP > 0 ? l.egp / goodsEGP : totalQty > 0 ? l.qty / totalQty : 0;
      l.extras = extras * share;
      l.landedTotal = l.egp + l.extras;
      l.landedUnit = l.qty > 0 ? l.landedTotal / l.qty : 0;
    });
    return { rate, lines, goodsForeign, goodsEGP, extras, landedTotal: round2(goodsEGP + extras), totalQty };
  }

  // ---------- إعادة تشغيل المخزون بالمتوسط المرجح ----------
  function computeInventory(state, asOf) {
    const events = [];
    let seq = 0;
    (state.shipments || []).forEach((sh) => {
      if (sh.status !== 'received') return;
      const date = sh.receivedDate || sh.orderDate;
      shipmentCosting(sh).lines.forEach((l, i) =>
        events.push({ kind: 'in', date, seq: seq++, productId: l.productId, qty: l.qty, cost: l.landedTotal, src: { type: 'shipment', id: sh.id, line: i } })
      );
    });
    (state.adjustments || []).forEach((adj) => {
      const qty = num(adj.qty);
      if (qty > 0) events.push({ kind: 'in', date: adj.date, seq: seq++, productId: adj.productId, qty, cost: adj.unitCost != null && adj.unitCost !== '' ? qty * num(adj.unitCost) : null, src: { type: 'adjustment', id: adj.id } });
      else if (qty < 0) events.push({ kind: 'outAdj', date: adj.date, seq: seq++, productId: adj.productId, qty: -qty, src: { type: 'adjustment', id: adj.id } });
    });
    (state.sales || []).forEach((sale) => {
      if (!BOOKED.has(sale.status)) return;
      (sale.items || []).forEach((it, i) => events.push({ kind: 'sale', date: sale.date, seq: seq++, productId: it.productId, qty: num(it.qty), src: { type: 'sale', id: sale.id, line: i } }));
      if (sale.status === 'returned') {
        (sale.items || []).forEach((it, i) => events.push({ kind: 'return', date: sale.returnDate || sale.date, seq: seq++, productId: it.productId, qty: num(it.qty), src: { type: 'sale', id: sale.id, line: i } }));
      }
    });
    events.sort(byDateThen({ in: 0, return: 1, sale: 2, outAdj: 3 }));

    const stock = {}; // productId -> {qty, value, lastCost}
    const saleCogs = {}; // saleId -> [cogs per line]
    const adjCost = {}; // adjustmentId -> total cost
    const movements = []; // لكل منتج
    const warnings = [];
    const get = (pid) => (stock[pid] = stock[pid] || { qty: 0, value: 0, lastCost: 0 });

    for (const ev of events) {
      if (asOf && ev.date > asOf) break;
      const s = get(ev.productId);
      const avg = s.qty > EPS ? s.value / s.qty : s.lastCost;
      let cost;
      if (ev.kind === 'in') {
        cost = ev.cost == null ? ev.qty * avg : ev.cost;
        s.qty += ev.qty; s.value += cost;
        if (ev.qty > 0) s.lastCost = cost / ev.qty;
        if (ev.src.type === 'adjustment') adjCost[ev.src.id] = cost;
      } else if (ev.kind === 'return') {
        cost = (saleCogs[ev.src.id] || [])[ev.src.line] || ev.qty * avg;
        s.qty += ev.qty; s.value += cost;
      } else {
        if (s.qty + EPS < ev.qty) warnings.push({ productId: ev.productId, date: ev.date, src: ev.src, message: 'رصيد غير كافٍ' });
        cost = ev.qty * avg;
        s.qty -= ev.qty; s.value -= cost;
        if (Math.abs(s.qty) < EPS) { s.qty = 0; s.value = 0; }
        if (ev.kind === 'sale') (saleCogs[ev.src.id] = saleCogs[ev.src.id] || [])[ev.src.line] = cost;
        else adjCost[ev.src.id] = cost;
      }
      movements.push({ ...ev, cost: round2(cost), balanceQty: s.qty, balanceValue: round2(s.value) });
    }
    // الكميات المحجوزة: طلبات قيد التجهيز
    const reserved = {};
    (state.sales || []).forEach((sale) => {
      if (sale.status !== 'pending') return;
      (sale.items || []).forEach((it) => (reserved[it.productId] = (reserved[it.productId] || 0) + num(it.qty)));
    });
    const products = {};
    (state.products || []).forEach((p) => {
      const s = stock[p.id] || { qty: 0, value: 0, lastCost: 0 };
      const qty = round2(s.qty);
      products[p.id] = {
        qty, value: round2(s.value), avgCost: qty > EPS ? s.value / qty : s.lastCost,
        reserved: reserved[p.id] || 0, available: round2(qty - (reserved[p.id] || 0)),
      };
    });
    return { products, saleCogs, adjCost, movements, warnings };
  }

  // ---------- أرصدة الموردين بالعملة الأجنبية وفروق العملة ----------
  function computeSuppliers(state, asOf) {
    const events = [];
    let seq = 0;
    (state.shipments || []).forEach((sh) => {
      if (sh.status === 'cancelled') return;
      const c = shipmentCosting(sh);
      if (c.goodsForeign) events.push({ kind: 'purchase', date: sh.orderDate, seq: seq++, supplierId: sh.supplierId, foreign: c.goodsForeign, rate: c.rate, ref: { type: 'shipment', id: sh.id } });
    });
    (state.supplierPayments || []).forEach((p) =>
      events.push({ kind: 'payment', date: p.date, seq: seq++, supplierId: p.supplierId, foreign: -num(p.amount), rate: num(p.rate) || 1, ref: { type: 'supplierPayment', id: p.id } })
    );
    events.sort(byDateThen({ purchase: 0, payment: 1 }));

    const balances = {}; // supplierId -> {foreign, egp}
    const fx = {}; // ref id -> adj (موجب = خسارة: نحتاج دائن إضافي للمورد)
    const lines = [];
    for (const ev of events) {
      if (asOf && ev.date > asOf) break;
      const b = (balances[ev.supplierId] = balances[ev.supplierId] || { foreign: 0, egp: 0 });
      const x = ev.foreign;
      const before = b.egp;
      if (Math.abs(b.foreign) < EPS || Math.sign(x) === Math.sign(b.foreign)) {
        b.foreign += x; b.egp += x * ev.rate;
      } else {
        const closing = Math.sign(x) * Math.min(Math.abs(x), Math.abs(b.foreign));
        const avg = b.egp / b.foreign;
        b.foreign += closing; b.egp += closing * avg;
        const rest = x - closing;
        if (Math.abs(rest) > EPS) { b.foreign += rest; b.egp += rest * ev.rate; }
        if (Math.abs(b.foreign) < EPS) { b.foreign = 0; b.egp = 0; }
      }
      const adj = round2(b.egp - (before + x * ev.rate));
      fx[ev.ref.id] = adj;
      lines.push({ ...ev, egp: round2(x * ev.rate), fx: adj, balanceForeign: round2(b.foreign), balanceEGP: round2(b.egp) });
    }
    Object.values(balances).forEach((b) => { b.foreign = round2(b.foreign); b.egp = round2(b.egp); });
    return { balances, fx, lines };
  }

  // ---------- توليد القيود اليومية ----------
  function buildJournal(state) {
    const inv = computeInventory(state);
    const sup = computeSuppliers(state);
    const S = state.settings || {};
    const entries = [];
    const name = (list, id) => ((state[list] || []).find((x) => x.id === id) || {}).name || '';
    const productName = (id) => {
      const p = (state.products || []).find((x) => x.id === id);
      return p ? `${p.brand ? p.brand + ' ' : ''}${p.name}` : '';
    };
    const add = (date, source, ref, desc, lines) => {
      const clean = lines
        .map((l) => ({ ...l, dr: round2(l.dr), cr: round2(l.cr) }))
        .filter((l) => Math.abs(l.dr) > EPS || Math.abs(l.cr) > EPS)
        .map((l) => (l.dr < 0 || l.cr < 0 ? { ...l, dr: Math.max(l.dr, 0) + Math.max(-l.cr, 0), cr: Math.max(l.cr, 0) + Math.max(-l.dr, 0) } : l));
      if (!clean.length) return;
      entries.push({ date, source, ref, desc, lines: clean });
    };
    const fxLines = (adj, party) =>
      adj > 0 ? [{ acc: '5900', dr: adj, cr: 0 }, { acc: '2100', dr: 0, cr: adj, party }]
      : adj < 0 ? [{ acc: '2100', dr: -adj, cr: 0, party }, { acc: '4300', dr: 0, cr: -adj }] : [];

    // أرصدة افتتاحية للخزائن
    (state.accounts || []).forEach((a) => {
      if (num(a.opening)) add(S.startDate || '2000-01-01', 'opening', { type: 'account', id: a.id }, `رصيد افتتاحي — ${a.name}`, [
        { acc: cashCode(a.id), dr: num(a.opening), cr: 0 }, { acc: '3100', dr: 0, cr: num(a.opening) },
      ]);
    });

    // رأس المال والمسحوبات
    (state.equity || []).forEach((e) => {
      const amt = num(e.amount);
      if (e.type === 'drawing') add(e.date, 'equity', { type: 'equity', id: e.id }, `مسحوبات شخصية ${e.notes ? '— ' + e.notes : ''}`, [
        { acc: '3200', dr: amt, cr: 0 }, { acc: cashCode(e.accountId), dr: 0, cr: amt },
      ]);
      else add(e.date, 'equity', { type: 'equity', id: e.id }, `إضافة رأس مال ${e.notes ? '— ' + e.notes : ''}`, [
        { acc: cashCode(e.accountId), dr: amt, cr: 0 }, { acc: '3100', dr: 0, cr: amt },
      ]);
    });

    // الشحنات
    (state.shipments || []).forEach((sh) => {
      if (sh.status === 'cancelled') return;
      const c = shipmentCosting(sh);
      const party = { type: 'supplier', id: sh.supplierId };
      const ref = { type: 'shipment', id: sh.id };
      const label = `شحنة ${sh.ref || ''} — ${name('suppliers', sh.supplierId)}`;
      add(sh.orderDate, 'shipment', ref, `${label} (${c.goodsForeign} ${sh.currency} × ${c.rate})`, [
        { acc: '1310', dr: c.goodsEGP, cr: 0 }, { acc: '2100', dr: 0, cr: c.goodsEGP, party }, ...fxLines(sup.fx[sh.id] || 0, party),
      ]);
      (sh.costs || []).forEach((cost) => {
        add(cost.date || sh.orderDate, 'shipment', ref, `${label} — ${cost.label || 'مصاريف'}`, [
          { acc: '1310', dr: num(cost.amount), cr: 0 }, { acc: cashCode(cost.accountId), dr: 0, cr: num(cost.amount) },
        ]);
      });
      if (sh.status === 'received') add(sh.receivedDate || sh.orderDate, 'shipment', ref, `استلام ${label} في المخزن`, [
        { acc: '1300', dr: c.landedTotal, cr: 0 }, { acc: '1310', dr: 0, cr: c.landedTotal },
      ]);
    });

    // دفعات الموردين
    (state.supplierPayments || []).forEach((p) => {
      const party = { type: 'supplier', id: p.supplierId };
      const egp = num(p.amount) * (num(p.rate) || 1);
      const fee = num(p.fee);
      add(p.date, 'supplierPayment', { type: 'supplierPayment', id: p.id }, `دفعة للمورد ${name('suppliers', p.supplierId)} (${num(p.amount)} × ${num(p.rate) || 1})`, [
        { acc: '2100', dr: egp, cr: 0, party }, { acc: '5700', dr: fee, cr: 0 },
        { acc: cashCode(p.accountId), dr: 0, cr: egp + fee }, ...fxLines(sup.fx[p.id] || 0, party),
      ]);
    });

    // المبيعات
    (state.sales || []).forEach((sale) => {
      if (!BOOKED.has(sale.status)) return;
      const t = saleTotals(sale);
      const ref = { type: 'sale', id: sale.id };
      const courier = { type: 'courier', id: sale.courierId };
      const prepaid = sale.payment && sale.payment !== 'cod';
      const debitAcc = prepaid ? cashCode(sale.payment) : '1200';
      const cogs = round2((inv.saleCogs[sale.id] || []).reduce((s, c) => s + (c || 0), 0));
      const cust = name('customers', sale.customerId);
      add(sale.date, 'sale', ref, `فاتورة ${sale.no || ''} — ${cust}`, [
        { acc: debitAcc, dr: t.total, cr: 0, party: prepaid ? undefined : courier },
        { acc: '4110', dr: t.discount, cr: 0 },
        { acc: '4100', dr: 0, cr: t.gross }, { acc: '4200', dr: 0, cr: t.shipping },
        { acc: '5100', dr: cogs, cr: 0 }, { acc: '1300', dr: 0, cr: cogs },
        { acc: '5200', dr: num(sale.courierFee), cr: 0 }, { acc: '1200', dr: 0, cr: num(sale.courierFee), party: courier },
      ]);
      if (sale.status === 'returned') {
        add(sale.returnDate || sale.date, 'saleReturn', ref, `مرتجع فاتورة ${sale.no || ''} — ${cust}`, [
          { acc: '4120', dr: t.net, cr: 0 }, { acc: '4200', dr: t.shipping, cr: 0 },
          { acc: debitAcc, dr: 0, cr: t.total, party: prepaid ? undefined : courier },
          { acc: '1300', dr: cogs, cr: 0 }, { acc: '5100', dr: 0, cr: cogs },
          { acc: '5210', dr: num(sale.returnFee), cr: 0 }, { acc: '1200', dr: 0, cr: num(sale.returnFee), party: courier },
        ]);
      }
    });

    // تسويات شركات الشحن (تحصيل صافي الدفع عند الاستلام)
    (state.settlements || []).forEach((st) => {
      const amt = num(st.amount);
      const courier = { type: 'courier', id: st.courierId };
      add(st.date, 'settlement', { type: 'settlement', id: st.id }, `${amt >= 0 ? 'تحصيل من' : 'سداد إلى'} ${name('couriers', st.courierId)}`, [
        { acc: cashCode(st.accountId), dr: amt, cr: 0 }, { acc: '1200', dr: 0, cr: amt, party: courier },
      ]);
    });

    // المصروفات
    (state.expenses || []).forEach((e) => {
      add(e.date, 'expense', { type: 'expense', id: e.id }, `${(COA_MAP[e.category] || {}).name || 'مصروف'}${e.notes ? ' — ' + e.notes : ''}`, [
        { acc: e.category || '5990', dr: num(e.amount), cr: 0 }, { acc: cashCode(e.accountId), dr: 0, cr: num(e.amount) },
      ]);
    });

    // التحويلات بين الخزائن
    (state.transfers || []).forEach((t) => {
      add(t.date, 'transfer', { type: 'transfer', id: t.id }, `تحويل من ${name('accounts', t.fromId)} إلى ${name('accounts', t.toId)}`, [
        { acc: cashCode(t.toId), dr: num(t.amount), cr: 0 }, { acc: '5700', dr: num(t.fee), cr: 0 },
        { acc: cashCode(t.fromId), dr: 0, cr: num(t.amount) + num(t.fee) },
      ]);
    });

    // تسويات المخزون

    const bare = text.replace(/ج\.م|SAR|AED|USD|EGP|,/g, '').replace(/\s+/g, '');
    if (/^-?\d+(\.\d+)?%$/.test(bare)) return { v: Number(bare.slice(0, -1)) / 100, pct: true };
    if (/^-?\d+(\.\d+)?$/.test(bare) && (el.classList.contains('num') || el.closest('.kpi-value, .pos-grid b, .acc-card strong, .summary b, .hbars b'))) return Number(bare);

    if (v == null || v === '') return '';
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return d.toISOString().slice(0, 10);
    }
    const s = latinDigits(str(v));
    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (m) { // يوم/شهر/سنة (الصيغة المصرية)، إلا لو اليوم > 12 في الخانة الثانية
      let [dd, mm] = [Number(m[1]), Number(m[2])];
      if (mm > 12 && dd <= 12) [dd, mm] = [mm, dd];
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return `${m[3]}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
    }
    return 'invalid';
  }

  // ---------- التعرف على الأوراق ----------
  const FIELDS = {
    sales: {
      orderNo: ['orderno', 'رقمالفاتوره', 'رقمالطلب', 'الفاتوره', 'م'],
      trackingNo: ['trackingno', 'tracking', 'رقمالبوليصه', 'البوليصه', 'رقمالشحنه'],
      type: ['type', 'النوع'],
      date: ['date', 'التاريخ'],
      customerName: ['customername', 'customer', 'العميل', 'اسمالعميل'],
      customerPhone: ['customerphone', 'phone', 'الموبايل', 'الهاتف', 'رقمالموبايل', 'التليفون'],
      customerAddress: ['customeraddress', 'address', 'العنوان'],
      productName: ['productname', 'product', 'المنتج', 'الصنف', 'اسمالمنتج'],
      qty: ['qty', 'quantity', 'الكميه', 'العدد'],
      netTotal: ['nettotal', 'total', 'الاجمالي', 'صافيالاجمالي', 'قيمهالبيع'],
      cogs: ['cogs', 'التكلفه'],
      profit: ['profit', 'الربح'],
      account: ['account', 'payment', 'طريقهالدفع', 'الحساب', 'الدفع'],
      channel: ['channel', 'القناه'],
    },
    stock: {
      sku: ['sku', 'code', 'الكود', 'كودالمنتج'],
      name: ['name', 'productname', 'الاسم', 'المنتج', 'اسمالمنتج'],
      qty: ['qty', 'quantity', 'الكميه', 'الرصيد'],
      cost: ['cost', 'unitcost', 'التكلفه', 'تكلفهالوحده'],
      price: ['price', 'saleprice', 'السعر', 'سعرالبيع'],
    },
    expenses: {
      date: ['date', 'التاريخ'],
      category: ['category', 'البند', 'التصنيف', 'النوع'],
      amount: ['amount', 'المبلغ', 'القيمه'],
      payment: ['payment', 'account', 'طريقهالدفع', 'الحساب', 'دفعمن'],
      desc: ['desc', 'description', 'notes', 'البيان', 'الوصف', 'ملاحظات'],
    },
  };
  const REQUIRED = { sales: ['date', 'productName', 'qty', 'netTotal'], stock: ['name', 'qty'], expenses: ['date', 'amount'] };
  const KIND_LABEL = { sales: 'مبيعات', stock: 'مخزون ومنتجات', expenses: 'مصروفات' };

  function mapHeader(cells, kind) {
    const map = {};
    const keys = cells.map(normKey);
    Object.entries(FIELDS[kind]).forEach(([field, aliases]) => {
      const i = keys.findIndex((k, idx) => k && aliases.includes(k) && !Object.values(map).includes(idx));
      if (i >= 0) map[field] = i;
    });
    return map;
  }
  function detectSheets(sheets) {
    const found = [], ignored = [];
    sheets.forEach((sh) => {
      const nonEmpty = sh.rows.filter((r) => r.some((v) => str(v) !== ''));
      if (!nonEmpty.length) { ignored.push({ name: sh.name, reason: 'الورقة فارغة' }); return; }
      let best = null;
      for (let h = 0; h < Math.min(sh.rows.length, 12) && !best; h++) {
        const cells = sh.rows[h] || [];
        for (const kind of ['sales', 'expenses', 'stock']) {
          const map = mapHeader(cells, kind);
          if (REQUIRED[kind].every((f) => map[f] != null)) { best = { kind, map, headerRow: h }; break; }
        }
      }
      if (!best) { ignored.push({ name: sh.name, reason: 'لم أتعرف على أعمدة هذه الورقة' }); return; }
      const rows = [];
      for (let r = best.headerRow + 1; r < sh.rows.length; r++) {
        const cells = sh.rows[r] || [];
        if (!cells.some((v) => str(v) !== '')) continue;
        const obj = { _row: r + 1 };
        Object.entries(best.map).forEach(([f, i]) => (obj[f] = cells[i]));
        rows.push(obj);
      }
      found.push({ name: sh.name, kind: best.kind, rows });
    });
    return { found, ignored };
  }

  // ---------- تصنيف المصروفات وطرق الدفع ----------
  const CATEGORY_RULES = [
    [/تسويق|اعلان|إعلان|دعايه|دعاية|ميتا|فيسبوك|انستا|تيك|marketing|ads/i, '5300'],
    [/تغليف|تعبئه|تعبئة|علب|اكياس|أكياس|packag/i, '5400'],
    [/شحن|مندوب|توصيل|shipping|courier/i, '5200'],
    [/راتب|رواتب|مرتب|عموله|عمولة|salary/i, '5500'],
    [/ايجار|إيجار|كهرباء|مياه|انترنت|إنترنت|rent/i, '5600'],
    [/بنك|تحويل|bank|fee/i, '5700'],
    [/اشتراك|برنامج|موقع|دومين|subscription|software/i, '5950'],
  ];
  const guessCategory = (s) => { const t = str(s); for (const [re, code] of CATEGORY_RULES) if (re.test(t)) return code; return '5990'; };
  const isStockPayment = (v) => /مخزون|stock|inventory/i.test(str(v));
  const isPromo = (row) => /promo|عين|دعاي|هدي|gift|sample/i.test(`${str(row.type)} ${str(row.account)}`);

  function guessAccount(value, accounts) {
    const v = normName(value);
    const byType = (t) => accounts.find((a) => a.type === t);
    const byName = (re) => accounts.find((a) => re.test(normName(a.name)));
    if (/فودافون|vodafone|voda/.test(v)) return (byName(/فودافون|vodafone/) || byType('wallet') || {}).id;
    if (/انستا|instapay|insta/.test(v)) return (byName(/انستا|insta/) || byType('wallet') || {}).id;
    if (/بنك|bank|تحويل|transfer/.test(v)) return (byType('bank') || {}).id;
    if (/نقد|كاش|cash|خزين/.test(v)) return (byType('cash') || {}).id;
    return null;
  }
  // الاقتراح المبدئي لربط قيم الدفع في الملف بحسابات النظام
  function defaultMappings(sheets, state) {
    const { found } = detectSheets(sheets);
    const accounts = state.accounts || [], couriers = state.couriers || [];
    const cod = couriers[0] ? `cod:${couriers[0].id}` : 'cod:';
    const salesPay = {}, expensePay = {};
    found.filter((s) => s.kind === 'sales').forEach((s) => s.rows.forEach((r) => {
      if (isPromo(r)) return;
      const key = str(r.account) || '(فارغ)';
      if (salesPay[key]) return;
      const acc = /ship|شحن|cod|استلام|courier/i.test(key) ? null : guessAccount(key, accounts);
      salesPay[key] = acc || cod;
    }));
    found.filter((s) => s.kind === 'expenses').forEach((s) => s.rows.forEach((r) => {
      const key = str(r.payment) || '(فارغ)';
      if (expensePay[key]) return;
      expensePay[key] = isStockPayment(key) ? 'skip' : guessAccount(key, accounts) || (accounts.find((a) => a.type === 'cash') || accounts[0] || {}).id || 'skip';
    }));
    const dates = found.flatMap((s) => (s.kind === 'stock' ? [] : s.rows.map((r) => toDate(r.date)))).filter((d) => d && d !== 'invalid').sort();
    return { salesPay, expensePay, status: 'delivered', openingDate: dates[0] || '' };
  }

  // ---------- الخطة ----------
  function planImport(sheets, state, opts, uid) {
    const makeId = uid || (() => Math.random().toString(36).slice(2, 10));
    const { found, ignored } = detectSheets(sheets);
    const errors = [], warnings = [], skipped = [];
    const today = new Date().toISOString().slice(0, 10);
    const openingDate = opts.openingDate || today;
    const existingRefs = new Set([...(state.sales || []), ...(state.adjustments || []), ...(state.expenses || [])].map((x) => x.importRef).filter(Boolean));

    // المنتجات
    const products = []; // {id, sku, name, price, cost, currentQty, soldQty, isNew, fromSales}
    const byNorm = new Map(), bySku = new Map();
    (state.products || []).forEach((p) => {
      const label = `${p.brand ? p.brand + ' ' : ''}${p.name}`;
      const entry = { id: p.id, sku: p.sku || '', name: p.name, price: p.price, cost: null, currentQty: null, soldQty: 0, isNew: false, existing: p };
      if (p.sku) bySku.set(normKey(p.sku), entry);
      byNorm.set(normName(p.name), entry); byNorm.set(normName(label), entry);
    });
    const registerFileProduct = (row, sheet) => {
      const name = str(row.name);
      if (!name) { errors.push({ sheet, row: row._row, reason: 'اسم المنتج فارغ' }); return; }
      const qty = toNumber(row.qty), cost = toNumber(row.cost), price = toNumber(row.price);
      if (qty == null || isNaN(qty) || qty < 0) { errors.push({ sheet, row: row._row, reason: `كمية غير صحيحة للمنتج «${name}»` }); return; }
      const sku = str(row.sku);
      let entry = (sku && bySku.get(normKey(sku))) || byNorm.get(normName(name));
      if (entry && !entry.isNew) {
        warnings.push(`المنتج «${name}» موجود بالفعل في النظام — لن يُضاف له مخزون افتتاحي من الملف`);
        entry.currentQty = qty; entry.cost = isNaN(cost) ? null : cost;
        return;
      }
      if (entry && entry.isNew) { warnings.push(`المنتج «${name}» مكرر في ورقة المخزون (سطر ${row._row}) — تم جمع الكميات`); entry.currentQty += qty; return; }
      entry = { id: makeId(), sku, name, price: isNaN(price) || price == null ? 0 : price, cost: isNaN(cost) || cost == null ? 0 : cost, currentQty: qty, soldQty: 0, isNew: true };
      products.push(entry);
      if (sku) bySku.set(normKey(sku), entry);
      byNorm.set(normName(name), entry);
      if (cost == null || isNaN(cost)) warnings.push(`المنتج «${name}» بدون تكلفة — سيُسجل مخزونه الافتتاحي بتكلفة صفر`);
    };
    found.filter((s) => s.kind === 'stock').forEach((s) => s.rows.forEach((r) => registerFileProduct(r, s.name)));

    // العملاء
    const customers = [];
    const custByPhone = new Map(), custByName = new Map();
    (state.customers || []).forEach((c) => { if (phoneKey(c.phone)) custByPhone.set(phoneKey(c.phone), c); custByName.set(normName(c.name), c); });
    const customerFor = (row) => {
      const name = str(row.customerName), phone = phoneKey(row.customerPhone);
      if (!name && !phone) return '';
      let c = (phone && custByPhone.get(phone)) || (!phone && custByName.get(normName(name)));
      if (!c) {
        c = { id: makeId(), name: name || phone, phone: phone || '', city: '', address: str(row.customerAddress) };
        const m = c.address.match(/[,،]\s*([^,،]+)$/);
        if (m) c.city = m[1].trim();
        customers.push(c);
        if (phone) custByPhone.set(phone, c);
        custByName.set(normName(c.name), c);
      }
      return c.id;
    };

    // المبيعات والعينات
    const groups = new Map();
    const promos = [];
    let fileCogs = 0, cogsGap = 0, cogsGapLines = 0;
    found.filter((s) => s.kind === 'sales').forEach((s) => s.rows.forEach((r) => {
      const where = { sheet: s.name, row: r._row };
      const date = toDate(r.date);
      const qty = toNumber(r.qty), total = toNumber(r.netTotal);
      const pname = str(r.productName);
      if (!date || date === 'invalid') { errors.push({ ...where, reason: `تاريخ غير صحيح «${str(r.date)}»` }); return; }
      if (!pname) { errors.push({ ...where, reason: 'اسم المنتج فارغ' }); return; }
      if (qty == null || isNaN(qty) || qty <= 0) { errors.push({ ...where, reason: `كمية غير صحيحة «${str(r.qty)}»` }); return; }
      if (total == null || isNaN(total) || total < 0) { errors.push({ ...where, reason: `مبلغ غير صحيح «${str(r.netTotal)}»` }); return; }
      let product = byNorm.get(normName(pname));
      const cogs = toNumber(r.cogs);
      if (!product) {
        product = { id: makeId(), sku: '', name: pname, price: total > 0 ? total / qty : 0, cost: cogs > 0 ? cogs / qty : 0, currentQty: 0, soldQty: 0, isNew: true, fromSales: true };
        products.push(product); byNorm.set(normName(pname), product);
        warnings.push(`المنتج «${pname}» غير موجود في ورقة المخزون — سيُضاف بتكلفة ${Math.round(product.cost)} ورصيد صفر بعد البيع`);
      }
      const ref = cleanRef(r.trackingNo);
      const promo = isPromo(r);
      const importRef = promo ? `erp:promo:${str(r.orderNo) || r._row}` : `erp:${ref || 'line:' + (str(r.orderNo) || r._row)}`;
      if (existingRefs.has(importRef)) { skipped.push({ ...where, reason: `مستورد من قبل (${ref || 'بند ' + str(r.orderNo)})` }); return; }
      product.soldQty += qty;
      if (cogs > 0 && product.cost != null) { fileCogs += cogs; const gap = cogs - qty * product.cost; if (Math.abs(gap) > 1) { cogsGap += gap; cogsGapLines++; } }
      if (promo) {
        promos.push({ id: makeId(), date, productId: product.id, qty: -qty, unitCost: null, reason: 'promo', notes: `عينة دعاية${str(r.customerName) ? ' — ' + str(r.customerName) : ''}${str(r.orderNo) ? ' (بند ' + str(r.orderNo) + ')' : ''}`, importRef });
        return;
      }
      const customerId = customerFor(r);
      const payKey = str(r.account) || '(فارغ)';
      const pay = opts.salesPay[payKey] || 'cod:';
      if (!groups.has(importRef)) {
        const isCod = pay.startsWith('cod:');
        groups.set(importRef, {
          id: makeId(), date, customerId, channel: 'other', status: opts.status || 'delivered',
          items: [], discount: 0, shippingCharged: 0, courierId: isCod ? pay.slice(4) : ((state.couriers || [])[0] || {}).id || '', courierFee: 0,
          payment: isCod ? 'cod' : pay, returnDate: '', returnFee: 0,
          notes: `مستورد من الملف${ref ? ' — بوليصة ' + ref : ''} — بند ${str(r.orderNo) || r._row}`, importRef, _rows: [r._row],
        });
      } else {
        const g = groups.get(importRef);
        g._rows.push(r._row);
        g.notes = `مستورد من الملف${ref ? ' — بوليصة ' + ref : ''} — بنود ${g._rows.length}`;
        if (g.date !== date) warnings.push(`البوليصة ${ref} فيها أكثر من تاريخ — استخدمت ${g.date}`);
      }
      groups.get(importRef).items.push({ productId: product.id, qty, price: Math.round((total / qty) * 100) / 100 });
    }));
    const sales = [...groups.values()];
    if (cogsGapLines) warnings.push(`${cogsGapLines} سطر مبيعات تكلفتها في الملف تختلف عن تكلفة المنتج في ورقة المخزون (الفرق ${Math.round(cogsGap)} ج.م) — النظام يحسب التكلفة من تكلفة المخزون`);

    // المخزون الافتتاحي = الرصيد الحالي + ما خرج في الملف
    const opening = [];
    products.filter((p) => p.isNew).forEach((p) => {
      const qty = (p.currentQty || 0) + p.soldQty;
      if (qty > 0) opening.push({ id: makeId(), date: openingDate, productId: p.id, qty, unitCost: p.cost || 0, reason: 'opening', notes: 'مخزون افتتاحي من ملف الاستيراد', importRef: `erp:opening:${p.sku || normKey(p.name)}` });
    });
    products.filter((p) => !p.isNew && p.soldQty > 0).forEach((p) => warnings.push(`«${p.name}» موجود مسبقًا وخرج منه ${p.soldQty} في الملف — تأكد أن رصيده في النظام يكفي`));
    const early = [...sales, ...promos].filter((x) => x.date < openingDate);
    if (early.length) warnings.push(`${early.length} عملية قبل تاريخ المخزون الافتتاحي (${openingDate}) — سيظهر رصيد غير كافٍ. اختر تاريخًا أقدم`);

    // المصروفات
    const expenses = [];
    found.filter((s) => s.kind === 'expenses').forEach((s) => s.rows.forEach((r) => {
      const where = { sheet: s.name, row: r._row };
      const date = toDate(r.date), amount = toNumber(r.amount);
      if (!date || date === 'invalid') { errors.push({ ...where, reason: `تاريخ غير صحيح «${str(r.date)}»` }); return; }
      if (amount == null || isNaN(amount) || amount <= 0) { errors.push({ ...where, reason: `مبلغ غير صحيح «${str(r.amount)}»` }); return; }
      const payKey = str(r.payment) || '(فارغ)';
      const acc = opts.expensePay[payKey];
      if (!acc || acc === 'skip') { skipped.push({ ...where, reason: isStockPayment(payKey) ? `مدفوع من المخزون — مسجل كعينة دعاية: ${str(r.desc).slice(0, 60)}` : `طريقة الدفع «${payKey}» اخترت تخطيها` }); return; }
      const importRef = `erp:exp:${date}:${amount}:${normKey(r.desc).slice(0, 40)}`;
      if (existingRefs.has(importRef)) { skipped.push({ ...where, reason: 'مستورد من قبل' }); return; }
      expenses.push({ id: makeId(), date, category: guessCategory(`${str(r.category)} ${str(r.desc)}`), amount, accountId: acc, notes: str(r.desc) || str(r.category), importRef });
    }));

    const totals = {
      revenue: sales.reduce((s, x) => s + x.items.reduce((a, it) => a + it.qty * it.price, 0), 0),
      lines: sales.reduce((s, x) => s + x.items.length, 0),
      openingQty: opening.reduce((s, a) => s + a.qty, 0),
      openingValue: opening.reduce((s, a) => s + a.qty * a.unitCost, 0),
      promoQty: promos.reduce((s, a) => s - a.qty, 0),
      expenses: expenses.reduce((s, e) => s + e.amount, 0),
      fileCogs,
    };
    return { found: found.map((f) => ({ name: f.name, kind: f.kind, label: KIND_LABEL[f.kind], rows: f.rows.length })), ignored, products, customers, sales, promos, opening, expenses, errors, warnings, skipped, totals, openingDate };
  }

  // ---------- التطبيق ----------
  function applyImport(state, plan) {
    const s = JSON.parse(JSON.stringify(state));
    plan.products.filter((p) => p.isNew).forEach((p) => s.products.push({ id: p.id, sku: p.sku, brand: '', name: p.name, sizeMl: '', gender: 'unisex', price: p.price, minStock: s.settings.lowStock }));
    s.customers.push(...plan.customers);
    s.adjustments.push(...plan.opening, ...plan.promos);
    [...plan.sales].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)).forEach((sale) => {
      const { _rows, ...clean } = sale;
      s.sales.push({ ...clean, no: s.settings.nextInvoiceNo++ });
    });
    s.expenses.push(...plan.expenses);
    if (plan.openingDate && (!s.settings.startDate || s.settings.startDate > plan.openingDate)) s.settings.startDate = plan.openingDate;
    s.demo = false;
    return s;
  }

  const api = { readWorkbook, parseCsv, detectSheets, defaultMappings, planImport, applyImport, toDate, toNumber, phoneKey, normName };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.IMP = api;
})(typeof window !== 'undefined' ? window : globalThis);

(function () {

  const emptyState = () => ({

  // ---------- أدوات ----------

    const top = nice(maxV) || 1, bottom = nice(minV);
    const y = (v) => padT + ((top - v) / (top - bottom)) * (H - padT - padB);
    const bw = (W - padL - padR) / series.length;
    const ticks = bottom < 0 ? (-bottom / (top - bottom) > 0.15 ? [top, 0, bottom] : [top, 0]) : [top, top / 2, 0];
    const col = (i) => series.length - 1 - i; // من اليمين لليسار
    const monthName = (m) => new Date(m + '-01T00:00:00').toLocaleDateString('ar-EG', { month: 'short' });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(label)}">
      ${ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" class="${t === 0 ? 'axis' : 'grid'}"/><text x="${W - padR + 6}" y="${y(t) + 4}" class="tick" text-anchor="start">${t ? fmt(t / 1000, 1) + 'k' : '0'}</text>`).join('')}
      ${series.map((s, i) => {
        const v = s[key]; const x = padL + col(i) * bw + bw * 0.22; const w = bw * 0.56;
        const y0 = y(Math.max(v, 0)), h = Math.max(Math.abs(y(v) - y(0)), v ? 1.5 : 0);
        const cx = padL + col(i) * bw + bw / 2;
        return `<g class="bar-g" data-tip="${esc(monthName(s.month))} ${s.month.slice(0, 4)}: ${fmt(v)} ج.م">
          <rect x="${padL + col(i) * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" class="hit"/>
          <rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="3" class="bar ${v < 0 ? 'neg' : ''} ${i === series.length - 1 ? 'last' : ''}"/>
          <text x="${cx}" y="${H - 10}" class="tick" text-anchor="middle">${esc(monthName(s.month))}</text></g>`;
      }).join('')}
    </svg>`;
  }

        ${kpi('مجمل الربح', money0(is.grossProfit), `هامش ${pct(is.grossMargin)}`)}

        ${kpi('نسبة المرتجع', pct(booked.length ? returned / booked.length : 0), `${returned} من ${booked.length} طلب`, booked.length && returned / booked.length > 0.15 ? 'bad' : '')}
      </section>
      <section class="position">
        <h2 class="section-title">المركز المالي اليوم</h2>
        <div class="pos-grid">
          <div><span>النقدية في كل الخزائن</span><b>${money0(bs.totalCash)}</b></div>
          <div><span>مستحق من شركات الشحن</span><b>${money0(courierBal)}</b></div>
          <div><span>المخزون بالتكلفة</span><b>${money0(invValue)}</b></div>
          <div><span>بضاعة في الطريق</span><b>${money0(git)}</b></div>
          <div><span>${supBal >= 0 ? 'مستحق للموردين' : 'دفعات مقدمة للموردين'}</span><b>${money0(Math.abs(supBal))}</b></div>
          <div class="strong"><span>حقوق الملكية</span><b>${money0(bs.totalEquity)}</b></div>
        </div>
      </section>
      <section class="grid-2">
        <div class="panel"><h2 class="section-title">صافي المبيعات — آخر ٦ شهور</h2>${barChart(series, 'netSales', 'صافي المبيعات الشهرية')}</div>
        <div class="panel"><h2 class="section-title">صافي الربح — آخر ٦ شهور</h2>${barChart(series, 'netProfit', 'صافي الربح الشهري')}</div>
      </section>
      <section class="grid-3">
        <div class="panel"><h2 class="section-title">طلبات مفتوحة</h2>

        </div>
        <div class="panel"><h2 class="section-title">نواقص المخزون</h2>
          ${low.length ? `<ul class="list">${low.map((x) => `<li><span>${esc(productLabel(x.p))}</span><b class="${x.st.available <= 0 ? 'bad-text' : 'warn-text'}">${fmt(x.st.available)} متاح</b></li>`).join('')}</ul>` : UI.empty('كل المنتجات فوق حد الطلب')}

  let saleFilter = { q: '', status: '', channel: '' };

      && (!q || `${invoiceNo(x)} ${nameOf('customers', x.customerId)} ${(DB.find('customers', x.customerId) || {}).phone || ''}`.toLowerCase().includes(q)))
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.no - a.no));
    let tot = { total: 0, cogs: 0, profit: 0 };
    const rows = list.map((x) => {
      const p = Acc.saleProfit(x, j);
      if (Acc.BOOKED.has(x.status) && x.status !== 'returned') { tot.total += p.total; tot.cogs += p.cogs; }
      tot.profit += p.profit;
      return `<tr>
        ${td(`<button class="link-btn strong" data-action="viewSale" data-id="${x.id}">${esc(invoiceNo(x))}</button>`)}${td(fmtDate(x.date))}
        ${td(esc(nameOf('customers', x.customerId)))}${td(CHANNELS[x.channel] || '—')}
        ${tdn(fmt(p.total))}${tdn(fmt(p.cogs))}${tdn(`<span class="${p.profit < 0 ? 'bad-text' : ''}">${fmt(p.profit)}</span>`)}
        ${td(x.payment === 'cod' ? 'عند الاستلام' : esc(nameOf('accounts', x.payment)))}
        ${td(UI.select('st-' + x.id, STATUSES, x.status, `class="status-select s-${x.status}" data-change="saleStatus" data-id="${x.id}" aria-label="الحالة"`))}
        ${actions(btn('تعديل', 'editSale', x.id), btn('حذف', 'delSale', x.id, 'danger'))}</tr>`;
    });
    return `
      ${header('المبيعات والطلبات', 'كل طلب يُسجَّل كإيراد عند خروجه مع شركة الشحن، وتُحسب تكلفته بمتوسط تكلفة المخزون.', `${periodBar()}<button class="btn btn-primary" data-action="newSale">+ طلب جديد</button>`)}
      <div class="filters">
        <input type="search" id="f-q" placeholder="بحث برقم الفاتورة أو العميل أو الموبايل" value="${esc(saleFilter.q)}" data-input="saleQ">
        ${UI.select('fstatus', { '': 'كل الحالات', ...STATUSES }, saleFilter.status, 'data-change="saleStatusFilter" aria-label="الحالة"')}
        ${UI.select('fchannel', { '': 'كل القنوات', ...CHANNELS }, saleFilter.channel, 'data-change="saleChannelFilter" aria-label="القناة"')}
      </div>
      ${table(['الفاتورة', 'التاريخ', 'العميل', 'القناة', '#الإجمالي', '#التكلفة', '#الربح', 'الدفع', 'الحالة', ''], rows, {
        empty: 'لا توجد طلبات في هذه الفترة',
        foot: rows.length ? `<tr><td colspan="4">الإجمالي (${rows.length} طلب)</td>${tdn(fmt(tot.total))}${tdn(fmt(tot.cogs))}${tdn(fmt(tot.profit))}<td colspan="3"></td></tr>` : '',
      })}`;

  function saleForm(sale) {
    const s = S();
    const isNew = !sale;
    sale = sale || { id: uid(), date: today(), channel: 'instagram', status: 'pending', payment: 'cod', courierId: (s.couriers[0] || {}).id, courierFee: 0, shippingCharged: 0, discount: 0, items: [{ qty: 1 }], returnFee: 0 };
    const custOpts = [{ v: '', l: 'اختر العميل…' }, { v: '__new', l: '+ عميل جديد' }, ...s.customers.map((c) => ({ v: c.id, l: `${c.name}${c.phone ? ' — ' + c.phone : ''}` }))];
    const body = `
      <div class="form-grid">
        ${UI.field('التاريخ', UI.input('date', sale.date, 'type="date" required'), { req: true })}
        ${UI.field('العميل', UI.select('customerId', custOpts, sale.customerId || ''), {})}

      </div>

        ${UI.field('الموبايل', UI.input('cPhone', '', 'inputmode="tel"'))}
        ${UI.field('المحافظة / المدينة', UI.input('cCity', ''))}

      </div>
      <div class="table-wrap"><table class="lines"><thead><tr><th>المنتج</th><th>الكمية</th><th>سعر البيع</th><th class="num">الإجمالي</th><th></th></tr></thead>
        <tbody id="lines">${sale.items.map(saleLineRow).join('')}</tbody></table></div>
      <button type="button" class="btn btn-small" id="add-line">+ إضافة صنف</button>
      <div class="form-grid">
        ${UI.field('خصم (ج.م)', UI.input('discount', sale.discount || 0, 'type="number" min="0" step="0.01"'))}
        ${UI.field('شحن محصل من العميل', UI.input('shippingCharged', sale.shippingCharged || 0, 'type="number" min="0" step="0.01"'))}
        ${UI.field('طريقة الدفع', UI.select('payment', [{ v: 'cod', l: 'الدفع عند الاستلام (مع شركة الشحن)' }, ...accountOptions().map((a) => ({ v: a.v, l: 'مدفوع مقدمًا — ' + a.l }))], sale.payment))}
        ${UI.field('شركة الشحن', UI.select('courierId', [{ v: '', l: '—' }, ...s.couriers.map((c) => ({ v: c.id, l: c.name }))], sale.courierId || ''))}
        ${UI.field('تكلفة الشحن علينا', UI.input('courierFee', sale.courierFee || 0, 'type="number" min="0" step="0.01"'), { hint: 'تخصمها شركة الشحن من التحصيل' })}
      </div>
      <div class="form-grid return-fields" hidden>
        ${UI.field('تاريخ المرتجع', UI.input('returnDate', sale.returnDate || today(), 'type="date"'))}
        ${UI.field('مصاريف المرتجع', UI.input('returnFee', sale.returnFee || 0, 'type="number" min="0" step="0.01"'))}
      </div>
      ${UI.field('ملاحظات', `<textarea id="f-notes" name="notes" rows="2">${esc(sale.notes || '')}</textarea>`)}
      <div class="summary" id="sale-summary"></div>`;
    UI.modal({
      title: isNew ? 'طلب جديد' : `تعديل الطلب ${esc(invoiceNo(sale))}`, body, wide: true,
      onOpen(f) {
        const lines = f.querySelector('#lines');
        const recalc = () => {
          let gross = 0, cost = 0;
          lines.querySelectorAll('.line').forEach((r) => {
            const pid = r.querySelector('.l-product').value; const q = num(r.querySelector('.l-qty').value); const pr = num(r.querySelector('.l-price').value);
            gross += q * pr; r.querySelector('.l-total').textContent = fmt(q * pr);
            const st = pid && J().inventory.products[pid];
            r.querySelector('.l-stock').textContent = st ? `متاح: ${fmt(st.available)} · تكلفة ${fmt(st.avgCost, 0)}` : '';
            if (st) cost += q * st.avgCost;
          });
          const disc = num(f.discount.value), ship = num(f.shippingCharged.value), fee = num(f.courierFee.value);
          const total = gross - disc + ship;
          const profit = total - cost - fee;
          f.querySelector('#sale-summary').innerHTML = `<div><span>إجمالي الأصناف</span><b>${fmt(gross)}</b></div><div><span>الخصم</span><b>${fmt(disc)}</b></div><div><span>شحن محصل</span><b>${fmt(ship)}</b></div><div class="strong"><span>المطلوب من العميل</span><b>${fmt(total)} ج.م</b></div><div><span>التكلفة المتوقعة</span><b>${fmt(cost)}</b></div><div class="${profit < 0 ? 'bad-text' : 'good-text'}"><span>الربح المتوقع</span><b>${fmt(profit)}</b></div>`;
        };
        f.querySelector('#add-line').addEventListener('click', () => { lines.insertAdjacentHTML('beforeend', saleLineRow({ qty: 1 })); recalc(); });
        lines.addEventListener('click', (e) => { if (e.target.closest('[data-line-remove]') && lines.children.length > 1) { e.target.closest('tr').remove(); recalc(); } });
        lines.addEventListener('change', (e) => {
          if (e.target.classList.contains('l-product')) { const p = productById(e.target.value); const pr = e.target.closest('tr').querySelector('.l-price'); if (p && !num(pr.value)) pr.value = p.price || ''; }
          recalc();
        });
        f.addEventListener('input', recalc);
        const toggle = () => {
          f.querySelector('.new-customer').hidden = f.customerId.value !== '__new';
          f.querySelector('#f-cName').required = f.customerId.value === '__new';
          f.querySelector('.return-fields').hidden = f.status.value !== 'returned';
        };
        f.customerId.addEventListener('change', toggle); f.status.addEventListener('change', toggle);
        toggle(); recalc();
      },
      onSubmit(f, fd) {
        const items = [...f.querySelectorAll('#lines .line')].map((r) => ({ productId: r.querySelector('.l-product').value, qty: num(r.querySelector('.l-qty').value), price: num(r.querySelector('.l-price').value) })).filter((l) => l.productId && l.qty > 0);
        if (!items.length) { UI.toast('أضف صنفًا واحدًا على الأقل', 'bad'); return false; }
        let customerId = fd.get('customerId');
        if (customerId === '__new') {
          const c = { id: uid(), name: fd.get('cName').trim(), phone: fd.get('cPhone').trim(), city: fd.get('cCity').trim(), address: fd.get('cAddress').trim() };
          S().customers.push(c); customerId = c.id;
        }
        const status = fd.get('status');
        const obj = { ...sale, date: fd.get('date'), customerId, channel: fd.get('channel'), status, items, discount: num(fd.get('discount')), shippingCharged: num(fd.get('shippingCharged')), payment: fd.get('payment'), courierId: fd.get('courierId'), courierFee: num(fd.get('courierFee')), returnDate: status === 'returned' ? fd.get('returnDate') : '', returnFee: status === 'returned' ? num(fd.get('returnFee')) : 0, notes: fd.get('notes') };
        if (isNew) obj.no = S().settings.nextInvoiceNo++;
        DB.upsert('sales', obj);
        UI.toast(isNew ? `تم تسجيل الطلب ${invoiceNo(obj)}` : 'تم حفظ التعديلات');
        render();
      },
    });
  }
