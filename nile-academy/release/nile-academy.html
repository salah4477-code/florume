لمالية`,explanation:`لا علاقة لذلك بنهاية السنة.`}]},{id:`p2e1-q5`,question:`أتعاب المكتب الاستشاري للإشراف على الإنشاء (2.4 مليون) تُعالج:`,options:[{text:`مصروف أتعاب مهنية`,explanation:`هي أتعاب مرتبطة مباشرة بإنشاء الأصل.`},{text:`جزء من تكلفة المبنى`,correct:!0,explanation:`صحيح. الأتعاب المهنية المباشرة تُرسمل.`},{text:`تُخصم من حقوق الملكية`,explanation:`الخصم من حقوق الملكية لتكاليف إصدار الأسهم فقط.`},{text:`أصل غير ملموس مستقل`,explanation:`ليست حقاً مستقلاً؛ هي جزء من تكلفة المبنى.`}]}],exercises:[{id:`p2e1-x1`,date:`2026-08-25`,prompt:`سجّل قيد سداد **400,000 ج.م** لتدريب العمال على الخط الجديد و**250,000 ج.م** لحفل افتتاح المصنع، بشيك واحد من البنك.`,solution:[{account:`5211`,debit:4e5},{account:`5301`,debit:25e4},{account:`1250`,credit:65e4}],hints:[`لا شيء منهما يُرسمل.`,`كل بند في حساب مصروفه المناسب.`,`الطرف الدائن واحد: البنك.`],explanation:`مصروفات تدريب مدين 400,000، ومصروفات دعاية وتسويق مدين 250,000، والبنك دائن 650,000.`},{id:`p2e1-x2`,date:`2026-08-31`,prompt:`اكتمل المصنع. رصيد مشروعات تحت التنفيذ **185,000,000 ج.م**: منها **84,000,000** للمبنى و**101,000,000** للآلات. سجّل قيد التحويل.`,solution:[{account:`1102`,debit:84e6},{account:`1103`,debit:101e6},{account:`1190`,credit:185e6}],hints:[`الأصول النهائية تزيد ← مدين.`,`الحساب المؤقت يُقفل ← دائن.`],explanation:`المباني مدين 84 مليوناً، والآلات مدين 101 مليون، ومشروعات تحت التنفيذ دائن 185 مليوناً.`}]},takeaways:[`التكلفة = السعر + كل ما يلزم لجعل الأصل في موقعه وصالحاً للتشغيل.`,`التدريب والافتتاح والمصروفات الإدارية لا تُرسمل.`,`مشروعات تحت التنفيذ حساب مؤقت لا يُهلك، ويُحوَّل عند الاكتمال.`,`المباني 84,000,000 والآلات 101,000,000، والبنك 63,450,000 ج.م في 31 أغسطس.`]},x={id:`p2e2`,part:2,number:2,title:`الإهلاك: توزيع التكلفة على سنوات الاستخدام`,subtitle:`العمر الإنتاجي، والقيمة المتبقية، وطرق الإهلاك، والقيمة الدفترية`,period:`سبتمبر 2026`,minutes:30,objectives:[`أن تشرح معنى الإهلاك ولماذا لا يمثل نقصاً في القيمة السوقية`,`أن تحسب القيمة القابلة للإهلاك وقسط الإهلاك بطريقة القسط الثابت ووحدات الإنتاج`,`أن تعرف متى يبدأ الإهلاك ولماذا لا تُهلك الأرض`,`أن تسجّل قيد الإهلاك باستخدام حساب مجمع الإهلاك`],situation:[`أصبح المصنع جاهزاً للاستخدام في 1 سبتمبر 2026، لكن الإنتاج التجاري لن يبدأ قبل 1 أكتوبر، لأن الشركة تنتظر وصول أول شحنات الخامات وتعيين بقية العمال.`,`في 30 سبتمبر سأل أحمد: «المصنع لم ينتج علبة واحدة بعد، فهل نسجّل إهلاكاً عن سبتمبر؟» وأضاف رئيس المجلس: «والأرض؟ أليست أكبر أصل لدينا؟»`,`وضعت الأستاذة منى أمامهم تقرير الإدارة الفنية:`,{type:`table`,headers:[`الأصل`,`التكلفة`,`العمر الإنتاجي`,`القيمة المتبقية المقدرة`],rows:[[`مبنى المصنع`,`84,000,000`,`40 سنة`,`صفر`],[`خط الإنتاج الرئيسي`,`95,000,000`,`10 سنوات (أو 30,000,000 كرتونة)`,`5,000,000`],[`ماكينة التغليف الثانوية`,`6,000,000`,`10 سنوات`,`صفر`],[`الأرض`,`46,350,000`,`غير محدد`,`—`]]}],explanation:[{type:`heading`,text:`ما الإهلاك؟`},`**{{term:depreciation|الإهلاك}}** هو التوزيع المنتظم للتكلفة القابلة للإهلاك للأصل على **{{term:useful-life|عمره الإنتاجي}}**. الفكرة: الشركة دفعت 95 مليوناً لتحصل على خدمة الخط عشر سنوات، فمن العدل أن تتحمل كل سنة نصيبها من التكلفة، لا أن تتحملها سنة الشراء وحدها.`,`والإهلاك **ليس تقييماً** للأصل ولا يقيس سعره في السوق؛ هو تخصيص للتكلفة. ولا يخرج به أي نقد؛ فالنقد خرج يوم الشراء.`,{type:`heading`,text:`ثلاثة أرقام قبل أي حساب`},{type:`list`,items:[`**التكلفة**: من الحلقة السابقة.`,`**{{term:residual-value|القيمة المتبقية}}**: ما تتوقع الشركة الحصول عليه من بيع الأصل في نهاية عمره بعد خصم تكاليف البيع.`,`**العمر الإنتاجي**: الفترة التي تتوقع الشركة استخدام الأصل خلالها، أو عدد الوحدات التي تتوقع إنتاجها به.`]},`**{{term:depreciable-amount|القيمة القابلة للإهلاك}}** = التكلفة − القيمة المتبقية. لخط الإنتاج: 95,000,000 − 5,000,000 = 90,000,000 ج.م.`,{type:`heading`,text:`طرق الإهلاك`},{type:`table`,headers:[`الطريقة`,`المعادلة`,`خط الإنتاج`],rows:[[`{{term:straight-line|القسط الثابت}}`,`القيمة القابلة للإهلاك ÷ العمر`,`90,000,000 ÷ 10 = 9,000,000 سنوياً = 750,000 شهرياً`],[`{{term:units-of-production|وحدات الإنتاج}}`,`القيمة القابلة للإهلاك ÷ إجمالي الوحدات المتوقعة × وحدات الفترة`,`90,000,000 ÷ 30,000,000 = 3 ج.م لكل كرتونة`],[`القسط المتناقص`,`نسبة ثابتة × القيمة الدفترية أول الفترة`,`إهلاك أكبر في السنوات الأولى`]]},`تختار الشركة الطريقة التي **تعكس نمط استهلاك المنافع** المتوقع. اختارت شركة النيل القسط الثابت للمباني والآلات، لأن الخط يتقادم فنياً بمرور الزمن حتى لو قل الإنتاج. ولو استخدمت وحدات الإنتاج لكان إهلاك سبتمبر صفراً، لأن الخط لم ينتج.`,{type:`heading`,text:`متى يبدأ الإهلاك؟`},`يبدأ الإهلاك عندما يصبح الأصل **{{term:available-for-use|متاحاً للاستخدام}}**، أي في الموقع والحالة اللازمين لتشغيله، **حتى لو لم يُستخدم فعلاً**. المصنع متاح من 1 سبتمبر، فيُهلك عن سبتمبر.`,`ولأن الإنتاج لم يبدأ، يُحمَّل إهلاك سبتمبر **مصروفاً** في قائمة الدخل. ومن أكتوبر سيدخل إهلاك المصنع في **تكلفة الإنتاج** ومنها إلى المخزون، وهذا موضوع محاسبة التكاليف في الجزء الثالث.`,{type:`heading`,text:`والأرض؟`},`**الأرض لا تُهلك**، لأن عمرها غير محدد عادة. ولهذا سُجّلت الأرض منفصلة عن المبنى منذ البداية: لو دمجناهما لأهلكنا الأرض بالخطأ.`,{type:`heading`,text:`{{term:accumulated-depreciation|مجمع الإهلاك}} و{{term:carrying-amount|القيمة الدفترية}}`},`لا نخفض حساب «الآلات» مباشرة، بل نسجّل الإهلاك في حساب مقابل اسمه **مجمع الإهلاك** رصيده دائن. فيبقى حساب الأصل محتفظاً بالتكلفة الأصلية، ويظهر في الميزانية:`,{type:`table`,caption:`الآلات والمعدات في 30 سبتمبر 2026`,headers:[`البند`,`ج.م`],rows:[[`التكلفة`,`101,000,000`],[`يُخصم: مجمع الإهلاك`,`(800,000)`],[`القيمة الدفترية (صافي)`,`100,200,000`]]}],rule:{refs:[{id:`eas:10`,title:`معيار المحاسبة المصري رقم (10): الإهلاك`,counterpart:`IAS 16 (الفقرات 50 و55 و58 و60 و62)`,text:`تُوزَّع القيمة القابلة للإهلاك للأصل على أساس منتظم على مدى عمره الإنتاجي. ويبدأ الإهلاك عندما يكون الأصل متاحاً للاستخدام، أي في الموقع والحالة اللازمين لتشغيله بالطريقة التي تقصدها الإدارة. والأراضي والمباني أصلان منفصلان يُحاسب عنهما كلٌّ على حدة، والأراضي لا تُهلك عادة. وتعكس طريقة الإهلاك النمط المتوقع لاستهلاك المنافع الاقتصادية للأصل.`},{id:`eas:10:review`,title:`مراجعة العمر الإنتاجي والقيمة المتبقية`,counterpart:`IAS 16 (الفقرتان 51 و61) و IAS 8`,text:`تُراجع القيمة المتبقية والعمر الإنتاجي وطريقة الإهلاك في نهاية كل سنة مالية على الأقل، وأي تغيير يُعالج تغييراً في تقدير محاسبي وفق المعيار المصري رقم 5، أي بأثر مستقبلي دون تعديل السنوات السابقة.`}]},application:{intro:[`حساب إهلاك سبتمبر 2026 بطريقة القسط الثابت:`],entries:[{id:`p2e2-j1`,date:`2026-09-30`,description:`إثبات إهلاك سبتمبر 2026 (المصنع متاح للاستخدام ولم يبدأ الإنتاج التجاري)`,lines:[{account:`5210`,debit:975e3},{account:`1182`,credit:175e3},{account:`1183`,credit:8e5}],steps:[`المبنى: 84,000,000 ÷ 40 سنة ÷ 12 = 175,000`,`خط الإنتاج: (95,000,000 − 5,000,000) ÷ 10 ÷ 12 = 750,000`,`ماكينة التغليف: 6,000,000 ÷ 10 ÷ 12 = 50,000`,`إهلاك الآلات = 750,000 + 50,000 = 800,000، والإجمالي = 975,000`,`الأرض لا تُهلك`]},{id:`p2e2-demo-uop`,date:`2026-10-31`,description:`توضيحي فقط: لو استخدمت الشركة طريقة وحدات الإنتاج وأنتج الخط 280,000 كرتونة في أكتوبر`,post:!1,lines:[{account:`5210`,debit:84e4},{account:`1183`,credit:84e4}],steps:[`معدل الإهلاك = 90,000,000 ÷ 30,000,000 كرتونة = 3 ج.م للكرتونة`,`إهلاك أكتوبر = 280,000 × 3 = 840,000`,`عملياً سيدخل هذا المبلغ تكلفة الإنتاج لا المصروفات (الجزء الثالث)`]}],outro:[{type:`table`,caption:`القيم الدفترية في 30 سبتمبر 2026 (ج.م)`,headers:[`الأصل`,`التكلفة`,`مجمع الإهلاك`,`القيمة الدفترية`],rows:[[`الأراضي`,`46,350,000`,`—`,`46,350,000`],[`المباني`,`84,000,000`,`(175,000)`,`83,825,000`],[`الآلات والمعدات`,`101,000,000`,`(800,000)`,`100,200,000`]]}]},mistake:{title:`تأجيل الإهلاك حتى يبدأ الإنتاج، أو إهلاك الأرض`,blocks:[`**الخطأ الأول**: عدم تسجيل إهلاك عن الفترة التي كان الأصل فيها جاهزاً ولم يُستخدم. المعيار يربط بداية الإهلاك بالإتاحة للاستخدام لا بالاستخدام الفعلي. (طريقة وحدات الإنتاج وحدها قد تعطي إهلاكاً صفرياً في فترة توقف، وهذا نتيجة الطريقة لا استثناء من القاعدة.)`,`**الخطأ الثاني**: إهلاك الأرض مع المبنى كأصل واحد. هذا يحمّل قائمة الدخل إهلاكاً لأصل عمره غير محدد.`,`**الخطأ الثالث**: تجاهل القيمة المتبقية وإهلاك الخط كله (95 مليوناً). النتيجة إهلاك سنوي 9.5 مليون بدلاً من 9 ملايين.`,`**الخطأ الرابع**: تخفيض حساب الأصل نفسه بالإهلاك. هذا يُفقد الدفاتر التكلفة الأصلية التي يحتاجها الإيضاح والمراجع.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`قبل أي حساب اكتب الأرقام الثلاثة: التكلفة، والقيمة المتبقية، والعمر. وابدأ العد من تاريخ الإتاحة للاستخدام، واستخدم دائماً حساب المجمع.`}]},quiz:{questions:[{id:`p2e2-q1`,question:`خط إنتاج تكلفته 95 مليوناً وقيمته المتبقية 5 ملايين وعمره 10 سنوات. ما إهلاكه الشهري بالقسط الثابت؟`,options:[{text:`791,667 ج.م`,explanation:`هذا بدون خصم القيمة المتبقية (95 مليوناً ÷ 120).`},{text:`750,000 ج.م`,correct:!0,explanation:`صحيح. (95,000,000 − 5,000,000) ÷ 10 ÷ 12.`},{text:`9,000,000 ج.م`,explanation:`هذا الإهلاك السنوي، لا الشهري.`},{text:`صفر لأن الخط لم ينتج`,explanation:`الإهلاك يبدأ عند الإتاحة للاستخدام، لا عند الإنتاج.`}]},{id:`p2e2-q2`,question:`لماذا لا تُهلك أرض المصنع؟`,options:[{text:`لأن قيمتها السوقية ترتفع`,explanation:`الإهلاك لا علاقة له بالسعر السوقي؛ هو توزيع للتكلفة.`},{text:`لأن عمرها الإنتاجي غير محدد عادة`,correct:!0,explanation:`صحيح. لا توجد فترة محددة نوزع عليها التكلفة.`},{text:`لأنها ليست أصلاً ثابتاً`,explanation:`الأرض أصل ثابت يُعرض ضمن الأصول الثابتة.`},{text:`لأن الضرائب لا تسمح بذلك`,explanation:`المعالجة المحاسبية تحكمها المعايير لا القوانين الضريبية.`}]},{id:`p2e2-q3`,question:`ما الحساب الدائن في قيد الإهلاك؟`,options:[{text:`الأصل نفسه (المباني أو الآلات)`,explanation:`نحتفظ بالتكلفة الأصلية في حساب الأصل.`},{text:`مجمع الإهلاك`,correct:!0,explanation:`صحيح. حساب مقابل دائن يُخصم من الأصل في الميزانية.`},{text:`البنك`,explanation:`الإهلاك لا يخرج به نقد.`},{text:`مصروف الإهلاك`,explanation:`المصروف هو الطرف المدين.`}]},{id:`p2e2-q4`,question:`أصبح المصنع متاحاً للاستخدام في 1 سبتمبر وبدأ الإنتاج في 1 أكتوبر. من متى يبدأ الإهلاك؟`,options:[{text:`1 أكتوبر`,explanation:`هذا تاريخ بدء الاستخدام الفعلي، لا الإتاحة.`},{text:`1 سبتمبر`,correct:!0,explanation:`صحيح. الإهلاك يبدأ عند الإتاحة للاستخدام.`},{text:`بداية السنة المالية التالية`,explanation:`لا يوجد ما يبرر التأجيل.`},{text:`تاريخ سداد آخر دفعة`,explanation:`توقيت السداد لا علاقة له ببدء الإهلاك.`}]},{id:`p2e2-q5`,question:`قررت الإدارة في ديسمبر أن العمر الإنتاجي الحقيقي للخط 12 سنة لا 10. كيف يُعالج ذلك؟`,options:[{text:`تعديل إهلاك الشهور السابقة بأثر رجعي`,explanation:`هذا تغيير في تقدير، لا تصحيح خطأ.`},{text:`بأثر مستقبلي: توزيع القيمة الدفترية المتبقية على العمر الجديد المتبقي`,correct:!0,explanation:`صحيح. تغيير التقديرات يُعالج مستقبلياً (المعيار 5).`},{text:`لا يُعدَّل شيء حتى نهاية العمر`,explanation:`يجب مراجعة التقديرات وتطبيق الجديدة.`},{text:`قيد ربح بفرق الإهلاك`,explanation:`لا يوجد ربح هنا؛ فقط يتغير الإهلاك المستقبلي.`}]}],exercises:[{id:`p2e2-x1`,date:`2026-09-30`,prompt:`سجّل قيد إهلاك سبتمبر 2026 كاملاً: المبنى **84,000,000** على 40 سنة، وخط الإنتاج **95,000,000** بقيمة متبقية **5,000,000** على 10 سنوات، وماكينة التغليف **6,000,000** على 10 سنوات. الإهلاك يُحمَّل مصروفاً هذا الشهر.`,solution:[{account:`5210`,debit:975e3},{account:`1182`,credit:175e3},{account:`1183`,credit:8e5}],hints:[`احسب كل أصل شهرياً: ÷ السنوات ÷ 12.`,`الخط والتغليف كلاهما في مجمع إهلاك الآلات.`,`طرف مدين واحد: مصروف الإهلاك.`],explanation:`175,000 للمباني + 750,000 للخط + 50,000 للتغليف = 975,000.`},{id:`p2e2-x2`,date:`2026-10-31`,prompt:`تمرين على طريقة وحدات الإنتاج: لو أنتج خط الإنتاج **280,000 كرتونة** في أكتوبر، والقيمة القابلة للإهلاك **90,000,000 ج.م** على إجمالي **30,000,000 كرتونة**، سجّل قيد الإهلاك على حساب مصروف الإهلاك (تبسيطاً).`,solution:[{account:`5210`,debit:84e4},{account:`1183`,credit:84e4}],hints:[`المعدل = 90,000,000 ÷ 30,000,000.`,`اضرب المعدل في كراتين الشهر.`],explanation:`3 ج.م × 280,000 = 840,000. (تمرين افتراضي لا يُرحَّل.)`}]},takeaways:[`الإهلاك تخصيص للتكلفة على العمر الإنتاجي، لا تقييم للأصل.`,`القيمة القابلة للإهلاك = التكلفة − القيمة المتبقية.`,`يبدأ الإهلاك عند الإتاحة للاستخدام، والأرض لا تُهلك.`,`إهلاك سبتمبر 975,000 ج.م: 175,000 للمبنى و800,000 للآلات.`]},ie={id:`p2e3`,part:2,number:3,title:`حين تتغير القيمة: إعادة التقييم والاضمحلال`,subtitle:`نموذج إعادة التقييم والدخل الشامل الآخر، واختبار اضمحلال الأصول`,period:`سبتمبر 2026`,minutes:35,objectives:[`أن تفرّق بين نموذج التكلفة ونموذج إعادة التقييم`,`أن تسجّل فائض إعادة التقييم في الدخل الشامل الآخر`,`أن تعرف مؤشرات الاضمحلال وتحسب القيمة الاستردادية`,`أن تسجّل خسارة الاضمحلال في الأرباح أو الخسائر`],situation:[`تذكر رئيس المجلس في الجزء الأول حين قال إن الأرض تساوي 55 مليوناً؟ في سبتمبر 2026، وبعد اكتمال المرافق في المنطقة الصناعية، قرر مجلس الإدارة تطبيق **نموذج إعادة التقييم** على فئة الأراضي، وكلّف خبيراً مثمناً مستقلاً معتمداً. جاء التقرير في 30 سبتمبر: **القيمة العادلة للأرض 58,000,000 ج.م**.`,`وفي الأسبوع نفسه حدث ما لم يتوقعه أحد: ارتفاع مفاجئ في الجهد الكهربي أتلف لوحة التحكم في **ماكينة التغليف الثانوية**. الماكينة ما زالت تعمل، لكن بنصف سرعتها، والمورد أبلغ الشركة أن قطع الغيار الأصلية لم تعد تُنتج.`,`قدّمت الإدارة الفنية والمالية الأرقام التالية للماكينة في 30 سبتمبر:`,{type:`table`,headers:[`البيان`,`ج.م`],rows:[[`التكلفة`,`6,000,000`],[`مجمع الإهلاك (سبتمبر)`,`(50,000)`],[`القيمة الدفترية`,`5,950,000`],[`سعر بيعها الآن لتاجر خردة صناعية ومعدات مستعملة بعد خصم تكاليف الفك والنقل`,`3,200,000`],[`القيمة الحالية للتدفقات النقدية المتوقعة من استمرار استخدامها`,`3,500,000`]]}],explanation:[{type:`heading`,text:`نموذجان للقياس بعد الاقتناء`},`بعد تسجيل الأصل الثابت بتكلفته، تختار الشركة **سياسة محاسبية** لكل فئة كاملة من الأصول:`,{type:`table`,headers:[``,`نموذج التكلفة`,`{{term:revaluation-model|نموذج إعادة التقييم}}`],rows:[[`القياس`,`التكلفة − مجمع الإهلاك − خسائر الاضمحلال`,`القيمة العادلة في تاريخ التقييم − الإهلاك والاضمحلال اللاحقان`],[`التطبيق`,`الأكثر شيوعاً`,`على فئة كاملة (كل الأراضي مثلاً) لا على أصل منفرد`],[`التحديث`,`لا يُعاد التقييم`,`بانتظام كافٍ حتى لا تختلف القيمة الدفترية جوهرياً عن العادلة`]]},`اختيار نموذج إعادة التقييم في المعايير المصرية له شروط وظروف خاصة يجب التحقق منها {{review:V09}}. وفي سيناريونا نفترض أن الشركة استوفتها لفئة الأراضي فقط.`,{type:`heading`,text:`أين تذهب الزيادة؟`},`الزيادة في القيمة **لم تتحقق** بالبيع، ولذلك لا تمر بالأرباح أو الخسائر. بل تُسجَّل في **{{term:other-comprehensive-income|الدخل الشامل الآخر}}** وتتجمع في حقوق الملكية تحت اسم **{{term:revaluation-surplus|فائض إعادة التقييم}}**.`,`الزيادة = 58,000,000 − 46,350,000 = **11,650,000 ج.م**.`,`ولو انخفضت القيمة لاحقاً، يُخصم الانخفاض أولاً من الفائض المتكوّن لنفس الأصل، وما زاد على الفائض يُحمَّل خسارة في الأرباح أو الخسائر. (الضريبة المؤجلة على الفائض موضوع الجزء السادس.)`,{type:`heading`,text:`{{term:impairment|الاضمحلال}}`},`الاضمحلال يعني أن **{{term:carrying-amount|القيمة الدفترية}}** للأصل أصبحت أعلى من المبلغ الذي يمكن استرداده منه. لا يُعقل أن تُظهر الشركة أصلاً بـ5.95 مليون وهي لن تستعيد منه أكثر من 3.5 مليون.`,`**متى نختبر؟** عند وجود مؤشر، مثل: تلف مادي، أو تقادم فني، أو انخفاض كبير في الأداء، أو تغيرات سلبية في السوق أو التكنولوجيا. وتلف لوحة التحكم مع توقف قطع الغيار مؤشر واضح.`,{type:`heading`,text:`{{term:recoverable-amount|القيمة الاستردادية}}`},`هي **الأعلى** من قيمتين، لأن الإدارة الرشيدة ستختار الأفضل بين البيع والاستخدام:`,{type:`list`,items:[`**{{term:fair-value-less-costs|القيمة العادلة ناقصاً تكاليف البيع}}**: ما تحصل عليه الشركة لو باعت الأصل الآن = 3,200,000.`,`**{{term:value-in-use|القيمة الاستخدامية}}**: القيمة الحالية للتدفقات النقدية المتوقعة من استمرار استخدامه = 3,500,000.`]},`القيمة الاستردادية = أعلى القيمتين = **3,500,000**. وخسارة الاضمحلال = 5,950,000 − 3,500,000 = **2,450,000 ج.م**، تُحمَّل على الأرباح أو الخسائر لأن الماكينة مقاسة بنموذج التكلفة.`,`وبعد الاضمحلال يُعاد حساب الإهلاك المستقبلي على القيمة الدفترية الجديدة (3,500,000) على العمر المتبقي.`],rule:{refs:[{id:`eas:10:revaluation`,title:`نموذج إعادة التقييم (المعيار المصري 10)`,counterpart:`IAS 16 (الفقرات 29 و31 و36 و39 و40)`,text:`تختار المنشأة نموذج التكلفة أو نموذج إعادة التقييم سياسةً محاسبية وتطبقه على فئة كاملة من الأصول. وفي نموذج إعادة التقييم، إذا زادت القيمة الدفترية نتيجة إعادة التقييم، يُعترف بالزيادة في الدخل الشامل الآخر وتُجمع في حقوق الملكية تحت فائض إعادة التقييم.`,review:`V09`},{id:`eas:31`,title:`معيار المحاسبة المصري رقم (31): اضمحلال قيمة الأصول`,counterpart:`IAS 36 Impairment of Assets (الفقرات 9 و12 و18 و59 و60 و63)`,text:`تقيّم المنشأة في نهاية كل فترة ما إذا كان هناك مؤشر على اضمحلال أصل، وإذا وُجد تقدّر قيمته الاستردادية، وهي القيمة العادلة ناقصاً تكاليف البيع أو القيمة الاستخدامية أيهما أعلى. وإذا قلّت القيمة الاستردادية عن القيمة الدفترية، تُخفَّض القيمة الدفترية إليها، ويُعترف بخسارة الاضمحلال فوراً في الأرباح أو الخسائر، ما لم يكن الأصل مقاساً بنموذج إعادة التقييم.`}]},application:{entries:[{id:`p2e3-j1`,date:`2026-09-30`,description:`إعادة تقييم أرض المصنع بالقيمة العادلة وفق تقرير الخبير المثمن`,lines:[{account:`1101`,debit:1165e4},{account:`3105`,credit:1165e4}],steps:[`القيمة العادلة 58,000,000 − القيمة الدفترية 46,350,000 = 11,650,000`,`الأرض لا تُهلك، فلا يوجد مجمع إهلاك يُعالج`,`الزيادة غير محققة ← الدخل الشامل الآخر ← فائض إعادة التقييم (حقوق ملكية)`]},{id:`p2e3-j2`,date:`2026-09-30`,description:`إثبات خسارة اضمحلال ماكينة التغليف الثانوية بعد تلف لوحة التحكم`,lines:[{account:`5220`,debit:245e4},{account:`1189`,credit:245e4}],steps:[`القيمة الاستردادية = الأعلى من (3,200,000 ، 3,500,000) = 3,500,000`,`الخسارة = 5,950,000 − 3,500,000 = 2,450,000`,`تُحمَّل على الأرباح أو الخسائر، وتُسجَّل في حساب مقابل (مجمع خسائر الاضمحلال)`]}],outro:[{type:`table`,caption:`الأثر على القوائم المالية`,headers:[`البند`,`قائمة الدخل (الأرباح أو الخسائر)`,`الدخل الشامل الآخر`,`المركز المالي`],rows:[[`إعادة تقييم الأرض`,`لا أثر`,`+11,650,000`,`الأرض 58,000,000، وفائض إعادة التقييم 11,650,000`],[`اضمحلال ماكينة التغليف`,`خسارة 2,450,000`,`لا أثر`,`الآلات تنقص بـ2,450,000`]]},{type:`callout`,tone:`info`,title:`إهلاك أكتوبر لماكينة التغليف`,text:`العمر المتبقي = 120 − 1 = 119 شهراً، والإهلاك الشهري الجديد ≈ 3,500,000 ÷ 119 = 29,412 ج.م بدلاً من 50,000.`}]},mistake:{title:`تسجيل فائض إعادة التقييم ربحاً، أو اختيار أقل القيمتين في الاضمحلال`,blocks:[`**الخطأ الأول**: تسجيل زيادة قيمة الأرض (11.65 مليون) إيراداً في قائمة الدخل. هذا يضخم ربح الفترة بمكسب لم يتحقق، وقد يُوزَّع على المساهمين كأنه ربح نقدي. مكانها الدخل الشامل الآخر وفائض إعادة التقييم.`,`**الخطأ الثاني**: إعادة تقييم أرض واحدة تعجب الإدارة وترك أصول الفئة نفسها بالتكلفة. النموذج يُطبق على **الفئة كاملة** لتجنب الانتقائية.`,`**الخطأ الثالث**: حساب الاضمحلال مقابل القيمة الأقل (3.2 مليون) فتكون الخسارة 2.75 مليون. القيمة الاستردادية هي **الأعلى** بين البيع والاستخدام.`,`**الخطأ الرابع**: الاستمرار في إهلاك 50,000 شهرياً بعد الاضمحلال. يجب إعادة حساب الإهلاك على القيمة الدفترية الجديدة.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`الزيادة غير المحققة في أصل مُعاد تقييمه ← دخل شامل آخر. والانخفاض تحت القيمة الاستردادية ← خسارة اضمحلال. وتذكّر: الاستردادية = **الأعلى** من القيمتين.`}]},quiz:{questions:[{id:`p2e3-q1`,question:`أرض قيمتها الدفترية 46.35 مليون وقيمتها العادلة 58 مليوناً، والشركة تطبق نموذج إعادة التقييم. أين تُسجَّل الزيادة؟`,options:[{text:`إيرادات أخرى في قائمة الدخل`,explanation:`الزيادة غير محققة ولا تمر بالأرباح أو الخسائر (إلا إذا كانت تعكس خسارة سابقة).`},{text:`الدخل الشامل الآخر، وتتجمع في فائض إعادة التقييم`,correct:!0,explanation:`صحيح.`},{text:`رأس المال`,explanation:`رأس المال لا يتغير إلا بإصدار أو تخفيض أسهم.`},{text:`لا تُسجَّل؛ يكفي إيضاح`,explanation:`في نموذج إعادة التقييم تُعدَّل القيمة الدفترية فعلاً.`}]},{id:`p2e3-q2`,question:`ما القيمة الاستردادية لأصل قيمته العادلة ناقصاً تكاليف البيع 3.2 مليون وقيمته الاستخدامية 3.5 مليون؟`,options:[{text:`3,200,000`,explanation:`القيمة الاستردادية هي الأعلى، لا الأقل.`},{text:`3,500,000`,correct:!0,explanation:`صحيح. أعلى القيمتين.`},{text:`3,350,000`,explanation:`لا نأخذ المتوسط.`},{text:`6,700,000`,explanation:`لا نجمع القيمتين؛ الشركة إما تبيع وإما تستخدم.`}]},{id:`p2e3-q3`,question:`متى يجب على الشركة تقدير القيمة الاستردادية لماكينة؟`,options:[{text:`كل شهر لكل الأصول`,explanation:`التقدير مطلوب عند وجود مؤشر على الاضمحلال (مع استثناءات لأصول معينة).`},{text:`عند وجود مؤشر على الاضمحلال، مثل التلف المادي أو التقادم`,correct:!0,explanation:`صحيح.`},{text:`عند بيع الأصل فقط`,explanation:`الاختبار يتم والأصل ما زال في الدفاتر.`},{text:`مرة كل خمس سنوات`,explanation:`لا يوجد جدول ثابت كهذا؛ التقييم في نهاية كل فترة.`}]},{id:`p2e3-q4`,question:`خسارة اضمحلال ماكينة مقاسة بنموذج التكلفة تُعالج:`,options:[{text:`في الأرباح أو الخسائر فوراً`,correct:!0,explanation:`صحيح، وفق المعيار 31.`},{text:`في الدخل الشامل الآخر`,explanation:`هذا يخص الأصول المُعاد تقييمها بقدر الفائض المتاح لها.`},{text:`تُؤجل حتى بيع الماكينة`,explanation:`الاضمحلال يُعترف به عند حدوثه.`},{text:`تُخصم من رأس المال`,explanation:`لا علاقة لرأس المال بها.`}]},{id:`p2e3-q5`,question:`على أي مستوى يُطبَّق نموذج إعادة التقييم؟`,options:[{text:`على أي أصل تختاره الإدارة منفرداً`,explanation:`هذا يسمح بالانتقائية، والمعيار يمنعه.`},{text:`على الفئة الكاملة من الأصول (مثل كل الأراضي)`,correct:!0,explanation:`صحيح.`},{text:`على كل أصول الشركة إلزامياً`,explanation:`الاختيار لكل فئة على حدة.`},{text:`على الأصول المتداولة فقط`,explanation:`النموذج يخص الأصول الثابتة.`}]}],exercises:[{id:`p2e3-x1`,date:`2026-09-30`,prompt:`سجّل قيد إعادة تقييم أرض المصنع: القيمة الدفترية **46,350,000 ج.م**، والقيمة العادلة وفق المثمن **58,000,000 ج.م**.`,solution:[{account:`1101`,debit:1165e4},{account:`3105`,credit:1165e4}],hints:[`احسب الفرق.`,`الزيادة لا تمر بقائمة الدخل.`],explanation:`الأراضي مدين 11,650,000، وفائض إعادة التقييم دائن 11,650,000.`},{id:`p2e3-x2`,date:`2026-09-30`,prompt:`ماكينة قيمتها الدفترية **5,950,000 ج.م**. قيمتها العادلة ناقصاً تكاليف البيع **3,200,000** وقيمتها الاستخدامية **3,500,000**. سجّل قيد خسارة الاضمحلال.`,solution:[{account:`5220`,debit:245e4},{account:`1189`,credit:245e4}],hints:[`حدد القيمة الاستردادية أولاً (الأعلى).`,`الخسارة = الدفترية − الاستردادية.`,`استخدم حساباً مقابلاً لا حساب الآلات.`],explanation:`خسائر اضمحلال الأصول مدين 2,450,000، ومجمع خسائر الاضمحلال دائن 2,450,000.`}]},takeaways:[`نموذج إعادة التقييم يُطبق على فئة كاملة، وزيادته تذهب للدخل الشامل الآخر.`,`القيمة الاستردادية = الأعلى من (القيمة العادلة ناقصاً تكاليف البيع، والقيمة الاستخدامية).`,`خسارة الاضمحلال لأصل بنموذج التكلفة ← الأرباح أو الخسائر فوراً.`,`الأرض الآن 58,000,000، وفائض إعادة التقييم 11,650,000، وخسارة الاضمحلال 2,450,000 ج.م.`]},S={id:`p2e4`,part:2,number:4,title:`أصول لا تُلمس: البرامج والتطوير`,subtitle:`الأصول غير الملموسة المقتناة، والبحث مقابل التطوير، والاستهلاك`,period:`سبتمبر 2026`,minutes:30,objectives:[`أن تعرّف الأصل غير الملموس وشروط الاعتراف به`,`أن تحدد تكلفة برنامج حاسب آلي مقتنى`,`أن تفرّق بين مرحلة البحث (مصروف) ومرحلة التطوير (أصل بشروط)`,`أن تحسب استهلاك أصل غير ملموس عمره محدد وتسجّله`],situation:[`مع بدء التشغيل لم يعد ممكناً إدارة المصنع والمخازن والمبيعات بجداول Excel. في 1 سبتمبر 2026 اشترت الشركة **ترخيصاً دائماً لنظام ERP** بمبلغ 4,800,000 ج.م، ودفعت لشركة تنفيذ 1,200,000 ج.م لإعداد النظام وربطه بأقسام الشركة، و200,000 ج.م لتدريب الموظفين على استخدامه. وبدأ النظام العمل في اليوم نفسه، وتتوقع الإدارة استخدامه **5 سنوات** قبل الحاجة لاستبداله.`,`وفي معمل الجودة بدأ فريق صغير مشروع **«عصير قليل السكر»**:`,{type:`list`,items:[`**من 1 إلى 15 سبتمبر**: تجارب معملية لاختبار 12 بديلاً للسكر ومعرفة أيها يصلح أصلاً. التكلفة 700,000 ج.م.`,`**من 16 إلى 28 سبتمبر**: بعد اختيار البديل المناسب، صمم الفريق التركيبة النهائية ونموذج الإنتاج التجريبي. وأثبت الفريق الجدوى الفنية، واعتمد مجلس الإدارة التمويل وخطة الإطلاق، ودراسة السوق تؤكد وجود طلب. التكلفة 1,300,000 ج.م.`]},`سأل أحمد: «لماذا يُعامل المبلغان بشكل مختلف وكلاهما على المشروع نفسه؟»`],explanation:[{type:`heading`,text:`ما الأصل غير الملموس؟`},`**{{term:intangible-asset|الأصل غير الملموس}}** أصل غير نقدي ليس له وجود مادي، ويمكن تمييزه: إما أنه قابل للانفصال (يمكن بيعه أو ترخيصه)، أو ناشئ عن حقوق تعاقدية أو قانونية. أمثلة: البرامج والتراخيص، وبراءات الاختراع، والعلامات التجارية المشتراة.`,`ويُعترف به إذا كان من المرجح أن تتدفق منه منافع اقتصادية مستقبلية وأمكن قياس تكلفته بدرجة يُعتمد عليها. ولهذا لم نعترف بالعلامة التجارية المُنشأة داخلياً في الجزء الأول.`,{type:`heading`,text:`تكلفة البرنامج المقتنى`},`مثل الأصل الثابت تماماً: سعر الشراء + التكاليف المباشرة لإعداد الأصل للاستخدام المقصود. ترخيص ERP (4,800,000) + الإعداد والربط (1,200,000) = **6,000,000 ج.م**. أما **تدريب الموظفين** فمصروف، بالمنطق نفسه الذي استبعدنا به تدريب العمال في الحلقة الأولى.`,{type:`heading`,text:`البحث أم التطوير؟`},`المشروعات الداخلية تمر بمرحلتين، والمعيار يعاملهما بشكل مختلف تماماً:`,{type:`table`,headers:[``,`{{term:research-phase|مرحلة البحث}}`,`{{term:development-phase|مرحلة التطوير}}`],rows:[[`الهدف`,`اكتساب معرفة جديدة، والبحث عن بدائل`,`تطبيق المعرفة لتصميم منتج أو عملية محددة قبل الإنتاج التجاري`],[`هل المنافع مؤكدة؟`,`لا يمكن إثبات أنها ستولّد منافع`,`يمكن إثباتها إذا تحققت كل الشروط`],[`المعالجة`,`مصروف دائماً`,`أصل إذا تحققت كل الشروط الستة، وإلا مصروف`],[`في مشروعنا`,`700,000 (اختبار 12 بديلاً)`,`1,300,000 (التركيبة النهائية بعد إثبات الجدوى)`]]},`**شروط رسملة التطوير** (كلها معاً): الجدوى الفنية لإكمال الأصل؛ ونية إكماله واستخدامه أو بيعه؛ والقدرة على ذلك؛ وكيفية توليده منافع (مثل وجود سوق)؛ وتوافر الموارد الفنية والمالية اللازمة؛ والقدرة على قياس النفقات بدرجة يُعتمد عليها. وموقف شركة النيل يستوفيها جميعاً من 16 سبتمبر.`,`وإذا تعذر الفصل بين المرحلتين، تُعامل النفقات كلها معاملة البحث (مصروف).`,{type:`heading`,text:`{{term:amortization|الاستهلاك}}`},`الأصل غير الملموس ذو العمر المحدد **يُستهلك** على عمره، وهو المقابل للإهلاك في الأصول الثابتة. نظام ERP: 6,000,000 ÷ 60 شهراً = **100,000 ج.م شهرياً** من 1 سبتمبر، والقيمة المتبقية صفر.`,`أما تكاليف التطوير الـ1,300,000 فلا تُستهلك الآن، لأن المنتج لم يصبح جاهزاً للاستخدام بعد؛ يبدأ استهلاكها مع بدء الإنتاج التجاري للعصير.`],rule:{refs:[{id:`eas:23`,title:`معيار المحاسبة المصري رقم (23): الأصول غير الملموسة`,counterpart:`IAS 38 (الفقرات 8 و12 و21 و27 و54 و57 و67 و97)`,text:`الأصل غير الملموس أصل غير نقدي قابل للتمييز وليس له وجود مادي. وتشمل تكلفة الأصل المقتنى منفصلاً سعر شراءه وأي تكلفة مباشرة لإعداده للاستخدام، ولا تشمل تكاليف تدريب العاملين. ولا يُعترف بأي أصل ناشئ عن البحث؛ فنفقات البحث مصروف عند حدوثها. ويُعترف بالأصل الناشئ عن التطوير فقط إذا أثبتت المنشأة الشروط المحددة كلها. ويُستهلك الأصل ذو العمر المحدد على أساس منتظم من تاريخ إتاحته للاستخدام.`}]},application:{entries:[{id:`p2e4-j1`,date:`2026-09-01`,description:`شراء ترخيص دائم لنظام ERP (4,800,000) وأتعاب إعداده وربطه (1,200,000)`,lines:[{account:`1150`,debit:6e6},{account:`1250`,credit:6e6}],steps:[`الترخيص والإعداد اللازم للتشغيل ← تكلفة الأصل`,`النظام قابل للتمييز (ترخيص تعاقدي) ← أصل غير ملموس`]},{id:`p2e4-j2`,date:`2026-09-01`,description:`تدريب الموظفين على استخدام نظام ERP`,lines:[{account:`5211`,debit:2e5},{account:`1250`,credit:2e5}],steps:[`التدريب مستبعد صراحة من تكلفة الأصل غير الملموس ← مصروف`]},{id:`p2e4-j3`,date:`2026-09-15`,description:`نفقات مرحلة البحث لمشروع العصير قليل السكر (اختبار 12 بديلاً)`,lines:[{account:`5213`,debit:7e5},{account:`1250`,credit:7e5}],steps:[`مرحلة بحث ← مصروف دائماً، مهما كانت النتيجة`]},{id:`p2e4-j4`,date:`2026-09-28`,description:`نفقات مرحلة التطوير لمشروع العصير قليل السكر بعد استيفاء شروط الرسملة`,lines:[{account:`1151`,debit:13e5},{account:`1250`,credit:13e5}],steps:[`الشروط الستة متحققة ← أصل غير ملموس`,`لا يُستهلك قبل أن يصبح المنتج جاهزاً للإنتاج التجاري`]},{id:`p2e4-j5`,date:`2026-09-30`,description:`استهلاك نظام ERP عن شهر سبتمبر`,lines:[{account:`5212`,debit:1e5},{account:`1159`,credit:1e5}],steps:[`6,000,000 ÷ 5 سنوات ÷ 12 = 100,000`,`حساب مقابل: مجمع استهلاك الأصول غير الملموسة`]}],outro:[{type:`callout`,tone:`success`,title:`رصيد البنك في 30 سبتمبر (بعد هذه الحلقة)`,text:`63,450,000 − 6,000,000 − 200,000 − 700,000 − 1,300,000 = **55,250,000 ج.م**`}]},mistake:{title:`رسملة نفقات البحث، أو تحميل الترخيص كله مصروفاً`,blocks:[`**الخطأ الأول**: رسملة كل نفقات المشروع (2 مليون) لأن المشروع «نجح في النهاية». نفقات البحث مصروف وقت حدوثها، ولا يجوز إعادة رسملتها لاحقاً حتى لو نجح المنتج.`,`**الخطأ الثاني**: تحميل ترخيص ERP كله مصروفاً «لأنه برنامج». البرنامج المقتنى بترخيص يستمر سنوات أصل غير ملموس يُستهلك على عمره.`,`**الخطأ الثالث**: رسملة تدريب المستخدمين ضمن تكلفة النظام.`,`**الخطأ الرابع**: بدء استهلاك تكاليف التطوير قبل أن يصبح المنتج جاهزاً.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`وثّق **تاريخ** استيفاء شروط التطوير الستة في محضر رسمي. قبله: مصروف. بعده: أصل. هذا ما سيطلبه مراقب الحسابات.`}]},quiz:{questions:[{id:`p2e4-q1`,question:`ما تكلفة نظام ERP التي تُسجَّل أصلاً: ترخيص 4.8 مليون، وإعداد 1.2 مليون، وتدريب 0.2 مليون؟`,options:[{text:`4,800,000`,explanation:`الإعداد والربط لازمان لتشغيل النظام، فيدخلان التكلفة.`},{text:`6,000,000`,correct:!0,explanation:`صحيح. الترخيص + الإعداد، والتدريب مصروف.`},{text:`6,200,000`,explanation:`التدريب مستبعد من التكلفة.`},{text:`صفر؛ كله مصروف`,explanation:`الترخيص المقتنى أصل غير ملموس قابل للتمييز.`}]},{id:`p2e4-q2`,question:`تجارب معملية لاختيار بديل السكر من بين 12 بديلاً تُعتبر:`,options:[{text:`مرحلة بحث ← مصروف`,correct:!0,explanation:`صحيح. هدفها اكتساب معرفة واختيار بدائل.`},{text:`مرحلة تطوير ← أصل`,explanation:`لم تُثبت الجدوى الفنية بعد.`},{text:`مخزون`,explanation:`لا يوجد منتج للبيع.`},{text:`أصل ثابت`,explanation:`لا يوجد أصل ملموس.`}]},{id:`p2e4-q3`,question:`ماذا لو لم تستطع الشركة الفصل بين مرحلتي البحث والتطوير في مشروع؟`,options:[{text:`تُرسمل النفقات كلها`,explanation:`المعيار يقضي بالعكس.`},{text:`تُعامل النفقات كلها معاملة البحث (مصروف)`,correct:!0,explanation:`صحيح.`},{text:`تُقسم مناصفة`,explanation:`لا توجد قاعدة كهذه.`},{text:`تُؤجل حتى نهاية المشروع`,explanation:`النفقات تُعالج عند حدوثها.`}]},{id:`p2e4-q4`,question:`ما استهلاك نظام ERP الشهري: تكلفته 6 ملايين وعمره 5 سنوات بلا قيمة متبقية؟`,options:[{text:`1,200,000`,explanation:`هذا الاستهلاك السنوي.`},{text:`100,000`,correct:!0,explanation:`صحيح. 6,000,000 ÷ 60 شهراً.`},{text:`120,000`,explanation:`راجع القسمة: 6,000,000 ÷ 60.`},{text:`صفر؛ البرامج لا تُستهلك`,explanation:`الأصل غير الملموس ذو العمر المحدد يُستهلك.`}]},{id:`p2e4-q5`,question:`متى يبدأ استهلاك تكاليف التطوير المرسملة للعصير الجديد؟`,options:[{text:`من تاريخ رسملتها`,explanation:`الأصل لم يصبح متاحاً للاستخدام بعد.`},{text:`عندما يصبح المنتج متاحاً للإنتاج التجاري`,correct:!0,explanation:`صحيح.`},{text:`بعد 5 سنوات`,explanation:`لا يوجد تأجيل ثابت كهذا.`},{text:`لا تُستهلك أبداً`,explanation:`عمرها محدد بعمر المنتج المتوقع، فتُستهلك.`}]}],exercises:[{id:`p2e4-x1`,date:`2026-09-01`,prompt:`سجّل **قيداً واحداً** لسداد ترخيص ERP **4,800,000** وأتعاب الإعداد **1,200,000** وتدريب الموظفين **200,000** من البنك.`,solution:[{account:`1150`,debit:6e6},{account:`5211`,debit:2e5},{account:`1250`,credit:62e5}],hints:[`الترخيص والإعداد معاً أصل واحد.`,`التدريب في حساب مصروفات تدريب.`],explanation:`برامج حاسب آلي وتراخيص 6,000,000 مدين، ومصروفات تدريب 200,000 مدين، والبنك 6,200,000 دائن.`},{id:`p2e4-x2`,date:`2026-09-30`,prompt:`سجّل قيد استهلاك نظام ERP عن سبتمبر. التكلفة **6,000,000 ج.م** والعمر **5 سنوات**.`,solution:[{account:`5212`,debit:1e5},{account:`1159`,credit:1e5}],hints:[`الاستهلاك الشهري = التكلفة ÷ 60.`,`استخدم الحساب المقابل لا حساب الأصل.`],explanation:`استهلاك الأصول غير الملموسة مدين 100,000، ومجمع الاستهلاك دائن 100,000.`}]},takeaways:[`الأصل غير الملموس قابل للتمييز وليس له وجود مادي.`,`البحث مصروف دائماً، والتطوير أصل فقط عند استيفاء كل الشروط.`,`التدريب لا يُرسمل أبداً.`,`ERP بـ6,000,000 يُستهلك 100,000 شهرياً، وتطوير المنتج 1,300,000 بلا استهلاك بعد.`]},ae={id:`p2e5`,part:2,number:5,title:`مخزن بالإيجار: عقود التأجير`,subtitle:`أصل حق الاستخدام، والتزام التأجير بالقيمة الحالية، واستثناء الإيجار قصير الأجل`,period:`مايو - سبتمبر 2026`,minutes:35,objectives:[`أن تعرف متى يحتوي العقد على تأجير`,`أن تحسب التزام التأجير بالقيمة الحالية للدفعات`,`أن تحدد تكلفة أصل حق الاستخدام`,`أن تسجّل الإهلاك والفائدة الشهرية`,`أن تطبق استثناء الإيجار قصير الأجل`],situation:[`يحتاج المصنع مخزناً للخامات والمنتجات التامة قريباً من الطريق الإقليمي. وجدت الشركة مخزناً مناسباً، ووقّعت عقداً بالشروط التالية:`,{type:`table`,headers:[`البند`,`القيمة`],rows:[[`بداية العقد`,`1 سبتمبر 2026`],[`المدة`,`5 سنوات غير قابلة للإلغاء، بلا خيار شراء`],[`الإيجار السنوي`,`2,400,000 ج.م تُدفع مقدماً أول كل سنة إيجارية (أول دفعة 1 سبتمبر 2026)`],[`عمولة السمسار (تكلفة مباشرة أولية)`,`100,000 ج.م`],[`معدل الاقتراض الإضافي للشركة`,`20% سنوياً {{review:V10}}`]]},`سأل أحمد: «سندفع 2.4 مليون كل سنة. لماذا لا نسجلها مصروف إيجار كما فعلنا مع المقر الإداري في الجزء الأول؟»`,`وتذكرت الأستاذة منى أن قيد المقر الإداري نفسه لم يُسوَّ منذ أبريل: خمسة أشهر (مايو - سبتمبر) من الإيجار المدفوع مقدماً انقضت ولم تُحمّل بعد.`],explanation:[{type:`heading`,text:`التأجير في نظر المعيار`},`**{{term:lease|عقد التأجير}}** عقد يمنح المستأجر **حق السيطرة على استخدام أصل محدد** لفترة مقابل عوض. والمعيار الحالي ألغى التفرقة القديمة لدى المستأجر بين تأجير «تشغيلي» خارج الميزانية وتأجير «تمويلي» داخلها: **كل التأجيرات** تقريباً تظهر في الميزانية.`,`والمنطق: الشركة التزمت فعلاً بدفع 12 مليوناً على 5 سنوات، ولا تستطيع الانسحاب. هذا التزام حقيقي، وفي المقابل حصلت على حق حقيقي في استخدام المخزن.`,{type:`heading`,text:`الطرف الأول: {{term:lease-liability|التزام التأجير}}`},`يُقاس بـ**{{term:present-value|القيمة الحالية}}** لدفعات الإيجار **التي لم تُدفع بعد** في تاريخ بداية العقد. ولأن الشركة دفعت الدفعة الأولى يوم البداية، يتبقى 4 دفعات.`,`معدل الخصم هو المعدل الضمني في العقد إن أمكن تحديده، وإلا **{{term:incremental-borrowing-rate|معدل الاقتراض الإضافي}}** للمستأجر، أي ما كانت ستدفعه الشركة لو اقترضت لتشتري أصلاً مماثلاً.`,{type:`table`,caption:`القيمة الحالية لأربع دفعات بمعدل 20% (ج.م)`,headers:[`الدفعة`,`التاريخ`,`معامل الخصم`,`القيمة الحالية`],rows:[[`2`,`1 سبتمبر 2027`,`1 ÷ 1.20 = 0.833333`,`2,000,000`],[`3`,`1 سبتمبر 2028`,`1 ÷ 1.44 = 0.694444`,`1,666,667`],[`4`,`1 سبتمبر 2029`,`1 ÷ 1.728 = 0.578704`,`1,388,889`],[`5`,`1 سبتمبر 2030`,`1 ÷ 2.0736 = 0.482253`,`1,157,407`],[`الإجمالي`,``,`2.588735`,`6,212,963`]]},{type:`heading`,text:`الطرف الثاني: {{term:right-of-use|أصل حق الاستخدام}}`},`تكلفته = التزام التأجير + الدفعات المسددة في البداية أو قبلها + التكاليف المباشرة الأولية:`,`6,212,963 + 2,400,000 + 100,000 = **8,712,963 ج.م**.`,{type:`heading`,text:`بعد البداية: قيدان كل شهر`},{type:`list`,items:[`**إهلاك الأصل** بالقسط الثابت على مدة العقد: 8,712,963 ÷ 60 = 145,216 ج.م شهرياً (مقربة).`,`**فائدة الالتزام**: الرصيد × المعدل. لسبتمبر: 6,212,963 × 20% ÷ 12 = 103,549 ج.م (مقربة)، تُضاف للالتزام لأنها ستُدفع ضمن الدفعة القادمة، وتظهر **تكلفة تمويلية**.`]},`لاحظ أن مجموع المصروفين في السنوات الأولى (إهلاك + فائدة) أكبر من الإيجار النقدي، ثم يقل لاحقاً مع تناقص الالتزام.`,{type:`heading`,text:`{{term:short-term-lease|استثناء الإيجار قصير الأجل}}`},`يجوز للمستأجر **ألا** يطبق النموذج السابق على عقد مدته **12 شهراً أو أقل** بلا خيار شراء، أو على أصل منخفض القيمة. حينها يُحمَّل الإيجار مصروفاً بالقسط الثابت على مدة العقد. وهذا بالضبط ما فعلناه مع المقر الإداري في الجزء الأول (عقد سنة واحدة)، ولهذا كان قيد «مصروفات مدفوعة مقدماً» صحيحاً.`,`والآن نسوّي الشهور المنقضية: 5 أشهر × 150,000 = **750,000 ج.م**.`],rule:{refs:[{id:`eas:49`,title:`معيار المحاسبة المصري رقم (49): عقود التأجير`,counterpart:`IFRS 16 Leases (الفقرات 9 و22 و23 و24 و26 و31 و36)`,text:`في تاريخ بداية عقد التأجير يعترف المستأجر بأصل حق الاستخدام والتزام التأجير. ويُقاس الالتزام بالقيمة الحالية لدفعات الإيجار غير المسددة في ذلك التاريخ، مخصومة بسعر الفائدة الضمني في العقد إن أمكن تحديده، وإلا بسعر الاقتراض الإضافي للمستأجر. وتشمل تكلفة أصل حق الاستخدام مبلغ القياس الأولي للالتزام، والدفعات المسددة في تاريخ البداية أو قبله، والتكاليف المباشرة الأولية.`,review:`V11`},{id:`eas:49:short-term`,title:`الإعفاء للتأجير قصير الأجل والأصول منخفضة القيمة`,counterpart:`IFRS 16 (الفقرتان 5 و6)`,text:`يجوز للمستأجر عدم تطبيق متطلبات الاعتراف على عقود التأجير قصيرة الأجل (12 شهراً أو أقل، بلا خيار شراء) وعلى عقود الأصول منخفضة القيمة، وعندئذ يعترف بدفعات الإيجار مصروفاً بطريقة القسط الثابت على مدة العقد.`}]},application:{entries:[{id:`p2e5-j1`,date:`2026-09-01`,description:`بداية عقد تأجير المخزن: الاعتراف بأصل حق الاستخدام والتزام التأجير، وسداد الدفعة الأولى وعمولة السمسار`,lines:[{account:`1160`,debit:8712963},{account:`2102`,credit:6212963},{account:`1250`,credit:25e5}],steps:[`الالتزام = القيمة الحالية لأربع دفعات = 2,400,000 × 2.588735 = 6,212,963`,`المسدد اليوم = الدفعة الأولى 2,400,000 + العمولة 100,000 = 2,500,000`,`أصل حق الاستخدام = 6,212,963 + 2,500,000 = 8,712,963`]},{id:`p2e5-j2`,date:`2026-09-30`,description:`إهلاك أصل حق استخدام المخزن عن سبتمبر`,lines:[{account:`5210`,debit:145216},{account:`1169`,credit:145216}],steps:[`8,712,963 ÷ 60 شهراً = 145,216.05 ← 145,216`,`حساب مقابل مستقل: مجمع إهلاك أصول حق الاستخدام`]},{id:`p2e5-j3`,date:`2026-09-30`,description:`فائدة التزام تأجير المخزن عن سبتمبر`,lines:[{account:`5401`,debit:103549},{account:`2102`,credit:103549}],steps:[`6,212,963 × 20% ÷ 12 = 103,549.38 ← 103,549`,`الالتزام يزيد بالفائدة حتى تُسدد الدفعة القادمة`,`تظهر في قائمة الدخل ضمن التكاليف التمويلية`]},{id:`p2e5-j4`,date:`2026-09-30`,description:`تسوية إيجار المقر الإداري (تأجير قصير الأجل) عن الفترة من مايو إلى سبتمبر`,lines:[{account:`5205`,debit:75e4},{account:`1220`,credit:75e4}],steps:[`5 أشهر × 150,000 = 750,000`,`رصيد المدفوع مقدماً = 1,650,000 − 750,000 = 900,000 (6 أشهر متبقية)`]}],outro:[{type:`table`,caption:`المخزن في قائمة المركز المالي 30 سبتمبر 2026 (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`أصل حق الاستخدام (التكلفة)`,`8,712,963`],[`يُخصم: مجمع الإهلاك`,`(145,216)`],[`القيمة الدفترية`,`8,567,747`],[`التزام التأجير`,`6,316,512`]]},{type:`callout`,tone:`info`,title:`ملاحظة عن العرض`,text:`جزء من التزام التأجير يستحق خلال 12 شهراً (دفعة سبتمبر 2027) ويجب فصله متداولاً في القوائم السنوية. سنعالج الفصل للقرض في الحلقة التالية، وللتأجير عند إعداد القوائم السنوية في الجزء السادس.`}]},mistake:{title:`معاملة كل الإيجارات كمصروف، أو خصم كل الدفعات بما فيها المسددة`,blocks:[`**الخطأ الأول**: تسجيل إيجار المخزن (5 سنوات) مصروفاً سنوياً وترك الالتزام خارج الميزانية. هذه المعالجة القديمة ولم تعد مقبولة لدى المستأجر.`,`**الخطأ الثاني**: حساب القيمة الحالية لخمس دفعات وإضافة الدفعة الأولى مرة أخرى للأصل. الدفعة المسددة يوم البداية لا تدخل في الالتزام لأنها دُفعت، لكنها تدخل في تكلفة الأصل.`,`**الخطأ الثالث**: نسيان التكاليف المباشرة الأولية (عمولة السمسار) في تكلفة الأصل.`,`**الخطأ الرابع**: تطبيق النموذج الكامل على عقد المقر الإداري لمدة سنة. لا خطأ فيه نظرياً، لكن المعيار يسمح بالإعفاء، والشركة اختارته سياسةً.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`ارسم جدولاً لكل الدفعات بتواريخها: المسدد يوم البداية ← للأصل فقط. والباقي ← قيمته الحالية للالتزام، ثم يُضاف للأصل أيضاً.`}]},quiz:{questions:[{id:`p2e5-q1`,question:`عقد تأجير مدته 5 سنوات بلا خيار شراء. كيف يعالجه المستأجر وفق المعيار 49؟`,options:[{text:`مصروف إيجار سنوي فقط`,explanation:`هذه المعالجة القديمة للتأجير التشغيلي لدى المستأجر.`},{text:`أصل حق استخدام والتزام تأجير في الميزانية`,correct:!0,explanation:`صحيح.`},{text:`شراء أصل ثابت بالقيمة الكاملة للدفعات`,explanation:`الشركة لا تملك المخزن؛ لديها حق استخدامه فقط.`},{text:`إيضاح فقط بلا قيود`,explanation:`يجب الاعتراف بالأصل والالتزام.`}]},{id:`p2e5-q2`,question:`دفعت الشركة الدفعة الأولى يوم بداية العقد. هل تدخل في قياس التزام التأجير؟`,options:[{text:`نعم، بقيمتها الكاملة`,explanation:`الالتزام يشمل الدفعات غير المسددة فقط.`},{text:`لا، لكنها تدخل في تكلفة أصل حق الاستخدام`,correct:!0,explanation:`صحيح.`},{text:`لا، وتُحمَّل مصروفاً`,explanation:`هي جزء من تكلفة الأصل.`},{text:`تدخل بقيمتها الحالية`,explanation:`دُفعت بالفعل، فلا التزام بها.`}]},{id:`p2e5-q3`,question:`التزام تأجير 6,212,963 بمعدل 20% سنوياً. كم فائدة الشهر الأول تقريباً؟`,options:[{text:`1,242,593`,explanation:`هذه فائدة سنة كاملة.`},{text:`103,549`,correct:!0,explanation:`صحيح. 6,212,963 × 20% ÷ 12.`},{text:`200,000`,explanation:`هذا جزء من الإيجار، لا فائدة الالتزام.`},{text:`145,216`,explanation:`هذا إهلاك الأصل الشهري.`}]},{id:`p2e5-q4`,question:`عقد إيجار المقر الإداري سنة واحدة. لماذا عولج كمصروف مدفوع مقدماً؟`,options:[{text:`لأن المقر مكتب وليس مصنعاً`,explanation:`طبيعة الأصل ليست المعيار هنا.`},{text:`لأن الشركة طبقت إعفاء التأجير قصير الأجل (12 شهراً أو أقل)`,correct:!0,explanation:`صحيح.`},{text:`لأن الإيجار مدفوع مقدماً`,explanation:`توقيت الدفع لا يحدد المعالجة.`},{text:`خطأ؛ كان يجب تطبيق النموذج الكامل`,explanation:`الإعفاء مسموح وسياسة الشركة صحيحة.`}]},{id:`p2e5-q5`,question:`أين تظهر فائدة التزام التأجير في قائمة الدخل؟`,options:[{text:`ضمن مصروف الإيجار`,explanation:`لم يعد هناك مصروف إيجار لهذا العقد.`},{text:`ضمن التكاليف التمويلية`,correct:!0,explanation:`صحيح.`},{text:`ضمن تكلفة المبيعات`,explanation:`الفائدة تكلفة تمويل لا تكلفة إنتاج.`},{text:`لا تظهر؛ تُضاف للأصل`,explanation:`الفائدة على الالتزام مصروف تمويلي.`}]}],exercises:[{id:`p2e5-x1`,date:`2026-09-01`,prompt:`سجّل قيد بداية عقد المخزن: القيمة الحالية للدفعات غير المسددة **6,212,963 ج.م**، والدفعة الأولى **2,400,000** وعمولة السمسار **100,000** سُددتا اليوم من البنك.`,solution:[{account:`1160`,debit:8712963},{account:`2102`,credit:6212963},{account:`1250`,credit:25e5}],hints:[`الأصل = الالتزام + كل ما دُفع اليوم.`,`طرفان دائنان: الالتزام والبنك.`],explanation:`أصل حق الاستخدام 8,712,963 مدين، والتزامات التأجير 6,212,963 دائن، والبنك 2,500,000 دائن.`},{id:`p2e5-x2`,date:`2026-09-30`,prompt:`سجّل تسوية إيجار المقر الإداري عن **5 أشهر** (مايو - سبتمبر)، علماً بأن الإيجار الشهري **150,000 ج.م** ومسجل في المصروفات المدفوعة مقدماً.`,solution:[{account:`5205`,debit:75e4},{account:`1220`,credit:75e4}],hints:[`5 × 150,000.`,`مثل قيد تسوية أبريل في الجزء الأول.`],explanation:`مصروف إيجار 750,000 مدين، ومصروفات مدفوعة مقدماً 750,000 دائن.`}]},takeaways:[`لدى المستأجر: أصل حق استخدام والتزام تأجير لكل عقد تقريباً.`,`الالتزام = القيمة الحالية للدفعات غير المسددة، والأصل = الالتزام + المسدد + التكاليف المباشرة.`,`كل شهر: إهلاك للأصل وفائدة على الالتزام (تكلفة تمويلية).`,`الإيجار 12 شهراً أو أقل يمكن تحميله مصروفاً، كما فعلنا مع المقر.`]},oe={id:`p2e6`,part:2,number:6,title:`أول قرض: التمويل ورسملة تكلفة الاقتراض`,subtitle:`القروض البنكية، والأصل المؤهل، ورسملة الفوائد، والجزء المتداول من القرض`,period:`سبتمبر 2026`,minutes:35,objectives:[`أن تسجّل الحصول على قرض بنكي طويل الأجل`,`أن تعرّف الأصل المؤهل ومتى تُرسمل تكلفة الاقتراض`,`أن تحسب تكلفة الاقتراض القابلة للرسملة بعد خصم عائد الاستثمار المؤقت`,`أن تفصل الجزء المتداول من القرض في قائمة المركز المالي`],situation:[`قبل أن يبدأ الإنتاج، قرر مجلس الإدارة التوسع بـ**خط إنتاج ثانٍ لمنتجات الألبان طويلة الأجل**. التكلفة المتوقعة 150 مليون جنيه، والتوريد والتركيب يستغرقان حوالي 14 شهراً. ولم يرغب المجلس في استنزاف النقدية المتبقية (52.75 مليون)، فتفاوض مع البنك:`,{type:`table`,headers:[`بند القرض`,`القيمة`],rows:[[`المبلغ`,`150,000,000 ج.م، صُرف بالكامل في 1 سبتمبر 2026`],[`الغرض`,`تمويل خط الإنتاج الثاني تحديداً`],[`سعر الفائدة`,`22% سنوياً، تُسدد كل ثلاثة أشهر {{review:V10}}`],[`السداد`,`10 أقساط نصف سنوية متساوية (15,000,000 لكل قسط) تبدأ في 1 مارس 2027`],[`الضمان`,`رهن تجاري على خط الإنتاج الثاني`]]},`في اليوم نفسه دفعت الشركة **60,000,000 ج.م** دفعة مقدمة لمورد الخط الثاني، وبدأ المورد التصنيع والتصميم الهندسي. ووضعت **90,000,000 ج.م** المتبقية في **وديعة لأجل** بعائد 18% سنوياً حتى يحين موعد الدفعات التالية.`,`في 30 سبتمبر سأل أحمد: «فائدة القرض عن سبتمبر 2.75 مليون. هل نحمّلها على قائمة الدخل؟»`],explanation:[{type:`heading`,text:`تسجيل القرض`},`عند استلام القرض: يزيد البنك (أصل) ويزيد **القرض** (التزام). والقرض **ليس إيراداً** أبداً؛ فهو مال يجب رده.`,{type:`heading`,text:`{{term:borrowing-costs|تكاليف الاقتراض}} و{{term:qualifying-asset|الأصل المؤهل}}`},`القاعدة العامة: الفوائد **مصروف** في قائمة الدخل. لكن هناك استثناء مهم: إذا كانت تكلفة الاقتراض **مرتبطة مباشرة** باقتناء أو إنشاء **أصل مؤهل**، فإنها **تُرسمل** (تُضاف لتكلفة الأصل).`,`**الأصل المؤهل** أصل يستغرق بالضرورة **فترة زمنية جوهرية** ليصبح جاهزاً للاستخدام أو البيع. خط إنتاج يستغرق 14 شهراً أصل مؤهل. أما ماكينة تُشترى جاهزة فليست كذلك.`,`المنطق: لو اشترت الشركة الخط جاهزاً، لكان المورد قد حمّل تكلفة تمويل فترة التصنيع في السعر. فالفائدة أثناء الإنشاء جزء من تكلفة الحصول على الأصل.`,{type:`heading`,text:`كم نرسمل؟`},`عندما يكون القرض **مخصصاً** لأصل بعينه: نرسمل تكلفة الاقتراض الفعلية للفترة، **مطروحاً منها** أي عائد من الاستثمار المؤقت لأموال القرض غير المستخدمة.`,{type:`table`,caption:`حساب التكلفة القابلة للرسملة عن سبتمبر 2026 (ج.م)`,headers:[`البيان`,`الحساب`,`المبلغ`],rows:[[`فائدة القرض`,`150,000,000 × 22% ÷ 12`,`2,750,000`],[`يُطرح: عائد الوديعة المؤقتة`,`90,000,000 × 18% ÷ 12`,`(1,350,000)`],[`التكلفة المرسملة`,``,`1,400,000`]]},`**متى تبدأ الرسملة؟** عندما تتحقق ثلاثة شروط معاً: الإنفاق على الأصل، وتكبد تكلفة الاقتراض، وبدء الأنشطة اللازمة لإعداد الأصل. وكلها تحققت في 1 سبتمبر. **ومتى تتوقف؟** عندما يكتمل الأصل فعلياً. وتُعلّق إذا توقف النشاط فترات طويلة.`,{type:`heading`,text:`{{term:current-portion|الجزء المتداول من القرض}}`},`القرض طويل الأجل، لكن بعض أقساطه يستحق خلال 12 شهراً من تاريخ القوائم. في 30 سبتمبر 2026 يستحق قسطا مارس 2027 وسبتمبر 2027 خلال 12 شهراً: 2 × 15,000,000 = **30,000,000 ج.م** تُعرض **التزاماً متداولاً**، والباقي (120 مليوناً) غير متداول. والفصل مهم لأن المستثمر والمقرض يقيسان قدرة الشركة على سداد التزاماتها القريبة.`],rule:{refs:[{id:`eas:14`,title:`معيار المحاسبة المصري رقم (14): تكاليف الاقتراض`,counterpart:`IAS 23 Borrowing Costs (الفقرات 5 و8 و12 و17 و20 و22)`,text:`تُرسمل تكاليف الاقتراض المرتبطة مباشرة باقتناء أو إنشاء أو إنتاج أصل مؤهل كجزء من تكلفته، وتُعترف التكاليف الأخرى مصروفاً. والأصل المؤهل هو الذي يستغرق بالضرورة فترة زمنية جوهرية ليصبح جاهزاً للاستخدام المقصود أو البيع. وعند اقتراض أموال خصيصاً لأصل مؤهل، تكون التكلفة القابلة للرسملة هي تكلفة الاقتراض الفعلية مطروحاً منها عائد الاستثمار المؤقت لتلك الأموال. وتبدأ الرسملة عند الإنفاق على الأصل وتكبد تكاليف الاقتراض وبدء الأنشطة اللازمة، وتتوقف عند اكتمال الأنشطة اللازمة.`},{id:`eas:1`,title:`معيار المحاسبة المصري رقم (1): التصنيف المتداول وغير المتداول`,counterpart:`IAS 1 (الفقرة 69)`,text:`تُصنف المنشأة الالتزام متداولاً إذا كان مستحق السداد خلال اثني عشر شهراً بعد فترة التقرير، أو إذا لم يكن لها حق في تأجيل سداده لمدة لا تقل عن اثني عشر شهراً بعد فترة التقرير.`}]},application:{entries:[{id:`p2e6-j1`,date:`2026-09-01`,description:`استلام قرض بنكي طويل الأجل لتمويل خط الإنتاج الثاني`,lines:[{account:`1250`,debit:15e7},{account:`2101`,credit:15e7}],steps:[`البنك يزيد (أصل)`,`القرض يزيد (التزام غير متداول)`,`لا أثر على قائمة الدخل`]},{id:`p2e6-j2`,date:`2026-09-01`,description:`دفعة مقدمة لمورد خط الإنتاج الثاني (بدء التصنيع والتصميم)`,lines:[{account:`1190`,debit:6e7},{account:`1250`,credit:6e7}],steps:[`الخط تحت الإنشاء ← مشروعات تحت التنفيذ`]},{id:`p2e6-j3`,date:`2026-09-01`,description:`إيداع الجزء غير المستخدم من القرض في وديعة لأجل`,lines:[{account:`1260`,debit:9e7},{account:`1250`,credit:9e7}],steps:[`نقل بين أصلين متداولين`,`الوديعة قصيرة الأجل لحين سداد دفعات المورد التالية`]},{id:`p2e6-j4`,date:`2026-09-30`,description:`استحقاق فائدة القرض عن سبتمبر ورسملتها على خط الإنتاج الثاني`,lines:[{account:`1190`,debit:275e4},{account:`2207`,credit:275e4}],steps:[`150,000,000 × 22% ÷ 12 = 2,750,000`,`قرض مخصص لأصل مؤهل ← تُرسمل على مشروعات تحت التنفيذ`,`تُسدد مع القسط الربع سنوي ← فوائد مستحقة`]},{id:`p2e6-j5`,date:`2026-09-30`,description:`عائد الوديعة المؤقتة عن سبتمبر (يُخصم من تكلفة الاقتراض المرسملة)`,lines:[{account:`1240`,debit:135e4},{account:`1190`,credit:135e4}],steps:[`90,000,000 × 18% ÷ 12 = 1,350,000`,`عائد استثمار مؤقت لأموال القرض المخصص ← يُطرح من المرسمل`,`صافي المرسمل = 2,750,000 − 1,350,000 = 1,400,000`,`العائد مستحق ولم يُقبض بعد ← مدينون متنوعون`]},{id:`p2e6-j6`,date:`2026-09-30`,description:`تبويب الجزء المستحق خلال 12 شهراً من القرض التزاماً متداولاً`,lines:[{account:`2101`,debit:3e7},{account:`2206`,credit:3e7}],steps:[`قسطا مارس وسبتمبر 2027 = 2 × 15,000,000`,`إعادة تبويب بين التزامين؛ إجمالي القرض لم يتغير`]}],outro:[{type:`table`,caption:`القرض في قائمة المركز المالي 30 سبتمبر 2026 (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`قروض طويلة الأجل (غير متداولة)`,`120,000,000`],[`الجزء المتداول من القروض`,`30,000,000`],[`فوائد مستحقة`,`2,750,000`],[`مشروعات تحت التنفيذ (الخط الثاني)`,`61,400,000`]]},{type:`callout`,tone:`success`,title:`نهاية الجزء الثاني`,text:`المصنع جاهز، والخط الثاني تحت الإنشاء، والشركة تبدأ الإنتاج في أكتوبر. افتح «القوائم المالية» لترى الأصول والتمويل في مكانهما، وقائمة الدخل الشامل بفائض إعادة التقييم.`}]},mistake:{title:`تحميل كل الفوائد مصروفاً، أو نسيان خصم عائد الاستثمار المؤقت`,blocks:[`**الخطأ الأول**: تحميل فائدة قرض الخط الثاني على قائمة الدخل. المعيار يُلزم برسملة تكاليف الاقتراض المرتبطة مباشرة بأصل مؤهل؛ ليست اختيارية.`,`**الخطأ الثاني**: رسملة الفائدة كاملة (2.75 مليون) وتسجيل عائد الوديعة إيراداً منفصلاً. عائد الاستثمار المؤقت لأموال القرض المخصص يُطرح من المبلغ المرسمل.`,`**الخطأ الثالث**: رسملة فوائد على ماكينة اشتُريت جاهزة، أو الاستمرار في رسملة الفوائد بعد اكتمال الخط. الرسملة تخص الأصل المؤهل وفترة إنشائه فقط.`,`**الخطأ الرابع**: عرض القرض كله غير متداول. الأقساط المستحقة خلال 12 شهراً التزام متداول.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`لكل قرض اسأل: **هل هو مخصص لأصل يستغرق إنشاؤه وقتاً طويلاً؟** إن كان كذلك: رسمل الفائدة ناقصاً عائد الاستثمار المؤقت، حتى اكتمال الأصل. وفي نهاية كل فترة: افصل أقساط الـ12 شهراً القادمة.`}]},quiz:{questions:[{id:`p2e6-q1`,question:`حصلت الشركة على قرض 150 مليوناً. ما أثره على قائمة الدخل يوم الاستلام؟`,options:[{text:`إيراد 150 مليوناً`,explanation:`القرض التزام يجب رده، لا إيراد.`},{text:`لا أثر؛ يزيد البنك ويزيد التزام القرض`,correct:!0,explanation:`صحيح.`},{text:`مصروف فوائد 150 مليوناً`,explanation:`الفوائد تستحق مع مرور الوقت لا عند الاستلام.`},{text:`زيادة في رأس المال`,explanation:`القرض تمويل من الغير لا من الملاك.`}]},{id:`p2e6-q2`,question:`أي الأصول التالية أصل مؤهل لرسملة تكلفة الاقتراض؟`,options:[{text:`سيارة نقل اشتُريت جاهزة من الوكيل`,explanation:`جاهزة للاستخدام فور الشراء.`},{text:`خط إنتاج يستغرق تصنيعه وتركيبه 14 شهراً`,correct:!0,explanation:`صحيح. يستغرق فترة جوهرية ليصبح جاهزاً.`},{text:`مخزون منتجات تُصنع في يوم واحد`,explanation:`لا يستغرق فترة جوهرية.`},{text:`وديعة بنكية`,explanation:`الأصول المالية ليست أصولاً مؤهلة.`}]},{id:`p2e6-q3`,question:`فائدة القرض المخصص عن الشهر 2.75 مليون، وعائد استثمار أمواله غير المستخدمة 1.35 مليون. كم يُرسمل؟`,options:[{text:`2,750,000`,explanation:`يجب طرح عائد الاستثمار المؤقت.`},{text:`1,400,000`,correct:!0,explanation:`صحيح. 2,750,000 − 1,350,000.`},{text:`4,100,000`,explanation:`لا نجمع العائد على التكلفة.`},{text:`صفر؛ الفوائد مصروف دائماً`,explanation:`تكاليف الاقتراض لأصل مؤهل تُرسمل إلزامياً.`}]},{id:`p2e6-q4`,question:`قرض 150 مليوناً يُسدد على 10 أقساط نصف سنوية (15 مليوناً) تبدأ بعد 6 أشهر من تاريخ القوائم. كم الجزء المتداول؟`,options:[{text:`15,000,000`,explanation:`قسطان يستحقان خلال 12 شهراً، لا قسط واحد.`},{text:`30,000,000`,correct:!0,explanation:`صحيح. القسطان الأول والثاني خلال 12 شهراً.`},{text:`150,000,000`,explanation:`معظم القرض يستحق بعد أكثر من سنة.`},{text:`صفر لأن السداد لم يبدأ`,explanation:`العبرة بالاستحقاق خلال 12 شهراً من تاريخ القوائم.`}]},{id:`p2e6-q5`,question:`متى تتوقف رسملة تكلفة الاقتراض على الخط الثاني؟`,options:[{text:`عند سداد آخر قسط من القرض`,explanation:`الرسملة مرتبطة بفترة إنشاء الأصل لا بعمر القرض.`},{text:`عند اكتمال الأنشطة اللازمة لإعداد الخط للاستخدام`,correct:!0,explanation:`صحيح. بعدها تُحمَّل الفوائد مصروفاً تمويلياً.`},{text:`في نهاية السنة المالية`,explanation:`لا علاقة لنهاية السنة بذلك.`},{text:`عند بدء الإنتاج بالطاقة الكاملة`,explanation:`التوقف عند اكتمال الأنشطة اللازمة، لا عند بلوغ الطاقة الكاملة.`}]}],exercises:[{id:`p2e6-x1`,date:`2026-09-30`,prompt:`سجّل **قيداً واحداً** يثبت رسملة صافي تكلفة الاقتراض عن سبتمبر: فائدة القرض المستحقة **2,750,000** (لم تُسدد)، وعائد الوديعة المستحق **1,350,000** (لم يُقبض).`,solution:[{account:`1190`,debit:14e5},{account:`1240`,debit:135e4},{account:`2207`,credit:275e4}],hints:[`الفائدة كلها التزام مستحق.`,`عائد الوديعة حق مستحق للشركة.`,`المرسمل على المشروع هو الصافي فقط.`],explanation:`مشروعات تحت التنفيذ 1,400,000 مدين، ومدينون متنوعون 1,350,000 مدين، وفوائد مستحقة 2,750,000 دائن. (التطبيق سجّله في قيدين منفصلين، والنتيجة واحدة.)`},{id:`p2e6-x2`,date:`2026-09-30`,prompt:`سجّل قيد تبويب **30,000,000 ج.م** من القرض طويل الأجل التزاماً متداولاً.`,solution:[{account:`2101`,debit:3e7},{account:`2206`,credit:3e7}],hints:[`الالتزام غير المتداول ينقص ← مدين.`,`الالتزام المتداول يزيد ← دائن.`],explanation:`قروض طويلة الأجل مدين، والجزء المتداول من القروض دائن.`}]},takeaways:[`القرض التزام وليس إيراداً.`,`تكلفة الاقتراض المرتبطة مباشرة بأصل مؤهل تُرسمل إلزامياً، ناقصاً عائد الاستثمار المؤقت.`,`الرسملة من بدء الإنشاء حتى اكتماله، وبعدها الفوائد مصروف تمويلي.`,`أقساط الـ12 شهراً القادمة التزام متداول: 30,000,000 ج.م.`]},se={id:`p3e1`,part:3,number:1,title:`دورة المشتريات: من أمر الشراء إلى السداد`,subtitle:`المطابقة الثلاثية، وتكلفة المشتريات، والخصم التجاري، ومردودات المشتريات`,period:`أكتوبر 2026`,minutes:30,objectives:[`أن تشرح خطوات دورة المشتريات والمستندات المرتبطة بكل خطوة`,`أن تطبق المطابقة الثلاثية قبل تسجيل فاتورة المورد`,`أن تحدد تكلفة المخزون المشترى (الخصم التجاري ومصاريف النقل للداخل)`,`أن تسجّل مردودات المشتريات وسداد الموردين`],situation:[`أكتوبر 2026: أول شهر إنتاج فعلي. أصبح لدى الشركة حوالي 500 موظف، وبدأت إدارة المشتريات تعمل بنظام ERP الذي اشترته في سبتمبر. وحدثت العمليات التالية:`,{type:`table`,headers:[`التاريخ`,`العملية`],rows:[[`2 أكتوبر`,`شراء خامات (مركزات فاكهة، سكر، معجون طماطم) من شركة «الوادي للمواد الغذائية»: السعر بالقائمة 12,000,000 ج.م بخصم تجاري 5%، آجل 45 يوماً`],[`3 أكتوبر`,`شراء مواد تعبئة (عبوات كرتونية وكراتين خارجية) من «الدلتا للتغليف» بمبلغ 4,200,000 ج.م آجل`],[`4 أكتوبر`,`سداد نقل الخامات من مخازن المورد إلى المصنع: 300,000 ج.م من البنك`],[`8 أكتوبر`,`رد خامات غير مطابقة للمواصفات إلى «الوادي» بقيمة 400,000 ج.م (بالسعر بعد الخصم)`],[`15 أكتوبر`,`سداد الرصيد القديم للمصنع المتعاقد (من الجزء الأول): 5,500,000 ج.م`],[`20 أكتوبر`,`سداد فاتورة كهرباء المقر عن أبريل التي سُجلت مستحقة في الجزء الأول: 45,000 ج.م`]]},`قبل تسجيل فاتورة «الوادي» لاحظ أحمد أن الكمية في الفاتورة أكبر مما استلمه المخزن فعلاً. فقالت الأستاذة منى: «لهذا السبب لا يُسجَّل شيء قبل المطابقة الثلاثية.» وبعد المراجعة أصدر المورد فاتورة معدلة مطابقة للاستلام.`],explanation:[{type:`heading`,text:`دورة المشتريات`},{type:`list`,ordered:!0,items:[`**طلب الشراء**: الإدارة المستخدمة (الإنتاج) تطلب الخامات.`,`**أمر الشراء**: إدارة المشتريات تعتمده وترسله للمورد بالكمية والسعر.`,`**إذن الاستلام**: المخزن يستلم ويفحص ويثبت الكمية المطابقة فعلاً.`,`**فاتورة المورد**: تصل بعد التوريد.`,`**{{term:three-way-match|المطابقة الثلاثية}}**: أمر الشراء = إذن الاستلام = الفاتورة (كمية وسعراً)، ثم يُسجَّل القيد.`,`**السداد** في تاريخ الاستحقاق بعد الاعتماد.`]},`هذا الفصل بين من يطلب ومن يشتري ومن يستلم ومن يسدد هو أساس **{{term:internal-control|الرقابة الداخلية}}** على المشتريات، ويمنع الشراء الوهمي أو سداد ما لم يُستلم.`,{type:`heading`,text:`ما تكلفة المخزون المشترى؟`},`تشمل **تكلفة الشراء**: سعر الشراء، ومصاريف النقل والمناولة حتى المخزن، والرسوم غير القابلة للاسترداد، **مطروحاً منها** الخصومات التجارية والمسموحات.`,{type:`table`,caption:`تكلفة خامات «الوادي» (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`السعر بالقائمة`,`12,000,000`],[`يُطرح: خصم تجاري 5%`,`(600,000)`],[`صافي الفاتورة`,`11,400,000`],[`يُضاف: نقل الخامات للمصنع`,`300,000`],[`يُطرح: مردودات مشتريات`,`(400,000)`],[`تكلفة الخامات المتاحة`,`11,300,000`]]},`**{{term:trade-discount|الخصم التجاري}}** يُخصم من السعر مباشرة ولا يُسجَّل في الدفاتر منفصلاً؛ نسجّل الصافي. أما **النقل للداخل** فجزء من تكلفة المخزون، بخلاف نقل المنتجات للعملاء (مصروف بيع).`,{type:`heading`,text:`خامات أم مواد تعبئة؟`},`تحتفظ الشركة بحسابين منفصلين للمخزون: **مخزون الخامات** (مكونات المنتج) و**مخزون مواد التعبئة**. والفصل يساعد في الرقابة وفي حساب تكلفة المنتج في الحلقة القادمة.`,`لاحظ أن «الدلتا للتغليف» شركة شقيقة تملك فيها الشركة حصة مؤثرة. المعاملات معها تُسجَّل الآن كأي مورد، لكن سيلزم الإفصاح عنها كمعاملات مع **أطراف ذات علاقة** (الجزء الخامس).`],rule:{refs:[{id:`eas:2`,title:`معيار المحاسبة المصري رقم (2): المخزون - تكلفة الشراء`,counterpart:`IAS 2 Inventories (الفقرتان 10 و11)`,text:`تشمل تكلفة المخزون كل تكاليف الشراء وتكاليف التحويل والتكاليف الأخرى اللازمة لجعل المخزون في موقعه وحالته الراهنة. وتتضمن تكاليف الشراء سعر الشراء والرسوم غير القابلة للاسترداد وتكاليف النقل والمناولة المرتبطة مباشرة بالحصول على البضاعة، وتُخصم الخصومات التجارية والمسموحات والبنود المماثلة.`},{id:`law:17-1999:art21`,title:`قانون التجارة - المادة 21`,text:`الدفاتر يجب أن تبيّن ما على التاجر من ديون متعلقة بتجارته؛ وحساب الموردين وحساباتهم المساعدة هما ما يحقق ذلك، مع الاحتفاظ بالمستندات المؤيدة (أوامر الشراء، وأذون الاستلام، والفواتير) المدة القانونية.`}]},application:{entries:[{id:`p3e1-j1`,date:`2026-10-02`,description:`شراء خامات من «الوادي للمواد الغذائية» آجلاً (12,000,000 بخصم تجاري 5%) بعد المطابقة الثلاثية`,lines:[{account:`1201`,debit:114e5},{account:`2201`,credit:114e5}],steps:[`12,000,000 × 95% = 11,400,000`,`الخصم التجاري لا يُسجَّل منفصلاً`,`مخزون الخامات مدين، والموردون دائن`]},{id:`p3e1-j2`,date:`2026-10-03`,description:`شراء مواد تعبئة من «الدلتا للتغليف» (شركة شقيقة) آجلاً`,lines:[{account:`1202`,debit:42e5},{account:`2201`,credit:42e5}]},{id:`p3e1-j3`,date:`2026-10-04`,description:`سداد مصاريف نقل الخامات من مخازن المورد إلى المصنع`,lines:[{account:`1201`,debit:3e5},{account:`1250`,credit:3e5}],steps:[`نقل للداخل ← جزء من تكلفة المخزون (المعيار 2)`,`ليس مصروف نقل للعملاء`]},{id:`p3e1-j4`,date:`2026-10-08`,description:`رد خامات غير مطابقة للمواصفات إلى «الوادي» (إشعار مدين)`,lines:[{account:`2201`,debit:4e5},{account:`1201`,credit:4e5}],steps:[`المديونية للمورد تنقص ← الموردون مدين`,`المخزون خرج ← مخزون الخامات دائن`,`بالسعر الصافي بعد الخصم`]},{id:`p3e1-j5`,date:`2026-10-15`,description:`سداد الرصيد القديم للمصنع المتعاقد (مشتريات أبريل)`,lines:[{account:`2201`,debit:55e5},{account:`1250`,credit:55e5}]},{id:`p3e1-j6`,date:`2026-10-20`,description:`سداد فاتورة كهرباء ومياه المقر عن أبريل (مستحقة من الجزء الأول)`,lines:[{account:`2203`,debit:45e3},{account:`1250`,credit:45e3}],steps:[`المصروف سُجّل في أبريل بقيد التسوية`,`السداد الآن يقفل الالتزام فقط ولا يُسجَّل مصروف مرة ثانية`]}],outro:[{type:`callout`,tone:`success`,title:`الأرصدة بعد المشتريات`,text:`مخزون الخامات **11,300,000**، ومواد التعبئة **4,200,000**، والموردون **15,200,000**، والبنك **46,905,000 ج.م**.`}]},mistake:{title:`تسجيل الفاتورة قبل الاستلام، أو تحميل النقل للداخل على المصروفات`,blocks:[`**الخطأ الأول**: تسجيل فاتورة المورد فور وصولها دون مطابقتها بإذن الاستلام. النتيجة: التزام ومخزون غير موجودين، وقد تسدد الشركة ما لم تستلمه.`,`**الخطأ الثاني**: تحميل نقل الخامات إلى المصنع على «مصروفات نقل». النقل للداخل جزء من تكلفة المخزون، ويظهر في تكلفة المبيعات عند بيع المنتج.`,`**الخطأ الثالث**: تسجيل الفاتورة بالسعر قبل الخصم التجاري ثم تسجيل الخصم «إيراداً». الخصم التجاري تخفيض للتكلفة لا إيراد.`,`**الخطأ الرابع**: تسجيل مصروف كهرباء أبريل مرة ثانية عند السداد في أكتوبر.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`اجعلها قاعدة في النظام: **لا فاتورة بلا إذن استلام مطابق**. وكل ما يُصرف حتى تصل الخامات للمخزن يدخل في تكلفتها.`}]},quiz:{questions:[{id:`p3e1-q1`,question:`ما المستندات الثلاثة في المطابقة الثلاثية؟`,options:[{text:`أمر الشراء، وإذن الاستلام، وفاتورة المورد`,correct:!0,explanation:`صحيح.`},{text:`طلب الشراء، والشيك، وكشف الحساب`,explanation:`الشيك وكشف الحساب يخصان السداد لا التسجيل.`},{text:`الفاتورة، وإذن الصرف، وبطاقة الصنف`,explanation:`إذن الصرف يخص خروج المخزون للإنتاج.`},{text:`العقد، والفاتورة، والإيصال`,explanation:`ليست هذه المستندات المقصودة.`}]},{id:`p3e1-q2`,question:`خامات بسعر قائمة 12,000,000 بخصم تجاري 5%، ومصاريف نقلها للمصنع 300,000. ما تكلفتها؟`,options:[{text:`12,300,000`,explanation:`يجب طرح الخصم التجاري.`},{text:`11,400,000`,explanation:`النقل للداخل جزء من التكلفة.`},{text:`11,700,000`,correct:!0,explanation:`صحيح. 11,400,000 + 300,000.`},{text:`12,000,000`,explanation:`يجب طرح الخصم وإضافة النقل.`}]},{id:`p3e1-q3`,question:`ردت الشركة خامات بقيمة 400,000 للمورد. ما القيد؟`,options:[{text:`من حـ/ الموردون إلى حـ/ مخزون الخامات`,correct:!0,explanation:`صحيح. ينقص الالتزام وينقص المخزون.`},{text:`من حـ/ مخزون الخامات إلى حـ/ الموردون`,explanation:`هذا قيد الشراء لا الرد.`},{text:`من حـ/ الموردون إلى حـ/ إيرادات أخرى`,explanation:`الرد ليس إيراداً.`},{text:`من حـ/ البنك إلى حـ/ مخزون الخامات`,explanation:`لم تُسترد نقدية؛ الفاتورة لم تُسدد بعد.`}]},{id:`p3e1-q4`,question:`أين تُسجَّل مصاريف نقل المنتجات التامة إلى مخازن العملاء؟`,options:[{text:`تُضاف لتكلفة المخزون`,explanation:`بعد البيع لم يعد المخزون ملك الشركة؛ هذا نقل للخارج.`},{text:`مصروف بيع وتوزيع`,correct:!0,explanation:`صحيح. النقل للداخل فقط يدخل التكلفة.`},{text:`تُخصم من الإيراد`,explanation:`ليست خصماً للعميل.`},{text:`أصل ثابت`,explanation:`لا علاقة لها بالأصول الثابتة.`}]},{id:`p3e1-q5`,question:`سددت الشركة في أكتوبر فاتورة كهرباء أبريل (45,000) التي سُجلت مستحقة. ما القيد؟`,options:[{text:`من حـ/ كهرباء ومياه إلى حـ/ البنك`,explanation:`المصروف سُجّل في أبريل؛ تسجيله مرة ثانية يكرر المصروف.`},{text:`من حـ/ مصروفات مستحقة إلى حـ/ البنك`,correct:!0,explanation:`صحيح. السداد يقفل الالتزام فقط.`},{text:`لا قيد`,explanation:`النقدية خرجت، فلا بد من قيد.`},{text:`من حـ/ البنك إلى حـ/ مصروفات مستحقة`,explanation:`الاتجاه معكوس.`}]}],exercises:[{id:`p3e1-x1`,date:`2026-10-02`,prompt:`سجّل قيد شراء خامات آجلاً: السعر بالقائمة **12,000,000 ج.م** وخصم تجاري **5%**.`,solution:[{account:`1201`,debit:114e5},{account:`2201`,credit:114e5}],hints:[`سجّل الصافي بعد الخصم.`,`الشراء آجل ← الموردون.`],explanation:`مخزون الخامات مدين 11,400,000، والموردون دائن 11,400,000.`},{id:`p3e1-x2`,date:`2026-10-08`,prompt:`سجّل رد خامات غير مطابقة بقيمة **400,000 ج.م** إلى المورد (الفاتورة لم تُسدد).`,solution:[{account:`2201`,debit:4e5},{account:`1201`,credit:4e5}],hints:[`ما الذي نقص: المخزون والالتزام.`],explanation:`الموردون مدين، ومخزون الخامات دائن.`}]},takeaways:[`لا تسجيل لفاتورة مورد قبل المطابقة الثلاثية.`,`تكلفة المشتريات = السعر − الخصم التجاري + النقل للداخل.`,`النقل للعملاء مصروف بيع، والنقل للمصنع جزء من تكلفة المخزون.`,`الخامات 11,300,000 ومواد التعبئة 4,200,000 والموردون 15,200,000 ج.م.`]},ce={id:`p3e2`,part:3,number:2,title:`كم تكلفة الكرتونة؟ محاسبة التكاليف في المصنع`,subtitle:`عناصر التكلفة، والتكاليف غير المباشرة، والطاقة العادية، والوحدات المعادلة`,period:`أكتوبر 2026`,minutes:40,objectives:[`أن تميّز بين المواد المباشرة والأجور المباشرة والتكاليف الصناعية غير المباشرة`,`أن تتبع تدفق التكاليف: الخامات ← الإنتاج تحت التشغيل ← الإنتاج التام`,`أن تحمّل التكاليف الثابتة على أساس الطاقة العادية وتعالج الطاقة غير المستغلة`,`أن تحسب تكلفة الوحدة بطريقة الوحدات المعادلة`],situation:[`انتهى أول شهر إنتاج. اجتمع مدير المصنع والأستاذة منى ليجيبا عن السؤال الذي سيبني عليه قسم المبيعات أسعاره: **كم تكلّف الكرتونة الواحدة؟**`,{type:`table`,caption:`تقرير الإنتاج والتكاليف لشهر أكتوبر 2026`,headers:[`البند`,`القيمة`],rows:[[`خامات منصرفة للإنتاج`,`9,800,000 ج.م`],[`مواد تعبئة منصرفة للإنتاج`,`3,500,000 ج.م`],[`أجور عمال الخطوط (380 عاملاً) - مسددة`,`4,565,000 ج.م`],[`أجور غير مباشرة (مشرفون، صيانة، جودة) - مسددة`,`1,150,372 ج.م`],[`مستلزمات تشغيل وقطع غيار مستهلكة - مسددة`,`300,000 ج.م`],[`كهرباء وغاز ومياه المصنع - مستحقة (الفاتورة في نوفمبر)`,`1,560,000 ج.م`],[`إهلاك مبنى المصنع والآلات وأصل حق استخدام المخزن`,`1,099,628 ج.م`],[`الطاقة العادية للمصنع`,`300,000 كرتونة شهرياً`],[`كراتين بدأ إنتاجها`,`280,000`],[`كراتين اكتملت ونُقلت لمخزن الإنتاج التام`,`270,000`],[`كراتين تحت التشغيل آخر الشهر`,`10,000 (المواد 100%، التشغيل 50%)`]]},`قال مدير المصنع: «أنتجنا أقل من طاقتنا العادية لأن الخط الأول احتاج ضبطاً في الأسبوع الأول.» فردت الأستاذة منى: «وهذا سيؤثر على طريقة تحميل التكاليف الثابتة.»`],explanation:[{type:`heading`,text:`عناصر تكلفة المنتج`},{type:`table`,headers:[`العنصر`,`التعريف`,`مثال`],rows:[[`{{term:direct-materials|المواد المباشرة}}`,`مواد تدخل في المنتج ويمكن تتبعها إليه`,`المركزات والسكر والعبوات`],[`{{term:direct-labour|الأجور المباشرة}}`,`أجور من يعمل مباشرة على المنتج`,`عمال خطوط الإنتاج`],[`{{term:manufacturing-overhead|التكاليف الصناعية غير المباشرة}}`,`كل تكلفة صناعية أخرى لا يمكن تتبعها لوحدة بعينها`,`الإشراف، والصيانة، والكهرباء، وإهلاك المصنع`]]},`والأجور المباشرة مع التكاليف غير المباشرة تُسمى **تكاليف التحويل**: تكلفة تحويل الخامات إلى منتج.`,`تذكّر من الجزء الثاني: إهلاك سبتمبر حُمّل مصروفاً لأن الإنتاج لم يبدأ. **من أكتوبر يدخل إهلاك المصنع في تكلفة المنتج** ضمن التكاليف غير المباشرة.`,{type:`heading`,text:`تدفق التكاليف في الدفاتر`},`مخزون خامات ← **{{term:work-in-progress|إنتاج تحت التشغيل}}** ← مخزون إنتاج تام ← تكلفة المبيعات (عند البيع).`,`وتُجمع التكاليف غير المباشرة الفعلية أولاً في **حساب رقابة** مؤقت، ثم تُحمَّل على الإنتاج بقيد واحد.`,{type:`heading`,text:`الثابت والمتغير و{{term:normal-capacity|الطاقة العادية}}`},{type:`list`,items:[`**التكاليف غير المباشرة المتغيرة** (الكهرباء والغاز، والمستلزمات) تتغير مع حجم الإنتاج، فتُحمَّل كلها على الإنتاج الفعلي = 1,860,000.`,`**التكاليف غير المباشرة الثابتة** (الإشراف، والإهلاك) لا تتغير مع الإنتاج = 2,250,000. وتُحمَّل على المخزون **على أساس الطاقة العادية**، لا الإنتاج الفعلي.`]},`معدل التحميل الثابت = 2,250,000 ÷ 300,000 كرتونة (طاقة عادية) = 7.5 ج.م للكرتونة. المحمَّل على الإنتاج = 280,000 × 7.5 = **2,100,000**. والفرق **150,000** تكلفة **طاقة غير مستغلة** تُحمَّل مصروفاً في الفترة ولا تدخل المخزون.`,`لماذا؟ لو حمّلنا الثابت كله على إنتاج أقل، لارتفعت تكلفة الكرتونة بسبب عدم الكفاءة، ولظهر المخزون بأكثر من تكلفته الحقيقية.`,`إجمالي غير المباشر المحمَّل = 1,860,000 + 2,100,000 = **3,960,000**.`,{type:`heading`,text:`{{term:equivalent-units|الوحدات المعادلة}}`},`الكراتين العشرة آلاف تحت التشغيل حصلت على كل موادها لكن على نصف تشغيلها فقط. لذلك نترجمها إلى «ما يعادل» وحدات تامة:`,{type:`table`,caption:`حساب تكلفة الوحدة - أكتوبر 2026`,headers:[``,`المواد`,`التحويل (أجور + غير مباشرة)`],rows:[[`وحدات تامة`,`270,000`,`270,000`],[`وحدات تحت التشغيل (معادلة)`,`10,000 × 100% = 10,000`,`10,000 × 50% = 5,000`],[`إجمالي الوحدات المعادلة`,`280,000`,`275,000`],[`التكاليف`,`13,300,000`,`4,565,000 + 3,960,000 = 8,525,000`],[`تكلفة الوحدة المعادلة`,`47.50`,`31.00`]]},`تكلفة الكرتونة التامة = 47.5 + 31 = **78.5 ج.م**.`,{type:`list`,items:[`الإنتاج التام: 270,000 × 78.5 = **21,195,000** ← مخزون إنتاج تام.`,`تحت التشغيل: (10,000 × 47.5) + (5,000 × 31) = **630,000** ← يبقى في حساب الإنتاج تحت التشغيل.`]}],rule:{refs:[{id:`eas:2:conversion`,title:`معيار المحاسبة المصري رقم (2): تكاليف التحويل والطاقة العادية`,counterpart:`IAS 2 (الفقرتان 12 و13)`,text:`تشمل تكاليف التحويل التكاليف المرتبطة مباشرة بوحدات الإنتاج كالأجور المباشرة، وتحميلاً منتظماً للتكاليف الصناعية غير المباشرة الثابتة والمتغيرة. ويُحمَّل الثابت منها على أساس الطاقة العادية لتسهيلات الإنتاج، ولا يزيد المبلغ المحمَّل على كل وحدة بسبب انخفاض الإنتاج أو تعطل المصنع، وتُعترف التكاليف غير المحمَّلة مصروفاً في الفترة التي حدثت فيها. أما المتغيرة فتُحمَّل على أساس الاستخدام الفعلي.`},{id:`eas:2:exclusions`,title:`تكاليف لا تدخل في تكلفة المخزون`,counterpart:`IAS 2 (الفقرة 16)`,text:`تُستبعد من تكلفة المخزون وتُحمَّل مصروفاً: الكميات غير العادية من الفاقد في المواد أو العمالة، وتكاليف التخزين (إلا ما يلزم في عملية الإنتاج)، والمصروفات الإدارية التي لا تسهم في وضع المخزون في موقعه وحالته، وتكاليف البيع.`}]},application:{entries:[{id:`p3e2-j1`,date:`2026-10-31`,description:`صرف خامات ومواد تعبئة للإنتاج خلال أكتوبر (مجمع أذون الصرف)`,lines:[{account:`1204`,debit:133e5},{account:`1201`,credit:98e5},{account:`1202`,credit:35e5}],steps:[`المواد انتقلت من المخزن إلى خط الإنتاج`,`مواد مباشرة ← إنتاج تحت التشغيل`]},{id:`p3e2-j2`,date:`2026-10-31`,description:`أجور عمال خطوط الإنتاج عن أكتوبر (أجور مباشرة)`,lines:[{account:`1204`,debit:4565e3},{account:`1250`,credit:4565e3}],steps:[`أجور مباشرة ← إنتاج تحت التشغيل (لا مصروف مرتبات)`,`الاستقطاعات والتأمينات في الجزء الرابع`]},{id:`p3e2-j3`,date:`2026-10-31`,description:`أجور غير مباشرة (1,150,372) ومستلزمات تشغيل (300,000) للمصنع`,lines:[{account:`1205`,debit:1450372},{account:`1250`,credit:1450372}],steps:[`تكاليف صناعية لا يمكن تتبعها للوحدة ← حساب الرقابة`]},{id:`p3e2-j4`,date:`2026-10-31`,description:`استحقاق كهرباء وغاز ومياه المصنع عن أكتوبر`,lines:[{account:`1205`,debit:156e4},{account:`2203`,credit:156e4}]},{id:`p3e2-j5`,date:`2026-10-31`,description:`إهلاك أكتوبر: مبنى المصنع، والآلات، وأصل حق استخدام مخزن الخامات`,lines:[{account:`1205`,debit:1099628},{account:`1182`,credit:175e3},{account:`1183`,credit:779412},{account:`1169`,credit:145216}],steps:[`المبنى 175,000 (كما في سبتمبر)`,`الآلات: الخط الرئيسي 750,000 + ماكينة التغليف بعد الاضمحلال 3,500,000 ÷ 119 = 29,412 ← 779,412`,`المخزن يخدم الإنتاج ← إهلاكه 145,216 تكلفة صناعية`,`الإنتاج بدأ ← الإهلاك يذهب لحساب الرقابة لا لمصروف الإهلاك`]},{id:`p3e2-j6`,date:`2026-10-31`,description:`تحميل التكاليف الصناعية غير المباشرة على الإنتاج، وإثبات تكلفة الطاقة غير المستغلة`,lines:[{account:`1204`,debit:396e4},{account:`5103`,debit:15e4},{account:`1205`,credit:411e4}],steps:[`إجمالي الفعلي = 1,450,372 + 1,560,000 + 1,099,628 = 4,110,000`,`المتغير 1,860,000 يُحمَّل كاملاً`,`الثابت 2,250,000 × (280,000 ÷ 300,000) = 2,100,000`,`غير المحمَّل 150,000 ← مصروف (تكاليف طاقة غير مستغلة)`]},{id:`p3e2-j7`,date:`2026-10-31`,description:`تحويل 270,000 كرتونة تامة إلى مخزن الإنتاج التام بتكلفة 78.5 ج.م للكرتونة`,lines:[{account:`1203`,debit:21195e3},{account:`1204`,credit:21195e3}],steps:[`270,000 × 78.5 = 21,195,000`,`يتبقى في الإنتاج تحت التشغيل 630,000`]}],outro:[{type:`callout`,tone:`success`,title:`النتيجة`,text:`تكلفة الكرتونة **78.5 ج.م**. الإنتاج التام 21,195,000، وتحت التشغيل 630,000، وتكلفة الطاقة غير المستغلة 150,000 مصروف. والبنك **40,889,628 ج.م**.`}]},mistake:{title:`تحميل كل التكاليف الثابتة على الإنتاج الفعلي، أو تسجيل الأجور المباشرة مصروفاً`,blocks:[`**الخطأ الأول**: قسمة كل التكاليف الثابتة (2,250,000) على الإنتاج الفعلي (280,000). النتيجة: تكلفة كرتونة أعلى، ومخزون مضخم بتكلفة عدم الكفاءة. المعيار يحمّل الثابت على أساس الطاقة العادية.`,`**الخطأ الثاني**: تسجيل أجور عمال الخطوط وإهلاك المصنع «مصروفات» في قائمة الدخل. هذه تكاليف إنتاج تدخل المخزون، ولا تظهر في قائمة الدخل إلا عند البيع ضمن تكلفة المبيعات.`,`**الخطأ الثالث**: تحميل تكاليف كل الكراتين الـ280,000 على الإنتاج التام كأنها اكتملت. الوحدات تحت التشغيل تأخذ نصيبها بالوحدات المعادلة.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`اسأل لكل تكلفة: **هل هي صناعية؟** إن كانت كذلك فمكانها المخزون. ثم: **ثابتة أم متغيرة؟** الثابتة تُحمَّل بمعدل الطاقة العادية.`}]},quiz:{questions:[{id:`p3e2-q1`,question:`أي مما يلي من التكاليف الصناعية غير المباشرة؟`,options:[{text:`مركزات الفاكهة في العصير`,explanation:`مادة مباشرة.`},{text:`أجور عمال خط التعبئة`,explanation:`أجور مباشرة.`},{text:`إهلاك مبنى المصنع`,correct:!0,explanation:`صحيح. تكلفة صناعية لا تُتتبع لوحدة بعينها.`},{text:`مرتب مدير التسويق`,explanation:`ليس تكلفة صناعية أصلاً؛ مصروف بيع.`}]},{id:`p3e2-q2`,question:`التكاليف الثابتة 2,250,000 والطاقة العادية 300,000 والإنتاج 280,000. كم يُحمَّل على المخزون؟`,options:[{text:`2,250,000`,explanation:`هذا يحمّل المخزون تكلفة الطاقة غير المستغلة.`},{text:`2,100,000`,correct:!0,explanation:`صحيح. 7.5 × 280,000.`},{text:`2,410,714`,explanation:`لا نرفع المعدل عند انخفاض الإنتاج.`},{text:`صفر`,explanation:`الثابت جزء من تكلفة الإنتاج.`}]},{id:`p3e2-q3`,question:`10,000 كرتونة تحت التشغيل حصلت على 100% من موادها و50% من تشغيلها. كم وحدة معادلة تمثل في التحويل؟`,options:[{text:`10,000`,explanation:`هذا للمواد.`},{text:`5,000`,correct:!0,explanation:`صحيح. 10,000 × 50%.`},{text:`صفر`,explanation:`حصلت على نصف تشغيلها.`},{text:`15,000`,explanation:`لا نجمع النسب.`}]},{id:`p3e2-q4`,question:`أين تظهر أجور عمال الخطوط في القوائم المالية لأكتوبر إذا لم تُبع المنتجات بعد؟`,options:[{text:`مصروف مرتبات في قائمة الدخل`,explanation:`تكاليف الإنتاج تدخل المخزون أولاً.`},{text:`ضمن المخزون في قائمة المركز المالي`,correct:!0,explanation:`صحيح. وتنتقل لتكلفة المبيعات عند البيع.`},{text:`التزامات متداولة`,explanation:`الأجور سُددت.`},{text:`لا تظهر حتى البيع`,explanation:`تظهر في المخزون.`}]},{id:`p3e2-q5`,question:`تكلفة الوحدة المعادلة: مواد 47.5 وتحويل 31. ما تكلفة 270,000 كرتونة تامة؟`,options:[{text:`12,825,000`,explanation:`هذه المواد فقط.`},{text:`21,195,000`,correct:!0,explanation:`صحيح. 270,000 × 78.5.`},{text:`21,825,000`,explanation:`هذا إجمالي التكاليف شاملة تحت التشغيل.`},{text:`8,370,000`,explanation:`هذا التحويل فقط.`}]}],exercises:[{id:`p3e2-x1`,date:`2026-10-31`,prompt:`التكاليف غير المباشرة الفعلية في حساب الرقابة **4,110,000 ج.م**: متغيرة **1,860,000** وثابتة **2,250,000**. الطاقة العادية **300,000** كرتونة والإنتاج **280,000**. سجّل قيد التحميل.`,solution:[{account:`1204`,debit:396e4},{account:`5103`,debit:15e4},{account:`1205`,credit:411e4}],hints:[`المتغير كله للإنتاج.`,`الثابت × 280/300.`,`الفرق مصروف طاقة غير مستغلة.`],explanation:`إنتاج تحت التشغيل 3,960,000، وتكاليف طاقة غير مستغلة 150,000، وحساب الرقابة دائن 4,110,000.`},{id:`p3e2-x2`,date:`2026-10-31`,prompt:`سجّل تحويل **270,000** كرتونة تامة بتكلفة **78.5 ج.م** للكرتونة إلى مخزن الإنتاج التام.`,solution:[{account:`1203`,debit:21195e3},{account:`1204`,credit:21195e3}],hints:[`270,000 × 78.5.`],explanation:`مخزون إنتاج تام مدين، وإنتاج تحت التشغيل دائن، بمبلغ 21,195,000.`}]},takeaways:[`تكلفة المنتج = مواد مباشرة + أجور مباشرة + تكاليف غير مباشرة.`,`الثابت يُحمَّل على أساس الطاقة العادية، وغير المحمَّل مصروف.`,`الوحدات المعادلة تقسم التكاليف بعدل بين التام وتحت التشغيل.`,`تكلفة الكرتونة 78.5 ج.م، والإنتاج التام 21,195,000 ج.م.`]},le={id:`p3e3`,part:3,number:3,title:`بكم نُظهر المخزون؟ تقييم المخزون`,subtitle:`طرق تسعير المنصرف، والتكلفة أو صافي القيمة البيعية أيهما أقل، والجرد الفعلي`,period:`أكتوبر 2026`,minutes:30,objectives:[`أن تطبق طريقتي الوارد أولاً يُصرف أولاً والمتوسط المرجح`,`أن تعرف لماذا لا يُسمح بطريقة الوارد أخيراً يُصرف أولاً`,`أن تقيس المخزون بالتكلفة أو صافي القيمة البيعية أيهما أقل`,`أن تعالج عجز الجرد الفعلي`],situation:[`في مخزن الإنتاج التام ما زالت توجد **40,000 كرتونة** من منتجات المصنع المتعاقد التي اشترتها الشركة في أبريل بتكلفة 100 ج.م للكرتونة. وعند الفحص اكتشف قسم الجودة أن **10,000 كرتونة** منها تنتهي صلاحيتها في ديسمبر.`,`اقترح قسم المبيعات تصريفها لسلسلة تخفيضات بسعر **60 ج.م** للكرتونة، مع تكاليف نقل وعمولة **5 ج.م** للكرتونة. أما الثلاثون ألفاً الباقية فصلاحيتها حتى منتصف 2027 وتُباع بسعرها العادي.`,`وفي 31 أكتوبر أجرت لجنة الجرد جرداً فعلياً لمخزن الخامات. الرصيد الدفتري للخامات **1,500,000 ج.م**، والموجود فعلاً بتكلفة **1,450,000 ج.م**. الفرق سببه انسكاب في عبوات مركزات أثناء النقل الداخلي، وهي كمية غير معتادة.`],explanation:[{type:`heading`,text:`تسعير المنصرف من المخزون`},`عندما تشتري الشركة الصنف نفسه بأسعار مختلفة، تحتاج **صيغة تكلفة** لتحديد تكلفة ما صُرف وما تبقى. المعيار يسمح بطريقتين للأصناف المتماثلة:`,{type:`table`,caption:`مثال توضيحي: سكر أبيض (طن)`,headers:[``,`{{term:fifo|الوارد أولاً يُصرف أولاً}}`,`{{term:weighted-average|المتوسط المرجح}}`],rows:[[`شراء 1: 100 طن × 30,000`,`3,000,000`,`3,000,000`],[`شراء 2: 100 طن × 34,000`,`3,400,000`,`3,400,000`],[`صرف 150 طناً للإنتاج`,`100 × 30,000 + 50 × 34,000 = 4,700,000`,`150 × 32,000 = 4,800,000`],[`الباقي 50 طناً`,`50 × 34,000 = 1,700,000`,`50 × 32,000 = 1,600,000`]]},`في فترة ارتفاع الأسعار يعطي FIFO تكلفة إنتاج أقل ومخزوناً أقرب للأسعار الحالية. والمهم هو **الثبات**: نفس الطريقة لكل المخزون المتماثل في الطبيعة والاستخدام. وتستخدم شركة النيل **المتوسط المرجح**.`,`أما **الوارد أخيراً يُصرف أولاً (LIFO)** فغير مسموح به، لأنه يُظهر المخزون بأسعار قديمة قد لا تعكس الواقع.`,`وفي حالتنا ترك المحاسب منتجات المصنع المتعاقد (تكلفة 100) منفصلة عن إنتاج المصنع (تكلفة 78.5) لأنها أصناف مختلفة في الكود والمواصفات.`,{type:`heading`,text:`التكلفة أو {{term:net-realisable-value|صافي القيمة البيعية}} أيهما أقل`},`لا يجوز أن يظهر المخزون بأكثر مما يُتوقع تحصيله من بيعه. **صافي القيمة البيعية** = سعر البيع المقدر − تكاليف الإتمام والبيع المقدرة.`,{type:`table`,caption:`مقارنة الكرتونة (ج.م)`,headers:[`الدفعة`,`التكلفة`,`صافي القيمة البيعية`,`القياس`,`التخفيض`],rows:[[`10,000 كرتونة قريبة الانتهاء`,`100`,`60 − 5 = 55`,`55`,`45 × 10,000 = 450,000`],[`30,000 كرتونة سليمة`,`100`,`140 − 5 = 135`,`100`,`لا شيء`]]},`المقارنة تتم **بنداً بنداً** (أو لمجموعات متشابهة)، لا للمخزون كله دفعة واحدة؛ وإلا لغطّى ربح المنتجات السليمة خسارة المنتجات المنتهية.`,`وإذا ارتفعت صافي القيمة البيعية لاحقاً قبل البيع، يُرد التخفيض في حدود ما سبق تخفيضه.`,{type:`heading`,text:`الجرد الفعلي`},`حتى مع نظام الجرد المستمر يجب **جرد فعلي** دوري للتأكد من أن المخزون الدفتري موجود فعلاً. أي عجز يُخفض به المخزون. والعجز **غير العادي** (انسكاب، سرقة، تلف) مصروف في الفترة، ولا يُحمَّل على تكلفة الإنتاج.`],rule:{refs:[{id:`eas:2:formulas`,title:`معيار المحاسبة المصري رقم (2): صيغ التكلفة`,counterpart:`IAS 2 (الفقرات 23 و25 و26)`,text:`تُحدد تكلفة المخزون من البنود غير القابلة للتبادل عادة بالتمييز المحدد لتكاليفها، وتُحدد تكلفة البنود الأخرى باستخدام طريقة الوارد أولاً يُصرف أولاً أو المتوسط المرجح للتكلفة، مع استخدام الصيغة نفسها لكل المخزون المتماثل في الطبيعة والاستخدام.`},{id:`eas:2:nrv`,title:`معيار المحاسبة المصري رقم (2): صافي القيمة البيعية`,counterpart:`IAS 2 (الفقرات 9 و28 و29 و34)`,text:`يُقاس المخزون بالتكلفة أو صافي القيمة البيعية أيهما أقل. ويُخفض المخزون عادة إلى صافي القيمة البيعية بنداً بنداً. ويُعترف بمبلغ التخفيض وكل خسائر المخزون مصروفاً في الفترة التي حدث فيها التخفيض أو الخسارة، ويُعترف بأي رد للتخفيض كتخفيض لمصروف المخزون في فترة الرد.`}]},application:{entries:[{id:`p3e3-j1`,date:`2026-10-31`,description:`تخفيض 10,000 كرتونة قريبة انتهاء الصلاحية إلى صافي القيمة البيعية`,lines:[{account:`5104`,debit:45e4},{account:`1203`,credit:45e4}],steps:[`التكلفة 100 > صافي القيمة البيعية 55`,`التخفيض = (100 − 55) × 10,000 = 450,000`,`يظهر ضمن تكلفة المبيعات`]},{id:`p3e3-j2`,date:`2026-10-31`,description:`إثبات عجز جرد مخزن الخامات (انسكاب غير عادي)`,lines:[{account:`5105`,debit:5e4},{account:`1201`,credit:5e4}],steps:[`الدفتري 1,500,000 − الفعلي 1,450,000 = 50,000`,`عجز غير عادي ← مصروف لا تكلفة إنتاج`]}],outro:[{type:`table`,caption:`المخزون في 31 أكتوبر قبل المبيعات (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`خامات`,`1,450,000`],[`مواد تعبئة`,`700,000`],[`إنتاج تحت التشغيل`,`630,000`],[`إنتاج تام: منتجات المصنع المتعاقد (30,000 × 100 + 10,000 × 55)`,`3,550,000`],[`إنتاج تام: إنتاج المصنع (270,000 × 78.5)`,`21,195,000`]]}]},mistake:{title:`المقارنة بالتكلفة والقيمة البيعية للمخزون ككل، أو حساب القيمة البيعية بلا خصم تكاليف البيع`,blocks:[`**الخطأ الأول**: مقارنة إجمالي تكلفة المخزون بإجمالي قيمته البيعية. القيمة البيعية للمخزون كله أعلى بكثير من تكلفته، فلا يظهر أي تخفيض رغم أن 10,000 كرتونة ستُباع بخسارة.`,`**الخطأ الثاني**: استخدام سعر البيع (60) دون طرح تكاليف البيع (5)، فيكون التخفيض 400,000 بدلاً من 450,000.`,`**الخطأ الثالث**: تحميل عجز الجرد غير العادي على تكلفة الإنتاج، فترتفع تكلفة الكرتونة بخسارة لا علاقة لها بالإنتاج.`,`**الخطأ الرابع**: تغيير صيغة التكلفة من شهر لآخر حسب ما يعطي ربحاً أعلى. الثبات شرط للقابلية للمقارنة.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`في كل إقفال: راجع تقارير الصلاحية والأصناف بطيئة الحركة، وقارن كل صنف بصافي قيمته البيعية، وطابق الجرد الفعلي بالدفتري.`}]},quiz:{questions:[{id:`p3e3-q1`,question:`أي طرق تسعير المنصرف **غير** مسموح بها؟`,options:[{text:`الوارد أولاً يُصرف أولاً`,explanation:`مسموح بها.`},{text:`المتوسط المرجح`,explanation:`مسموح بها.`},{text:`الوارد أخيراً يُصرف أولاً`,correct:!0,explanation:`صحيح. غير مسموح بها في المعايير.`},{text:`التمييز المحدد للبنود غير المتبادلة`,explanation:`مطلوبة للبنود غير القابلة للتبادل.`}]},{id:`p3e3-q2`,question:`تكلفة الكرتونة 100، وسعر بيعها المتوقع 60، وتكاليف البيع 5. بكم تُقاس؟`,options:[{text:`100`,explanation:`صافي القيمة البيعية أقل من التكلفة.`},{text:`60`,explanation:`يجب طرح تكاليف البيع.`},{text:`55`,correct:!0,explanation:`صحيح. الأقل بين 100 و(60 − 5).`},{text:`65`,explanation:`تكاليف البيع تُطرح لا تُضاف.`}]},{id:`p3e3-q3`,question:`اشتُري 100 طن بـ30,000 ثم 100 طن بـ34,000، وصُرف 150 طناً. ما تكلفة المنصرف بالمتوسط المرجح؟`,options:[{text:`4,700,000`,explanation:`هذه نتيجة FIFO.`},{text:`4,800,000`,correct:!0,explanation:`صحيح. المتوسط 32,000 × 150.`},{text:`5,100,000`,explanation:`هذه بآخر سعر للكل.`},{text:`4,500,000`,explanation:`هذه بأول سعر للكل.`}]},{id:`p3e3-q4`,question:`على أي مستوى تُجرى مقارنة التكلفة بصافي القيمة البيعية؟`,options:[{text:`للمخزون كله إجمالاً`,explanation:`يسمح بتغطية الخسائر بالأرباح، والمعيار يمنع ذلك.`},{text:`بنداً بنداً أو لمجموعات البنود المتشابهة`,correct:!0,explanation:`صحيح.`},{text:`لكل مخزن على حدة`,explanation:`الموقع الجغرافي ليس هو الأساس.`},{text:`مرة كل سنة للمخزون كله`,explanation:`المستوى بنداً بنداً، والتقييم في كل فترة تقرير.`}]},{id:`p3e3-q5`,question:`عجز جرد غير عادي بسبب انسكاب مركزات، كيف يُعالج؟`,options:[{text:`يُحمَّل على تكلفة الإنتاج`,explanation:`الفاقد غير العادي مستبعد من تكلفة المخزون.`},{text:`مصروف في الفترة`,correct:!0,explanation
