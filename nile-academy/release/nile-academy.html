ng and marketing`,type:`expense`,group:`selling-expenses`,normal:`debit`,introducedIn:1},{code:`5302`,name:`مصروفات نقل للعملاء`,nameEn:`Delivery expenses`,type:`expense`,group:`selling-expenses`,normal:`debit`,introducedIn:1},{code:`5303`,name:`مرتبات فريق المبيعات`,nameEn:`Sales staff salaries`,type:`expense`,group:`selling-expenses`,normal:`debit`,introducedIn:3},{code:`5304`,name:`تأمينات ومزايا فريق المبيعات`,nameEn:`Sales staff social insurance and benefits`,type:`expense`,group:`selling-expenses`,normal:`debit`,introducedIn:4},{code:`5305`,name:`مصروفات استدعاء منتجات`,nameEn:`Product recall expense`,type:`expense`,group:`selling-expenses`,normal:`debit`,introducedIn:4},{code:`5401`,name:`فوائد التزامات التأجير`,nameEn:`Interest on lease liabilities`,type:`expense`,group:`finance-costs`,normal:`debit`,introducedIn:2},{code:`5402`,name:`فوائد القروض`,nameEn:`Interest on loans`,type:`expense`,group:`finance-costs`,normal:`debit`,introducedIn:2}]},xe=JSON.parse(`[{"id":"term:joint-stock-company","ar":"الشركة المساهمة","en":"Joint Stock Company (S.A.E.)","kind":"term","short":"شركة رأس مالها مقسم إلى أسهم متساوية القيمة قابلة للتداول، ولا يُسأل المساهم فيها إلا بقدر قيمة أسهمه."},{"id":"term:legal-personality","ar":"الشخصية الاعتبارية","en":"Legal Personality","kind":"term","short":"صفة قانونية تجعل الشركة شخصاً مستقلاً عن مساهميها: تملك وتتعاقد وتُقاضي باسمها، وتكتسبها بالقيد في السجل التجاري."},{"id":"term:share","ar":"السهم","en":"Share","kind":"term","short":"حصة متساوية من رأس مال الشركة المساهمة، تمنح صاحبها حقوقاً في الأرباح والتصويت وفائض التصفية."},{"id":"term:limited-liability","ar":"المسؤولية المحدودة","en":"Limited Liability","kind":"term","short":"مسؤولية المساهم عن ديون الشركة في حدود قيمة أسهمه فقط، دون أمواله الخاصة."},{"id":"term:entity-concept","ar":"مبدأ الوحدة المحاسبية المستقلة","en":"Entity Concept","kind":"term","short":"الفصل بين أموال الشركة وعملياتها وبين أموال ملاكها الشخصية في الدفاتر."},{"id":"term:authorized-capital","ar":"رأس المال المرخص به","en":"Authorized Capital","kind":"term","short":"الحد الأقصى لما يجوز للشركة إصداره من أسهم دون تعديل نظامها الأساسي. لا يُسجَّل له قيد."},{"id":"term:issued-capital","ar":"رأس المال المصدر","en":"Issued Capital","kind":"term","short":"القيمة الاسمية للأسهم التي أصدرتها الشركة فعلاً واكتتب فيها المساهمون."},{"id":"term:paid-up-capital","ar":"رأس المال المدفوع","en":"Paid-up Capital","kind":"term","short":"ما سدده المساهمون فعلاً من قيمة رأس المال المصدر."},{"id":"term:par-value","ar":"القيمة الاسمية","en":"Par Value / Nominal Value","kind":"term","short":"القيمة المدوّنة على السهم في النظام الأساسي، ويُسجَّل بها رأس المال في الدفاتر."},{"id":"term:subscription-receivable","ar":"المساهمون - حساب الاكتتاب","en":"Subscription Receivable","kind":"term","short":"أصل يمثل قيمة الأسهم المكتتب فيها التي لم يسددها المساهمون بعد."},{"id":"term:formation-expenses","ar":"مصروفات التأسيس","en":"Formation / Start-up Costs","kind":"term","short":"تكاليف إنشاء الكيان القانوني للشركة (أتعاب قانونية، رسوم توثيق وتسجيل). تُحمَّل مصروفاً عند حدوثها."},{"id":"term:share-issue-costs","ar":"تكاليف إصدار الأسهم","en":"Share Issue Costs","kind":"term","short":"التكاليف الإضافية المرتبطة مباشرة بإصدار أسهم جديدة (عمولة بنك الاكتتاب، نشرة الاكتتاب). تُخصم من حقوق الملكية."},{"id":"term:double-entry","ar":"القيد المزدوج","en":"Double-entry Bookkeeping","kind":"term","short":"نظام تسجيل يؤثر فيه كل قيد على حسابين على الأقل، ويتساوى فيه مجموع المدين ومجموع الدائن دائماً."},{"id":"term:debit","ar":"المدين","en":"Debit (Dr)","kind":"term","short":"الجانب الأيمن من الحساب. تزيد به الأصول والمصروفات، وتنقص به الالتزامات وحقوق الملكية والإيرادات."},{"id":"term:credit","ar":"الدائن","en":"Credit (Cr)","kind":"term","short":"الجانب الأيسر من الحساب. تزيد به الالتزامات وحقوق الملكية والإيرادات، وتنقص به الأصول والمصروفات."},{"id":"term:normal-balance","ar":"الرصيد الطبيعي","en":"Normal Balance","kind":"term","short":"الجانب الذي يزيد به الحساب عادة: مدين للأصول والمصروفات، ودائن للالتزامات وحقوق الملكية والإيرادات."},{"id":"term:accounting-equation","ar":"المعادلة المحاسبية","en":"Accounting Equation","kind":"term","short":"الأصول = الالتزامات + حقوق الملكية. أساس توازن الدفاتر."},{"id":"term:asset","ar":"الأصل","en":"Asset","kind":"term","short":"مورد اقتصادي حالي تسيطر عليه الشركة نتيجة أحداث ماضية، ويُتوقع أن يولّد منافع اقتصادية."},{"id":"term:liability","ar":"الالتزام","en":"Liability","kind":"term","short":"التزام حالي على الشركة بنقل مورد اقتصادي نتيجة أحداث ماضية."},{"id":"term:equity","ar":"حقوق الملكية","en":"Equity","kind":"term","short":"الحصة المتبقية في أصول الشركة بعد خصم جميع التزاماتها."},{"id":"term:income","ar":"الدخل","en":"Income","kind":"term","short":"زيادة في الأصول أو نقص في الالتزامات تزيد حقوق الملكية، بخلاف مساهمات الملاك. يشمل الإيرادات والمكاسب."},{"id":"term:expense","ar":"المصروف","en":"Expense","kind":"term","short":"نقص في الأصول أو زيادة في الالتزامات تقلل حقوق الملكية، بخلاف التوزيعات على الملاك."},{"id":"term:conceptual-framework","ar":"الإطار المفاهيمي","en":"Conceptual Framework","kind":"term","short":"مجموعة المفاهيم الأساسية التي تُبنى عليها المعايير: هدف التقرير المالي، والخصائص النوعية، والعناصر، والاعتراف، والقياس."},{"id":"term:relevance","ar":"الملاءمة","en":"Relevance","kind":"term","short":"خاصية نوعية أساسية: قدرة المعلومة على التأثير في القرارات، بقيمتها التنبؤية أو التأكيدية."},{"id":"term:faithful-representation","ar":"التمثيل الصادق","en":"Faithful Representation","kind":"term","short":"خاصية نوعية أساسية: أن تكون المعلومة كاملة ومحايدة وخالية من الأخطاء الجوهرية."},{"id":"term:comparability","ar":"القابلية للمقارنة","en":"Comparability","kind":"term","short":"خاصية معززة: إمكان مقارنة معلومات الشركة عبر الفترات ومع الشركات الأخرى."},{"id":"term:verifiability","ar":"القابلية للتحقق","en":"Verifiability","kind":"term","short":"خاصية معززة: إمكان وصول مراقبين مستقلين مطلعين إلى النتيجة نفسها تقريباً."},{"id":"term:timeliness","ar":"التوقيت المناسب","en":"Timeliness","kind":"term","short":"خاصية معززة: إتاحة المعلومة في وقت يسمح بأن تؤثر في القرار."},{"id":"term:understandability","ar":"القابلية للفهم","en":"Understandability","kind":"term","short":"خاصية معززة: تصنيف المعلومات وعرضها بوضوح وإيجاز."},{"id":"term:materiality","ar":"الأهمية النسبية","en":"Materiality","kind":"term","short":"تكون المعلومة جوهرية إذا كان حذفها أو تحريفها يمكن أن يؤثر في قرارات مستخدمي القوائم المالية."},{"id":"term:recognition","ar":"الاعتراف","en":"Recognition","kind":"term","short":"إدراج بند في قائمة المركز المالي أو قائمة الدخل، عندما يستوفي تعريف أحد العناصر ومعايير الاعتراف."},{"id":"term:measurement","ar":"القياس","en":"Measurement","kind":"term","short":"تحديد المبلغ النقدي الذي يُثبت به البند في القوائم المالية."},{"id":"term:historical-cost","ar":"التكلفة التاريخية","en":"Historical Cost","kind":"term","short":"أساس قياس: ما دُفع لاقتناء الأصل مضافاً إليه التكاليف المباشرة اللازمة لتجهيزه للاستخدام."},{"id":"term:going-concern","ar":"فرض الاستمرارية","en":"Going Concern","kind":"term","short":"افتراض أن الشركة ستستمر في نشاطها في المستقبل المنظور، دون نية أو حاجة للتصفية."},{"id":"term:accrual-basis","ar":"أساس الاستحقاق","en":"Accrual Basis","kind":"term","short":"تسجيل الإيرادات والمصروفات في الفترة التي تحدث فيها، لا في فترة قبض النقدية أو دفعها."},{"id":"term:executory-contract","ar":"عقد تحت التنفيذ","en":"Executory Contract","kind":"term","short":"عقد لم ينفذ أي من طرفيه التزاماته بعد. لا يُسجَّل له قيد عند التوقيع عادة."},{"id":"term:auditor","ar":"مراقب الحسابات","en":"External Auditor","kind":"term","short":"محاسب قانوني مستقل تعينه الجمعية العامة لمراجعة القوائم المالية وإبداء الرأي في عدالتها."},{"id":"term:ifrs","ar":"المعايير الدولية للتقرير المالي","en":"IFRS","kind":"ifrs","short":"معايير محاسبية يصدرها مجلس معايير المحاسبة الدولية (IASB)، وتشمل معايير IAS الأقدم ومعايير IFRS الأحدث."},{"id":"term:eas","ar":"معايير المحاسبة المصرية","en":"Egyptian Accounting Standards (EAS)","kind":"eas","short":"معايير ملزمة صدرت بقرار وزير الاستثمار 110 لسنة 2015 وتعديلاته، مبنية على المعايير الدولية مع اختلافات محددة."},{"id":"term:toll-manufacturing","ar":"التصنيع لدى الغير","en":"Toll / Contract Manufacturing","kind":"term","short":"تعاقد شركة مع مصنع آخر لإنتاج سلعها بمواصفاتها وعلامتها التجارية."},{"id":"term:contract-liability","ar":"التزام العقد","en":"Contract Liability","kind":"term","short":"التزام الشركة بنقل سلع أو خدمات لعميل قبضت منه المقابل (أو استحق لها) قبل التسليم."},{"id":"term:chart-of-accounts","ar":"دليل الحسابات","en":"Chart of Accounts","kind":"term","short":"قائمة منظمة بكل حسابات الشركة بأكواد ثابتة، تُستخدم في التسجيل وإعداد القوائم."},{"id":"term:subsidiary-ledger","ar":"الحسابات المساعدة","en":"Subsidiary Ledger","kind":"term","short":"تفاصيل حساب إجمالي (مثل حساب لكل عميل تحت حساب العملاء)، ومجموعها يساوي رصيد الحساب الإجمالي."},{"id":"term:unified-accounting-system","ar":"النظام المحاسبي الموحد","en":"Egyptian Unified Accounting System","kind":"term","short":"نظام محاسبي بدليل حسابات موحد طُبق تاريخياً على شركات القطاع العام في مصر.","review":"V08"},{"id":"term:perpetual-inventory","ar":"نظام الجرد المستمر","en":"Perpetual Inventory System","kind":"term","short":"نظام يُحدَّث فيه رصيد المخزون وتكلفة المبيعات مع كل عملية شراء أو بيع."},{"id":"term:cost-of-sales","ar":"تكلفة المبيعات","en":"Cost of Sales","kind":"term","short":"تكلفة البضاعة التي بيعت خلال الفترة، وتُقابل بإيراد المبيعات."},{"id":"term:gross-profit","ar":"مجمل الربح","en":"Gross Profit","kind":"term","short":"إيرادات المبيعات مطروحاً منها تكلفة المبيعات."},{"id":"term:compound-entry","ar":"القيد المركب","en":"Compound Journal Entry","kind":"term","short":"قيد فيه أكثر من حساب مدين أو أكثر من حساب دائن."},{"id":"term:accounting-cycle","ar":"الدورة المحاسبية","en":"Accounting Cycle","kind":"term","short":"خطوات متكررة كل فترة: تحليل المستندات، والتسجيل، والترحيل، وميزان المراجعة، والتسويات، والقوائم، والإقفال."},{"id":"term:general-journal","ar":"دفتر اليومية","en":"General Journal","kind":"term","short":"دفتر القيد الأول، تُسجَّل فيه القيود بترتيبها الزمني."},{"id":"term:general-ledger","ar":"دفتر الأستاذ","en":"General Ledger","kind":"term","short":"دفتر تُجمَّع فيه حركات كل حساب على حدة لاستخراج رصيده."},{"id":"term:trial-balance","ar":"ميزان المراجعة","en":"Trial Balance","kind":"term","short":"قائمة بأرصدة جميع الحسابات في تاريخ معين، للتحقق من تساوي مجموع الأرصدة المدينة والدائنة."},{"id":"term:adjusting-entries","ar":"قيود التسوية","en":"Adjusting Entries","kind":"term","short":"قيود نهاية الفترة التي تُحمّل كل فترة بما يخصها من إيرادات ومصروفات وفق أساس الاستحقاق."},{"id":"term:closing-entries","ar":"قيود الإقفال","en":"Closing Entries","kind":"term","short":"قيود نهاية السنة التي تصفّر حسابات الإيرادات والمصروفات وتنقل صافيها إلى الأرباح المرحلة."},{"id":"term:financial-statements","ar":"القوائم المالية","en":"Financial Statements","kind":"term","short":"المركز المالي، والدخل (والدخل الشامل)، والتغير في حقوق الملكية، والتدفقات النقدية، والإيضاحات."},{"id":"term:prepaid-expense","ar":"المصروف المدفوع مقدماً","en":"Prepaid Expense","kind":"term","short":"مبلغ دُفع عن خدمة لم تُستهلك بعد؛ يُسجَّل أصلاً ويتحول إلى مصروف مع الاستفادة."},{"id":"term:accrued-expense","ar":"المصروف المستحق","en":"Accrued Expense","kind":"term","short":"مصروف استفادت منه الشركة ولم تدفعه بعد؛ يُسجَّل مصروفاً والتزاماً."},{"id":"eas:framework","ar":"الإطار العام لإعداد وعرض القوائم المالية","en":"Conceptual Framework","kind":"eas","short":"الإطار المفاهيمي المرفق بمعايير المحاسبة المصرية.","review":"V04"},{"id":"eas:1","ar":"معيار المحاسبة المصري رقم (1): عرض القوائم المالية","en":"IAS 1 Presentation of Financial Statements","kind":"eas","short":"يحدد مكونات القوائم المالية وهيكلها والحد الأدنى لبنودها."},{"id":"eas:2","ar":"معيار المحاسبة المصري رقم (2): المخزون","en":"IAS 2 Inventories","kind":"eas","short":"قياس المخزون بالتكلفة أو صافي القيمة البيعية أيهما أقل، والاعتراف بتكلفته مصروفاً عند البيع."},{"id":"eas:5","ar":"معيار المحاسبة المصري رقم (5): السياسات المحاسبية والتغيرات في التقديرات المحاسبية والأخطاء","en":"IAS 8","kind":"eas","short":"اختيار السياسات المحاسبية وتطبيقها، ومعالجة تغيير التقديرات وتصحيح الأخطاء."},{"id":"eas:10","ar":"معيار المحاسبة المصري رقم (10): الأصول الثابتة وإهلاكاتها","en":"IAS 16 Property, Plant and Equipment","kind":"eas","short":"الاعتراف بالأصول الثابتة وقياسها بالتكلفة، وإهلاكها، ونموذج إعادة التقييم."},{"id":"eas:23","ar":"معيار المحاسبة المصري رقم (23): الأصول غير الملموسة","en":"IAS 38 Intangible Assets","kind":"eas","short":"الاعتراف بالأصول غير الملموسة. يمنع رسملة تكاليف بدء النشاط والعلامات المُنشأة داخلياً."},{"id":"eas:25","ar":"معيار المحاسبة المصري رقم (25): الأدوات المالية - العرض","en":"IAS 32 Financial Instruments: Presentation","kind":"eas","short":"التمييز بين الالتزامات وحقوق الملكية، ومعالجة تكاليف إصدار أدوات حقوق الملكية خصماً منها."},{"id":"eas:48","ar":"معيار المحاسبة المصري رقم (48): الإيراد من العقود مع العملاء","en":"IFRS 15 Revenue from Contracts with Customers","kind":"eas","short":"يعترف بالإيراد عند نقل السيطرة على السلع أو الخدمات للعميل، بنموذج من خمس خطوات."},{"id":"decree:110-2015","ar":"قرار وزير الاستثمار رقم 110 لسنة 2015","en":"Ministerial Decree 110/2015","kind":"law","short":"القرار الذي أصدر معايير المحاسبة المصرية الحالية مع تمهيدها والإطار العام.","review":"V03"},{"id":"decree:69-2019","ar":"قرار وزيرة الاستثمار رقم 69 لسنة 2019","en":"Ministerial Decree 69/2019","kind":"law","short":"عدّل بعض معايير المحاسبة المصرية وأضاف معايير جديدة متوافقة مع المعايير الدولية (منها المعيار 48)."},{"id":"law:159-1981","ar":"قانون الشركات رقم 159 لسنة 1981","en":"Companies Law No. 159 of 1981","kind":"law","short":"ينظم شركات المساهمة والتوصية بالأسهم والمسؤولية المحدودة: التأسيس، ورأس المال، والإدارة، والجمعيات، والأرباح."},{"id":"law:159-1981:capital-min","ar":"الحد الأدنى لرأس المال ونسبة المدفوع (قانون 159 ولائحته)","en":"Minimum capital requirements","kind":"law","short":"حد أدنى لرأس المال المصدر ونسبة دنيا تُسدد عند التأسيس.","review":"V01"},{"id":"law:159-1981:auditor","ar":"تعيين مراقب الحسابات (قانون 159)","en":"Auditor appointment","kind":"law","short":"تعين الجمعية العامة مراقب الحسابات وتحدد أتعابه.","review":"V05"},{"id":"law:95-1992","ar":"قانون سوق رأس المال رقم 95 لسنة 1992","en":"Capital Market Law No. 95 of 1992","kind":"law","short":"ينظم إصدار الأوراق المالية وتداولها والإفصاح الدوري للشركات المقيدة."},{"id":"law:17-1999","ar":"قانون التجارة رقم 17 لسنة 1999","en":"Commercial Code No. 17 of 1999","kind":"law","short":"ينظم الأعمال التجارية والتزامات التجار، ومنها الدفاتر التجارية، والعقود والأوراق التجارية."},{"id":"law:17-1999:art21","ar":"المادة 21 من قانون التجارة","en":"Commercial Code, Art. 21","kind":"law","short":"إلزام التاجر الذي يجاوز رأس ماله 20,000 ج.م بإمساك الدفاتر اللازمة، وبوجه خاص دفتري اليومية والجرد."},{"id":"law:17-1999:art26","ar":"المادة 26 من قانون التجارة","en":"Commercial Code, Art. 26","kind":"law","short":"الاحتفاظ بالدفاتر التجارية والوثائق المؤيدة لها خمس سنوات من تاريخ قفل الدفتر."},{"id":"org:fra","ar":"الهيئة العامة للرقابة المالية","en":"Financial Regulatory Authority (FRA)","kind":"org","short":"الجهة الرقابية على الأنشطة المالية غير المصرفية في مصر، ومنها سوق رأس المال. أُنشئت بالقانون 10 لسنة 2009."},{"id":"org:egx","ar":"البورصة المصرية","en":"The Egyptian Exchange (EGX)","kind":"org","short":"سوق تداول الأوراق المالية المقيدة في مصر."},{"id":"org:mcdr","ar":"شركة مصر للمقاصة والإيداع والقيد المركزي","en":"Misr for Central Clearing, Depository and Registry (MCDR)","kind":"org","short":"الجهة التي تتولى إيداع الأوراق المالية وقيدها مركزياً وتسوية عمليات التداول."},{"id":"term:property-plant-equipment","ar":"الأصول الثابتة","en":"Property, Plant and Equipment","kind":"term","short":"أصول ملموسة تُستخدم في الإنتاج أو التوريد أو الإدارة ويُتوقع استخدامها أكثر من فترة مالية."},{"id":"term:capitalization","ar":"الرسملة","en":"Capitalisation","kind":"term","short":"إدراج نفقة في تكلفة أصل بدلاً من تحميلها مصروفاً في الفترة."},{"id":"term:projects-under-construction","ar":"مشروعات تحت التنفيذ","en":"Assets under Construction","kind":"term","short":"حساب مؤقت تُجمع فيه تكاليف أصل لم يكتمل بعد، ولا يُهلك حتى يُحوَّل للأصل عند الاكتمال."},{"id":"term:depreciation","ar":"الإهلاك","en":"Depreciation","kind":"term","short":"التوزيع المنتظم للقيمة القابلة للإهلاك لأصل ثابت على عمره الإنتاجي."},{"id":"term:useful-life","ar":"العمر الإنتاجي","en":"Useful Life","kind":"term","short":"الفترة المتوقع استخدام الأصل خلالها، أو عدد الوحدات المتوقع إنتاجها به."},{"id":"term:residual-value","ar":"القيمة المتبقية","en":"Residual Value","kind":"term","short":"المبلغ المقدر الذي يمكن الحصول عليه من التخلص من الأصل في نهاية عمره بعد خصم تكاليف التخلص."},{"id":"term:depreciable-amount","ar":"القيمة القابلة للإهلاك","en":"Depreciable Amount","kind":"term","short":"تكلفة الأصل (أو قيمته المعاد تقييمها) مطروحاً منها قيمته المتبقية."},{"id":"term:straight-line","ar":"طريقة القسط الثابت","en":"Straight-line Method","kind":"term","short":"طريقة إهلاك تحمّل كل فترة مبلغاً متساوياً على مدى العمر الإنتاجي."},{"id":"term:units-of-production","ar":"طريقة وحدات الإنتاج","en":"Units of Production Method","kind":"term","short":"طريقة إهلاك تربط القسط بعدد الوحدات المنتجة فعلاً في الفترة."},{"id":"term:available-for-use","ar":"متاح للاستخدام","en":"Available for Use","kind":"term","short":"أن يكون الأصل في الموقع والحالة اللازمين لتشغيله كما تقصد الإدارة؛ ومن هذا التاريخ يبدأ الإهلاك."},{"id":"term:accumulated-depreciation","ar":"مجمع الإهلاك","en":"Accumulated Depreciation","kind":"term","short":"حساب مقابل رصيده دائن يجمع الإهلاك المتراكم ويُخصم من تكلفة الأصل في الميزانية."},{"id":"term:carrying-amount","ar":"القيمة الدفترية","en":"Carrying Amount","kind":"term","short":"المبلغ الذي يظهر به الأصل: التكلفة مطروحاً منها مجمع الإهلاك ومجمع خسائر الاضمحلال."},{"id":"term:revaluation-model","ar":"نموذج إعادة التقييم","en":"Revaluation Model","kind":"term","short":"قياس فئة من الأصول الثابتة بقيمتها العادلة في تاريخ إعادة التقييم مطروحاً منها الإهلاك والاضمحلال اللاحقان."},{"id":"term:revaluation-surplus","ar":"فائض إعادة التقييم","en":"Revaluation Surplus","kind":"term","short":"احتياطي في حقوق الملكية يتجمع فيه الارتفاع في قيمة الأصول المعاد تقييمها عبر الدخل الشامل الآخر."},{"id":"term:other-comprehensive-income","ar":"الدخل الشامل الآخر","en":"Other Comprehensive Income (OCI)","kind":"term","short":"بنود دخل ومصروف لا تمر بالأرباح أو الخسائر وفق المعايير، مثل فائض إعادة التقييم."},{"id":"term:impairment","ar":"الاضمحلال","en":"Impairment","kind":"term","short":"انخفاض القيمة الاستردادية لأصل عن قيمته الدفترية."},{"id":"term:recoverable-amount","ar":"القيمة الاستردادية","en":"Recoverable Amount","kind":"term","short":"القيمة العادلة ناقصاً تكاليف البيع أو القيمة الاستخدامية، أيهما أعلى."},{"id":"term:fair-value-less-costs","ar":"القيمة العادلة ناقصاً تكاليف البيع","en":"Fair Value less Costs of Disposal","kind":"term","short":"السعر الذي يمكن الحصول عليه من بيع الأصل في معاملة منظمة بعد خصم تكاليف التخلص منه."},{"id":"term:value-in-use","ar":"القيمة الاستخدامية","en":"Value in Use","kind":"term","short":"القيمة الحالية للتدفقات النقدية المستقبلية المتوقعة من استمرار استخدام الأصل."},{"id":"term:intangible-asset","ar":"الأصل غير الملموس","en":"Intangible Asset","kind":"term","short":"أصل غير نقدي قابل للتمييز ليس له وجود مادي، مثل البرامج والتراخيص وبراءات الاختراع."},{"id":"term:amortization","ar":"الاستهلاك","en":"Amortisation","kind":"term","short":"التوزيع المنتظم لتكلفة أصل غير ملموس ذي عمر محدد على عمره الإنتاجي."},{"id":"term:research-phase","ar":"مرحلة البحث","en":"Research Phase","kind":"term","short":"بحث أصيل مخطط لاكتساب معرفة جديدة؛ نفقاتها مصروف دائماً."},{"id":"term:development-phase","ar":"مرحلة التطوير","en":"Development Phase","kind":"term","short":"تطبيق نتائج البحث لتصميم منتج أو عملية قبل الإنتاج التجاري؛ نفقاتها تُرسمل إذا تحققت شروط محددة."},{"id":"term:lease","ar":"عقد التأجير","en":"Lease","kind":"term","short":"عقد يمنح حق السيطرة على استخدام أصل محدد لفترة مقابل عوض."},{"id":"term:right-of-use","ar":"أصل حق الاستخدام","en":"Right-of-use Asset","kind":"term","short":"أصل يمثل حق المستأجر في استخدام الأصل المؤجر طوال مدة العقد."},{"id":"term:lease-liability","ar":"التزام التأجير","en":"Lease Liability","kind":"term","short":"القيمة الحالية لدفعات الإيجار التي لم تُسدد بعد."},{"id":"term:incremental-borrowing-rate","ar":"معدل الاقتراض الإضافي","en":"Incremental Borrowing Rate","kind":"term","short":"سعر الفائدة الذي كان المستأجر سيدفعه لاقتراض مبلغ مماثل لمدة مماثلة وبضمان مماثل."},{"id":"term:present-value","ar":"القيمة الحالية","en":"Present Value","kind":"term","short":"قيمة مبلغ مستقبلي اليوم بعد خصمه بسعر فائدة يعكس القيمة الزمنية للنقود."},{"id":"term:short-term-lease","ar":"التأجير قصير الأجل","en":"Short-term Lease","kind":"term","short":"عقد تأجير مدته 12 شهراً أو أقل بلا خيار شراء؛ يجوز تحميل إيجاره مصروفاً بالقسط الثابت."},{"id":"term:borrowing-costs","ar":"تكاليف الاقتراض","en":"Borrowing Costs","kind":"term","short":"الفوائد والتكاليف الأخرى التي تتكبدها المنشأة في سبيل اقتراض الأموال."},{"id":"term:qualifying-asset","ar":"الأصل المؤهل","en":"Qualifying Asset","kind":"term","short":"أصل يستغرق بالضرورة فترة زمنية جوهرية ليصبح جاهزاً للاستخدام المقصود أو البيع."},{"id":"term:current-portion","ar":"الجزء المتداول من القرض","en":"Current Portion of Long-term Debt","kind":"term","short":"أقساط القرض طويل الأجل المستحقة خلال 12 شهراً من تاريخ القوائم المالية."},{"id":"eas:10:exclusions","ar":"المعيار المصري 10: تكاليف لا تدخل في تكلفة الأصل","en":"IAS 16.19-20","kind":"eas","short":"تكاليف الافتتاح والدعاية والتدريب والمصروفات الإدارية لا تُرسمل."},{"id":"eas:10:review","ar":"المعيار المصري 10: مراجعة العمر والقيمة المتبقية","en":"IAS 16.51, 61","kind":"eas","short":"تُراجع التقديرات سنوياً على الأقل، والتغيير يُعالج بأثر مستقبلي."},{"id":"eas:10:revaluation","ar":"المعيار المصري 10: نموذج إعادة التقييم","en":"IAS 16.31-42","kind":"eas","short":"قياس فئة كاملة من الأصول بالقيمة العادلة، والزيادة إلى الدخل الشامل الآخر.","review":"V09"},{"id":"eas:14","ar":"معيار المحاسبة المصري رقم (14): تكاليف الاقتراض","en":"IAS 23 Borrowing Costs","kind":"eas","short":"رسملة تكاليف الاقتراض المرتبطة مباشرة بأصل مؤهل، وتحميل الباقي مصروفاً."},{"id":"eas:31","ar":"معيار المحاسبة المصري رقم (31): اضمحلال قيمة الأصول","en":"IAS 36 Impairment of Assets","kind":"eas","short":"تخفيض القيمة الدفترية للأصل إلى قيمته الاستردادية عند وجود اضمحلال، والاعتراف بالخسارة."},{"id":"eas:49","ar":"معيار المحاسبة المصري رقم (49): عقود التأجير","en":"IFRS 16 Leases","kind":"eas","short":"اعتراف المستأجر بأصل حق استخدام والتزام تأجير لمعظم عقود التأجير.","review":"V11"},{"id":"eas:49:short-term","ar":"المعيار المصري 49: إعفاء التأجير قصير الأجل","en":"IFRS 16.5-8","kind":"eas","short":"يجوز تحميل إيجار العقود 12 شهراً أو أقل والأصول منخفضة القيمة مصروفاً."},{"id":"term:three-way-match","ar":"المطابقة الثلاثية","en":"Three-way Match","kind":"term","short":"مطابقة أمر الشراء بإذن الاستلام وبفاتورة المورد كميةً وسعراً قبل تسجيل الفاتورة وسدادها."},{"id":"term:internal-control","ar":"الرقابة الداخلية","en":"Internal Control","kind":"term","short":"إجراءات تضعها الإدارة لحماية الأصول وضمان دقة السجلات، مثل الفصل بين المهام والاعتمادات."},{"id":"term:trade-discount","ar":"الخصم التجاري","en":"Trade Discount","kind":"term","short":"تخفيض في سعر القائمة يمنحه المورد؛ يُسجَّل الشراء بالصافي بعده ولا يُثبت منفصلاً."},{"id":"term:direct-materials","ar":"المواد المباشرة","en":"Direct Materials","kind":"term","short":"مواد تدخل في تكوين المنتج ويمكن تتبعها إليه اقتصادياً."},{"id":"term:direct-labour","ar":"الأجور المباشرة","en":"Direct Labour","kind":"term","short":"أجور العاملين الذين يعملون مباشرة على تصنيع المنتج."},{"id":"term:manufacturing-overhead","ar":"التكاليف الصناعية غير المباشرة","en":"Manufacturing Overhead","kind":"term","short":"التكاليف الصناعية التي لا يمكن تتبعها لوحدة منتج بعينها، مثل الإشراف والصيانة وإهلاك المصنع."},{"id":"term:work-in-progress","ar":"إنتاج تحت التشغيل","en":"Work in Progress","kind":"term","short":"وحدات بدأ تصنيعها ولم تكتمل بعد في تاريخ القوائم."},{"id":"term:normal-capacity","ar":"ال وع التعثر."},{"id":"term:simplified-approach","ar":"المنهج المبسط","en":"Simplified Approach","kind":"term","short":"قياس مخصص العملاء التجاريين دائماً بالخسائر المتوقعة على مدى العمر."},{"id":"term:provision-matrix","ar":"مصفوفة المخصص","en":"Provision Matrix","kind":"term","short":"جدول نسب خسارة متوقعة لكل فئة من أعمار الديون، يُطبق على أرصدة العملاء."},{"id":"term:write-off","ar":"الإعدام","en":"Write-off","kind":"term","short":"تخفيض رصيد دين لا يوجد توقع معقول لاسترداده، على حساب المخصص."},{"id":"term:bank-reconciliation","ar":"مذكرة التسوية البنكية","en":"Bank Reconciliation","kind":"term","short":"مطابقة رصيد النقدية في الدفاتر برصيد كشف البنك وتفسير الفروق بنداً بنداً."},{"id":"term:outstanding-cheque","ar":"شيك لم يُصرف","en":"Outstanding Cheque","kind":"term","short":"شيك أصدرته المنشأة وسجّلته، ولم يقدمه المستفيد للبنك بعد."},{"id":"eas:2:conversion","ar":"المعيار المصري 2: تكاليف التحويل والطاقة العادية","en":"IAS 2.12-13","kind":"eas","short":"تحميل التكاليف الصناعية الثابتة على أساس الطاقة العادية، وغير المحمَّل مصروف."},{"id":"eas:2:exclusions","ar":"المعيار المصري 2: تكاليف مستبعدة من المخزون","en":"IAS 2.16","kind":"eas","short":"الفاقد غير العادي، والتخزين، والمصروفات الإدارية، وتكاليف البيع لا تدخل المخزون."},{"id":"eas:2:formulas","ar":"المعيار المصري 2: صيغ التكلفة","en":"IAS 2.23-27","kind":"eas","short":"FIFO أو المتوسط المرجح للبنود القابلة للتبادل، والتمييز المحدد لغيرها."},{"id":"eas:2:nrv","ar":"المعيار المصري 2: صافي القيمة البيعية","en":"IAS 2.9, 28-33","kind":"eas","short":"قياس المخزون بالتكلفة أو صافي القيمة البيعية أيهما أقل، بنداً بنداً."},{"id":"eas:48:returns","ar":"المعيار المصري 48: البيع مع حق الرد","en":"IFRS 15.B20-B27","kind":"eas","short":"إيراد بالمتوقع استحقاقه، والتزام رد، وأصل حق استرداد للمنتجات."},{"id":"eas:47","ar":"معيار المحاسبة المصري رقم (47): الأدوات المالية","en":"IFRS 9 Financial Instruments","kind":"eas","short":"تصنيف الأصول المالية وقياسها، ونموذج الخسائر الائتمانية المتوقعة.","review":"V12"},{"id":"term:
