rage.removeItem(e)}catch{}}function _(e,t){try{window.localStorage.setItem(e,t)}catch{}}var v={id:`p1e1`,part:1,number:1,title:`ميلاد شركة مساهمة`,subtitle:`التأسيس، ورأس المال، وأول قيد في دفاتر الشركة`,period:`يناير 2026`,minutes:25,objectives:[`أن تفهم معنى الشركة المساهمة ولماذا اختارها المؤسسون`,`أن تفرّق بين رأس المال المرخص به والمصدر والمدفوع`,`أن تسجّل قيد الاكتتاب في رأس المال وقيد سداده`,`أن تميّز بين مصروفات التأسيس وتكاليف إصدار الأسهم في المعالجة المحاسبية`],situation:[`في أوائل يناير 2026 اجتمع خمسة مؤسسين في مكتب محامٍ بالقاهرة. لكلٍّ منهم خبرة في صناعة الأغذية، وقد قرروا إنشاء مصنع كبير في مدينة العاشر من رمضان ينتج العصائر والصلصات ومنتجات الألبان طويلة الأجل، ويبيعها للموزعين وسلاسل السوبر ماركت في أنحاء مصر.`,`يحتاج المشروع إلى أموال كبيرة: أرض، ومبانٍ، وخطوط إنتاج، ورأس مال عامل. لذلك قرر المؤسسون إنشاء **{{term:joint-stock-company|شركة مساهمة}}** باسم **«النيل للصناعات الغذائية ش.م.م»**، لأنها تستطيع جمع الأموال من عدد كبير من المستثمرين، ويمكن قيد أسهمها في البورصة لاحقاً.`,{type:`table`,caption:`قرارات المؤسسين في عقد التأسيس والنظام الأساسي`,headers:[`البند`,`القيمة`],rows:[[`رأس المال المرخص به`,`1,000,000,000 ج.م`],[`رأس المال المصدر`,`300,000,000 ج.م`],[`عدد الأسهم المصدرة`,`30,000,000 سهم`],[`القيمة الاسمية للسهم`,`10 ج.م`],[`نسبة السداد عند الاكتتاب`,`100% (قرر المكتتبون سداد القيمة كاملة)`]]},`في 4 يناير 2026 قُيدت الشركة في السجل التجاري واكتسبت {{term:legal-personality|الشخصية الاعتبارية}}. وفي 11 يناير حوّل البنك متلقي الاكتتاب الحصيلة كاملة إلى الحساب الجاري للشركة. وخلال الشهر دفعت الشركة أتعاب المحامي ورسوم التوثيق والتسجيل، وعمولة بنك الاكتتاب وتكلفة نشرة الاكتتاب.`,`فتحت المديرة المالية الجديدة، الأستاذة منى، دفاتر الشركة وقالت: «أول قيد في حياة أي شركة هو قيد رأس المال؛ فلنسجّله بشكل صحيح من البداية.»`],explanation:[{type:`heading`,text:`ما الشركة المساهمة؟`},`**{{term:joint-stock-company|الشركة المساهمة}}** شركة ينقسم رأس مالها إلى **{{term:share|أسهم}}** متساوية القيمة، ولا يُسأل المساهم عن ديون الشركة إلا **في حدود قيمة أسهمه**. فإذا خسرت الشركة قد يخسر المساهم ما دفعه، لكن لا يحق لدائني الشركة مطالبته من أمواله الخاصة. ويُسمّى ذلك **{{term:limited-liability|المسؤولية المحدودة}}**.`,`والشركة نفسها **شخص اعتباري** مستقل عن مساهميها: لها ذمة مالية خاصة، وتملك وتتعاقد وتُقاضي باسمها. ومن هنا جاء مبدأ محاسبي مهم هو **{{term:entity-concept|مبدأ الوحدة المحاسبية المستقلة}}**: دفاتر الشركة تسجّل أموال الشركة فقط، لا أموال المؤسسين.`,{type:`heading`,text:`ثلاثة مصطلحات لرأس المال`},{type:`list`,items:[`**{{term:authorized-capital|رأس المال المرخص به}}**: الحد الأقصى للأسهم التي يجوز للشركة إصدارها دون تعديل نظامها الأساسي، وهو هنا مليار جنيه. هذا رقم قانوني **لا يُسجَّل له قيد**.`,`**{{term:issued-capital|رأس المال المصدر}}**: قيمة الأسهم التي أصدرتها الشركة فعلاً واكتتب فيها المساهمون، وهو هنا 300 مليون جنيه.`,`**{{term:paid-up-capital|رأس المال المدفوع}}**: ما سدده المساهمون فعلاً من رأس المال المصدر. يسمح القانون بسداد جزء عند التأسيس والباقي على أقساط {{review:V02}}، وفي حالتنا سُدد بالكامل.`]},`**{{term:par-value|القيمة الاسمية}}** هي القيمة المدوّنة على السهم (10 جنيهات). ويُسجَّل رأس المال في الدفاتر دائماً بالقيمة الاسمية مضروبة في عدد الأسهم المصدرة.`,{type:`heading`,text:`تسجيل رأس المال على خطوتين`},`1) **عند الاكتتاب**: التزم المساهمون بدفع 300 مليون جنيه، فأصبح للشركة حق عليهم (أصل اسمه «{{term:subscription-receivable|المساهمون - حساب الاكتتاب}}»)، وفي الوقت نفسه زاد رأس مالها. وهذا أول تطبيق لـ{{term:double-entry|القيد المزدوج}}: لكل عملية طرفان.`,`2) **عند السداد**: دخلت الأموال البنك وانقضى الحق على المساهمين؛ أي زاد أصل (البنك) ونقص أصل آخر (حساب الاكتتاب).`,`لو سدد المساهمون في اليوم نفسه، يمكن الاكتفاء بقيد واحد: من حـ/ البنك إلى حـ/ رأس المال. لكن الفصل بين الخطوتين يوضح الحالة التي يكون فيها السداد على أقساط.`,{type:`heading`,text:`مصروفات التأسيس ≠ تكاليف إصدار الأسهم`},`ليست كل المبالغ التي تُنفق وقت التأسيس تُعالج بالطريقة نفسها:`,{type:`table`,headers:[`النوع`,`أمثلة`,`المعالجة`],rows:[[`{{term:formation-expenses|مصروفات التأسيس}}`,`أتعاب المحامي لصياغة العقد، ورسوم التوثيق والسجل التجاري`,`مصروف في قائمة الدخل فوراً`],[`{{term:share-issue-costs|تكاليف إصدار الأسهم}}`,`عمولة بنك تلقي الاكتتاب، وإعداد نشرة الاكتتاب ونشرها`,`تُخصم مباشرة من حقوق الملكية`]]},`والسبب أن مصروفات التأسيس لا تُنشئ أصلاً تسيطر عليه الشركة ويولّد منافع اقتصادية محددة، فيمنع المعيار رسملتها. أما تكاليف الإصدار فهي جزء من «تكلفة الحصول على رأس المال» ذاته، فتُخصم منه.`],rule:{intro:[`تأتي هذه القواعد من مصدرين: **القانون**، الذي يحدد شكل الشركة ورأس مالها، و**معايير المحاسبة**، التي تحدد طريقة تسجيل العمليات.`],refs:[{id:`law:159-1981`,title:`قانون شركات المساهمة وشركات التوصية بالأسهم والشركات ذات المسؤولية المحدودة رقم 159 لسنة 1981`,counterpart:`ولائحته التنفيذية وتعديلاته، ومنها القانون 4 لسنة 2018`,text:`القانون الأساسي الذي ينظم تأسيس الشركة المساهمة: عقد التأسيس والنظام الأساسي، ورأس المال المرخص به والمصدر، والاكتتاب، وإدارة الشركة وجمعياتها العامة.`},{id:`law:159-1981:capital-min`,title:`الحد الأدنى لرأس المال المصدر ونسبة المدفوع عند التأسيس`,counterpart:`القانون 159 لسنة 1981 ولائحته التنفيذية`,text:`تحدد اللائحة التنفيذية حداً أدنى لرأس المال المصدر لشركات المساهمة (250 ألف جنيه للشركات التي لا تطرح أسهمها للاكتتاب العام، وحداً أعلى للشركات التي تطرحها)، ويحدد القانون نسبة دنيا تُسدَّد نقداً عند التأسيس، ويُسدَّد الباقي في المواعيد التي يحددها النظام الأساسي. ورأس مال شركتنا أعلى بكثير من أي حد أدنى، ومسدد بالكامل.`,review:`V01`},{id:`eas:23`,title:`معيار المحاسبة المصري رقم (23): الأصول غير الملموسة`,counterpart:`IAS 38 Intangible Assets (الفقرة 69)`,text:`النفقات على أنشطة بدء النشاط، ومنها التكاليف القانونية والإدارية لتأسيس الكيان القانوني، تُثبت مصروفاً عند تكبدها، ولا تُرسمل أصلاً.`},{id:`eas:25`,title:`معيار المحاسبة المصري رقم (25): الأدوات المالية - العرض`,counterpart:`IAS 32 Financial Instruments: Presentation (الفقرة 37)`,text:`تكاليف المعاملة الخاصة بإصدار أدوات حقوق ملكية (كالأسهم) تُعالج خصماً من حقوق الملكية، بقدر ما هي تكاليف إضافية مرتبطة مباشرة بالإصدار وكان يمكن تجنبها لو لم يتم.`}]},application:{intro:[`هذه هي القيود التي سجلتها الأستاذة منى في دفتر اليومية خلال يناير. لاحظ أن **مجموع المدين = مجموع الدائن** في كل قيد.`],entries:[{id:`p1e1-j1`,date:`2026-01-04`,description:`إثبات الاكتتاب في 30,000,000 سهم بقيمة اسمية 10 ج.م للسهم`,lines:[{account:`1230`,debit:3e8},{account:`3101`,credit:3e8}],steps:[`عدد الأسهم × القيمة الاسمية = 30,000,000 × 10 = 300,000,000 ج.م`,`حق للشركة على المساهمين (أصل يزيد ← مدين)`,`رأس المال يزيد (حقوق ملكية تزيد ← دائن)`]},{id:`p1e1-j2`,date:`2026-01-11`,description:`تحويل حصيلة الاكتتاب من البنك متلقي الاكتتاب إلى الحساب الجاري للشركة`,lines:[{account:`1250`,debit:3e8},{account:`1230`,credit:3e8}],steps:[`النقدية بالبنك زادت (أصل يزيد ← مدين)`,`الحق على المساهمين سُدد (أصل ينقص ← دائن)`,`أصبح رصيد «المساهمون - حساب الاكتتاب» صفراً`]},{id:`p1e1-j3`,date:`2026-01-15`,description:`سداد عمولة بنك تلقي الاكتتاب وتكاليف إعداد نشرة الاكتتاب ونشرها`,lines:[{account:`3104`,debit:6e5},{account:`1250`,credit:6e5}],steps:[`عمولة البنك 450,000 + نشرة الاكتتاب 150,000 = 600,000 ج.م`,`تكاليف مرتبطة مباشرة بإصدار الأسهم ← تُخصم من حقوق الملكية (حساب مقابل رصيده مدين)`,`لن تظهر في قائمة الدخل`]},{id:`p1e1-j4`,date:`2026-01-20`,description:`سداد أتعاب المحامي ورسوم التوثيق والقيد في السجل التجاري`,lines:[{account:`5201`,debit:85e4},{account:`1250`,credit:85e4}],steps:[`أتعاب المحامي 600,000 + رسوم التوثيق والتسجيل 250,000 = 850,000 ج.م`,`تكاليف تأسيس الكيان القانوني ← مصروف (المعيار 23)`,`المصروف يقلل الربح، ومن ثم يقلل حقوق الملكية في النهاية`]}],outro:[{type:`callout`,tone:`success`,title:`رصيد البنك في نهاية يناير`,text:`300,000,000 − 600,000 − 850,000 = **298,550,000 ج.م**. وحقوق الملكية = 300,000,000 − 600,000 (تكاليف الإصدار) − 850,000 (خسارة الفترة بسبب مصروفات التأسيس) = 298,550,000 ج.م. لاحظ أن الأصول تساوي حقوق الملكية تماماً، لأن الشركة ليس عليها التزامات بعد.`}]},mistake:{title:`تسجيل رأس المال المرخص به في الدفاتر، أو رسملة مصروفات التأسيس`,blocks:[`**الخطأ الأول**: أن يسجّل المحاسب قيداً بمليار جنيه (رأس المال المرخص به). هذا خطأ، لأن المرخص به مجرد سقف قانوني؛ لم تُصدر أسهم ولم يلتزم أحد بالدفع. ويكتفى بذكره في الإيضاحات.`,`**الخطأ الثاني**: كان شائعاً قديماً تسجيل مصروفات التأسيس أصلاً («مصروفات مؤجلة») وتوزيعها على عدة سنوات. المعايير الحالية تمنع ذلك، ويجب تحميلها على قائمة الدخل فوراً.`,`**الخطأ الثالث**: تحميل عمولة بنك الاكتتاب على المصروفات. هذه تكلفة إصدار أسهم، ومكانها حقوق الملكية.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`اسأل نفسك قبل أي قيد: هل وقعت **عملية فعلية** غيّرت أصول الشركة أو التزاماتها أو حقوق ملكيتها؟ وإذا كانت هناك تكلفة: هل هي تكلفة **إصدار الأسهم ذاتها**، أم تكلفة **إنشاء الكيان**؟`}]},quiz:{questions:[{id:`p1e1-q1`,question:`رأس مال شركة النيل المرخص به مليار جنيه والمصدر 300 مليون. بأي مبلغ يُسجَّل رصيد حساب رأس المال في الدفاتر بعد الاكتتاب؟`,options:[{text:`1,000,000,000 ج.م`,explanation:`هذا رأس المال المرخص به، وهو سقف قانوني لا يُسجَّل له قيد.`},{text:`300,000,000 ج.م`,correct:!0,explanation:`صحيح. رأس المال في الدفاتر = الأسهم المصدرة فعلاً × القيمة الاسمية.`},{text:`700,000,000 ج.م`,explanation:`هذا الفرق بين المرخص به والمصدر، أي الأسهم التي يمكن إصدارها مستقبلاً، ولا يُسجَّل.`},{text:`صفر حتى تُقيَّد الشركة في البورصة`,explanation:`يُسجَّل رأس المال من لحظة الاكتتاب بغض النظر عن القيد في البورصة.`}]},{id:`p1e1-q2`,question:`ما المعنى العملي للمسؤولية المحدودة للمساهم؟`,options:[{text:`لا يتحمل المساهم أي خسارة إطلاقاً`,explanation:`غير صحيح؛ قد يخسر المساهم قيمة أسهمه بالكامل.`},{text:`يُسأل المساهم عن ديون الشركة في حدود قيمة أسهمه فقط`,correct:!0,explanation:`صحيح. أمواله الخاصة بعيدة عن متناول دائني الشركة.`},{text:`يُسأل المساهم عن ديون الشركة بنسبة 50% من أمواله`,explanation:`لا توجد نسبة كهذه؛ الحد هو قيمة الأسهم.`},{text:`المسؤولية المحدودة تخص أعضاء مجلس الإدارة وحدهم`,explanation:`المسؤولية المحدودة صفة لجميع المساهمين في الشركة المساهمة.`}]},{id:`p1e1-q3`,question:`دفعت الشركة 600,000 ج.م عمولة لبنك تلقي الاكتتاب. ما المعالجة الصحيحة؟`,options:[{text:`مصروف في قائمة الدخل`,explanation:`هذه تكلفة مرتبطة مباشرة بإصدار الأسهم، والمعيار 25 يخصمها من حقوق الملكية.`},{text:`أصل غير ملموس يُستهلك على 5 سنوات`,explanation:`ليست أصلاً؛ فلا توجد منافع اقتصادية مستقبلية مستقلة.`},{text:`خصم من حقوق الملكية`,correct:!0,explanation:`صحيح. تكاليف إصدار أدوات حقوق الملكية تُخصم من حقوق الملكية.`},{text:`تُضاف إلى رأس المال`,explanation:`بالعكس، فهي تقلل صافي حقوق الملكية ولا تزيده.`}]},{id:`p1e1-q4`,question:`كيف تُعالج أتعاب المحامي لصياغة عقد التأسيس (600,000 ج.م)؟`,options:[{text:`مصروف فوراً في قائمة الدخل`,correct:!0,explanation:`صحيح. تكاليف تأسيس الكيان القانوني مصروف عند تكبدها وفق المعيار 23.`},{text:`أصل باسم «مصروفات تأسيس مؤجلة» يُستهلك على عدة سنوات`,explanation:`هذه ممارسة قديمة لا تسمح بها المعايير الحالية.`},{text:`تُخصم من حقوق الملكية`,explanation:`الخصم من حقوق الملكية خاص بتكاليف إصدار الأسهم ذاتها، لا بتأسيس الكيان.`},{text:`تُضاف إلى تكلفة أرض المصنع`,explanation:`لا علاقة لهذه الأتعاب بالأرض.`}]},{id:`p1e1-q5`,question:`بعد قيد الاكتتاب وقبل السداد، يكون حساب «المساهمون - حساب الاكتتاب»:`,options:[{text:`التزاماً على الشركة`,explanation:`بالعكس، المساهمون هم المدينون للشركة.`},{text:`أصلاً للشركة (حقاً لها على المساهمين)`,correct:!0,explanation:`صحيح. هو مبلغ مستحق للشركة يُقفل عند سداد المساهمين.`},{text:`جزءاً من الإيرادات`,explanation:`مساهمات الملاك ليست إيراداً أبداً؛ الإيراد ينتج من النشاط.`},{text:`مصروفاً`,explanation:`لم تُستهلك أي موارد هنا.`}]}],exercises:[{id:`p1e1-x1`,date:`2026-01-04`,prompt:`افترض أن النظام الأساسي سمح للمساهمين بسداد **25% فقط** من قيمة الأسهم عند الاكتتاب، والباقي على قسطين. سجّل قيداً واحداً يُثبت الاكتتاب في 300,000,000 ج.م وتحصيل 25% منها في البنك.`,solution:[{account:`1250`,debit:75e6},{account:`1230`,debit:225e6},{account:`3101`,credit:3e8}],hints:[`رأس المال المصدر يُسجَّل بالكامل (300 مليون) أياً كان المسدد منه.`,`المسدد = 300,000,000 × 25% = 75,000,000 دخلت البنك.`,`الباقي حق للشركة على المساهمين.`],explanation:`يُسجَّل رأس المال المصدر دائناً بالكامل، ويُقسم الطرف المدين: 75 مليوناً في البنك، و225 مليوناً حقاً على المساهمين حتى سداد الأقساط. (هذا التمرين افتراضي ولا يُرحَّل إلى دفاتر الشركة.)`},{id:`p1e1-x2`,date:`2026-01-20`,prompt:`سجّل قيد سداد أتعاب المحامي ورسوم التوثيق والسجل التجاري بإجمالي **850,000 ج.م** بشيك على البنك.`,solution:[{account:`5201`,debit:85e4},{account:`1250`,credit:85e4}],hints:[`هذه تكاليف تأسيس الكيان القانوني.`,`المعيار 23 يقضي بتحميلها مصروفاً.`],explanation:`مصروفات التأسيس مدينة (مصروف يزيد)، والبنك دائن (أصل ينقص).`}]},takeaways:[`يُسجَّل رأس المال بالقيمة الاسمية للأسهم المصدرة، لا المرخص بها.`,`مصروفات التأسيس ← قائمة الدخل. تكاليف إصدار الأسهم ← حقوق الملكية.`,`رصيد البنك في نهاية يناير: 298,550,000 ج.م.`]},y={id:`p1e2`,part:1,number:2,title:`القواعد التي تحكم اللعبة`,subtitle:`الإطار القانوني والتنظيمي، والمعايير المصرية والدولية`,period:`فبراير 2026`,minutes:25,objectives:[`أن تعرف القوانين الرئيسية التي تخضع لها شركة مساهمة مقيدة في مصر`,`أن تعرف دور الهيئة العامة للرقابة المالية والبورصة ومراقب الحسابات`,`أن تفهم العلاقة بين معايير المحاسبة المصرية والمعايير الدولية`,`أن تميّز العقد الذي لا يُسجَّل له قيد عند توقيعه`],situation:[`في فبراير 2026 قرر مجلس إدارة شركة النيل قيد أسهم الشركة في البورصة المصرية. تقدمت الشركة بملف القيد، وسددت رسوم القيد ورسوم الهيئة العامة للرقابة المالية بإجمالي 400,000 ج.م، ثم سددت 150,000 ج.م رسوم إيداع الأسهم وقيدها مركزياً لدى شركة مصر للمقاصة.`,`وتعاقدت الشركة مع مكتب استشارات قانونية لإعداد لوائح الحوكمة ودليل الإفصاح، مقابل أتعاب 300,000 ج.م سُددت في 15 فبراير.`,`وفي اجتماع الجمعية العامة عُيّن مكتب «حسن وشركاه» مراقباً لحسابات الشركة عن سنة 2026، بأتعاب سنوية 1,200,000 ج.م تُسدد بعد إصدار تقرير المراجعة.`,`سأل أحمد، المحاسب الجديد، الأستاذة منى: «هل نسجّل قيداً بمليون ومائتي ألف لأتعاب المراجع اليوم؟» فابتسمت وقالت: «سؤال ممتاز، والإجابة في هذه الحلقة.»`],explanation:[{type:`heading`,text:`خريطة القوانين`},`تخضع شركة مساهمة مقيدة مثل شركة النيل لعدة قوانين في الوقت نفسه، ولكل قانون مجاله:`,{type:`table`,headers:[`القانون`,`ماذا ينظم؟`,`أين يظهر في البرنامج؟`],rows:[[`{{law:159-1981|قانون الشركات 159 لسنة 1981}}`,`التأسيس، ورأس المال، ومجلس الإدارة، والجمعيات العامة، ومراقب الحسابات، والاحتياطي القانوني وتوزيع الأرباح`,`الجزء الأول والسادس`],[`{{law:95-1992|قانون سوق رأس المال 95 لسنة 1992}}`,`طرح الأوراق المالية وتداولها، والإفصاح الدوري للشركات المقيدة`,`الجزء الأول والخامس`],[`{{law:17-1999|قانون التجارة 17 لسنة 1999}}`,`التزامات التاجر، ومنها الدفاتر التجارية، والأوراق التجارية كالشيكات`,`الجزء الأول`],[`قوانين الضرائب`,`ضريبة الدخل، والقيمة المضافة، والإجراءات الضريبية الموحدة، والدمغة`,`الجزء الرابع والسادس`]]},{type:`heading`,text:`من يراقب الشركة؟`},{type:`list`,items:[`**{{org:fra|الهيئة العامة للرقابة المالية}}**: الجهة الرقابية على سوق رأس المال؛ تراجع نشرات الطرح، وتتابع إفصاح الشركات المقيدة، وتصدر قواعد القيد بالتنسيق مع البورصة.`,`**{{org:egx|البورصة المصرية}}**: السوق الذي تُتداول فيه الأسهم، وتطبّق قواعد القيد والشطب، وتنشر إفصاحات الشركات.`,`**{{org:mcdr|مصر للمقاصة}}**: تتولى الإيداع والقيد المركزي للأسهم وتسوية عمليات التداول.`,`**{{term:auditor|مراقب الحسابات}}**: محاسب قانوني مستقل تعينه الجمعية العامة، يراجع القوائم المالية ويبدي رأيه في مدى عدالتها {{review:V05}}.`]},{type:`heading`,text:`الدفاتر التجارية إلزام قانوني`},`يُلزم {{law:17-1999:art21|قانون التجارة (المادة 21)}} كل تاجر يزيد رأس ماله المستثمر في التجارة على عشرين ألف جنيه بإمساك الدفاتر التي تستلزمها طبيعة تجارته، وعلى الأخص **دفتر اليومية** و**دفتر الجرد**. ويُلزم في {{law:17-1999:art26|المادة 26}} بالاحتفاظ بالدفاتر والمستندات المؤيدة لها **خمس سنوات**. فالقيود التي نتعلمها ليست تمريناً نظرياً؛ إنها التزام قانوني.`,{type:`heading`,text:`المعايير المصرية والمعايير الدولية`},`**{{term:ifrs|المعايير الدولية للتقرير المالي}}** تصدرها مؤسسة دولية مستقلة هي مجلس معايير المحاسبة الدولية (IASB)، وتطبقها دول كثيرة.`,`أما **{{term:eas|معايير المحاسبة المصرية}}** فصدرت بـ{{decree:110-2015|قرار وزير الاستثمار رقم 110 لسنة 2015}}، وعُدّلت بقرارات لاحقة منها {{decree:69-2019|القرار 69 لسنة 2019}}. وهي مبنية على المعايير الدولية ومتوافقة معها إلى حد كبير، لكنها **ليست ترجمة حرفية**: فلها أرقامها الخاصة، وقد يتأخر تبني التعديلات الدولية، وتوجد اختلافات في بعض المعالجات والصياغات.`,{type:`table`,caption:`أمثلة لمعايير مصرية ومقابلها الدولي`,headers:[`المعيار المصري`,`المقابل الدولي`,`الموضوع`],rows:[[`{{eas:1|معيار 1}}`,`IAS 1`,`عرض القوائم المالية`],[`{{eas:5|معيار 5}}`,`IAS 8`,`السياسات المحاسبية والتغيرات في التقديرات والأخطاء`],[`{{eas:10|معيار 10}}`,`IAS 16`,`الأصول الثابتة وإهلاكاتها`],[`{{eas:23|معيار 23}}`,`IAS 38`,`الأصول غير الملموسة`],[`{{eas:48|معيار 48}}`,`IFRS 15`,`الإيراد من العقود مع العملاء`]]},`**القاعدة العملية**: الشركات المصرية تُعد قوائمها وفق المعايير المصرية. وعند عدم وجود معيار مصري يعالج موضوعاً معيناً، يُرجع إلى المعايير الدولية وفق ما ينص عليه تمهيد المعايير المصرية {{review:V03}}.`,{type:`heading`,text:`لماذا لا نسجّل أتعاب المراجع عند التعيين؟`},`عند تعيين المراجع لم يقدّم أي خدمة بعد، ولم تدفع الشركة شيئاً. هذا **{{term:executory-contract|عقد تحت التنفيذ}}**: وعدان متبادلان لم ينفذ أي طرف منهما شيئاً. لا يُسجَّل له قيد لحظة التوقيع، بل يُسجَّل المصروف **عندما تُقدَّم الخدمة** فعلاً، وهذا هو {{term:accrual-basis|أساس الاستحقاق}}. وسنرى في الحلقة السادسة كيف نسجّل الجزء الذي استحق من الأتعاب في نهاية الشهر.`],rule:{refs:[{id:`decree:110-2015`,title:`قرار وزير الاستثمار رقم 110 لسنة 2015 بإصدار معايير المحاسبة المصرية`,counterpart:`وتعديلاته، ومنها القرار 69 لسنة 2019`,text:`يُصدر معايير المحاسبة المصرية الملزمة، ومعها تمهيد يوضح نطاق تطبيقها وعلاقتها بالمعايير الدولية، والإطار العام لإعداد القوائم المالية وعرضها.`,review:`V03`},{id:`law:17-1999:art21`,title:`قانون التجارة 17 لسنة 1999 - المادة 21`,text:`على كل تاجر يجاوز رأس ماله المستثمر في التجارة عشرين ألف جنيه أن يمسك الدفاتر التي تستلزمها طبيعة تجارته وأهميتها، وبوجه خاص دفتري اليومية والجرد، بطريقة تكفل بيان مركزه المالي وما له من حقوق وما عليه من ديون متعلقة بتجارته.`},{id:`law:17-1999:art26`,title:`قانون التجارة 17 لسنة 1999 - المادة 26`,text:`يجب على التاجر وورثته الاحتفاظ بالدفاتر التجارية والوثائق المؤيدة للقيود الواردة بها مدة خمس سنوات تبدأ من تاريخ التأشير على الدفتر بانتهائه أو قفله.`},{id:`law:95-1992`,title:`قانون سوق رأس المال رقم 95 لسنة 1992`,counterpart:`ولائحته التنفيذية وقواعد القيد بالبورصة`,text:`ينظم إصدار الأوراق المالية وتداولها، ويُلزم الشركات المقيدة بإعداد قوائم مالية دورية وفق معايير المحاسبة المصرية ومراجعتها ونشرها. وتفاصيل شروط القيد ومواعيد الإفصاح في قواعد القيد الصادرة عن الهيئة.`,review:`V06`},{id:`law:159-1981:auditor`,title:`تعيين مراقب الحسابات`,counterpart:`قانون 159 لسنة 1981`,text:`يكون للشركة مراقب حسابات أو أكثر تعينه الجمعية العامة وتقدّر أتعابه، ويُشترط في مراقب حسابات الشركات المقيدة أن يكون مقيداً في السجل الذي تحتفظ به الهيئة العامة للرقابة المالية.`,review:`V05`}]},application:{intro:[`هذه قيود فبراير. لاحظ أنه **لا يوجد قيد لتعيين مراقب الحسابات**.`],entries:[{id:`p1e2-j1`,date:`2026-02-08`,description:`سداد رسوم القيد بالبورصة ورسوم الهيئة العامة للرقابة المالية`,lines:[{account:`5203`,debit:4e5},{account:`1250`,credit:4e5}],steps:[`القيد في البورصة لا يتضمن إصدار أسهم جديدة، فالرسوم ليست «تكلفة إصدار»`,`تُحمَّل مصروفاً (رسوم قيد وتسجيل)`,`البنك ينقص بالمبلغ نفسه`]},{id:`p1e2-j2`,date:`2026-02-08`,description:`سداد رسوم الإيداع والقيد المركزي للأسهم لدى مصر للمقاصة`,lines:[{account:`5203`,debit:15e4},{account:`1250`,credit:15e4}],steps:[`رسوم خدمة إيداع وقيد مركزي ← مصروف`,`البنك ← دائن`]},{id:`p1e2-j3`,date:`2026-02-15`,description:`سداد أتعاب مكتب الاستشارات القانونية عن إعداد لوائح الحوكمة ودليل الإفصاح`,lines:[{account:`5202`,debit:3e5},{account:`1250`,credit:3e5}],steps:[`الخدمة قُدمت بالكامل خلال فبراير ← مصروف الفترة`,`أتعاب مهنية وقانونية مدين، والبنك دائن`]}],outro:[{type:`callout`,tone:`info`,title:`وماذا عن مراقب الحسابات؟`,text:`لا قيد اليوم. يُسجَّل المصروف تدريجياً مع تقديم الخدمة (الحلقة 6)، أما مبلغ الأتعاب المتفق عليه فيُفصح عنه حيث يلزم.`},{type:`callout`,tone:`success`,title:`رصيد البنك في نهاية فبراير`,text:`298,550,000 − 400,000 − 150,000 − 300,000 = **297,700,000 ج.م**`}]},mistake:{title:`تسجيل العقود عند توقيعها، أو اعتبار رسوم القيد تكلفة إصدار`,blocks:[`**الخطأ الأول**: تسجيل قيد بقيمة العقد بالكامل يوم توقيعه (من حـ/ أتعاب المراجعة إلى حـ/ مصروفات مستحقة 1,200,000). هذا يحمّل فبراير مصروف سنة كاملة لم تُقدم خدماتها بعد، ويظهر التزاماً لم ينشأ.`,`**الخطأ الثاني**: خصم رسوم القيد في البورصة من حقوق الملكية كأنها تكلفة إصدار. الخصم من حقوق الملكية يقتصر على التكاليف المرتبطة **مباشرة بإصدار أسهم جديدة**. أما قيد أسهم قائمة بالفعل فمصروف.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`اسأل: هل **نفّذ** أحد الطرفين شيئاً؟ إن لم يحدث، فلا قيد بعد. وعند تحليل أي تكلفة متعلقة بالأسهم اسأل: هل صدرت **أسهم جديدة** بسببها؟`}]},quiz:{questions:[{id:`p1e2-q1`,question:`عيّنت الجمعية العامة مراقب حسابات بأتعاب سنوية 1,200,000 ج.م تُدفع بعد التقرير. ما القيد يوم التعيين؟`,options:[{text:`من حـ/ أتعاب مهنية إلى حـ/ مصروفات مستحقة 1,200,000`,explanation:`لم تُقدَّم أي خدمة بعد، فلا مصروف ولا التزام.`},{text:`من حـ/ مصروفات مدفوعة مقدماً إلى حـ/ البنك 1,200,000`,explanation:`الشركة لم تدفع شيئاً.`},{text:`لا يوجد قيد`,correct:!0,explanation:`صحيح. هذا عقد تحت التنفيذ، ويُسجَّل المصروف مع تقديم الخدمة على أساس الاستحقاق.`},{text:`من حـ/ أتعاب مهنية إلى حـ/ البنك 1,200,000`,explanation:`لم يحدث سداد ولم تُقدَّم خدمة.`}]},{id:`p1e2-q2`,question:`وفق قانون التجارة، ما الدفتران المنصوص عليهما بوجه خاص؟`,options:[{text:`دفتر الأستاذ وميزان المراجعة`,explanation:`دفتر الأستاذ مهم عملياً، لكن المادة 21 تنص بوجه خاص على اليومية والجرد.`},{text:`دفتر اليومية ودفتر الجرد`,correct:!0,explanation:`صحيح، وفق المادة 21 من قانون التجارة.`},{text:`دفتر الخزينة ودفتر البنك`,explanation:`دفاتر مساعدة شائعة، لكنها ليست المنصوص عليها.`},{text:`سجل المساهمين وسجل الأسهم`,explanation:`هذه سجلات تنظيمية للشركة، لا الدفاتر التجارية المقصودة.`}]},{id:`p1e2-q3`,question:`ما مدة الاحتفاظ بالدفاتر التجارية والمستندات المؤيدة لها وفق قانون التجارة؟`,options:[{text:`سنة واحدة`,explanation:`المدة أطول من ذلك.`},{text:`ثلاث سنوات`,explanation:`غير صحيح.`},{text:`خمس سنوات`,correct:!0,explanation:`صحيح، وفق المادة 26. (قد تفرض القوانين الضريبية مدداً خاصة بها، وسنتناولها في الجزء السادس.)`},{text:`عشر سنوات`,explanation:`ليست المدة المنصوص عليها في المادة 26.`}]},{id:`p1e2-q4`,question:`أي العبارات أدق في وصف معايير المحاسبة المصرية؟`,options:[{text:`ترجمة حرفية للمعايير الدولية بالأرقام نفسها`,explanation:`لها ترقيم خاص، وتوجد اختلافات وتوقيتات تبنٍّ مختلفة.`},{text:`معايير مبنية على المعايير الدولية ومتوافقة معها إلى حد كبير، مع اختلافات محددة`,correct:!0,explanation:`صحيح.`},{text:`معايير مستقلة تماماً لا علاقة لها بالمعايير الدولية`,explanation:`بُنيت المعايير المصرية على المعايير الدولية.`},{text:`معايير اختيارية يمكن للشركة تجاهلها`,explanation:`هي ملزمة بقرار وزاري.`}]},{id:`p1e2-q5`,question:`ما المعيار الدولي المقابل لمعيار المحاسبة المصري رقم 10؟`,options:[{text:`IAS 1`,explanation:`IAS 1 يقابل المعيار المصري 1 (عرض القوائم المالية).`},{text:`IAS 16`,correct:!0,explanation:`صحيح. كلاهما عن الأصول الثابتة (الممتلكات والآلات والمعدات).`},{text:`IFRS 15`,explanation:`IFRS 15 يقابل المعيار المصري 48 (الإيراد).`},{text:`IAS 38`,explanation:`IAS 38 يقابل المعيار المصري 23 (الأصول غير الملموسة).`}]}],exercises:[{id:`p1e2-x1`,date:`2026-02-08`,prompt:`سجّل قيد سداد رسوم القيد بالبورصة ورسوم الهيئة العامة للرقابة المالية بإجمالي **400,000 ج.م** من الحساب الجاري بالبنك.`,solution:[{account:`5203`,debit:4e5},{account:`1250`,credit:4e5}],hints:[`لم تصدر أسهم جديدة.`,`ابحث في دليل الحسابات عن حساب الرسوم.`],explanation:`رسوم القيد مصروف لأن القيد لم يصاحبه إصدار أسهم جديدة.`}]},takeaways:[`شركة مساهمة مقيدة تخضع لقانون الشركات وقانون سوق رأس المال وقانون التجارة وقوانين الضرائب.`,`المعايير المصرية مبنية على الدولية، ويُرجع للدولية عند غياب معيار مصري.`,`العقد لا يُسجَّل عند توقيعه؛ المصروف يُسجَّل عند تلقي الخدمة.`,`رصيد البنك في نهاية فبراير: 297,700,000 ج.م.`]},b={id:`p1e3`,part:1,number:3,title:`متى نسجّل أصلاً؟ الإطار المفاهيمي`,subtitle:`أهداف التقرير المالي، والخصائص النوعية، وعناصر القوائم، والاعتراف والقياس`,period:`مارس 2026`,minutes:30,objectives:[`أن تعرف هدف التقرير المالي ومن هم مستخدموه`,`أن تشرح الخصائص النوعية للمعلومات المالية المفيدة`,`أن تعرّف عناصر القوائم المالية الخمسة`,`أن تطبق شروط الاعتراف ومبدأ التكلفة التاريخية على شراء أرض المصنع`],situation:[`في 5 مارس 2026 اشترت شركة النيل قطعة أرض مساحتها 30,000 متر مربع في المنطقة الصناعية بمدينة العاشر من رمضان بسعر **45,000,000 ج.م**، ودفعت في اليوم نفسه رسوم التسجيل والشهر العقاري **900,000 ج.م** وعمولة الوسيط العقاري **450,000 ج.م**.`,`وفي 20 مارس وقّعت عقد إنشاء مبنى المصنع مع شركة مقاولات، ودفعت لها **دفعة مقدمة 20,000,000 ج.م** لبدء الأعمال.`,`في اجتماع مجلس الإدارة تحدث رئيس المجلس بحماس:`,{type:`list`,items:[`«استشاري تقييم قال إن **علامتنا التجارية** وحدها تساوي 50 مليون جنيه! سجّلوها في الميزانية.»`,`«وسمسار عقارات قال إن الأرض **تساوي الآن 55 مليوناً**. لماذا نُظهرها بـ45؟»`,`«وموظفونا هم **أهم أصولنا**، أين هم في الميزانية؟»`]},`نظرت الأستاذة منى إلى أحمد وقالت: «الإجابة عن الأسئلة الثلاثة في الإطار المفاهيمي.»`],explanation:[{type:`heading`,text:`ما الإطار المفاهيمي؟`},`**{{term:conceptual-framework|الإطار المفاهيمي}}** هو «الدستور» الذي تُبنى عليه المعايير. لا يعالج عملية بعينها، لكنه يحدد: لماذا نعد القوائم المالية؟ ولمن؟ وما الذي يجعل المعلومة مفيدة؟ ومتى نسجّل بنداً، وبأي قيمة؟ ويُسمى في مصر **{{eas:framework|الإطار العام لإعداد وعرض القوائم المالية}}** {{review:V04}}.`,{type:`heading`,text:`هدف التقرير المالي`},`توفير معلومات مالية مفيدة **للمستثمرين والمقرضين والدائنين** الحاليين والمحتملين، تساعدهم في اتخاذ قرارات: شراء الأسهم أو بيعها، ومنح القروض، وتقييم أداء الإدارة. فالمستخدم الأساسي ليس مجلس الإدارة، بل من يقدّم الأموال للشركة من خارجها.`,{type:`heading`,text:`الخصائص النوعية للمعلومة المفيدة`},{type:`table`,headers:[`الخاصية`,`معناها`,`مثال من شركة النيل`],rows:[[`{{term:relevance|الملاءمة}} (أساسية)`,`تؤثر في قرارات المستخدمين، ولها قيمة تنبؤية أو تأكيدية`,`إيرادات المبيعات الشهرية تساعد في توقع أداء السنة`],[`{{term:faithful-representation|التمثيل الصادق}} (أساسية)`,`تصوّر الواقع كاملاً ومحايداً وخالياً من الأخطاء الجوهرية`,`تسجيل الأرض بما دُفع فعلاً، لا بتقدير متفائل`],[`{{term:comparability|القابلية للمقارنة}}`,`إمكان مقارنة الشركة بنفسها عبر الزمن وبغيرها`,`تطبيق السياسات نفسها كل سنة`],[`{{term:verifiability|القابلية للتحقق}}`,`يصل مراقبون مستقلون إلى النتيجة نفسها تقريباً`,`عقد شراء الأرض والشيكات المسددة`],[`{{term:timeliness|التوقيت المناسب}}`,`إتاحة المعلومة قبل أن تفقد قدرتها على التأثير`,`نشر القوائم في المواعيد القانونية`],[`{{term:understandability|القابلية للفهم}}`,`عرض واضح ومختصر لمستخدم لديه معرفة معقولة`,`إيضاحات مرتبة وواضحة`]]},`ويحكم ذلك كله قيد **{{term:materiality|الأهمية النسبية}}**: المعلومة جوهرية إذا كان حذفها أو تحريفها يمكن أن يؤثر في قرارات المستخدمين.`,{type:`heading`,text:`عناصر القوائم المالية الخمسة`},{type:`list`,items:[`**{{term:asset|الأصل}}**: مورد اقتصادي حالي تسيطر عليه الشركة نتيجة أحداث ماضية، ويُتوقع أن يولّد منافع اقتصادية.`,`**{{term:liability|الالتزام}}**: التزام حالي على الشركة بنقل مورد اقتصادي نتيجة أحداث ماضية.`,`**{{term:equity|حقوق الملكية}}**: ما يتبقى من الأصول بعد خصم جميع الالتزامات.`,`**{{term:income|الدخل}}**: زيادات في الأصول أو نقص في الالتزامات تزيد حقوق الملكية، بخلاف مساهمات الملاك.`,`**{{term:expense|المصروف}}**: نقص في الأصول أو زيادة في الالتزامات تقلل حقوق الملكية، بخلاف التوزيعات على الملاك.`]},{type:`heading`,text:`الاعتراف والقياس`},`**{{term:recognition|الاعتراف}}** هو إدراج بند في القوائم المالية. يُعترف بالبند إذا انطبق عليه تعريف أحد العناصر، وكان الاعتراف به يوفر معلومات ملائمة وتمثيلاً صادقاً، ويشمل ذلك إمكان قياسه بدرجة يُعتمد عليها.`,`و**{{term:measurement|القياس}}** هو تحديد المبلغ. والأساس الأشهر هو **{{term:historical-cost|التكلفة التاريخية}}**: ما دُفع لاقتناء الأصل، **مضافاً إليه التكاليف المباشرة اللازمة لجعله جاهزاً للاستخدام**، كرسوم التسجيل وعمولة الوسيط.`,`ويقوم الإطار كله على **{{term:going-concern|فرض الاستمرارية}}**: أن الشركة مستمرة في نشاطها في المستقبل المنظور، ولذلك نسجل الأصول بالتكلفة لا بقيمة تصفيتها.`,{type:`heading`,text:`إجابات أسئلة رئيس المجلس`},{type:`table`,headers:[`البند`,`هل نعترف به؟`,`السبب`],rows:[[`العلامة التجارية (50 مليون)`,`لا`,`علامة مُنشأة داخلياً؛ المعيار 23 يمنع الاعتراف بالعلامات المُنشأة داخلياً لأن تكلفتها لا يمكن فصلها عن تكلفة تطوير النشاط ككل`],[`زيادة قيمة الأرض إلى 55 مليوناً`,`لا، الآن`,`نقيس بالتكلفة التاريخية. المعيار 10 يسمح بنموذج إعادة التقييم كسياسة محاسبية لفئة كاملة من الأصول، وسنتناوله في الجزء الثاني`],[`الموظفون`,`لا`,`الشركة لا تسيطر على الموظفين كما تسيطر على أصل، ولا يمكن قياس «قيمتهم» بصورة صادقة`],[`الأرض (46,350,000)`,`نعم`,`مورد تسيطر عليه الشركة، ناتج عن شراء فعلي، وتكلفته معروفة بدقة`],[`الدفعة المقدمة للمقاول`,`نعم، ضمن مشروعات تحت التنفيذ`,`حق للشركة في الحصول على مبنى، والمبلغ مدفوع فعلاً`]]}],rule:{refs:[{id:`eas:framework`,title:`الإطار العام لإعداد وعرض القوائم المالية (المرفق بمعايير المحاسبة المصرية)`,counterpart:`Conceptual Framework for Financial Reporting (IASB)`,text:`يحدد هدف القوائم المالية، والخصائص النوعية للمعلومات، وتعريفات العناصر، وشروط الاعتراف، وأسس القياس. صدر الإطار الدولي المحدَّث سنة 2018 بتعريفات معدلة للأصل والالتزام، وتحتاج درجة تطابق الإطار المصري الحالي معه إلى مراجعة.`,review:`V04`},{id:`eas:10`,title:`معيار المحاسبة المصري رقم (10): الأصول الثابتة وإهلاكاتها`,counterpart:`IAS 16 Property, Plant and Equipment (الفقرات 7 و15 و16)`,text:`يُعترف بتكلفة الأصل الثابت إذا كان من المرجح تدفق منافع اقتصادية مستقبلية منه وأمكن قياس تكلفته بدرجة يُعتمد عليها. ويُقاس الأصل عند الاعتراف الأولي بتكلفته، وتشمل سعر الشراء وأي تكاليف مباشرة لازمة لوصول الأصل إلى الموقع والحالة اللازمين لتشغيله.`},{id:`eas:23`,title:`معيار المحاسبة المصري رقم (23): الأصول غير الملموسة`,counterpart:`IAS 38 Intangible Assets (الفقرة 63)`,text:`العلامات التجارية وعناوين النشر وقوائم العملاء والبنود المماثلة المُنشأة داخلياً لا يُعترف بها أصولاً.`}]},application:{intro:[`تكلفة الأرض = سعر الشراء + رسوم التسجيل + عمولة الوسيط = 45,000,000 + 900,000 + 450,000 = **46,350,000 ج.م**.`],entries:[{id:`p1e3-j1`,date:`2026-03-05`,description:`شراء أرض المصنع بالعاشر من رمضان (30,000 م²) بشيك`,lines:[{account:`1101`,debit:45e6},{account:`1250`,credit:45e6}],steps:[`أصل جديد تسيطر عليه الشركة ← الأراضي مدين`,`النقدية تنقص ← البنك دائن`,`هذا تبادل أصل بأصل؛ لا أثر على حقوق الملكية`]},{id:`p1e3-j2`,date:`2026-03-05`,description:`رسوم التسجيل والشهر العقاري (900,000) وعمولة الوسيط (450,000) لأرض المصنع`,lines:[{account:`1101`,debit:135e4},{account:`1250`,credit:135e4}],steps:[`تكاليف مباشرة لازمة لاقتناء الأرض ← تُضاف إلى تكلفتها (المعيار 10)`,`ليست مصروفاً في قائمة الدخل`,`رصيد حساب الأراضي = 46,350,000 ج.م`]},{id:`p1e3-j3`,date:`2026-03-20`,description:`دفعة مقدمة لشركة المقاولات لبدء إنشاء مبنى المصنع`,lines:[{account:`1190`,debit:2e7},{account:`1250`,credit:2e7}],steps:[`المبنى لم يكتمل بعد ← لا نسجّله في «مباني»`,`نجمع تكاليفه في «مشروعات تحت التنفيذ» حتى يصبح جاهزاً للاستخدام`,`مشروعات تحت التنفيذ لا تُهلك`]}],outro:[{type:`callout`,tone:`success`,title:`رصيد البنك في نهاية مارس`,text:`297,700,000 − 45,000,000 − 1,350,000 − 20,000,000 = **231,350,000 ج.م**. ولم تتغير حقوق الملكية في مارس، لأن كل العمليات تبادل أصل بأصل.`}]},mistake:{title:`تحميل رسوم تسجيل الأرض على المصروفات، أو تسجيل «قيمة سوقية» لم تتحقق`,blocks:[`**الخطأ الأول**: تسجيل رسوم الشهر العقاري وعمولة الوسيط مصروفاً. هذا يقلل تكلفة الأرض ويُظهر خسارة غير حقيقية في مارس. القاعدة: كل تكلفة **مباشرة ولازمة** لاقتناء الأصل وتجهيزه جزء من تكلفته.`,`**الخطأ الثاني**: رفع قيمة الأرض إلى 55 مليوناً لأن سمساراً قال ذلك، وتسجيل الفرق ربحاً. هذا يخالف التكلفة التاريخية والتمثيل الصادق، والربح لم يتحقق. (نموذج إعادة التقييم موجود في المعيار 10 لكن بشروط وقيود، وفروقه لا تمر بقائمة الدخل كربح عادي؛ الجزء الثاني.)`,`**الخطأ الثالث**: تسجيل الدفعة المقدمة للمقاول في حساب «مباني» وبدء إهلاكها. المبنى لا وجود له بعد.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`اسأل: هل هذه التكلفة **ضرورية لاقتناء الأصل وجعله جاهزاً**؟ إن كانت كذلك فهي جزء من تكلفته. وهل القيمة **مدعومة بمعاملة فعلية**؟ إن لم تكن، فلا تعترف بها وفق نموذج التكلفة.`}]},quiz:{questions:[{id:`p1e3-q1`,question:`اشترت الشركة أرضاً بـ45 مليوناً ودفعت رسوم تسجيل 900 ألف وعمولة وسيط 450 ألفاً. بكم تُسجَّل الأرض؟`,options:[{text:`45,000,000 ج.م`,explanation:`التكلفة تشمل التكاليف المباشرة اللازمة للاقتناء، لا السعر وحده.`},{text:`45,900,000 ج.م`,explanation:`عمولة الوسيط تكلفة مباشرة للاقتناء أيضاً.`},{text:`46,350,000 ج.م`,correct:!0,explanation:`صحيح. 45,000,000 + 900,000 + 450,000.`},{text:`55,000,000 ج.م`,explanation:`هذا تقدير سمسار، لا تكلفة فعلية.`}]},{id:`p1e3-q2`,question:`لماذا لا تُسجَّل العلامة التجارية التي أنشأتها الشركة بنفسها أصلاً؟`,options:[{text:`لأنها لا تساوي شيئاً`,explanation:`قد تكون لها قيمة كبيرة اقتصادياً، لكن المعيار يمنع الاعتراف بها.`},{text:`لأن المعيار 23 يمنع الاعتراف بالعلامات المُنشأة داخلياً`,correct:!0,explanation:`صحيح. تكلفتها لا يمكن فصلها عن تكلفة تطوير النشاط ككل.`},{text:`لأن الشركة لم تسجلها في جهاز تنمية التجارة`,explanation:`التسجيل القانوني يحمي العلامة، لكنه لا يغيّر الحكم المحاسبي.`},{text:`لأنها أصل متداول`,explanation:`لو اعتُرف بها لكانت أصلاً غير متداول، لكن لا يُعترف بها أصلاً.`}]},{id:`p1e3-q3`,question:`أي مما يلي من الخصائص النوعية **الأساسية**؟`,options:[{text:`القابلية للمقارنة والتوقيت المناسب`,explanation:`هاتان خاصيتان معززتان.`},{text:`الملاءمة والتمثيل الصادق`,correct:!0,explanation:`صحيح. هما الخاصيتان الأساسيتان؛ والباقي معززات.`},{text:`الحيطة والحذر والتحفظ`,explanation:`الحيطة جزء من دعم الحياد في الإطار الحديث، وليست خاصية أساسية مستقلة.`},{text:`الأهمية النسبية والتكلفة`,explanation:`الأهمية النسبية جانب من الملاءمة، والتكلفة قيد على التقرير.`}]},{id:`p1e3-q4`,question:`دفعت الشركة 20 مليوناً مقدماً لمقاول لبناء المصنع. أين تُسجَّل؟`,options:[{text:`مباني وإنشاءات، وتبدأ في الإهلاك`,explanation:`المبنى غير موجود بعد، ولا يبدأ الإهلاك إلا عند جاهزية الأصل للاستخدام.`},{text:`مصروف إنشاءات في قائمة الدخل`,explanation:`الشركة حصلت على حق في مبنى، فهي لم تستهلك المورد.`},{text:`مشروعات تحت التنفيذ`,correct:!0,explanation:`صحيح. تُجمع فيها تكاليف الأصل حتى يكتمل، ثم تُحول إلى المباني.`},{text:`لا قيد حتى يكتمل المبنى`,explanation:`الشركة دفعت نقدية فعلاً، فلا بد من قيد.`}]},{id:`p1e3-q5`,question:`ما الذي يبرر تسجيل الأصول بالتكلفة لا بقيمة التصفية؟`,options:[{text:`فرض الاستمرارية`,correct:!0,explanation:`صحيح. نفترض أن الشركة مستمرة، فلن تبيع أصولها بيعاً اضطرارياً.`},{text:`مبدأ الأهمية النسبية`,explanation:`الأهمية النسبية تتعلق بتأثير المعلومة على القرار.`},{text:`القابلية للمقارنة`,explanation:`خاصية معززة، لكنها ليست أساس هذا الاختيار.`},{text:`مبدأ الوحدة المحاسبية المستقلة`,explanation:`هذا المبدأ يفصل أموال الشركة عن أموال الملاك.`}]}],exercises:[{id:`p1e3-x1`,date:`2026-03-05`,prompt:`سجّل **قيداً واحداً** يُثبت شراء أرض المصنع بسعر 45,000,000 ج.م مع رسوم التسجيل 900,000 ج.م وعمولة الوسيط 450,000 ج.م، وكلها مسددة من البنك.`,solution:[{account:`1101`,debit:4635e4},{account:`1250`,credit:4635e4}],hints:[`كل التكاليف المباشرة جزء من تكلفة الأرض.`,`اجمع الثلاثة مبالغ.`],explanation:`تكلفة الأرض = 46,350,000 ج.م، مدين الأراضي ودائن البنك.`},{id:`p1e3-x2`,date:`2026-03-20`,prompt:`سجّل قيد سداد **دفعة مقدمة 20,000,000 ج.م** لشركة المقاولات لبدء إنشاء مبنى المصنع.`,solution:[{account:`1190`,debit:2e7},{account:`1250`,credit:2e7}],hints:[`المبنى لم يكتمل بعد.`],explanation:`تُجمع تكاليف الإنشاء في مشروعات تحت التنفيذ حتى يصبح المبنى جاهزاً للاستخدام.`}]},takeaways:[`المستخدم الأساسي للقوائم: المستثمرون والمقرضون والدائنون.`,`الخاصيتان الأساسيتان: الملاءمة والتمثيل الصادق.`,`التكلفة = السعر + التكاليف المباشرة اللازمة للاقتناء.`,`رصيد البنك في نهاية مارس: 231,350,000 ج.م.`]},ee={id:`p1e4`,part:1,number:4,title:`المعادلة المحاسبية والقيد المزدوج`,subtitle:`لماذا تتوازن الدفاتر دائماً؟ وكيف نعرف المدين من الدائن؟`,period:`1 - 10 أبريل 2026`,minutes:30,objectives:[`أن تكتب المعادلة المحاسبية وتشرح سبب توازنها الدائم`,`أن تحلل أثر أي عملية على طرفي المعادلة`,`أن تطبق قواعد المدين والدائن على الأنواع الخمسة من الحسابات`,`أن تعرف الطبيعة العادية لرصيد كل حساب`],situation:[`مصنع العاشر من رمضان سيحتاج إلى أكثر من سنة حتى يكتمل. ولكي تبني الشركة اسمها في السوق من الآن، اتفقت مع مصنع متعاقد ينتج لها العصائر والصلصات بعلامتها التجارية وفق مواصفاتها، وتشتريها منه منتجاتٍ تامة الصنع ({{term:toll-manufacturing|التصنيع لدى الغير}}).`,`وخلال الأيام العشرة الأولى من أبريل 2026 حدث الآتي:`,{type:`table`,headers:[`التاريخ`,`العملية`],rows:[[`1 أبريل`,`استئجار مقر إداري بالقاهرة الجديدة لمدة سنة، ودفع إيجار 12 شهراً مقدماً: 1,800,000 ج.م`],[`3 أبريل`,`شراء أول دفعة منتجات تامة من المصنع المتعاقد بقيمة 6,000,000 ج.م على الحساب (آجل 60 يوماً)`],[`6 أبريل`,`سداد 2,500,000 ج.م للمصنع المتعاقد من الحساب السابق`],[`8 أبريل`,`استلام دفعة مقدمة 1,000,000 ج.م من سلسلة «هايبر المحروسة» عن طلبية تُسلَّم منتصف الشهر`],[`9 أبريل`,`سحب 200,000 ج.م من البنك عهدةً نقدية للمصروفات النثرية بالخزينة`]]},`قال أحمد: «خمس عمليات مختلفة تماماً. كيف أعرف ماذا أضع في المدين وماذا في الدائن؟» فرسمت الأستاذة منى على السبورة معادلة واحدة.`],explanation:[{type:`heading`,text:`المعادلة المحاسبية`},{type:`callout`,tone:`info`,title:`المعادلة الأساسية`,text:`**الأصول = الالتزامات + حقوق الملكية**`},`**{{term:accounting-equation|المعادلة المحاسبية}}** تقول ببساطة: كل ما تملكه الشركة (الأصول) مموَّل إما من الغير (الالتزامات) وإما من الملاك (حقوق الملكية). لا يوجد مصدر ثالث. لذلك يتساوى الطرفان دائماً.`,`وبما أن الربح يزيد حقوق الملكية، يمكن توسيع المعادلة:`,{type:`callout`,tone:`info`,title:`المعادلة الموسعة`,text:`**الأصول = الالتزامات + رأس المال + الإيرادات − المصروفات**`},{type:`heading`,text:`كل عملية لها أثران`},`أي عملية تغيّر بندين على الأقل بحيث تبقى المعادلة متوازنة. لنحلل عمليات أبريل:`,{type:`table`,caption:`أثر عمليات 1-10 أبريل على المعادلة (بالجنيه)`,headers:[`العملية`,`الأصول`,`الالتزامات`,`حقوق الملكية`],rows:[[`إيجار مقدم`,`+1,800,000 مدفوع مقدماً / −1,800,000 بنك`,`0`,`0`],[`شراء منتجات آجل`,`+6,000,000 مخزون`,`+6,000,000 موردون`,`0`],[`سداد للمورد`,`−2,500,000 بنك`,`−2,500,000 موردون`,`0`],[`دفعة مقدمة من عميل`,`+1,000,000 بنك`,`+1,000,000 دفعات مقدمة من العملاء`,`0`],[`سحب عهدة نقدية`,`+200,000 خزينة / −200,000 بنك`,`0`,`0`]]},`لاحظ أن **لا عملية منها غيّرت حقوق الملكية**. فدفع الإيجار مقدماً ليس مصروفاً بعد، لأن الشركة لم تستخدم المقر بعد، بل اشترت **حقاً** في استخدامه 12 شهراً. واستلام الدفعة المقدمة ليس إيراداً، لأن الشركة لم تسلّم البضاعة بعد، بل صار عليها **التزام** بالتسليم.`,{type:`heading`,text:`المدين والدائن`},`**{{term:debit|المدين}}** هو الجانب الأيمن من الحساب، و**{{term:credit|الدائن}}** هو الجانب الأيسر. ليس معناهما «جيد» أو «سيئ»، بل هما مجرد اتجاهين. والقاعدة مشتقة من المعادلة:`,{type:`table`,headers:[`نوع الحساب`,`يزيد بـ`,`ينقص بـ`,`{{term:normal-balance|الرصيد الطبيعي}}`],rows:[[`الأصول`,`المدين`,`الدائن`,`مدين`],[`المصروفات`,`المدين`,`الدائن`,`مدين`],[`الالتزامات`,`الدائن`,`المدين`,`دائن`],[`حقوق الملكية`,`الدائن`,`المدين`,`دائن`],[`الإيرادات`,`الدائن`,`المدين`,`دائن`]]},`**لماذا المصروفات مدينة؟** لأنها تقلل حقوق الملكية، وحقوق الملكية تنقص بالمدين. **ولماذا الإيرادات دائنة؟** لأنها تزيد حقوق الملكية.`,`و**{{term:double-entry|القيد المزدوج}}** يعني أن كل قيد له طرف مدين وطرف دائن على الأقل، و**مجموع المدين = مجموع الدائن** دائماً. ولهذا تتوازن الدفاتر.`,{type:`heading`,text:`طريقة عملية في 3 أسئلة`},{type:`list`,ordered:!0,items:[`ما الحسابات التي تأثرت؟`,`ما نوع كل حساب (أصل، التزام، حقوق ملكية، إيراد، مصروف)؟`,`هل زاد أم نقص؟ ثم طبّق الجدول.`]},`مثال: الدفعة المقدمة من العميل ← البنك (أصل زاد ← مدين) + دفعات مقدمة من العملاء (التزام زاد ← دائن). ويسميها معيار الإيراد {{term:contract-liability|التزام عقد}}.`],rule:{refs:[{id:`eas:framework`,title:`الإطار العام: تعريفات العناصر`,counterpart:`Conceptual Framework (IASB) - الفصل 4`,text:`حقوق الملكية هي الحصة المتبقية في الأصول بعد خصم جميع الالتزامات، وهذا التعريف هو أصل المعادلة المحاسبية.`,review:`V04`},{id:`eas:48`,title:`معيار المحاسبة المصري رقم (48): الإيراد من العقود مع العملاء`,counterpart:`IFRS 15 Revenue from Contracts with Customers (الفقرة 106)`,text:`إذا دفع العميل مقابلاً قبل أن تنقل المنشأة السلعة إليه، تعرض المنشأة العقد التزامَ عقد عند استلام الدفعة. ويُعترف بالإيراد عند الوفاء بالتزام الأداء، أي عند نقل السيطرة على السلعة إلى العميل.`},{id:`law:17-1999:art21`,title:`قانون التجارة - المادة 21`,text:`الدفاتر يجب أن تكفل بيان المركز المالي للتاجر وما له من حقوق وما عليه من ديون، أي طرفي المعادلة المحاسبية.`}]},application:{intro:[`قيود 1-10 أبريل في دفتر اليومية:`],entries:[{id:`p1e4-j1`,date:`2026-04-01`,description:`سداد إيجار المقر الإداري بالقاهرة الجديدة لمدة 12 شهراً مقدماً (أبريل 2026 - مارس 2027)`,lines:[{account:`1220`,debit:18e5},{account:`1250`,credit:18e5}],steps:[`الإيجار الشهري = 1,800,000 ÷ 12 = 150,000 ج.م`,`حق استخدام لم يُستهلك بعد ← مصروفات مدفوعة مقدماً (أصل يزيد ← مدين)`,`البنك (أصل ينقص ← دائن)`]},{id:`p1e4-j2`,date:`2026-04-03`,description:`شراء منتجات تامة من المصنع المتعاقد على الحساب (آجل 60 يوماً)`,lines:[{account:`1203`,debit:6e6},{account:`2201`,credit:6e6}],steps:[`المخزون (أصل يزيد ← مدين)`,`الموردون (التزام يزيد ← دائن)`]},{id:`p1e4-j3`,date:`2026-04-06`,description:`سداد جزء من مستحقات المصنع المتعاقد بتحويل بنكي`,lines:[{account:`2201`,debit:25e5},{account:`1250`,credit:25e5}],steps:[`الموردون (التزام ينقص ← مدين)`,`البنك (أصل ينقص ← دائن)`,`رصيد المورد بعد السداد = 6,000,000 − 2,500,000 = 3,500,000 ج.م`]},{id:`p1e4-j4`,date:`2026-04-08`,description:`استلام دفعة مقدمة من سلسلة هايبر المحروسة عن طلبية تُسلَّم منتصف أبريل`,lines:[{account:`1250`,debit:1e6},{account:`2202`,credit:1e6}],steps:[`البنك (أصل يزيد ← مدين)`,`الشركة لم تسلّم البضاعة ← ليس إيراداً بعد`,`دفعات مقدمة من العملاء (التزام عقد يزيد ← دائن)`]},{id:`p1e4-j5`,date:`2026-04-09`,description:`سحب عهدة نقدية من البنك للمصروفات النثرية`,lines:[{account:`1251`,debit:2e5},{account:`1250`,credit:2e5}],steps:[`الخزينة (أصل يزيد ← مدين)`,`البنك (أصل ينقص ← دائن)`,`مجرد نقل بين أصلين`]}],outro:[{type:`table`,caption:`المعادلة بعد عمليات 10 أبريل`,headers:[`الأصول`,`=`,`الالتزامات`,`+`,`حقوق الملكية`],rows:[[`302,200,000`,`=`,`4,500,000`,`+`,`297,700,000`]]},{type:`callout`,tone:`success`,title:`رصيد البنك في 10 أبريل`,text:`231,350,000 − 1,800,000 − 2,500,000 + 1,000,000 − 200,000 = **227,850,000 ج.م**`}]},mistake:{title:`تسجيل الإيجار المقدم مصروفاً، والدفعة المقدمة إيراداً`,blocks:[`**الخطأ الأول**: تحميل الإيجار المدفوع عن سنة كاملة (1,800,000) على مصروفات أبريل. النتيجة: أبريل يُظهر خسارة كبيرة مصطنعة، والشهور الإحدى عشرة التالية تُظهر أرباحاً مضخمة لأنها بلا مصروف إيجار.`,`**الخطأ الثاني**: تسجيل الدفعة المقدمة من العميل إيراداً. الإيراد يتحقق عند **نقل السيطرة على البضاعة** للعميل، لا عند استلام النقدية. ولو أُلغيت الطلبية لوجب رد المبلغ، وهذا دليل على أنه التزام.`,`**الخطأ الثالث**: الظن أن «مدين» تعني أن الحساب «مديون» أو أنها شيء سيئ. المدين مجرد الجانب الأيمن، والنقدية نفسها رصيدها مدين.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`افصل دائماً بين **توقيت النقدية** و**توقيت الاستفادة أو الأداء**. النقدية تجيب عن سؤال «متى دفعنا أو قبضنا؟»، أما المصروف والإيراد فيجيبان عن سؤال «متى استفدنا أو أدّينا؟».`}]},quiz:{questions:[{id:`p1e4-q1`,question:`إذا كانت أصول الشركة 302,200,000 ج.م والتزاماتها 4,500,000 ج.م، فكم حقوق الملكية؟`,options:[{text:`306,700,000 ج.م`,explanation:`جمعت بدلاً من أن تطرح. حقوق الملكية = الأصول − الالتزامات.`},{text:`297,700,000 ج.م`,correct:!0,explanation:`صحيح. 302,200,000 − 4,500,000.`},{text:`300,000,000 ج.م`,explanation:`هذا رأس المال فقط، وحقوق الملكية تأثرت بالمصروفات وتكاليف الإصدار.`},{text:`4,500,000 ج.م`,explanation:`هذه الالتزامات.`}]},{id:`p1e4-q2`,question:`دفعت الشركة إيجار 12 شهراً مقدماً بمبلغ 1,800,000 ج.م في 1 أبريل. ما الطرف المدين؟`,options:[{text:`مصروف إيجار 1,800,000`,explanation:`الشركة لم تستفد بعد إلا من جزء صغير؛ الباقي حق مستقبلي.`},{text:`مصروفات مدفوعة مقدماً 1,800,000`,correct:!0,explanation:`صحيح. أصل يُحوَّل إلى مصروف شهرياً بقيد تسوية (الحلقة 6).`},{text:`البنك 1,800,000`,explanation:`البنك نقص، فهو الطرف الدائن.`},{text:`مصروفات مستحقة 1,800,000`,explanation:`المصروفات المستحقة لما لم يُدفع بعد، وهنا دفعنا مقدماً.`}]},{id:`p1e4-q3`,question:`أي الحسابات التالية رصيده الطبيعي دائن؟`,options:[{text:`مخزون إنتاج تام`,explanation:`أصل، رصيده الطبيعي مدين.`},{text:`مصروف إيجار`,explanation:`مصروف، رصيده الطبيعي مدين.`},{text:`دفعات مقدمة من العملاء`,correct:!0,explanation:`صحيح. التزام، رصيده الطبيعي دائن.`},{text:`الخزينة`,explanation:`أصل، رصيده الطبيعي مدين.`}]},{id:`p1e4-q4`,question:`لماذا تزيد المصروفات بالمدين؟`,options:[{text:`لأنها تقلل حقوق الملكية، وحقوق الملكية تنقص بالمدين`,correct:!0,explanation:`صحيح. هذا هو المنطق المشتق من المعادلة الموسعة.`},{text:`لأن الشركة مديونة بها`,explanation:`«مدين» اصطلاح لجانب الحساب، لا يعني وجود دين.`},{text:`اتفاق عشوائي بين المحاسبين`,explanation:`القاعدة لها منطق مشتق من المعادلة.`},{text:`لأنها أصول`,explanation:`المصروفات ليست أصولاً؛ هي موارد استُهلكت.`}]},{id:`p1e4-q5`,question:`اشترت الشركة بضاعة بـ6 ملايين على الحساب. ما أثرها على المعادلة؟`,options:[{text:`أصول +6 مليون، حقوق ملكية +6 مليون`,explanation:`الشراء الآجل لا يغيّر حقوق الملكية؛ المصدر هنا دائن.`},{text:`أصول +6 مليون، التزامات +6 مليون`,correct:!0,explanation:`صحيح. مخزون زاد، وموردون زادوا.`},{text:`أصول −6 مليون، التزامات +6 مليون`,explanation:`المعادلة لن تتوازن بهذا الشكل.`},{text:`لا أثر حتى يتم السداد`,explanation:`البضاعة استُلمت والالتزام نشأ، فلا بد من قيد.`}]},{id:`p1e4-q6`,question:`استلمت الشركة مليون جنيه دفعة مقدمة من عميل عن بضاعة ستُسلَّم بعد أسبوع. ما الأثر على قائمة الدخل اليوم؟`,options:[{text:`إيراد مليون جنيه`,explanation:`لم يُنقل للعميل شيء بعد، فلا إيراد.`},{text:`لا أثر؛ يُسجَّل التزام عقد`,correct:!0,explanation:`صحيح. الإيراد يُعترف به عند التسليم (المعيار 48).`},{text:`مصروف مليون جنيه`,explanation:`لم تُستهلك أي موارد.`},{text:`ربح بنصف المبلغ`,explanation:`لا توجد قاعدة كهذه.`}]}],exercises:[{id:`p1e4-x1`,date:`2026-04-08`,prompt:`سجّل قيد استلام **دفعة مقدمة 1,000,000 ج.م** بتحويل بنكي من سلسلة هايبر المحروسة عن طلبية لم تُسلَّم بعد.`,solution:[{account:`1250`,debit:1e6},{account:`2202`,credit:1e6}],hints:[`البضاعة لم تُسلَّم ← لا إيراد.`,`على الشركة التزام بالتسليم.`],explanation:`البنك مدين، ودفعات مقدمة من العملاء (التزام عقد) دائن.`},{id:`p1e4-x2`,date:`2026-04-03`,prompt:`سجّل قيد شراء منتجات تامة من المصنع المتعاقد بقيمة **6,000,000 ج.م** على الحساب.`,solution:[{account:`1203`,debit:6e6},{account:`2201`,credit:6e6}],hints:[`الشراء آجل.`,`المنتجات تامة وجاهزة للبيع.`],explanation:`مخزون إنتاج تام مدين (أصل زاد)، والموردون دائن (التزام زاد).`}]},takeaways:[`الأصول = الالتزامات + حقوق الملكية، دائماً.`,`الأصول والمصروفات تزيد بالمدين؛ الالتزامات وحقوق الملكية والإيرادات تزيد بالدائن.`,`النقدية المدفوعة مقدماً أصل، والنقدية المقبوضة مقدماً التزام.`,`رصيد البنك في 10 أبريل: 227,850,000 ج.م.`]},te={id:`p1e5`,part:1,number:5,title:`دليل الحسابات وأول شهر تشغيل`,subtitle:`كيف ننظّم مئات الحسابات بأكواد؟ وأول مبيعات للشركة`,period:`11 - 30 أبريل 2026`,minutes:30,objectives:[`أن تفهم وظيفة دليل الحسابات ومنطق ترميزه`,`أن تستخدم أكواد الحسابات في تسجيل القيود`,`أن تسجّل عملية بيع آجل مع تكلفة المبيعات وفق نظام الجرد المستمر`,`أن تسجّل قيداً مركباً (أكثر من طرفين)`],situation:[`مع بدء المبيعات زادت العمليات اليومية. اقترح أحمد أن يكتب كل محاسب اسم الحساب كما يحلو له: «البنك الأهلي»، «حساب البنك»، «بنك»... فاعترضت الأستاذة منى: «بهذه الطريقة لن نستطيع تجميع أي حساب. نحتاج **دليل حسابات** موحداً بأكواد ثابتة، يستخدمه الجميع ويستخدمه نظام الـERP.»`,`واعتمدت الإدارة المالية الدليل الذي تجده في شاشة «دفاتر الشركة». ثم توالت عمليات بقية أبريل:`,{type:`table`,headers:[`التاريخ`,`العملية`],rows:[[`12 أبريل`,`بيع منتجات لموزعين في الدلتا والصعيد بقيمة 4,500,000 ج.م آجلاً (30 يوماً). تكلفة هذه المنتجات 3,000,000 ج.م`],[`15 أبريل`,`تسليم طلبية هايبر المحروسة بقيمة 1,500,000 ج.م: خُصمت الدفعة المقدمة 1,000,000 والباقي آجل. التكلفة 1,000,000 ج.م`],[`20 أبريل`,`تحصيل 3,000,000 ج.م من الموزعين بتحويل بنكي`],[`25 أبريل`,`شراء دفعة ثانية من المنتجات بقيمة 2,000,000 ج.م آجلاً`],[`28 أبريل`,`صرف مرتبات أبريل لموظفي المقر الإداري (60 موظفاً) بإجمالي 1,350,000 ج.م`],[`29 أبريل`,`سداد حملة إعلانية على مواقع التواصل 400,000 ج.م`],[`30 أبريل`,`مصروفات نثرية مسددة من العهدة النقدية (ضيافة، أدوات مكتبية، انتقالات) 85,000 ج.م`]]}],explanation:[{type:`heading`,text:`ما دليل الحسابات؟`},`**{{term:chart-of-accounts|دليل الحسابات}}** قائمة منظمة بكل الحسابات التي تستخدمها الشركة، لكل حساب **كود ثابت** واسم ونوع. وهو الأساس الذي تُبنى عليه الدفاتر والقوائم المالية والتقارير الإدارية، وأي نظام محاسبي إلكتروني.`,{type:`heading`,text:`منطق الترميز في شركة النيل`},{type:`table`,headers:[`الرقم الأول`,`المجموعة`,`مثال`],rows:[[`1`,`الأصول (11 غير متداولة، 12 متداولة)`,`1101 أراضي، 1250 البنك`],[`2`,`الالتزامات (21 غير متداولة، 22 متداولة)`,`2201 الموردون`],[`3`,`حقوق الملكية`,`3101 رأس المال`],[`4`,`الإيرادات`,`4101 إيرادات المبيعات`],[`5`,`المصروفات (51 تكلفة مبيعات، 52 إدارية، 53 بيع وتوزيع)`,`5204 مرتبات إدارية`]]},`فبمجرد رؤية الكود **5301** تعرف أنه مصروف (5)، من مصروفات البيع والتوزيع (53). وهذا يسهّل إعداد القوائم: كل الحسابات التي تبدأ بـ12 تُجمع تحت «الأصول المتداولة»، وهكذا.`,`ومن قواعد التصميم الجيد: ترك فراغات في الترقيم لإضافة حسابات مستقبلاً، وعدم تكرار الحساب نفسه باسمين، وفتح **{{term:subsidiary-ledger|حسابات مساعدة}}** للتفاصيل (كل عميل أو مورد على حدة) تحت حساب إجمالي واحد في دليل الحسابات.`,{type:`callout`,tone:`info`,title:`والنظام المحاسبي الموحد؟`,text:`في مصر يوجد **{{term:unified-accounting-system|النظام المحاسبي الموحد}}** الذي طُبق تاريخياً على شركات القطاع العام وله ترميز مختلف (مثل تصنيف المصروفات «استخدامات» والإيرادات «موارد»). الشركات الخاصة المقيدة غير ملزمة به وتصمم دليلها بما يناسب المعايير وطبيعة نشاطها {{review:V08}}.`},{type:`heading`,text:`قيد البيع: قيدان لا قيد واحد`},`تستخدم شركة النيل **{{term:perpetual-inventory|نظام الجرد المستمر}}**: المخزون يُحدَّث مع كل عملية. لذلك عند كل بيع نسجّل:`,{type:`list`,ordered:!0,items:[`**قيد الإيراد** بسعر البيع: من حـ/ العملاء إلى حـ/ إيرادات المبيعات.`,`**قيد التكلفة** بسعر التكلفة: من حـ/ {{term:cost-of-sales|تكلفة المبيعات}} إلى حـ/ مخزون إنتاج تام.`]},`الفرق بينهما هو **{{term:gross-profit|مجمل الربح}}**: 4,500,000 − 3,000,000 = 1,500,000 ج.م في عملية 12 أبريل.`,`والإيراد هنا يُعترف به عند **تسليم البضاعة** للموزع، لأن السيطرة عليها انتقلت إليه، حتى لو لم يدفع بعد. وهذا أساس الاستحقاق مرة أخرى.`,{type:`heading`,text:`القيد المركب`},`في 15 أبريل حصلنا على مقابل البيع من مصدرين: جزء سبق قبضه (الدفعة المقدمة) وجزء آجل. فيكون القيد **{{term:compound-entry|قيداً مركباً}}** بطرفين مدينين وطرف دائن واحد. المهم دائماً: مجموع المدين = مجموع الدائن.`],rule:{refs:[{id:`eas:48`,title:`معيار المحاسبة المصري رقم (48): الإيراد من العقود مع العملاء`,counterpart:`IFRS 15 (الفقرات 31 و38)`,text:`تعترف المنشأة بالإيراد عندما تفي بالتزام الأداء بنقل السلعة إلى العميل، وتنتقل السلعة عندما يحصل العميل على السيطرة عليها. ومن مؤشرات انتقال السيطرة: الحيازة المادية، وانتقال المخاطر والمنافع، وقبول العميل للأصل. (سنتعمق في نموذج الخطوات الخمس في الجزء الثالث.)`},{id:`eas:2`,title:`معيار المحاسبة المصري رقم (2): المخزون`,counterpart:`IAS 2 Inventories (الفقرة 34)`,text:`عند بيع المخزون، يُعترف بقيمته الدفترية مصروفاً في الفترة التي يُعترف فيها بالإيراد المرتبط به.`},{id:`eas:1`,title:`معيار المحاسبة المصري رقم (1): عرض القوائم المالية`,counterpart:`IAS 1 Presentation of Financial Statements`,text:`يحدد الحد الأدنى من البنود التي تُعرض في قائمة المركز المالي وقائمة الدخل، والتمييز بين المتداول وغير المتداول. ودليل الحسابات يُصمَّم بحيث يخدم هذا العرض.`}]},application:{intro:[`لاحظ استخدام **الأكواد** في الجدول، واقتران كل قيد بيع بقيد تكلفة.`],entries:[{id:`p1e5-j1`,date:`2026-04-12`,description:`بيع منتجات آجلاً لموزعي الدلتا والصعيد (فاتورة رقم 0001)`,lines:[{account:`1210`,debit:45e5},{account:`4101`,credit:45e5}],steps:[`البضاعة سُلّمت ← الإيراد تحقق`,`العملاء (أصل يزيد ← مدين)`,`إيرادات المبيعات (إيراد يزيد ← دائن)`]},{id:`p1e5-j2`,date:`2026-04-12`,description:`إثبات تكلفة المنتجات المبيعة بالفاتورة 0001`,lines:[{account:`5101`,debit:3e6},{account:`1203`,credit:3e6}],steps:[`المخزون خرج ← ينقص (دائن)`,`تكلفة المبيعات (مصروف يزيد ← مدين)`,`مجمل الربح = 4,500,000 − 3,000,000 = 1,500,000`]},{id:`p1e5-j3`,date:`2026-04-15`,description:`تسليم طلبية هايبر المحروسة (فاتورة 0002) وخصم الدفعة المقدمة`,lines:[{account:`2202`,debit:1e6},{account:`1210`,debit:5e5},{account:`4101`,credit:15e5}],steps:[`الإيراد = قيمة الطلبية كاملة 1,500,000`,`التزام العقد (الدفعة المقدمة) انقضى بالتسليم ← مدين 1,000,000`,`الباقي 500,000 حق على العميل ← العملاء مدين`,`قيد مركب: 1,000,000 + 500,000 = 1,500,000`]},{id:`p1e5-j4`,date:`2026-04-15`,description:`إثبات تكلفة المنتجات المبيعة بالفاتورة 0002`,lines:[{account:`5101`,debit:1e6},{account:`1203`,credit:1e6}]},{id:`p1e5-j5`,date:`2026-04-20`,description:`تحصيل من الموزعين بتحويلات بنكية`,lines:[{account:`1250`,debit:3e6},{account:`1210`,credit:3e6}],steps:[`التحصيل ليس إيراداً جديداً؛ الإيراد سُجّل يوم البيع`,`البنك يزيد، والعملاء ينقصون`]},{id:`p1e5-j6`,date:`2026-04-25`,description:`شراء دفعة ثانية من المنتجات التامة من المصنع المتعاقد آجلاً`,lines:[{account:`1203`,debit:2e6},{account:`2201`,credit:2e6}]},{id:`p1e5-j7`,date:`2026-04-28`,description:`صرف مرتبات أبريل لموظفي المقر الإداري (60 موظفاً)`,lines:[{account:`5204`,debit:135e4},{account:`1250`,credit:135e4}],steps:[`متوسط المرتب = 1,350,000 ÷ 60 = 22,500 ج.م`,`للتبسيط سجلنا الإجمالي؛ استقطاع الضريبة والتأمينات في الجزء الرابع`]},{id:`p1e5-j8`,date:`2026-04-29`,description:`سداد تكلفة حملة إعلانية على مواقع التواصل الاجتماعي`,lines:[{account:`5301`,debit:4e5},{account:`1250`,credit:4e5}],steps:[`الإعلان مصروف بيع وتسويق (كود 53xx)`,`لا يُرسمل حتى لو كان أثره ممتداً`]},{id:`p1e5-j9`,date:`2026-04-30`,description:`مصروفات نثرية من العهدة النقدية (ضيافة، أدوات مكتبية، انتقالات)`,lines:[{account:`5209`,debit:85e3},{account:`1251`,credit:85e3}],steps:[`الصرف من الخزينة لا البنك`,`رصيد العهدة = 200,000 − 85,000 = 115,000`]}],outro:[{type:`table`,caption:`ملخص مبيعات أبريل`,headers:[`البيان`,`المبلغ (ج.م)`],rows:[[`إيرادات المبيعات`,`6,000,000`],[`تكلفة المبيعات`,`(4,000,000)`],[`مجمل الربح`,`2,000,000`],[`نسبة مجمل الربح`,`33.3%`]]},{type:`callout`,tone:`success`,title:`رصيد البنك في 30 أبريل (قبل التسويات)`,text:`227,850,000 + 3,000,000 − 1,350,000 − 400,000 = **229,100,000 ج.م**`}]},mistake:{title:`نسيان قيد التكلفة، أو تسجيل الإيراد عند التحصيل`,blocks:[`**الخطأ الأول**: تسجيل قيد البيع فقط ونسيان قيد التكلفة. النتيجة: المخزون في الدفاتر 8 ملايين بينما الموجود فعلاً 4 ملايين، ومجمل الربح يظهر 6 ملايين بدلاً من 2. خطأ مزدوج في المركز المالي وقائمة الدخل.`,`**الخطأ الثاني**: انتظار التحصيل لتسجيل الإيراد (الأساس النقدي). يوم 20 أبريل حصّلنا 3 ملايين، لكن هذا ليس إيراداً جديداً؛ فقد سُجّل الإيراد يوم 12 أبريل عند التسليم.`,`**الخطأ الثالث**: فتح حساب جديد في دليل الحسابات لكل عميل. الصواب: حساب «العملاء» واحد في الدليل، وتفاصيل كل عميل في حسابات مساعدة.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`كل فاتورة بيع في نظام الجرد المستمر = **قيدان**. واجعل في نظامك قاعدة: لا يُغلق قيد بيع دون قيد تكلفة مرتبط به.`}]},quiz:{questions:[{id:`p1e5-q1`,question:`الكود 5301 في دليل حسابات شركة النيل يدل على:`,options:[{text:`أصل متداول`,explanation:`الأصول المتداولة تبدأ بـ12.`},{text:`مصروف بيع وتوزيع`,correct:!0,explanation:`صحيح. 5 = مصروفات، 53 = بيع وتوزيع.`},{text:`إيراد`,explanation:`الإيرادات تبدأ بـ4.`},{text:`التزام متداول`,explanation:`الالتزامات المتداولة تبدأ بـ22.`}]},{id:`p1e5-q2`,question:`باعت الشركة بضاعة تكلفتها 3 ملايين بسعر 4.5 مليون آجلاً. كم قيداً نسجل في نظام الجرد المستمر؟`,options:[{text:`قيد واحد بالإيراد`,explanation:`ينقص قيد التكلفة؛ المخزون سيظل مضخماً.`},{text:`قيدان: الإيراد والتكلفة`,correct:!0,explanation:`صحيح.`},{text:`لا قيود حتى التحصيل`,explanation:`الإيراد يتحقق عند التسليم لا عند التحصيل.`},{text:`قيد واحد بمجمل الربح 1.5 مليون`,explanation:`يجب إظهار الإيراد والتكلفة كلٌّ بإجماليه.`}]},{id:`p1e5-q3`,question:`حصّلت الشركة 3 ملايين من الموزعين عن مبيعات سابقة. ما أثر ذلك على إيرادات المبيعات؟`,options:[{text:`تزيد 3 ملايين`,explanation:`الإيراد سُجّل يوم البيع؛ التحصيل لا يكرره.`},{text:`لا أثر`,correct:!0,explanation:`صحيح. يزيد البنك وينقص رصيد العملاء فقط.`},{text:`تنقص 3 ملايين`,explanation:`التحصيل لا يقلل الإيراد.`},{text:`تزيد بمجمل الربح فقط`,explanation:`لا علاقة للتحصيل بمجمل الربح.`}]},{id:`p1e5-q4`,question:`ما الهيكل الأفضل لمتابعة أرصدة 40 موزعاً؟`,options:[{text:`40 حساباً مستقلاً في دليل الحسابات الرئيسي`,explanation:`يضخّم الدليل ويصعّب إعداد القوائم.`},{text:`حساب «العملاء» واحد في الدليل مع حسابات مساعدة لكل موزع`,correct:!0,explanation:`صحيح. والمجموع في الحسابات المساعدة يساوي رصيد الحساب الإجمالي.`},{text:`تسجيل الموزعين في دفتر خارجي دون ربط بالدفاتر`,explanation:`يفقد الرقابة ويصعب المطابقة.`},{text:`ضمهم جميعاً لحساب «مدينون متنوعون»`,explanation:`المدينون المتنوعون لغير العملاء التجاريين.`}]},{id:`p1e5-q5`,question:`متى يُعترف بإيراد بيع المنتجات للموزع وفق المعيار 48؟`,options:[{text:`عند توقيع أمر الشراء`,explanation:`الأمر وحده لا ينقل السيطرة على البضاعة.`},{text:`عند انتقال السيطرة على البضاعة للموزع (عادة عند التسليم)`,correct:!0,explanation:`صحيح.`},{text:`عند تحصيل الثمن`,explanation:`هذا الأساس النقدي، ولا تقبله المعايير.`},{text:`في نهاية السنة المالية`,explanation:`الإيراد يُعترف به عند الوفاء بالتزام الأداء، لا في موعد ثابت.`}]}],exercises:[{id:`p1e5-x1`,date:`2026-04-15`,prompt:`سلّمت الشركة طلبية لهايبر المحروسة قيمتها **1,500,000 ج.م**. كان العميل قد دفع مقدماً **1,000,000 ج.م** والباقي آجل. سجّل **قيد الإيراد** فقط (قيد مركب).`,solution:[{account:`2202`,debit:1e6},{account:`1210`,debit:5e5},{account:`4101`,credit:15e5}],hints:[`الإيراد بالقيمة الكاملة للطلبية.`,`الدفعة المقدمة كانت التزاماً، والآن انقضى.`,`الباقي حق على العميل.`],explanation:`قيد مركب: طرفان مدينان (التزام العقد 1,000,000 والعملاء 500,000) وطرف دائن (المبيعات 1,500,000).`},{id:`p1e5-x2`,date:`2026-04-12`,prompt:`سجّل **قيد التكلفة** لمبيعات 12 أبريل للموزعين، علماً بأن تكلفة المنتجات المبيعة **3,000,000 ج.م**.`,solution:[{account:`5101`,debit:3e6},{account:`1203`,credit:3e6}],hints:[`المخزون خرج من الشركة.`,`التكلفة تقابل الإيراد في الفترة نفسها.`],explanation:`تكلفة المبيعات مدين، ومخزون الإنتاج التام دائن.`}]},takeaways:[`دليل الحسابات بأكواده هو لغة الشركة المشتركة؛ الرقم الأول يحدد نوع الحساب.`,`كل بيع في الجرد المستمر = قيد إيراد + قيد تكلفة.`,`الإيراد يتحقق عند التسليم، والتحصيل مجرد تحويل من العملاء إلى البنك.`,`مبيعات أبريل 6,000,000 ومجمل الربح 2,000,000 ج.م.`]},ne={id:`p1e6`,part:1,number:6,title:`الدورة المحاسبية: إقفال أول شهر`,subtitle:`من المستند إلى القوائم المالية: الترحيل، وميزان المراجعة، وقيود التسوية`,period:`30 أبريل 2026`,minutes:35,objectives:[`أن تعدد خطوات الدورة المحاسبية بالترتيب`,`أن تفهم الترحيل إلى دفتر الأستاذ وإعداد ميزان المراجعة`,`أن تسجّل قيود التسوية للمصروفات المدفوعة مقدماً والمستحقة`,`أن تعرف ما يكشفه ميزان المراجعة وما لا يكشفه`,`أن تقرأ أول قائمة مركز مالي وقائمة دخل للشركة`],situation:[`يوم 30 أبريل 2026 طلب مجلس الإدارة أول **تقرير مالي شهري**: قائمة مركز مالي وقائمة دخل عن الفترة من التأسيس حتى نهاية أبريل.`,`أعدّت الأستاذة منى ميزان المراجعة من الدفاتر فوجدته متوازناً: 311,500,000 ج.م في كلٍّ من المدين والدائن. لكنها قالت لأحمد: «التوازن لا يعني أن الأرقام صحيحة. هناك أمور حدثت ولم تُسجَّل بعد.» ثم كتبت ثلاث ملاحظات:`,{type:`list`,ordered:!0,items:[`دفعنا إيجار 12 شهراً في 1 أبريل، وانقضى منها شهر كامل.`,`فاتورة كهرباء ومياه المقر عن أبريل تقدَّر بـ45,000 ج.م، ولن تصل إلا في مايو.`,`مراقب الحسابات يعمل على مراجعة سنة 2026 بأتعاب 1,200,000 ج.م. ما يخص الفترة من يناير إلى أبريل (4 أشهر) لم يُسجَّل بعد.`]}],explanation:[{type:`heading`,text:`الدورة المحاسبية`},`**{{term:accounting-cycle|الدورة المحاسبية}}** هي سلسلة الخطوات التي تتكرر كل فترة لتحويل العمليات إلى قوائم مالية:`,{type:`list`,ordered:!0,items:[`**تحليل المستندات**: فواتير، وعقود، وإشعارات بنك. كل قيد يجب أن يستند إلى مستند.`,`**التسجيل في {{term:general-journal|دفتر اليومية}}**: القيود بالترتيب الزمني (فعلناها في الحلقات 1-5).`,`**الترحيل إلى {{term:general-ledger|دفتر الأستاذ}}**: نقل كل سطر من القيد إلى صفحة حسابه، فنعرف رصيد كل حساب.`,`**{{term:trial-balance|ميزان المراجعة}} قبل التسوية**: قائمة بأرصدة كل الحسابات للتأكد من تساوي المدين والدائن.`,`**{{term:adjusting-entries|قيود التسوية}}**: تسجيل ما يخص الفترة ولم يُسجَّل بعد، وتصحيح ما سُجّل بغير مكانه.`,`**ميزان المراجعة بعد التسوية**.`,`**إعداد {{term:financial-statements|القوائم المالية}}**.`,`**{{term:closing-entries|قيود الإقفال}}** في نهاية السنة المالية: تصفير حسابات الإيرادات والمصروفات ونقل صافيها إلى الأرباح المرحلة.`,`**ميزان المراجعة بعد الإقفال**: لا يحتوي إلا على حسابات المركز المالي.`]},{type:`heading`,text:`لماذا نحتاج إلى قيود التسوية؟`},`القيود اليومية تُسجَّل عادة عند **حركة النقدية أو وصول المستند**. لكن أساس الاستحقاق يطلب أن يظهر المصروف في **الفترة التي استفدنا فيها**، والإيراد في **الفترة التي أدّينا فيها**. وقيود التسوية تسد هذه الفجوة. وأشهر أنواعها:`,{type:`table`,headers:[`النوع`,`الموقف`,`قيد التسوية`,`مثالنا`],rows:[[`{{term:prepaid-expense|مصروف مدفوع مقدماً}}`,`دفعنا ثم استفدنا تدريجياً`,`من حـ/ المصروف إلى حـ/ المدفوع مقدماً`,`الإيجار: 150,000 لشهر أبريل`],[`{{term:accrued-expense|مصروف مستحق}}`,`استفدنا ولم ندفع بعد`,`من حـ/ المصروف إلى حـ/ مصروفات مستحقة`,`الكهرباء 45,000 وأتعاب المراجعة 400,000`],[`إيراد مقبوض مقدماً`,`قبضنا ثم أدّينا`,`من حـ/ التزام العقد إلى حـ/ الإيراد`,`سجّلناه مع التسليم في الحلقة 5`],[`إيراد مستحق`,`أدّينا ولم نقبض بعد ولم نُصدر فاتورة`,`من حـ/ إيرادات مستحقة إلى حـ/ الإيراد`,`لا يوجد هذا الشهر`]]},`وفي الجزء الثاني سنضيف أهم قيد تسوية على الإطلاق: **الإهلاك**. لم نحتج إليه بعد، لأن الأرض لا تُهلك والمصنع ما زال تحت الإنشاء.`,{type:`heading`,text:`ما الذي يكشفه ميزان المراجعة؟`},`يكشف الميزان أخطاء **عدم التوازن**: قيد مسجل بطرف واحد، أو رقم مكتوب خطأ في جانب واحد، أو خطأ في جمع رصيد. لكنه **لا يكشف**:`,{type:`list`,items:[`إغفال قيد بالكامل (مثل قيود التسوية التي نسيناها).`,`تسجيل المبلغ الخاطئ في الطرفين معاً.`,`الترحيل إلى حساب خطأ من النوع نفسه (مثلاً مصروف إيجار بدلاً من مصروف كهرباء).`,`عكس الطرفين بالكامل.`,`خطأين يلغي أحدهما الآخر.`]},{type:`heading`,text:`قراءة النتيجة`},`بعد التسوية تظهر **خسارة 2,130,000 ج.م** عن الفترة من يناير إلى أبريل. هل هذا مقلق؟ ليس بالضرورة: فالفترة تضمنت مصروفات غير متكررة (التأسيس 850,000 والقيد في البورصة 550,000 والاستشارات القانونية 300,000)، والمبيعات بدأت منذ أسبوعين فقط. والأهم أن **مجمل الربح 33%**، وهي نسبة صحية لصناعة الأغذية.`,`ولن نسجل قيود الإقفال الآن؛ فهذه قوائم إدارية شهرية والإقفال يكون في 31 ديسمبر (الجزء السادس). لذلك تظهر خسارة الفترة في قائمة المركز المالي بنداً مستقلاً ضمن حقوق الملكية: «صافي ربح (خسارة) الفترة».`],rule:{refs:[{id:`eas:1`,title:`معيار المحاسبة المصري رقم (1): عرض القوائم المالية`,counterpart:`IAS 1 (الفقرات 10 و27 و28)`,text:`المجموعة الكاملة للقوائم المالية تشمل: قائمة المركز المالي، وقائمة الأرباح أو الخسائر والدخل الشامل، وقائمة التغير في حقوق الملكية، وقائمة التدفقات النقدية، والإيضاحات. وتُعد القوائم وفق أساس الاستحقاق المحاسبي، باستثناء قائمة التدفقات النقدية.`},{id:`law:17-1999:art21`,title:`قانون التجارة - المادتان 21 و26`,text:`دفتر اليومية يُقيد فيه يوماً بيوم جميع العمليات المالية، ودفتر الجرد تُقيد فيه صور الميزانيات الختامية. ويُحتفظ بالدفاتر خمس سنوات.`},{id:`eas:framework`,title:`الإطار العام: أساس الاستحقاق`,counterpart:`Conceptual Framework (IASB) - الفصل 1`,text:`يصف أساس الاستحقاق آثار العمليات والأحداث على موارد الشركة والمطالبات عليها في الفترات التي تحدث فيها تلك الآثار، حتى لو حدثت المقبوضات والمدفوعات النقدية في فترة مختلفة.`,review:`V04`}]},application:{intro:[`قيود التسوية في 30 أبريل 2026، ثم قيد إقفال **توضيحي** لا يُرحَّل للدفاتر.`],entries:[{id:`p1e6-j1`,date:`2026-04-30`,description:`تسوية: تحميل إيجار شهر أبريل على المصروفات`,lines:[{account:`5205`,debit:15e4},{account:`1220`,credit:15e4}],steps:[`الإيجار الشهري = 1,800,000 ÷ 12 = 150,000`,`مصروف إيجار (مدين)`,`مصروفات مدفوعة مقدماً تنقص (دائن)`,`الرصيد المتبقي = 1,650,000 يمثل 11 شهراً قادمة`]},{id:`p1e6-j2`,date:`2026-04-30`,description:`تسوية: استحقاق كهرباء ومياه المقر عن أبريل (تقدير)`,lines:[{account:`5206`,debit:45e3},{account:`2203`,credit:45e3}],steps:[`استفدنا من الكهرباء في أبريل`,`الفاتورة لم تصل ← نسجل التزاماً مستحقاً بتقدير معقول`,`عند وصول الفاتورة في مايو نسدد ونقفل الالتزام`]},{id:`p1e6-j3`,date:`2026-04-30`,description:`تسوية: استحقاق أتعاب مراقب الحسابات عن يناير - أبريل`,lines:[{account:`5202`,debit:4e5},{account:`2203`,credit:4e5}],steps:[`الأتعاب السنوية 1,200,000 ÷ 12 × 4 أشهر = 400,000`,`الخدمة تُقدَّم على مدار السنة ← المصروف يُوزع عليها`,`لم يُسدد شيء بعد ← مصروفات مستحقة`]},{id:`p1e6-demo-close`,date:`2026-04-30`,description:`توضيحي فقط: شكل قيد الإقفال لو كان 30 أبريل نهاية السنة المالية`,post:!1,lines:[{account:`4101`,debit:6e6},{account:`3103`,debit:213e4},{account:`5101`,credit:4e6},{account:`5201`,credit:85e4},{account:`5202`,credit:7e5},{account:`5203`,credit:55e4},{account:`5204`,credit:135e4},{account:`5205`,credit:15e4},{account:`5206`,credit:45e3},{account:`5209`,credit:85e3},{account:`5301`,credit:4e5}],steps:[`الإيرادات رصيدها دائن ← نجعلها مدينة لتصفيرها`,`المصروفات رصيدها مدين ← نجعلها دائنة لتصفيرها`,`الفرق (خسارة 2,130,000) يُحمّل على الأرباح المرحلة`,`هذا القيد لا يُرحَّل الآن؛ الإقفال الفعلي في 31 ديسمبر`]}],outro:[{type:`table`,caption:`ميزان المراجعة قبل التسوية وبعدها (مختصر)`,headers:[`البيان`,`قبل التسوية`,`التسويات`,`بعد التسوية`],rows:[[`مصروفات مدفوعة مقدماً`,`1,800,000`,`(150,000)`,`1,650,000`],[`مصروفات مستحقة`,`0`,`445,000`,`445,000`],[`إجمالي المصروفات (شاملة تكلفة المبيعات)`,`7,535,000`,`595,000`,`8,130,000`],[`مجموع ميزان المراجعة`,`311,500,000`,`445,000`,`311,945,000`]]},{type:`callout`,tone:`success`,title:`النتيجة`,text:`صافي خسارة الفترة من التأسيس حتى 30 أبريل 2026 = **2,130,000 ج.م**. إجمالي الأصول = **303,215,000 ج.م**. افتح شاشة «القوائم المالية» لترى القائمتين كاملتين.`}]},mistake:{title:`الاطمئنان إلى أن ميزان المراجعة المتوازن معناه دفاتر صحيحة`,blocks:[`**الخطأ الأول**: إعداد القوائم من ميزان المراجعة قبل التسوية لأنه «متوازن». النتيجة في حالتنا: الخسارة تظهر 1,535,000 بدلاً من 2,130,000 (أقل بـ595,000)، والالتزامات ناقصة 445,000، والأصول مبالغ فيها 150,000.`,`**الخطأ الثاني**: تأجيل تسجيل الكهرباء حتى تصل الفاتورة بحجة «لا يوجد مستند». أساس الاستحقاق يطلب تقديراً معقولاً، والمستند هنا قراءة العداد أو متوسط الاستهلاك.`,`**الخطأ الثالث**: تسجيل قيود الإقفال كل شهر. هذا يصفّر حسابات الإيرادات والمصروفات فتفقد الرصيد التراكمي للسنة، والإقفال يكون مرة واحدة في نهاية السنة المالية.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`قبل أي إقفال شهري اعمل **قائمة مراجعة للتسويات**: ما المدفوع مقدماً الذي انقضى جزء منه؟ ما الخدمات التي استفدنا منها ولم تصل فواتيرها؟ ما الإيرادات المكتسبة ولم تصدر فواتيرها؟`}]},quiz:{questions:[{id:`p1e6-q1`,question:`ما الترتيب الصحيح لخطوات الدورة المحاسبية؟`,options:[{text:`اليومية ← الأستاذ ← ميزان المراجعة ← التسويات ← القوائم المالية`,correct:!0,explanation:`صحيح. ثم قيود الإقفال في نهاية السنة.`},{text:`الأستاذ ← اليومية ← القوائم المالية ← ميزان المراجعة`,explanation:`اليومية هي دفتر القيد الأول، ومنه يُرحَّل إلى الأستاذ.`},{text:`القوائم المالية ← ميزان المراجعة ← اليومية`,explanation:`الترتيب معكوس.`},{text:`اليومية ← القوائم المالية ← التسويات`,explanation:`التسويات يجب أن تسبق إعداد القوائم.`}]},{id:`p1e6-q2`,question:`دُفع إيجار 12 شهراً (1,800,000) في 1 أبريل. ما قيد التسوية في 30 أبريل؟`,options:[{text:`من حـ/ مصروف إيجار إلى حـ/ مصروفات مدفوعة مقدماً 150,000`,correct:!0,explanation:`صحيح. شهر واحد انقضى = 1,800,000 ÷ 12.`},{text:`من حـ/ مصروف إيجار إلى حـ/ البنك 150,000`,explanation:`البنك دُفع منه بالفعل في 1 أبريل؛ لا دفع جديد.`},{text:`من حـ/ مصروفات مدفوعة مقدماً إلى حـ/ مصروف إيجار 1,650,000`,explanation:`المصروف لم يُسجَّل أصلاً بهذا المبلغ؛ سجلنا أصلاً.`},{text:`لا يحتاج تسوية`,explanation:`بدون تسوية تُبالغ الأصول وتنقص مصروفات أبريل.`}]},{id:`p1e6-q3`,question:`أي الأخطاء التالية **لا** يكشفه ميزان المراجعة؟`,options:[{text:`ترحيل الطرف المدين فقط من قيد`,explanation:`هذا يُحدث عدم توازن فيكشفه الميزان.`},{text:`خطأ في جمع رصيد حساب واحد`,explanation:`يُحدث فرقاً في أحد الجانبين، فيُكشف.`},{text:`نسيان قيد تسوية الكهرباء بالكامل`,correct:!0,explanation:`صحيح. غياب الطرفين معاً يُبقي الميزان متوازناً.`},{text:`كتابة 45,000 في المدين و54,000 في الدائن`,explanation:`يُحدث فرقاً 9,000 فيُكشف.`}]},{id:`p1e6-q4`,question:`ما الغرض من قيود الإقفال؟`,options:[{text:`تصحيح أخطاء السنة`,explanation:`تصحيح الأخطاء يكون بقيود تصحيح، لا بقيود الإقفال.`},{text:`تصفير حسابات الإيرادات والمصروفات ونقل صافي الربح أو الخسارة إلى الأرباح المرحلة`,correct:!0,explanation:`صحيح. لتبدأ السنة الجديدة بحسابات نتيجة صفرية.`},{text:`إقفال الحساب البنكي في نهاية السنة`,explanation:`حسابات المركز المالي تستمر أرصدتها للسنة التالية.`},{text:`تسجيل المصروفات المستحقة`,explanation:`هذه قيود تسوية.`}]},{id:`p1e6-q5`,question:`الأتعاب السنوية للمراجع 1,200,000 ج.م. كم يخص الفترة من يناير إلى أبريل؟`,options:[{text:`100,000 ج.م`,explanation:`هذا شهر واحد فقط.`},{text:`300,000 ج.م`,explanation:`هذا ثلاثة أشهر؛ الفترة أربعة.`},{text:`400,000 ج.م`,correct:!0,explanation:`صحيح. 1,200,000 ÷ 12 × 4.`},{text:`1,200,000 ج.م`,explanation:`الأتعاب تخص السنة كلها.`}]}],exercises:[{id:`p1e6-x1`,date:`2026-04-30`,prompt:`سجّل قيد تسوية **إيجار أبريل**، علماً بأن الشركة دفعت في 1 أبريل إيجار 12 شهراً مقدماً بمبلغ **1,800,000 ج.م** وسجلته مصروفات مدفوعة مقدماً.`,solution:[{account:`5205`,debit:15e4},{account:`1220`,credit:15e4}],hints:[`احسب نصيب شهر واحد.`,`الأصل المدفوع مقدماً يتحول تدريجياً إلى مصروف.`],explanation:`1,800,000 ÷ 12 = 150,000: مصروف إيجار مدين، ومصروفات مدفوعة مقدماً دائن.`},{id:`p1e6-x2`,date:`2026-04-30`,prompt:`سجّل **قيداً واحداً** يُثبت المصروفات المستحقة في 30 أبريل: كهرباء ومياه **45,000 ج.م** وأتعاب مراقب الحسابات عن 4 أشهر من أتعاب سنوية **1,200,000 ج.م**.`,solution:[{account:`5206`,debit:45e3},{account:`5202`,debit:4e5},{account:`2203`,credit:445e3}],hints:[`أتعاب 4 أشهر = 1,200,000 ÷ 12 × 4.`,`الالتزام في حساب واحد: مصروفات مستحقة.`],explanation:`قيد مركب: مصروفان مدينان (45,000 + 400,000) ومصروفات مستحقة دائنة 445,000.`}]},takeaways:[`الدورة المحاسبية: مستند ← يومية ← أستاذ ← ميزان ← تسويات ← قوائم ← إقفال سنوي.`,`ميزان المراجعة المتوازن لا يضمن صحة الدفاتر.`,`قيود التسوية تطبّق أساس الاستحقاق: المصروف في فترة الاستفادة.`,`حتى 30 أبريل: إجمالي الأصول 303,215,000 ج.م، وصافي الخسارة 2,130,000 ج.م. هذه الأرصدة هي نقطة بداية الجزء الثاني.`]},re={id:`p2e1`,part:2,number:1,title:`المصنع يكتمل: ما الذي يدخل في تكلفة الأصل؟`,subtitle:`الاعتراف بالأصول الثابتة وقياس تكلفتها، ومشروعات تحت التنفيذ`,period:`مايو - أغسطس 2026`,minutes:30,objectives:[`أن تعرّف الأصول الثابتة وشروط الاعتراف بها`,`أن تحدد عناصر تكلفة الأصل الثابت وما يُستبعد منها`,`أن تجمع تكاليف الإنشاء في مشروعات تحت التنفيذ ثم تحولها إلى الأصول عند الاكتمال`,`أن تميّز بين نفقة تُرسمل ونفقة تُحمَّل مصروفاً`],situation:[`بين مايو وأغسطس 2026 تحول موقع العاشر من رمضان من أرض فضاء إلى مصنع كامل. وكانت الأستاذة منى تتابع كل فاتورة بنفسها، لأن مجلس الإدارة سألها سؤالاً واحداً: **«كم تكلّف المصنع فعلاً؟»**`,{type:`table`,caption:`مدفوعات المشروع من البنك (ج.م)`,headers:[`التاريخ`,`البند`,`المبلغ`],rows:[[`12 مايو`,`رسوم ترخيص البناء ومعاينات الدفاع المدني`,`1,600,000`],[`1 يونيو`,`سعر شراء خط الإنتاج الرئيسي (عصائر وصلصات) من مورد محلي`,`90,000,000`],[`15 يونيو`,`مستخلص المقاول الثاني لمبنى المصنع`,`50,000,000`],[`5 يوليو`,`نقل خط الإنتاج والتأمين عليه حتى الموقع (1,200,000) وتركيبه (2,300,000)`,`3,500,000`],[`31 يوليو`,`أتعاب المكتب الاستشاري للإشراف الهندسي على الإنشاء`,`2,400,000`],[`10 أغسطس`,`تشغيل تجريبي واختبار خط الإنتاج حتى يعمل بالمواصفات`,`1,500,000`],[`15 أغسطس`,`شراء ماكينة تغليف ثانوية وتركيبها`,`6,000,000`],[`20 أغسطس`,`المستخلص الختامي للمقاول`,`10,000,000`],[`25 أغسطس`,`تدريب العمال على الخط الجديد (400,000) وحفل افتتاح المصنع (250,000)`,`650,000`]]},`في 31 أغسطس استلمت الشركة المبنى من المقاول، وأصدر المورد شهادة اكتمال تركيب الخط واختباره. أصبح المصنع **جاهزاً للاستخدام** من 1 سبتمبر 2026.`,`تذكّر أن الشركة كانت قد دفعت للمقاول **دفعة مقدمة 20,000,000 ج.م** في مارس (الجزء الأول، الحلقة 3)، وهي ما زالت في حساب «مشروعات تحت التنفيذ».`],explanation:[{type:`heading`,text:`ما الأصل الثابت؟`},`**{{term:property-plant-equipment|الأصول الثابتة}}** أصول ملموسة تحتفظ بها الشركة لاستخدامها في الإنتاج أو التوريد أو الأغراض الإدارية، ويُتوقع استخدامها **أكثر من فترة مالية واحدة**. مبنى المصنع وخط الإنتاج والسيارات والأثاث أمثلة لها. أما المنتجات التي يصنعها الخط فهي مخزون لا أصول ثابتة.`,`ويُعترف بتكلفة الأصل الثابت إذا كان من المرجح أن تتدفق منه منافع اقتصادية مستقبلية للشركة، وأمكن قياس تكلفته بدرجة يُعتمد عليها.`,{type:`heading`,text:`ماذا تشمل التكلفة؟`},`التكلفة = **سعر الشراء** + **كل تكلفة مباشرة لازمة لوصول الأصل إلى موقعه وجعله صالحاً للتشغيل بالطريقة التي تريدها الإدارة**. ويُسمى إدراج هذه التكاليف في الأصل **{{term:capitalization|الرسملة}}**.`,{type:`table`,headers:[`تُرسمل (جزء من تكلفة الأصل)`,`لا تُرسمل (مصروف)`],rows:[[`سعر الشراء بعد الخصومات التجارية`,`تدريب العاملين على تشغيل الأصل`],[`النقل والتأمين حتى الموقع`,`حفلات الافتتاح والدعاية للمصنع الجديد`],[`التركيب والتجهيز`,`المصروفات الإدارية والعمومية`],[`اختبار الأصل للتأكد من أنه يعمل بالمواصفات`,`خسائر التشغيل الأولى قبل الوصول للطاقة المستهدفة`],[`أتعاب مهنية مباشرة (مهندسون واستشاريون)`,`تكاليف نقل النشاط أو إعادة تنظيمه`],[`رسوم التراخيص اللازمة للبناء`,``]]},`القاعدة الذهنية: **هل كان الأصل سيصبح جاهزاً للتشغيل بدون هذه التكلفة؟** إن كانت الإجابة «لا» فهي غالباً جزء من التكلفة. التدريب يرفع كفاءة الموظفين لا جاهزية الماكينة، والحفل لا يغيّر شيئاً في المبنى.`,{type:`heading`,text:`{{term:projects-under-construction|مشروعات تحت التنفيذ}}`},`أثناء الإنشاء أو التركيب لا يوجد أصل جاهز بعد، فنجمع كل التكاليف في حساب واحد مؤقت: **مشروعات تحت التنفيذ**. هذا الحساب **لا يُهلك**. وعند الاكتمال نحوّل رصيده إلى حسابات الأصول المناسبة (مباني، آلات) بقيد تحويل، ومن تلك اللحظة تبدأ حياة الأصل المحاسبية.`,{type:`table`,caption:`تحليل رصيد مشروعات تحت التنفيذ في 31 أغسطس (ج.م)`,headers:[`البند`,`المبنى`,`الآلات`],rows:[[`دفعة مقدمة للمقاول (مارس)`,`20,000,000`,``],[`رسوم الترخيص والمعاينات`,`1,600,000`,``],[`مستخلصات المقاول`,`60,000,000`,``],[`الإشراف الهندسي`,`2,400,000`,``],[`خط الإنتاج: سعر الشراء`,``,`90,000,000`],[`خط الإنتاج: نقل وتأمين وتركيب`,``,`3,500,000`],[`خط الإنتاج: التشغيل التجريبي`,``,`1,500,000`],[`ماكينة التغليف الثانوية`,``,`6,000,000`],[`**الإجمالي**`,`**84,000,000**`,`**101,000,000**`]]}],rule:{refs:[{id:`eas:10`,title:`معيار المحاسبة المصري رقم (10): الأصول الثابتة وإهلاكاتها`,counterpart:`IAS 16 (الفقرات 6 و7 و16 و17)`,text:`الأصول الثابتة أصول ملموسة يُحتفظ بها للاستخدام في الإنتاج أو التوريد أو الأغراض الإدارية ويُتوقع استخدامها أكثر من فترة. وتشمل تكلفتها سعر الشراء وأي تكاليف مرتبطة مباشرة بوصول الأصل إلى الموقع والحالة اللازمين لتشغيله، ومنها تكاليف التجهيز والنقل والتركيب والاختبار والأتعاب المهنية.`},{id:`eas:10:exclusions`,title:`تكاليف لا تدخل في تكلفة الأصل الثابت`,counterpart:`IAS 16 (الفقرتان 19 و20)`,text:`لا تدخل في تكلفة الأصل: تكاليف افتتاح منشأة جديدة، وتكاليف تقديم منتج أو خدمة جديدة (ومنها الدعاية)، وتكاليف ممارسة النشاط في موقع جديد (ومنها تدريب العاملين)، والمصروفات الإدارية والعمومية. ويتوقف الاعتراف بالتكاليف في القيمة الدفترية للأصل عندما يصبح في الموقع والحالة اللازمين لتشغيله.`}]},application:{intro:[`كل المدفوعات تمر أولاً على «مشروعات تحت التنفيذ» ما عدا التدريب والافتتاح. ثم قيد تحويل واحد في 31 أغسطس.`],entries:[{id:`p2e1-j1`,date:`2026-05-12`,description:`سداد رسوم ترخيص البناء ومعاينات الدفاع المدني لمبنى المصنع`,lines:[{account:`1190`,debit:16e5},{account:`1250`,credit:16e5}],steps:[`رسوم لازمة قانوناً لإقامة المبنى ← جزء من تكلفته`,`المبنى لم يكتمل ← مشروعات تحت التنفيذ`]},{id:`p2e1-j2`,date:`2026-06-01`,description:`سداد سعر شراء خط الإنتاج الرئيسي (قبل التركيب)`,lines:[{account:`1190`,debit:9e7},{account:`1250`,credit:9e7}],steps:[`الخط لم يُركَّب ولم يُختبر ← غير جاهز للاستخدام`,`يُسجَّل في مشروعات تحت التنفيذ حتى يكتمل تجهيزه`]},{id:`p2e1-j3`,date:`2026-06-15`,description:`سداد المستخلص الثاني لمقاول مبنى المصنع`,lines:[{account:`1190`,debit:5e7},{account:`1250`,credit:5e7}]},{id:`p2e1-j4`,date:`2026-07-05`,description:`نقل خط الإنتاج والتأمين عليه حتى الموقع (1,200,000) وتركيبه (2,300,000)`,lines:[{account:`1190`,debit:35e5},{account:`1250`,credit:35e5}],steps:[`تكاليف لازمة لوصول الأصل لموقعه وتركيبه ← تُرسمل`]},{id:`p2e1-j5`,date:`2026-07-31`,description:`أتعاب الإشراف الهندسي على إنشاء مبنى المصنع`,lines:[{account:`1190`,debit:24e5},{account:`1250`,credit:24e5}],steps:[`أتعاب مهنية مرتبطة مباشرة بإنشاء الأصل ← تُرسمل`]},{id:`p2e1-j6`,date:`2026-08-10`,description:`تكاليف التشغيل التجريبي واختبار خط الإنتاج`,lines:[{account:`1190`,debit:15e5},{account:`1250`,credit:15e5}],steps:[`الاختبار شرط لكي يعمل الخط بالمواصفات ← يُرسمل`]},{id:`p2e1-j7`,date:`2026-08-15`,description:`شراء ماكينة التغليف الثانوية وتركيبها`,lines:[{account:`1190`,debit:6e6},{account:`1250`,credit:6e6}]},{id:`p2e1-j8`,date:`2026-08-20`,description:`سداد المستخلص الختامي لمقاول مبنى المصنع`,lines:[{account:`1190`,debit:1e7},{account:`1250`,credit:1e7}]},{id:`p2e1-j9`,date:`2026-08-25`,description:`تدريب العمال على خط الإنتاج (400,000) وحفل افتتاح المصنع (250,000)`,lines:[{account:`5211`,debit:4e5},{account:`5301`,debit:25e4},{account:`1250`,credit:65e4}],steps:[`التدريب يخص العاملين لا جاهزية الآلة ← مصروف تدريب`,`الافتتاح دعاية ← مصروف تسويق`,`قيد مركب: طرفان مدينان وطرف دائن`]},{id:`p2e1-j10`,date:`2026-08-31`,description:`تحويل مشروعات تحت التنفيذ إلى الأصول الثابتة عند اكتمال المصنع`,lines:[{account:`1102`,debit:84e6},{account:`1103`,debit:101e6},{account:`1190`,credit:185e6}],steps:[`رصيد مشروعات تحت التنفيذ = 20,000,000 + 165,000,000 = 185,000,000`,`المبنى 84,000,000 والآلات 101,000,000 (الخط 95,000,000 + التغليف 6,000,000)`,`يصبح رصيد مشروعات تحت التنفيذ صفراً، ويبدأ الإهلاك من تاريخ الجاهزية`]}],outro:[{type:`callout`,tone:`success`,title:`رصيد البنك في 31 أغسطس`,text:`229,100,000 − 165,000,000 (رسملة) − 650,000 (مصروفات) = **63,450,000 ج.م**. تكلفة المصنع (مبنى وآلات) = **185,000,000 ج.م**، والأرض مسجلة منفصلة بـ46,350,000.`}]},mistake:{title:`رسملة كل ما صُرف على المشروع، أو تحميل تكاليف التركيب على المصروفات`,blocks:[`**الخطأ الأول**: إضافة التدريب وحفل الافتتاح إلى تكلفة الآلات «لأنها جزء من المشروع». المعيار يستبعدها صراحة؛ رسملتها تضخم الأصول وتؤجل المصروف إلى سنوات قادمة عبر الإهلاك.`,`**الخطأ الثاني**: العكس: تحميل النقل والتركيب والاختبار على مصروفات الشهر. هذه تكاليف لازمة لجعل الأصل صالحاً للتشغيل، وتحميلها مصروفاً يُظهر خسارة مصطنعة.`,`**الخطأ الثالث**: تسجيل خط الإنتاج في حساب «آلات» يوم شرائه وبدء إهلاكه قبل تركيبه واختباره. الإهلاك يبدأ عند الجاهزية للاستخدام.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`لكل فاتورة اسأل: **هل هي ضرورية لجعل الأصل في موقعه وصالحاً للتشغيل؟** وإذا كان الأصل لم يكتمل بعد، فمكانها «مشروعات تحت التنفيذ».`}]},quiz:{questions:[{id:`p2e1-q1`,question:`أي من التكاليف التالية **لا** تدخل في تكلفة خط الإنتاج؟`,options:[{text:`تركيب الخط في المصنع`,explanation:`التركيب لازم لجعل الأصل صالحاً للتشغيل، فيُرسمل.`},{text:`اختبار الخط قبل التشغيل`,explanation:`الاختبار لازم للتأكد من عمله بالمواصفات، فيُرسمل.`},{text:`تدريب العمال على تشغيله`,correct:!0,explanation:`صحيح. التدريب مستبعد صراحة في المعيار ويُحمَّل مصروفاً.`},{text:`نقل الخط والتأمين عليه حتى الموقع`,explanation:`تكلفة لازمة لوصول الأصل لموقعه، فتُرسمل.`}]},{id:`p2e1-q2`,question:`دفعت الشركة 90 مليوناً ثمن خط إنتاج في يونيو، ولم يُركب إلا في يوليو. أين يُسجَّل المبلغ في يونيو؟`,options:[{text:`آلات ومعدات`,explanation:`الأصل غير جاهز بعد؛ تسجيله في الآلات قد يؤدي لبدء إهلاكه قبل الأوان.`},{text:`مشروعات تحت التنفيذ`,correct:!0,explanation:`صحيح. يبقى هناك حتى يكتمل تركيبه واختباره.`},{text:`مصروفات مدفوعة مقدماً`,explanation:`هذا الحساب للخدمات التي تُستهلك على فترات، لا لأصول ثابتة.`},{text:`مخزون`,explanation:`الخط لن يُباع؛ سيُستخدم في الإنتاج.`}]},{id:`p2e1-q3`,question:`إذا كان رصيد مشروعات تحت التنفيذ 185 مليوناً عند اكتمال المصنع، فما قيد التحويل؟`,options:[{text:`من حـ/ مشروعات تحت التنفيذ إلى حـ/ المباني والآلات`,explanation:`الاتجاه معكوس؛ الأصول تزيد بالمدين.`},{text:`من مذكورين: حـ/ المباني وحـ/ الآلات إلى حـ/ مشروعات تحت التنفيذ`,correct:!0,explanation:`صحيح. الأصول النهائية مدينة، والحساب المؤقت دائن حتى يصفر.`},{text:`من حـ/ المباني إلى حـ/ البنك`,explanation:`لا توجد مدفوعات جديدة في قيد التحويل.`},{text:`لا قيد؛ يكفي إيضاح`,explanation:`التحويل ضروري لبدء الإهلاك وعرض الأصول في بنودها الصحيحة.`}]},{id:`p2e1-q4`,question:`متى يتوقف إدراج التكاليف في القيمة الدفترية للأصل الثابت؟`,options:[{text:`عند سداد آخر دفعة للمورد`,explanation:`توقيت السداد لا يحدد ذلك.`},{text:`عندما يصبح الأصل في الموقع والحالة اللازمين لتشغيله`,correct:!0,explanation:`صحيح. بعدها تكاليف التشغيل مصروفات أو تكاليف إنتاج.`},{text:`عند بلوغ الطاقة الإنتاجية الكاملة`,explanation:`خسائر التشغيل الأولى قبل الطاقة الكاملة لا تُرسمل.`},{text:`في نهاية السنة ا
