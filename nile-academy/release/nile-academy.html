:`صحيح.`},{text:`يُترك المخزون الدفتري كما هو`,explanation:`يجب أن يعكس المخزون الموجود فعلاً.`},{text:`يُخصم من حقوق الملكية`,explanation:`لا علاقة له بحقوق الملكية مباشرة.`}]}],exercises:[{id:`p3e3-x1`,date:`2026-10-31`,prompt:`10,000 كرتونة تكلفتها **100 ج.م** للكرتونة، وصافي قيمتها البيعية **55 ج.م**. سجّل قيد التخفيض.`,solution:[{account:`5104`,debit:45e4},{account:`1203`,credit:45e4}],hints:[`الفرق للكرتونة × العدد.`],explanation:`خسائر تخفيض المخزون مدين 450,000، ومخزون الإنتاج التام دائن 450,000.`},{id:`p3e3-x2`,date:`2026-10-31`,prompt:`رصيد الخامات الدفتري **1,500,000** والجرد الفعلي **1,450,000**، والعجز غير عادي. سجّل القيد.`,solution:[{account:`5105`,debit:5e4},{account:`1201`,credit:5e4}],hints:[`العجز = الدفتري − الفعلي.`],explanation:`عجز المخزون مدين 50,000، ومخزون الخامات دائن 50,000.`}]},takeaways:[`صيغ التكلفة المسموحة: FIFO والمتوسط المرجح، وLIFO ممنوعة.`,`المخزون بالتكلفة أو صافي القيمة البيعية أيهما أقل، بنداً بنداً.`,`صافي القيمة البيعية = سعر البيع − تكاليف الإتمام والبيع.`,`تخفيض 450,000 وعجز 50,000 ج.م في أكتوبر.`]},ue={id:`p3e4`,part:3,number:4,title:`الإيراد من العقود مع العملاء`,subtitle:`نموذج الخطوات الخمس، والمقابل المتغير: خصومات الكمية وحق الرد`,period:`أكتوبر 2026`,minutes:40,objectives:[`أن تطبق نموذج الخطوات الخمس للاعتراف بالإيراد`,`أن تقدّر المقابل المتغير (خصم الكمية) وتسجّل التزام الرد`,`أن تعالج البيع مع حق الرد: الإيراد والتزام الرد وأصل حق الاسترداد`,`أن تسجّل تكلفة المبيعات بالتكلفة المحسوبة من المصنع`],situation:[`بدأ فريق المبيعات الجديد (20 مندوباً) التعاقد. وكانت عقود أكتوبر كالتالي:`,{type:`table`,headers:[`التاريخ`,`العميل`,`التفاصيل`],rows:[[`15 أكتوبر`,`موزعو الدلتا والصعيد`,`220,000 كرتونة من إنتاج المصنع × 120 ج.م = 26,400,000 آجل 60 يوماً. العقد يمنح **خصم كمية 3%** بأثر رجعي إذا تجاوزت مشتريات الموزع 200,000 كرتونة في الربع الأخير. الإدارة تتوقع بقوة أن يتجاوزوه.`],[`20 أكتوبر`,`سلسلة هايبر المحروسة`,`30,000 كرتونة × 130 ج.م = 3,900,000 آجل. للسلسلة **حق رد** الكميات غير المباعة خلال 60 يوماً. الخبرة السابقة تشير إلى مرتجعات بنسبة 5%.`],[`25 أكتوبر`,`موزع القاهرة الكبرى`,`30,000 كرتونة من منتجات المصنع المتعاقد (السليمة) × 140 ج.م = 4,200,000 آجل، بلا خصومات أو حق رد.`]]},`رأى مدير المبيعات أن الإيراد 34,500,000. لكن الأستاذة منى قالت: «هذا ما ستصدر به الفواتير، لا ما سنعترف به إيراداً.»`],explanation:[{type:`heading`,text:`نموذج الخطوات الخمس`},`تعرفنا في الجزء الأول على قاعدة «الإيراد عند نقل السيطرة». والمعيار يضع لذلك خمس خطوات:`,{type:`list`,ordered:!0,items:[`**تحديد العقد** مع العميل: اتفاق ملزم بحقوق والتزامات واضحة وشروط سداد، ومن المرجح تحصيل المقابل.`,`**تحديد {{term:performance-obligation|التزامات الأداء}}**: كل سلعة أو خدمة مميزة يعد بها العقد. هنا: تسليم الكراتين.`,`**تحديد {{term:transaction-price|سعر المعاملة}}**: المقابل الذي تتوقع الشركة الحصول عليه، **بما فيه المقابل المتغير**.`,`**تخصيص سعر المعاملة** على التزامات الأداء (عقودنا فيها التزام واحد).`,`**الاعتراف بالإيراد** عند الوفاء بالالتزام: عند تسليم البضاعة.`]},{type:`heading`,text:`{{term:variable-consideration|المقابل المتغير}}: خصم الكمية`},`إذا تجاوز الموزعون الحد سيحصلون على خصم 3% على كل مشترياتهم. الشركة **تتوقع** ذلك بقوة، فلا يمكنها اعتبار 26.4 مليوناً إيراداً كاملاً؛ فهي تتوقع أن ترد 3% منها.`,`سعر المعاملة = 26,400,000 × 97% = **25,608,000** إيراد، والفرق **792,000** **{{term:refund-liability|التزام رد}}**. والعميل ما زال مديناً بقيمة الفاتورة كاملة.`,`والقيد المهم: يُدرج المقابل المتغير في سعر المعاملة فقط إلى الحد الذي يكون فيه **من المرجح بدرجة عالية ألا يحدث رد جوهري** للإيراد المعترف به لاحقاً.`,{type:`heading`,text:`البيع مع حق الرد`},`عندما يحق للعميل رد البضاعة، لا تعترف الشركة بإيراد عن الكمية المتوقع ردها. ومع هايبر المحروسة يتوقع رد 5% = 1,500 كرتونة:`,{type:`table`,caption:`مبيعات هايبر المحروسة (ج.م)`,headers:[`البند`,`الحساب`,`المبلغ`],rows:[[`قيمة الفاتورة (العملاء)`,`30,000 × 130`,`3,900,000`],[`الإيراد`,`28,500 × 130`,`3,705,000`],[`التزام رد`,`1,500 × 130`,`195,000`],[`تكلفة المبيعات`,`28,500 × 78.5`,`2,237,250`],[`أصل حق استرداد المنتجات`,`1,500 × 78.5`,`117,750`]]},`**{{term:right-to-recover|أصل حق الاسترداد}}** يمثل حق الشركة في استعادة البضاعة المتوقع ردها، ويُقاس بتكلفتها الدفترية (ناقصاً أي تكاليف متوقعة للاسترداد أو انخفاض في قيمتها).`,{type:`heading`,text:`تكلفة المبيعات`},`منتجات المصنع بتكلفة **78.5** للكرتونة (الحلقة الثانية)، ومنتجات المصنع المتعاقد السليمة بتكلفة **100**.`],rule:{refs:[{id:`eas:48`,title:`معيار المحاسبة المصري رقم (48): الإيراد من العقود مع العملاء`,counterpart:`IFRS 15 (الفقرات 9 و22 و47 و50 و56)`,text:`تعترف المنشأة بالإيراد بتطبيق خمس خطوات: تحديد العقد، وتحديد التزامات الأداء، وتحديد سعر المعاملة، وتخصيصه، والاعتراف بالإيراد عند الوفاء بكل التزام. وإذا تضمن المقابل مبلغاً متغيراً (خصومات، أو حوافز، أو حق رد)، تقدّره المنشأة بالقيمة المتوقعة أو المبلغ الأرجح، وتدرجه فقط إلى الحد الذي يكون معه من المرجح بدرجة عالية ألا يحدث رد جوهري للإيراد المتراكم المعترف به عند زوال عدم التأكد.`},{id:`eas:48:returns`,title:`البيع مع حق الرد`,counterpart:`IFRS 15 (الفقرة B21)`,text:`عند بيع منتجات مع حق الرد، تعترف المنشأة بالإيراد بالمبلغ الذي تتوقع استحقاقه (دون المنتجات المتوقع ردها)، وبالتزام رد، وبأصل (مع تعديل مقابل في تكلفة المبيعات) عن حقها في استرداد المنتجات من العملاء عند تسوية التزام الرد.`}]},application:{entries:[{id:`p3e4-j1`,date:`2026-10-15`,description:`مبيعات آجلة لموزعي الدلتا والصعيد (220,000 كرتونة × 120) مع خصم كمية متوقع 3%`,lines:[{account:`1210`,debit:264e5},{account:`4101`,credit:25608e3},{account:`2208`,credit:792e3}],steps:[`الفاتورة = 26,400,000 (حق على العملاء)`,`الخصم المتوقع 3% = 792,000 ← التزام رد`,`الإيراد = 26,400,000 − 792,000 = 25,608,000`]},{id:`p3e4-j2`,date:`2026-10-15`,description:`تكلفة 220,000 كرتونة مبيعة لموزعي الدلتا والصعيد`,lines:[{account:`5101`,debit:1727e4},{account:`1203`,credit:1727e4}],steps:[`220,000 × 78.5 = 17,270,000`]},{id:`p3e4-j3`,date:`2026-10-20`,description:`مبيعات آجلة لسلسلة هايبر المحروسة مع حق الرد (مرتجعات متوقعة 5%)`,lines:[{account:`1210`,debit:39e5},{account:`4101`,credit:3705e3},{account:`2208`,credit:195e3}],steps:[`الفاتورة 30,000 × 130 = 3,900,000`,`المتوقع رده 1,500 × 130 = 195,000 ← التزام رد`,`الإيراد 3,705,000`]},{id:`p3e4-j4`,date:`2026-10-20`,description:`تكلفة مبيعات هايبر المحروسة وأصل حق استرداد المرتجعات المتوقعة`,lines:[{account:`5101`,debit:2237250},{account:`1270`,debit:117750},{account:`1203`,credit:2355e3}],steps:[`خرج من المخزن 30,000 × 78.5 = 2,355,000`,`المتوقع بيعه نهائياً 28,500 × 78.5 = 2,237,250 ← تكلفة مبيعات`,`المتوقع رده 1,500 × 78.5 = 117,750 ← حق استرداد`]},{id:`p3e4-j5`,date:`2026-10-25`,description:`مبيعات آجلة لموزع القاهرة الكبرى من منتجات المصنع المتعاقد (30,000 × 140)`,lines:[{account:`1210`,debit:42e5},{account:`4101`,credit:42e5}]},{id:`p3e4-j6`,date:`2026-10-25`,description:`تكلفة 30,000 كرتونة من منتجات المصنع المتعاقد`,lines:[{account:`5101`,debit:3e6},{account:`1203`,credit:3e6}],steps:[`30,000 × 100 = 3,000,000`,`يتبقى 10,000 كرتونة قريبة الانتهاء بقيمة 550,000`]}],outro:[{type:`table`,caption:`ملخص مبيعات أكتوبر (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`قيمة الفواتير`,`34,500,000`],[`إيرادات المبيعات المعترف بها`,`33,513,000`],[`التزامات رد (خصومات ومرتجعات)`,`987,000`],[`تكلفة المبيعات (بدون التخفيض والعجز)`,`22,507,250`],[`مخزون الإنتاج التام المتبقي`,`2,120,000`]]}]},mistake:{title:`تسجيل الإيراد بقيمة الفاتورة متجاهلاً الخصومات المتوقعة وحق الرد`,blocks:[`**الخطأ الأول**: الاعتراف بـ34.5 مليون إيراداً ثم تسجيل الخصم عند منحه فعلاً في يناير. هذا يضخم إيراد أكتوبر ويخفض إيراد الربع التالي.`,`**الخطأ الثاني**: تسجيل خصم الكمية المتوقع مصروف بيع. الخصم للعميل تخفيض لسعر المعاملة، فيُخصم من الإيراد.`,`**الخطأ الثالث**: في البيع مع حق الرد، تحميل تكلفة كل الكراتين على تكلفة المبيعات. الجزء المتوقع رده يُسجَّل أصل حق استرداد.`,`**الخطأ الرابع**: تخفيض حساب العملاء بالخصم المتوقع. العميل مدين بكامل الفاتورة حتى يُمنح الخصم؛ والخصم المتوقع التزام رد منفصل.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`قبل تسجيل أي إيراد اقرأ العقد: **هل فيه خصومات أو حوافز أو حق رد؟** إن وُجدت، قدّرها وسجّل الإيراد بالصافي المتوقع، وراجع التقدير في كل فترة.`}]},quiz:{questions:[{id:`p3e4-q1`,question:`ما الخطوة الثالثة في نموذج الإيراد؟`,options:[{text:`تحديد العقد`,explanation:`هذه الخطوة الأولى.`},{text:`تحديد سعر المعاملة`,correct:!0,explanation:`صحيح.`},{text:`الاعتراف بالإيراد`,explanation:`هذه الخطوة الخامسة.`},{text:`تحديد التزامات الأداء`,explanation:`هذه الخطوة الثانية.`}]},{id:`p3e4-q2`,question:`فاتورة 26.4 مليون مع خصم كمية متوقع بقوة 3%. كم الإيراد؟`,options:[{text:`26,400,000`,explanation:`يجب تقدير المقابل المتغير.`},{text:`25,608,000`,correct:!0,explanation:`صحيح. 26,400,000 × 97%.`},{text:`792,000`,explanation:`هذا التزام الرد.`},{text:`صفر حتى نهاية الربع`,explanation:`البضاعة سُلّمت، فالإيراد يُعترف به الآن بالمبلغ المتوقع.`}]},{id:`p3e4-q3`,question:`باعت الشركة 30,000 كرتونة مع حق رد، والمتوقع رد 1,500. تكلفة الكرتونة 78.5. ما أصل حق الاسترداد؟`,options:[{text:`195,000`,explanation:`هذا التزام الرد بسعر البيع.`},{text:`117,750`,correct:!0,explanation:`صحيح. 1,500 × 78.5.`},{text:`2,355,000`,explanation:`هذه تكلفة كل الكراتين.`},{text:`صفر`,explanation:`للشركة حق استعادة المنتجات المردودة.`}]},{id:`p3e4-q4`,question:`أين يُسجَّل خصم الكمية المتوقع للموزعين؟`,options:[{text:`مصروف بيع وتوزيع`,explanation:`الخصم للعميل يخفض سعر المعاملة.`},{text:`تخفيض للإيراد مقابل التزام رد`,correct:!0,explanation:`صحيح.`},{text:`تخفيض لحساب العملاء`,explanation:`العميل مدين بالفاتورة كاملة حتى يُمنح الخصم.`},{text:`لا يُسجَّل حتى يُمنح`,explanation:`يجب تقديره عند الاعتراف بالإيراد.`}]},{id:`p3e4-q5`,question:`متى يُدرج المقابل المتغير في سعر المعاملة؟`,options:[{text:`دائماً بأعلى قيمة ممكنة`,explanation:`هذا يخالف القيد على المقابل المتغير.`},{text:`إلى الحد الذي يكون معه من المرجح بدرجة عالية ألا يحدث رد جوهري للإيراد لاحقاً`,correct:!0,explanation:`صحيح.`},{text:`عند تحصيل النقدية`,explanation:`الإيراد لا يرتبط بالتحصيل.`},{text:`أبداً؛ يُستبعد تماماً`,explanation:`يُدرج بعد تقديره وتطبيق القيد.`}]}],exercises:[{id:`p3e4-x1`,date:`2026-10-15`,prompt:`سجّل قيد بيع آجل بقيمة فاتورة **26,400,000 ج.م** مع خصم كمية متوقع **3%** (قيد الإيراد فقط).`,solution:[{account:`1210`,debit:264e5},{account:`4101`,credit:25608e3},{account:`2208`,credit:792e3}],hints:[`العملاء بالفاتورة كاملة.`,`الخصم المتوقع ← التزامات رد للعملاء.`,`الإيراد = الفاتورة − الخصم.`],explanation:`العملاء 26,400,000 مدين، والمبيعات 25,608,000 دائن، والتزامات الرد 792,000 دائن.`},{id:`p3e4-x2`,date:`2026-10-20`,prompt:`خرجت **30,000** كرتونة تكلفة الواحدة **78.5** لعميل له حق رد، والمتوقع رد **1,500** كرتونة. سجّل قيد التكلفة.`,solution:[{account:`5101`,debit:2237250},{account:`1270`,debit:117750},{account:`1203`,credit:2355e3}],hints:[`المخزون ينقص بكل ما خرج.`,`المتوقع رده ← حق استرداد منتجات.`],explanation:`تكلفة المبيعات 2,237,250، وحق استرداد المنتجات 117,750، والمخزون دائن 2,355,000.`}]},takeaways:[`خمس خطوات: العقد، والتزامات الأداء، وسعر المعاملة، والتخصيص، والاعتراف.`,`المقابل المتغير (خصومات، حق رد) يُقدَّر ويُخصم من الإيراد مقابل التزام رد.`,`في حق الرد: أصل حق استرداد بتكلفة المنتجات المتوقع ردها.`,`إيرادات أكتوبر 33,513,000 ج.م والفواتير 34,500,000.`]},de={id:`p3e5`,part:3,number:5,title:`العملاء والخسائر الائتمانية المتوقعة`,subtitle:`التحصيل، وأعمار الديون، ومصفوفة المخصص، وإعدام الديون`,period:`أكتوبر 2026`,minutes:35,objectives:[`أن تسجّل التحصيل من العملاء`,`أن تشرح نموذج الخسائر الائتمانية المتوقعة ولماذا لا ننتظر وقوع الخسارة`,`أن تطبق المنهج المبسط باستخدام مصفوفة مخصص على أعمار الديون`,`أن تسجّل المخصص وإعدام دين معدوم`],situation:[`في أكتوبر حصّلت الشركة **1,700,000 ج.م** من أرصدة أبريل (هايبر المحروسة 500,000 وموزعو الدلتا 1,200,000)، و**15,000,000 ج.م** من موزعي الدلتا والصعيد عن مبيعات أكتوبر.`,`لكن الـ**300,000 ج.م** الباقية من أبريل مستحقة على «موزع أسيوط»، الذي صدر ضده حكم بإشهار إفلاسه في 27 أكتوبر، وأبلغ المحامي الشركة بأن احتمال تحصيل أي مبلغ من التفليسة ضعيف جداً.`,`طلب مراقب الحسابات من الأستاذة منى «سياسة واضحة للخسائر الائتمانية»، فأعدت مع إدارة الائتمان مصفوفة نسب تعتمد على خبرة الشركة القصيرة وبيانات قطاع توزيع الأغذية، معدلة بتوقعات الاقتصاد للفترة القادمة:`,{type:`table`,caption:`مصفوفة المخصص المعتمدة`,headers:[`عمر الدين`,`نسبة الخسارة المتوقعة`],rows:[[`لم يستحق بعد`,`1%`],[`متأخر 1 - 30 يوماً`,`3%`],[`متأخر 31 - 90 يوماً`,`10%`],[`متأخر 91 - 180 يوماً`,`40%`],[`متأخر أكثر من 180 يوماً أو عميل متعثر`,`100%`]]}],explanation:[{type:`heading`,text:`لماذا مخصص؟`},`رصيد العملاء أصل مالي، ولا يجوز أن يظهر بأكثر مما يُتوقع تحصيله. وحتى العملاء الجيدون لا يدفعون كلهم.`,`النموذج القديم كان ينتظر **وقوع** الخسارة (حدث تعثر) ثم يسجلها، فكانت الخسائر تُسجَّل «متأخرة جداً وقليلة جداً». أما نموذج **{{term:expected-credit-loss|الخسائر الائتمانية المتوقعة}}** فيسجل الخسارة **المتوقعة** من أول يوم، معتمداً على الخبرة السابقة والظروف الحالية والتوقعات المستقبلية.`,{type:`heading`,text:`{{term:simplified-approach|المنهج المبسط}}`},`لأرصدة العملاء التجارية التي لا تتضمن مكون تمويل جوهرياً، يسمح المعيار (بل يُلزم) بقياس المخصص دائماً بقيمة **الخسائر المتوقعة على مدى عمر الدين**. والأداة العملية الشائعة **{{term:provision-matrix|مصفوفة المخصص}}**: نسبة لكل فئة عمر.`,{type:`table`,caption:`حساب المخصص في 31 أكتوبر 2026 (ج.م)`,headers:[`الفئة`,`الرصيد`,`النسبة`,`المخصص`],rows:[[`لم يستحق بعد (مبيعات أكتوبر)`,`19,500,000`,`1%`,`195,000`],[`متأخر 1 - 180 يوماً`,`0`,`—`,`0`],[`موزع أسيوط (متعثر، تقييم فردي)`,`300,000`,`100%`,`300,000`],[`الإجمالي`,`19,800,000`,``,`495,000`]]},`لاحظ أن موزع أسيوط عُومل **فردياً**: لم ننتظر وصوله لفئة «أكثر من 180 يوماً»، لأن هناك دليلاً محدداً على التعثر (حكم الإفلاس).`,`يُسجَّل المخصص في حساب مقابل يُخصم من العملاء، والمصروف **خسائر ائتمانية متوقعة**.`,{type:`heading`,text:`{{term:write-off|الإعدام}}`},`عندما لا يكون لدى الشركة توقع معقول لاسترداد الدين، **تُعدمه**: تخفض رصيد العميل ورصيد المخصص معاً. ولا يظهر مصروف جديد، لأن الخسارة سُجّلت مسبقاً في المخصص. وإذا حُصّل مبلغ لاحقاً من التفليسة يُسجَّل كاسترداد (يخفض مصروف الخسائر الائتمانية).`],rule:{refs:[{id:`eas:47`,title:`معيار المحاسبة المصري رقم (47): الأدوات المالية`,counterpart:`IFRS 9 Financial Instruments (الفقرات 5.5.1 و5.5.15 و5.4.4 و B5.5.35)`,text:`تعترف المنشأة بمخصص خسارة للخسائر الائتمانية المتوقعة على الأصول المالية المقاسة بالتكلفة المستهلكة. وللمدينين التجاريين الذين لا يتضمنون مكون تمويل جوهرياً، يُقاس المخصص دائماً بمبلغ يساوي الخسائر الائتمانية المتوقعة على مدى العمر. ويجوز استخدام وسائل عملية مثل مصفوفة المخصص المبنية على الخبرة التاريخية والمعدلة بالمعلومات المستقبلية. وتُخفض القيمة الدفترية الإجمالية للأصل عندما لا يكون لدى المنشأة توقعات معقولة لاسترداده.`,review:`V12`}]},application:{entries:[{id:`p3e5-j1`,date:`2026-10-12`,description:`تحصيل أرصدة أبريل من هايبر المحروسة (500,000) وموزعي الدلتا (1,200,000)`,lines:[{account:`1250`,debit:17e5},{account:`1210`,credit:17e5}]},{id:`p3e5-j2`,date:`2026-10-28`,description:`تحصيل دفعة من موزعي الدلتا والصعيد عن مبيعات أكتوبر`,lines:[{account:`1250`,debit:15e6},{account:`1210`,credit:15e6}],steps:[`التحصيل لا يغيّر التزام الرد؛ الخصم يُسوّى عند نهاية الربع`]},{id:`p3e5-j3`,date:`2026-10-31`,description:`تكوين مخصص الخسائر الائتمانية المتوقعة وفق مصفوفة المخصص`,lines:[{account:`5230`,debit:495e3},{account:`1219`,credit:495e3}],steps:[`19,500,000 × 1% = 195,000`,`موزع أسيوط 300,000 × 100% = 300,000`,`الإجمالي 495,000 (لم يكن هناك رصيد مخصص سابق)`]},{id:`p3e5-j4`,date:`2026-10-31`,description:`إعدام مديونية موزع أسيوط بعد حكم الإفلاس`,lines:[{account:`1219`,debit:3e5},{account:`1210`,credit:3e5}],steps:[`لا توقع معقول للاسترداد ← إعدام`,`المخصص ينقص والعملاء ينقصون`,`لا مصروف جديد؛ سُجّل في المخصص`]}],outro:[{type:`table`,caption:`العملاء في قائمة المركز المالي 31 أكتوبر (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`العملاء (إجمالي)`,`19,500,000`],[`يُخصم: مخصص الخسائر الائتمانية المتوقعة`,`(195,000)`],[`الصافي`,`19,305,000`]]},{type:`callout`,tone:`success`,title:`رصيد البنك`,text:`40,889,628 + 1,700,000 + 15,000,000 = **57,589,628 ج.م**`}]},mistake:{title:`انتظار الإفلاس لتسجيل الخسارة، أو تسجيل مصروف عند الإعدام مرتين`,blocks:[`**الخطأ الأول**: عدم تكوين أي مخصص على مبيعات أكتوبر «لأن العملاء لم يتأخروا بعد». النموذج الحالي يسجل الخسارة المتوقعة حتى على الأرصدة غير المستحقة.`,`**الخطأ الثاني**: إعدام دين موزع أسيوط بقيد «من حـ/ الخسائر الائتمانية إلى حـ/ العملاء» بعد أن كوّنا له مخصصاً. النتيجة: مصروف مكرر 300,000 ومخصص مبالغ فيه.`,`**الخطأ الثالث**: تطبيق نسبة الفئة العمرية فقط على عميل أُشهر إفلاسه. وجود دليل محدد على التعثر يستلزم تقييماً فردياً.`,`**الخطأ الرابع**: تخفيض حساب العملاء بالمخصص مباشرة. المخصص في حساب مقابل حتى يُعدم الدين فعلاً.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`في كل إقفال: أعمار ديون محدثة ← مصفوفة ← المخصص المطلوب ← قيد بالفرق عن الرصيد القائم. والإعدام دائماً على المخصص.`}]},quiz:{questions:[{id:`p3e5-q1`,question:`ما الفرق الأساسي بين نموذج الخسائر المتوقعة والنموذج القديم؟`,options:[{text:`النموذج المتوقع يسجل الخسارة قبل وقوع حدث التعثر بناءً على التوقعات`,correct:!0,explanation:`صحيح.`},{text:`النموذج المتوقع لا يسجل مخصصاً إطلاقاً`,explanation:`بالعكس، يسجله مبكراً.`},{text:`النموذج المتوقع يسجل الخسارة عند التحصيل`,explanation:`لا علاقة بالتحصيل.`},{text:`لا فرق؛ الاسم فقط تغير`,explanation:`الفرق جوهري في التوقيت والأساس.`}]},{id:`p3e5-q2`,question:`رصيد غير مستحق 19,500,000 بنسبة 1%، وعميل متعثر 300,000 بنسبة 100%. كم المخصص؟`,options:[{text:`195,000`,explanation:`نسيت العميل المتعثر.`},{text:`300,000`,explanation:`نسيت الأرصدة غير المستحقة.`},{text:`495,000`,correct:!0,explanation:`صحيح.`},{text:`198,000`,explanation:`يُقيَّم المتعثر فردياً بنسبة 100%.`}]},{id:`p3e5-q3`,question:`ما قيد إعدام دين له مخصص قائم؟`,options:[{text:`من حـ/ الخسائر الائتمانية إلى حـ/ العملاء`,explanation:`يكرر المصروف المسجل في المخصص.`},{text:`من حـ/ مخصص الخسائر الائتمانية إلى حـ/ العملاء`,correct:!0,explanation:`صحيح.`},{text:`من حـ/ العملاء إلى حـ/ المخصص`,explanation:`الاتجاه معكوس.`},{text:`لا قيد؛ يبقى الدين في الدفاتر`,explanation:`عند انعدام توقع الاسترداد يجب الإعدام.`}]},{id:`p3e5-q4`,question:`ما أثر الإعدام (على مخصص قائم) على صافي رصيد العملاء؟`,options:[{text:`ينقص بقيمة الدين`,explanation:`الإجمالي والمخصص ينقصان معاً بنفس المبلغ.`},{text:`لا يتغير`,correct:!0,explanation:`صحيح. الصافي يبقى كما هو.`},{text:`يزيد`,explanation:`لا يزيد.`},{text:`يصبح صفراً`,explanation:`يخص دين عميل واحد فقط.`}]},{id:`p3e5-q5`,question:`على أي أساس تُبنى نسب مصفوفة المخصص؟`,options:[{text:`الخبرة التاريخية فقط`,explanation:`يجب تعديلها بالظروف الحالية والتوقعات المستقبلية.`},{text:`الخبرة التاريخية معدلة بالظروف الحالية والتوقعات المستقبلية`,correct:!0,explanation:`صحيح.`},{text:`نسبة ثابتة يحددها القانون`,explanation:`لا يحدد القانون نسباً لذلك.`},{text:`تقدير مراقب الحسابات`,explanation:`التقدير مسؤولية الإدارة، والمراقب يراجعه.`}]}],exercises:[{id:`p3e5-x1`,date:`2026-10-31`,prompt:`المخصص المطلوب بالمصفوفة **495,000 ج.م**، ولا يوجد رصيد مخصص سابق. سجّل قيد تكوين المخصص.`,solution:[{account:`5230`,debit:495e3},{account:`1219`,credit:495e3}],hints:[`المصروف: الخسائر الائتمانية المتوقعة.`,`الحساب المقابل للعملاء.`],explanation:`الخسائر الائتمانية المتوقعة مدين، ومخصص الخسائر الائتمانية المتوقعة دائن.`},{id:`p3e5-x2`,date:`2026-10-31`,prompt:`سجّل إعدام مديونية موزع أسيوط **300,000 ج.م** (لها مخصص كامل).`,solution:[{account:`1219`,debit:3e5},{account:`1210`,credit:3e5}],hints:[`الإعدام على المخصص لا على المصروف.`],explanation:`مخصص الخسائر الائتمانية مدين، والعملاء دائن.`}]},takeaways:[`الخسائر الائتمانية تُسجَّل متوقعةً من أول يوم، لا عند وقوعها.`,`للعملاء التجاريين: المنهج المبسط بمصفوفة مخصص على أعمار الديون.`,`العميل المتعثر يُقيَّم فردياً، والإعدام يكون على المخصص.`,`العملاء 19,500,000 والمخصص 195,000، والبنك 57,589,628 ج.م.`]},fe={id:`p3e6`,part:3,number:6,title:`إقفال أول شهر تشغيل: التسوية البنكية والقيود المتكررة`,subtitle:`مذكرة التسوية البنكية، وقيود نهاية الشهر، وقراءة نتيجة أكتوبر`,period:`31 أكتوبر 2026`,minutes:35,objectives:[`أن تعد مذكرة تسوية بنكية وتحدد بنودها`,`أن تميّز بين البنود التي تحتاج قيداً في الدفاتر وتلك التي لا تحتاج`,`أن تسجّل قيود نهاية الشهر المتكررة`,`أن تقرأ نتيجة أول شهر تشغيل كامل`],situation:[`قبل إقفال أكتوبر سجّلت الأستاذة منى العمليات الأخيرة:`,{type:`list`,items:[`29 أكتوبر: شيك بمبلغ 2,000,000 ج.م لشركة «الوادي» من حسابها.`,`31 أكتوبر: مرتبات المقر الإداري 1,350,000 ومرتبات فريق المبيعات 400,000 (بالإجمالي؛ الاستقطاعات في الجزء الرابع).`,`31 أكتوبر: مصاريف نقل المنتجات للعملاء بسيارات مستأجرة 620,000.`]},`ثم وصل كشف حساب البنك عن أكتوبر. رصيده **55,687,128 ج.م**، بينما رصيد حساب البنك في الدفاتر بعد العمليات السابقة **53,219,628 ج.م**. الفرق 2,467,500. وبالمراجعة سطراً سطراً وجدت:`,{type:`list`,items:[`شيك «الوادي» (2,000,000) لم يُصرف من البنك بعد.`,`البنك خصم عمولات ومصروفات بنكية 12,500 لم تُسجل في الدفاتر.`,`موزع القاهرة الكبرى حوّل 480,000 مباشرة لحساب الشركة، ولم يُبلغ قسم الحسابات.`]},`وذكّرها أحمد بأن هناك قيوداً تتكرر كل شهر: إيجار المقر، واستهلاك ERP، وفائدة التزام التأجير، وفائدة القرض وعائد الوديعة.`],explanation:[{type:`heading`,text:`لماذا يختلف رصيد البنك عن الدفاتر؟`},`رصيدان لنفس الحساب يسجلهما طرفان مختلفان في توقيتات مختلفة. **{{term:bank-reconciliation|مذكرة التسوية البنكية}}** تشرح الفرق بندًا بندًا، وهي من أهم أدوات الرقابة على النقدية: تكشف الأخطاء والعمليات غير المسجلة، وأي سحب غير مصرح به.`,{type:`table`,headers:[`نوع البند`,`مثال`,`هل يحتاج قيداً في دفاترنا؟`],rows:[[`{{term:outstanding-cheque|شيكات لم تُصرف}}`,`شيك «الوادي»`,`لا؛ سجّلناه صحيحاً، والبنك سيصرفه لاحقاً`],[`إيداعات بالطريق`,`إيداع آخر يوم لم يظهر في الكشف`,`لا`],[`مصروفات خصمها البنك`,`العمولات 12,500`,`نعم`],[`تحصيلات أضافها البنك`,`تحويل الموزع 480,000`,`نعم`],[`أخطاء`,`رقم مكتوب خطأ`,`من أخطأ يصحح`]]},`القاعدة: **ما يعرفه البنك ولا نعرفه** ← قيد في دفاترنا. **ما نعرفه ولا يعرفه البنك بعد** ← لا قيد، يظهر في المذكرة فقط.`,{type:`table`,caption:`مذكرة التسوية البنكية في 31 أكتوبر 2026 (ج.م)`,headers:[`البيان`,`المبلغ`],rows:[[`رصيد الدفاتر قبل التسوية`,`53,219,628`],[`يُضاف: تحويل من موزع القاهرة الكبرى`,`480,000`],[`يُطرح: عمولات بنكية`,`(12,500)`],[`**رصيد الدفاتر المعدل**`,`**53,687,128**`],[`رصيد كشف البنك`,`55,687,128`],[`يُطرح: شيكات لم تُصرف («الوادي»)`,`(2,000,000)`],[`**رصيد البنك المعدل**`,`**53,687,128**`]]},`الرصيدان المعدلان متساويان، والرصيد الصحيح للنقدية في القوائم هو **53,687,128**.`,{type:`heading`,text:`القيود المتكررة`},`بعض القيود تتكرر كل شهر بنفس المنطق، ويجدولها نظام ERP عادة:`,{type:`table`,headers:[`القيد`,`الحساب`,`المبلغ`],rows:[[`إيجار المقر (تأجير قصير الأجل)`,`1,800,000 ÷ 12`,`150,000`],[`استهلاك ERP`,`6,000,000 ÷ 60`,`100,000`],[`فائدة التزام التأجير`,`6,316,512 × 20% ÷ 12`,`105,275`],[`فائدة القرض (تُرسمل؛ الخط الثاني ما زال تحت الإنشاء)`,`150,000,000 × 22% ÷ 12`,`2,750,000`],[`عائد الوديعة (يُطرح من المرسمل)`,`90,000,000 × 18% ÷ 12`,`1,350,000`]]},`لاحظ أن فائدة التأجير محسوبة على الرصيد الجديد بعد إضافة فائدة سبتمبر. وإهلاك المصنع وأصل حق الاستخدام سُجّل بالفعل في الحلقة الثانية ضمن التكاليف الصناعية.`],rule:{refs:[{id:`eas:framework`,title:`الإطار العام: التمثيل الصادق والقابلية للتحقق`,counterpart:`Conceptual Framework (IASB) - الفصل 2`,text:`يجب أن يكون رصيد النقدية في القوائم كاملاً وخالياً من الأخطاء. والتسوية البنكية تحقق ذلك بمطابقة الدفاتر بمصدر مستقل (كشف البنك)، وهي من الأدلة الأولى التي يطلبها مراقب الحسابات.`,review:`V04`},{id:`eas:1`,title:`معيار المحاسبة المصري رقم (1): أساس الاستحقاق`,counterpart:`IAS 1 (الفقرتان 27 و28)`,text:`تُعد القوائم المالية على أساس الاستحقاق: الإيرادات والمصروفات في الفترة التي تخصها. والقيود المتكررة (الإيجار، والاستهلاك، والفوائد) هي تطبيق شهري لهذا الأساس.`}]},application:{entries:[{id:`p3e6-j1`,date:`2026-10-29`,description:`شيك لشركة «الوادي للمواد الغذائية» من حسابها`,lines:[{account:`2201`,debit:2e6},{account:`1250`,credit:2e6}],steps:[`يُسجَّل في الدفاتر يوم إصدار الشيك`,`سيظهر في المذكرة كشيك لم يُصرف`]},{id:`p3e6-j2`,date:`2026-10-31`,description:`مرتبات أكتوبر: المقر الإداري (1,350,000) وفريق المبيعات (400,000)`,lines:[{account:`5204`,debit:135e4},{account:`5303`,debit:4e5},{account:`1250`,credit:175e4}],steps:[`مرتبات غير صناعية ← مصروفات الفترة`,`مرتبات البيع في مصروفات البيع والتوزيع`]},{id:`p3e6-j3`,date:`2026-10-31`,description:`مصاريف نقل المنتجات لمخازن العملاء بسيارات مستأجرة`,lines:[{account:`5302`,debit:62e4},{account:`1250`,credit:62e4}],steps:[`نقل للخارج ← مصروف بيع وتوزيع (ليس تكلفة مخزون)`]},{id:`p3e6-j4`,date:`2026-10-31`,description:`تسوية بنكية: عمولات ومصروفات بنكية خصمها البنك`,lines:[{account:`5214`,debit:12500},{account:`1250`,credit:12500}]},{id:`p3e6-j5`,date:`2026-10-31`,description:`تسوية بنكية: تحويل مباشر من موزع القاهرة الكبرى`,lines:[{account:`1250`,debit:48e4},{account:`1210`,credit:48e4}]},{id:`p3e6-j6`,date:`2026-10-31`,description:`إيجار المقر الإداري عن أكتوبر`,lines:[{account:`5205`,debit:15e4},{account:`1220`,credit:15e4}]},{id:`p3e6-j7`,date:`2026-10-31`,description:`استهلاك نظام ERP عن أكتوبر`,lines:[{account:`5212`,debit:1e5},{account:`1159`,credit:1e5}]},{id:`p3e6-j8`,date:`2026-10-31`,description:`فائدة التزام تأجير المخزن عن أكتوبر`,lines:[{account:`5401`,debit:105275},{account:`2102`,credit:105275}],steps:[`6,316,512 × 20% ÷ 12 = 105,275.20 ← 105,275`]},{id:`p3e6-j9`,date:`2026-10-31`,description:`فائدة القرض عن أكتوبر مرسملة على الخط الثاني`,lines:[{account:`1190`,debit:275e4},{account:`2207`,credit:275e4}]},{id:`p3e6-j10`,date:`2026-10-31`,description:`عائد الوديعة المؤقتة عن أكتوبر (يُطرح من التكلفة المرسملة)`,lines:[{account:`1240`,debit:135e4},{account:`1190`,credit:135e4}]}],outro:[{type:`table`,caption:`نتيجة شهر أكتوبر 2026 وحده (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`إيرادات المبيعات`,`33,513,000`],[`تكلفة المبيعات (شاملة الطاقة غير المستغلة والتخفيض والعجز)`,`(23,157,250)`],[`مجمل الربح`,`10,355,750`],[`مصروفات البيع والتوزيع`,`(1,020,000)`],[`المصروفات الإدارية (مرتبات، إيجار، ERP، خسائر ائتمانية، عمولات)`,`(2,107,500)`],[`التكاليف التمويلية`,`(105,275)`],[`صافي ربح أكتوبر قبل الضرائب`,`7,122,975`]]},{type:`callout`,tone:`success`,title:`أول شهر رابح`,text:`بعد تسعة أشهر من الخسائر بسبب التأسيس والإنشاء، حقق المصنع في أول شهر تشغيل ربحاً قبل الضرائب **7,122,975 ج.م**، ونسبة مجمل ربح حوالي **31%**. افتح «القوائم المالية» لترى الأثر التراكمي منذ يناير.`}]},mistake:{title:`تسجيل الشيكات غير المصروفة كقيود، أو تعديل الدفاتر لتطابق كشف البنك`,blocks:[`**الخطأ الأول**: إلغاء قيد شيك «الوادي» لأنه لم يظهر في كشف البنك. الشيك صدر والالتزام سُدد من وجهة نظرنا؛ البنك فقط لم يصرفه بعد.`,`**الخطأ الثاني**: تسجيل «فرق التسوية» 2,467,500 في حساب معلق أو مصروفات متنوعة لكي يتساوى الرصيدان. هذا يخفي الأخطاء ويهدم الغرض من التسوية.`,`**الخطأ الثالث**: نسيان قيود البنود التي عرفناها من الكشف (العمولات والتحويل المباشر)، فيبقى رصيد الدفاتر خطأ.`,`**الخطأ الرابع**: نسيان القيود المتكررة، فتظهر نتيجة الشهر أفضل من الحقيقة. الحل: جدولتها في النظام وقائمة مراجعة للإقفال.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`ابدأ من الرصيدين، وفسّر كل فرق ببند محدد بمستنده. ما يحتاج قيداً يُقيَّد في دفاترنا، وما لا يحتاج يبقى في المذكرة حتى يظهر في كشف الشهر التالي.`}]},quiz:{questions:[{id:`p3e6-q1`,question:`أي بنود التسوية البنكية التالية يحتاج قيداً في دفاتر الشركة؟`,options:[{text:`شيكات أصدرتها الشركة ولم تُصرف بعد`,explanation:`مسجلة صحيحاً في الدفاتر.`},{text:`إيداعات بالطريق`,explanation:`مسجلة في الدفاتر، والبنك سيسجلها.`},{text:`عمولات بنكية خصمها البنك`,correct:!0,explanation:`صحيح. لم نكن نعرفها، فتُقيَّد في دفاترنا.`},{text:`لا شيء؛ الدفاتر دائماً صحيحة`,explanation:`التسوية تكشف ما لم يُسجَّل في الدفاتر.`}]},{id:`p3e6-q2`,question:`رصيد الدفاتر 53,219,628، وتحويل عميل لم يُسجل 480,000، وعمولات 12,500. ما رصيد الدفاتر المعدل؟`,options:[{text:`53,687,128`,correct:!0,explanation:`صحيح. + 480,000 − 12,500.`},{text:`53,712,128`,explanation:`العمولات تُطرح لا تُضاف.`},{text:`55,687,128`,explanation:`هذا رصيد كشف البنك قبل التسوية.`},{text:`52,727,128`,explanation:`التحويل يُضاف لا يُطرح.`}]},{id:`p3e6-q3`,question:`كشف البنك 55,687,128 وشيكات لم تُصرف 2,000,000. ما رصيد البنك المعدل؟`,options:[{text:`57,687,128`,explanation:`الشيكات غير المصروفة تُطرح من رصيد البنك.`},{text:`53,687,128`,correct:!0,explanation:`صحيح.`},{text:`55,687,128`,explanation:`يجب تعديله بالشيكات غير المصروفة.`},{text:`53,219,628`,explanation:`هذا رصيد الدفاتر قبل التسوية.`}]},{id:`p3e6-q4`,question:`أين تُسجَّل مرتبات فريق المبيعات؟`,options:[{text:`تكلفة الإنتاج`,explanation:`ليست تكلفة صناعية.`},{text:`مصروفات البيع والتوزيع`,correct:!0,explanation:`صحيح.`},{text:`تكلفة المبيعات`,explanation:`تكلفة المبيعات تخص تكلفة المنتجات المبيعة.`},{text:`المصروفات الإدارية`,explanation:`الأدق تبويبها مصروفات بيع.`}]},{id:`p3e6-q5`,question:`لماذا ما زالت فائدة القرض تُرسمل في أكتوبر رغم بدء الإنتاج؟`,options:[{text:`لأن كل الفوائد تُرسمل دائماً`,explanation:`تُرسمل فقط للأصل المؤهل أثناء إنشائه.`},{text:`لأن القرض مخصص للخط الثاني الذي ما زال تحت الإنشاء`,correct:!0,explanation:`صحيح. بدء إنتاج الخط الأول لا علاقة له بالقرض.`},{text:`لأن الشركة لم تسدد الفائدة بعد`,explanation:`الرسملة لا ترتبط بالسداد.`},{text:`خطأ؛ كان يجب تحميلها مصروفاً`,explanation:`الرسملة صحيحة حتى يكتمل الخط الثاني.`}]}],exercises:[{id:`p3e6-x1`,date:`2026-10-31`,prompt:`من مذكرة التسوية: سجّل **قيداً واحداً** يثبت عمولات بنكية **12,500** وتحويلاً مباشراً من عميل **480,000** ظهرا في كشف البنك.`,solution:[{account:`1250`,debit:467500},{account:`5214`,debit:12500},{account:`1210`,credit:48e4}],hints:[`صافي أثر البنك = 480,000 − 12,500.`,`العملاء ينقصون بالتحويل كاملاً.`,`العمولات مصروف.`],explanation:`البنك 467,500 مدين، والعمولات 12,500 مدين، والعملاء 480,000 دائن. (التطبيق سجّلهما في قيدين؛ النتيجة واحدة.)`},{id:`p3e6-x2`,date:`2026-10-31`,prompt:`سجّل مرتبات أكتوبر: المقر الإداري **1,350,000** وفريق المبيعات **400,000**، مسددة من البنك.`,solution:[{account:`5204`,debit:135e4},{account:`5303`,debit:4e5},{account:`1250`,credit:175e4}],hints:[`كل نوع في حسابه.`,`طرف دائن واحد.`],explanation:`مرتبات إدارية 1,350,000، ومرتبات فريق المبيعات 400,000، والبنك دائن 1,750,000.`}]},takeaways:[`التسوية البنكية: ما يعرفه البنك ولا نعرفه ← قيد. ما نعرفه ولا يعرفه البنك ← مذكرة فقط.`,`الرصيدان المعدلان يجب أن يتساويا: 53,687,128 ج.م.`,`القيود المتكررة تُجدول ولا تُنسى عند الإقفال.`,`صافي ربح أكتوبر قبل الضرائب 7,122,975 ج.م.`]},pe={id:`p4e1`,part:4,number:1,title:`كشف المرتبات: من الإجمالي إلى الصافي`,subtitle:`مكونات المرتب، والاستقطاعات، وقيد المرتبات، وتوزيع تكلفة العمالة`,period:`نوفمبر 2026`,minutes:30,objectives:[`أن تفهم مكونات كشف المرتبات: الإجمالي والاستقطاعات والصافي`,`أن تعرف لماذا تُعد الاستقطاعات التزاماً على الشركة لا إيراداً لها`,`أن تسجّل قيد المرتبات مع توزيع التكلفة على الإنتاج والمصروفات`,`أن تميّز بين تكلفة الشركة والمبلغ الذي يتسلمه الموظف`],situation:[`في الأجزاء السابقة سجّلنا المرتبات «بالإجمالي» تبسيطاً، كأن الشركة تدفع للموظف كامل مرتبه. والحقيقة غير ذلك: الشركة **تستقطع** من المرتب ضريبة كسب العمل وحصة الموظف في التأمينات، وتوردهما للجهات المختصة.`,`في 30 نوفمبر 2026 أصدرت إدارة الموارد البشرية كشف مرتبات نوفمبر من نظام ERP لحوالي 500 موظف:`,{type:`table`,caption:`ملخص كشف مرتبات نوفمبر 2026 (ج.م)`,headers:[`الفئة`,`العدد`,`الإجمالي`,`تأمينات (حصة العامل 11%)`,`ضريبة كسب العمل`,`الصافي`],rows:[[`عمال خطوط الإنتاج`,`380`,`4,560,000`,`501,600`,`360,430`,`3,697,970`],[`إشراف وصيانة وجودة بالمصنع`,`40`,`1,150,000`,`73,480`,`176,384`,`900,136`],[`المقر الإداري`,`60`,`1,350,000`,`99,000`,`182,725`,`1,068,275`],[`فريق المبيعات`,`20`,`400,000`,`30,800`,`50,153`,`319,047`],[`**الإجمالي**`,`**500**`,`**7,460,000**`,`**704,880**`,`**769,692**`,`**5,985,428**`]]},`حُوِّل الصافي لحسابات الموظفين البنكية في اليوم نفسه. أما الضريبة والتأمينات المستقطعة فتُورد في منتصف ديسمبر.`,`سأل أحمد: «الضريبة تُخصم من الموظف، فلماذا تظهر في دفاترنا أصلاً؟»`],explanation:[{type:`heading`,text:`ثلاثة أرقام في كل مرتب`},{type:`list`,items:[`**{{term:gross-salary|المرتب الإجمالي}}**: الأساسي والحوافز والبدلات. هذا ما تتحمله الشركة تكلفةً للعمل.`,`**الاستقطاعات**: مبالغ تخصمها الشركة من الإجمالي **نيابة عن جهات أخرى**: ضريبة كسب العمل لمصلحة الضرائب، وحصة العامل في التأمينات للهيئة القومية للتأمين الاجتماعي (وأحياناً أقساط سلف أو جزاءات).`,`**{{term:net-salary|صافي المرتب}}**: ما يتسلمه الموظف فعلاً = الإجمالي − الاستقطاعات.`]},`الشركة هنا **وسيط تحصيل**: تستقطع المبالغ من الموظف ثم تلتزم بتوريدها. لذلك تُسجَّل الاستقطاعات **التزاماً** حتى يتم التوريد، ولا تقلل تكلفة الشركة. وعدم توريدها في موعده يعرض الشركة لغرامات، لأنها أموال غيرها في يدها.`,{type:`heading`,text:`أين تذهب تكلفة المرتبات؟`},`التكلفة تتبع **طبيعة العمل**، تماماً كما تعلمنا في محاسبة التكاليف:`,{type:`table`,headers:[`الفئة`,`الحساب المدين`,`السبب`],rows:[[`عمال الخطوط`,`إنتاج تحت التشغيل`,`أجور مباشرة: جزء من تكلفة المنتج`],[`الإشراف والصيانة بالمصنع`,`تكاليف صناعية غير مباشرة`,`تُحمَّل على الإنتاج مع بقية التكاليف غير المباشرة`],[`المقر الإداري`,`مرتبات وأجور إدارية`,`مصروف فترة`],[`فريق المبيعات`,`مرتبات فريق المبيعات`,`مصروف بيع وتوزيع`]]},`وتحميل تكاليف المصنع على الإنتاج المكتمل في نوفمبر وديسمبر سيتم ضمن إقفال السنة في الجزء السادس.`,{type:`heading`,text:`وتكلفة الشركة أكبر من الإجمالي`},`إلى جانب المرتب الإجمالي تدفع الشركة **حصتها** في التأمينات الاجتماعية (الحلقة الثالثة)، وتتحمل مزايا أخرى كالإجازات المستحقة والمكافآت (الحلقة الرابعة). فتكلفة الموظف على الشركة = الإجمالي + حصة صاحب العمل + المزايا الأخرى.`],rule:{refs:[{id:`eas:38`,title:`معيار المحاسبة المصري رقم (38): مزايا العاملين`,counterpart:`IAS 19 Employee Benefits (الفقرتان 5 و11)`,text:`مزايا العاملين قصيرة الأجل (الأجور والمرتبات واشتراكات التأمين الاجتماعي والإجازات المدفوعة والمكافآت المستحقة خلال 12 شهراً) يُعترف بها بالمبلغ غير المخصوم عندما يؤدي الموظف الخدمة: التزاماً بعد خصم ما دُفع، ومصروفاً، ما لم يتطلب معيار آخر إدراجها في تكلفة أصل (مثل المخزون وفق المعيار 2).`},{id:`law:91-2005`,title:`قانون الضريبة على الدخل رقم 91 لسنة 2005 - إلزام صاحب العمل بالخصم`,counterpart:`وتعديلاته، وقانون الإجراءات الضريبية الموحد 206 لسنة 2020`,text:`يلتزم صاحب العمل بخصم الضريبة المستحقة على المرتبات وما في حكمها عند كل صرف وتوريدها لمصلحة الضرائب في المواعيد المحددة، ويكون مسؤولاً بالتضامن عن سدادها.`,review:`V13`}]},application:{entries:[{id:`p4e1-j1`,date:`2026-11-30`,description:`إثبات مرتبات نوفمبر وصرف الصافي للعاملين، واستقطاع الضريبة وحصة العاملين في التأمينات`,lines:[{account:`1204`,debit:456e4},{account:`1205`,debit:115e4},{account:`5204`,debit:135e4},{account:`5303`,debit:4e5},{account:`2209`,credit:769692},{account:`2210`,credit:704880},{account:`1250`,credit:5985428}],steps:[`الأطراف المدينة = المرتبات الإجمالية موزعة حسب طبيعة العمل = 7,460,000`,`ضريبة كسب العمل المستقطعة ← التزام لمصلحة الضرائب 769,692`,`حصة العاملين في التأمينات ← التزام للهيئة 704,880`,`الصافي المحوَّل للعاملين ← البنك 5,985,428`,`7,460,000 = 769,692 + 704,880 + 5,985,428`]}],outro:[{type:`callout`,tone:`info`,title:`قارن بقيد أكتوبر`,text:`في أكتوبر (الجزء الثالث) دفعنا المرتبات بالإجمالي من البنك بلا استقطاع، تبسيطاً. من نوفمبر يعمل الكشف بشكله الكامل.`}]},mistake:{title:`تسجيل المرتبات بالصافي، أو اعتبار الاستقطاعات وفراً للشركة`,blocks:[`**الخطأ الأول**: تسجيل مصروف المرتبات بالصافي المدفوع (5,985,428). هذا يُخفي 1,474,572 من تكلفة العمالة ويُخفي التزاماً حقيقياً على الشركة تجاه مصلحة الضرائب والتأمينات.`,`**الخطأ الثاني**: اعتبار المبالغ المستقطعة سيولة متاحة للشركة. هي أموال للدولة والهيئة في يد الشركة، وتأخير توريدها يعرّضها لغرامات ومسؤولية.`,`**الخطأ الثالث**: تحميل أجور عمال الخطوط على مصروفات الفترة. هي تكلفة إنتاج تدخل المخزون.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`قيد المرتبات دائماً: **المدين = الإجمالي** موزعاً حسب طبيعة العمل، و**الدائن = الصافي + كل استقطاع في حساب التزامه**.`}]},quiz:{questions:[{id:`p4e1-q1`,question:`مرتب إجمالي 12,000، والتأمينات المستقطعة 1,320، والضريبة 948.5. كم الصافي؟`,options:[{text:`12,000`,explanation:`هذا الإجمالي قبل الاستقطاعات.`},{text:`9,731.5`,correct:!0,explanation:`صحيح. 12,000 − 1,320 − 948.5.`},{text:`10,680`,explanation:`نسيت خصم الضريبة.`},{text:`11,051.5`,explanation:`نسيت خصم التأمينات.`}]},{id:`p4e1-q2`,question:`ما طبيعة ضريبة كسب العمل المستقطعة في دفاتر الشركة؟`,options:[{text:`مصروف ضرائب على الشركة`,explanation:`الضريبة على دخل الموظف، والشركة تحصّلها نيابة عن الدولة.`},{text:`التزام حتى توريدها لمصلحة الضرائب`,correct:!0,explanation:`صحيح.`},{text:`إيراد للشركة`,explanation:`ليست ملكاً للشركة.`},{text:`أصل للشركة`,explanation:`هي التزام عليها.`}]},{id:`p4e1-q3`,question:`أين تُسجَّل أجور عمال خطوط الإنتاج؟`,options:[{text:`مرتبات وأجور إدارية`,explanation:`ليست عمالة إدارية.`},{text:`إنتاج تحت التشغيل`,correct:!0,explanation:`صحيح. أجور مباشرة تدخل تكلفة المنتج.`},{text:`مصروفات بيع`,explanation:`لا علاقة لها بالبيع.`},{text:`تكاليف طاقة غير مستغلة`,explanation:`هذا الحساب للتكاليف الثابتة غير المحمّلة فقط.`}]},{id:`p4e1-q4`,question:`ما مجموع الأطراف المدينة في قيد المرتبات؟`,options:[{text:`الصافي المدفوع`,explanation:`المدين يعكس التكلفة الكاملة.`},{text:`المرتبات الإجمالية`,correct:!0,explanation:`صحيح.`},{text:`الإجمالي + حصة الشركة في التأمينات`,explanation:`حصة الشركة تُسجَّل بقيد مستقل.`},{text:`الاستقطاعات فقط`,explanation:`الاستقطاعات في الطرف الدائن.`}]},{id:`p4e1-q5`,question:`لماذا تستقطع الشركة ضريبة المرتبات بنفسها بدلاً من أن يدفعها الموظف؟`,options:[{text:`لأن القانون يُلزم صاحب العمل بالخصم والتوريد`,correct:!0,explanation:`صحيح، ويجعله مسؤولاً عنها.`},{text:`لأن الشركة تتحمل الضريبة عن الموظف`,explanation:`الضريبة على دخل الموظف؛ الشركة تخصمها من مرتبه.`},{text:`لتقليل مصروف المرتبات`,explanation:`الاستقطاع لا يقلل التكلفة.`},{text:`اختياري حسب سياسة الشركة`,explanation:`الخصم إلزامي.`}]}],exercises:[{id:`p4e1-x1`,date:`2026-11-30`,prompt:`سجّل مرتبات **فريق المبيعات** فقط: الإجمالي **400,000**، وحصة العاملين في التأمينات **30,800**، والضريبة المستقطعة **50,153**، والصافي **319,047** محوَّل من البنك.`,solution:[{account:`5303`,debit:4e5},{account:`2209`,credit:50153},{account:`2210`,credit:30800},{account:`1250`,credit:319047}],hints:[`المدين بالإجمالي.`,`ثلاثة أطراف دائنة: الضريبة، والتأمينات، والبنك.`],explanation:`مرتبات فريق المبيعات 400,000 مدين؛ الضريبة 50,153 والتأمينات 30,800 والبنك 319,047 دائن.`}]},takeaways:[`الصافي = الإجمالي − الضريبة − حصة العامل في التأمينات.`,`المصروف (أو التكلفة) بالإجمالي، والاستقطاعات التزامات حتى التوريد.`,`تكلفة العمالة تتبع طبيعة العمل: إنتاج، أو غير مباشر، أو إداري، أو بيع.`,`مرتبات نوفمبر 7,460,000، والصافي المدفوع 5,985,428 ج.م.`]},me={id:`p4e2`,part:4,number:2,title:`ضريبة كسب العمل: كيف تُحسب؟`,subtitle:`الوعاء الضريبي، والإعفاء الشخصي، والشرائح التصاعدية، والتوريد`,period:`نوفمبر - ديسمبر 2026`,minutes:35,objectives:[`أن تحدد وعاء ضريبة المرتبات بعد خصم حصة التأمينات والإعفاء الشخصي`,`أن تطبق الشرائح التصاعدية لحساب الضريبة السنوية والشهرية`,`أن تفهم الفرق بين السعر الحدي ومتوسط العبء الضريبي`,`أن تسجّل توريد الضريبة المستقطعة`],situation:[`اعترض سعيد، عامل الخط الثالث، على مدير الموارد البشرية: «مرتبي 12,000 جنيه. لماذا خُصم مني 948.5 جنيه ضريبة؟ وزميلي المشرف مرتبه 28,750 فخُصم منه 4,409.59، أي أكثر من أربعة أضعاف، مع أن مرتبه أقل من ثلاثة أضعاف مرتبي!»`,`طلبت الأستاذة منى من أحمد أن يشرح الحساب لسعيد خطوة بخطوة، ثم يجهّز توريد ضريبة نوفمبر لمصلحة الضرائب في 15 ديسمبر.`],explanation:[{type:`heading`,text:`الوعاء الضريبي`},`الضريبة لا تُحسب على المرتب الإجمالي مباشرة. نحسب أولاً **{{term:taxable-income|الوعاء الخاضع للضريبة}}** على أساس سنوي:`,{type:`list`,ordered:!0,items:[`المرتب الإجمالي الشهري × 12.`,`يُخصم: حصة الموظف في التأمينات الاجتماعية (تكاليف واجبة الخصم).`,`يُخصم: **{{term:personal-exemption|الإعفاء الشخصي}}** السنوي 20,000 ج.م {{review:V13}}.`]},{type:`heading`,text:`الشرائح التصاعدية`},`تُطبق الضريبة على **شرائح**: كل جزء من الدخل يُضرب في سعر شريحته فقط، لا الدخل كله في أعلى سعر.`,{type:`table`,caption:`شرائح الضريبة على الدخل السنوي للأشخاص الطبيعيين المستخدمة في السيناريو`,headers:[`الشريحة`,`السعر`],rows:[[`حتى 40,000`,`0%`],[`40,000 - 55,000`,`10%`],[`55,000 - 70,000`,`15%`],[`70,000 - 200,000`,`20%`],[`200,000 - 400,000`,`22.5%`],[`400,000 - 1,200,000`,`25%`],[`أكثر من 1,200,000`,`27.5%`]]},{type:`callout`,tone:`warning`,title:`تنبيه`,text:`هذه الشرائح وفق تعديلات القانون 30 لسنة 2023 كما وردت في المصادر المتاحة لنا، وتوجد قواعد خاصة تُفقد أصحاب الدخول المرتفعة جداً مزايا الشرائح الأولى، وأنباء عن تعديلات لاحقة لحد الإعفاء. تحقق من الجدول الساري في تاريخ الحساب {{review:V13}}.`},{type:`heading`,text:`مثال 1: سعيد (عامل خط، 12,000 شهرياً)`},{type:`table`,headers:[`البند`,`الحساب`,`المبلغ`],rows:[[`الإجمالي السنوي`,`12,000 × 12`,`144,000`],[`يُخصم: التأمينات`,`1,320 × 12`,`(15,840)`],[`يُخصم: الإعفاء الشخصي`,``,`(20,000)`],[`الوعاء الخاضع`,``,`108,160`],[`شريحة 0%`,`40,000 × 0%`,`0`],[`شريحة 10%`,`15,000 × 10%`,`1,500`],[`شريحة 15%`,`15,000 × 15%`,`2,250`],[`شريحة 20%`,`38,160 × 20%`,`7,632`],[`الضريبة السنوية`,``,`11,382`],[`الضريبة الشهرية`,`11,382 ÷ 12`,`948.50`]]},{type:`heading`,text:`مثال 2: المشرف (28,750 شهرياً)`},`التأمينات تُحسب على أجر الاشتراك بحد أقصى 16,700 (الحلقة التالية) = 1,837 شهرياً. الوعاء = (28,750 − 1,837) × 12 − 20,000 = **302,956**. الضريبة: 0 + 1,500 + 2,250 + 26,000 (على 130,000 بنسبة 20%) + 23,165.10 (على 102,956 بنسبة 22.5%) = **52,915.10** سنوياً = **4,409.59** شهرياً.`,{type:`heading`,text:`{{term:marginal-rate|السعر الحدي}} ومتوسط العبء`},`سعيد في شريحة 20% (سعره الحدي)، لكن **متوسط** ضريبته 948.5 ÷ 12,000 = **7.9%** فقط من مرتبه. والمشرف سعره الحدي 22.5% ومتوسطه 4,409.59 ÷ 28,750 = **15.3%**. هذا معنى «التصاعدية»: كلما زاد الدخل زاد متوسط العبء، ولهذا لاحظ سعيد أن الضريبة زادت بنسبة أكبر من المرتب.`,{type:`heading`,text:`التوريد`},`تورد الشركة ما استقطعته في المواعيد المحددة بقانون الإجراءات الضريبية الموحد، مع النماذج الإلكترونية المطلوبة، وتجري تسوية سنوية في نهاية العام لكل موظف {{review:V13}}. في سيناريونا يتم التوريد في 15 ديسمبر.`],rule:{refs:[{id:`law:91-2005`,title:`قانون الضريبة على الدخل رقم 91 لسنة 2005 وتعديلاته - المرتبات وما في حكمها`,counterpart:`ومنها القانون 30 لسنة 2023`,text:`تفرض الضريبة على صافي دخل المرتبات وما في حكمها بعد خصم حصة العامل في التأمينات الاجتماعية والإعفاء الشخصي، وفق شرائح تصاعدية، ويلتزم صاحب العمل بخصم الضريبة وتوريدها. أرقام الشرائح والإعفاء وتاريخ سريانها تحتاج تأكيداً من النص الرسمي الساري.`,review:`V13`},{id:`law:206-2020`,title:`قانون الإجراءات الضريبية الموحد رقم 206 لسنة 2020`,text:`ينظم الإجراءات المشتركة لكل الضرائب: التسجيل، والإقرارات، ومواعيد التوريد، والسداد الإلكتروني، والفحص، والطعن، والغرامات عن التأخير.`,review:`V13`}]},application:{entries:[{id:`p4e2-j1`,date:`2026-12-15`,description:`توريد ضريبة كسب العمل المستقطعة من مرتبات نوفمبر لمصلحة الضرائب (سداد إلكتروني)`,lines:[{account:`2209`,debit:769692},{account:`1250`,credit:769692}],steps:[`الالتزام ينقص ← مدين`,`البنك ينقص ← دائن`,`لا مصروف هنا؛ المصروف هو المرتب الإجمالي المسجل في نوفمبر`]}]},mistake:{title:`تطبيق أعلى شريحة على الدخل كله، أو نسيان خصم التأمينات والإعفاء`,blocks:[`**الخطأ الأول**: ضرب وعاء سعيد كله (108,160) في 20% = 21,632 سنوياً بدلاً من 11,382. الشرائح تُطبق على أجزاء الدخل، كل جزء بسعره.`,`**الخطأ الثاني**: حساب الضريبة على الإجمالي قبل خصم حصة التأمينات والإعفاء الشخصي، فتتضخم الضريبة.`,`**الخطأ الثالث**: حساب تأمينات المشرف على مرتبه كاملاً (28,750 × 11%) متجاهلاً الحد الأقصى لأجر الاشتراك.`,`**الخطأ الرابع**: تسجيل الضريبة المستقطعة مصروفاً على الشركة عند التوريد.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`الترتيب دائماً: **سنوي ← اخصم التأمينات ← اخصم الإعفاء ← طبّق الشرائح ← اقسم على 12**. وتأكد من جدول الشرائح الساري قبل أي حساب.`}]},quiz:{questions:[{id:`p4e2-q1`,question:`ما الذي يُخصم من الإجمالي السنوي قبل تطبيق الشرائح؟`,options:[{text:`حصة الموظف في التأمينات والإعفاء الشخصي`,correct:!0,explanation:`صحيح.`},{text:`حصة الشركة في التأمينات`,explanation:`حصة الشركة ليست جزءاً من مرتب الموظف أصلاً.`},{text:`لا شيء؛ الضريبة على الإجمالي`,explanation:`الوعاء بعد الخصومات المسموح بها.`},{text:`صافي المرتب`,explanation:`الصافي نتيجة بعد الضريبة لا خصم منها.`}]},{id:`p4e2-q2`,question:`وعاء سنوي 108,160. كم الضريبة بالشرائح (0% حتى 40k، 10% حتى 55k، 15% حتى 70k، 20% حتى 200k)؟`,options:[{text:`21,632`,explanation:`هذا بتطبيق 20% على الوعاء كله.`},{text:`11,382`,correct:!0,explanation:`صحيح. 0 + 1,500 + 2,250 + 7,632.`},{text:`13,632`,explanation:`راجع شريحة الصفر.`},{text:`7,632`,explanation:`هذه شريحة 20% وحدها.`}]},{id:`p4e2-q3`,question:`موظف سعره الحدي 20% ومتوسط ضريبته 7.9%. ماذا يعني السعر الحدي؟`,options:[{text:`سعر الضريبة على كل دخله`,explanation:`هذا خلط بين الحدي والمتوسط.`},{text:`سعر الضريبة على آخر جنيه يكسبه`,correct:!0,explanation:`صحيح.`},{text:`متوسط الضريبة للشركة كلها`,explanation:`يخص الموظف وحده.`},{text:`نسبة التأمينات`,explanation:`التأمينات نسبة مختلفة تماماً.`}]},{id:`p4e2-q4`,question:`ما قيد توريد الضريبة المستقطعة؟`,options:[{text:`من حـ/ مصروف ضرائب إلى حـ/ البنك`,explanation:`الضريبة ليست مصروفاً على الشركة.`},{text:`من حـ/ مصلحة الضرائب - ضريبة كسب العمل إلى حـ/ البنك`,correct:!0,explanation:`صحيح. يُقفل الالتزام.`},{text:`من حـ/ البنك إلى حـ/ مصلحة الضرائب`,explanation:`الاتجاه معكوس.`},{text:`من حـ/ المرتبات إلى حـ/ مصلحة الضرائب`,explanation:`هذا جزء من قيد الاستحقاق لا التوريد.`}]},{id:`p4e2-q5`,question:`ماذا يحدث إذا تأخرت الشركة في توريد الضريبة المستقطعة؟`,options:[{text:`لا شيء؛ هي ضريبة الموظف`,explanation:`صاحب العمل مسؤول قانوناً عن التوريد.`},{text:`تتعرض لمقابل تأخير وغرامات ومسؤولية عن المبالغ`,correct:!0,explanation:`صحيح.`},{text:`يتحملها الموظف`,explanation:`خُصمت منه بالفعل؛ المسؤولية على صاحب العمل.`},{text:`تسقط الضريبة`,explanation:`لا تسقط.`}]}],exercises:[{id:`p4e2-x1`,date:`2026-12-15`,prompt:`سجّل توريد ضريبة كسب العمل المستقطعة عن نوفمبر **769,692 ج.م** لمصلحة الضرائب من البنك.`,solution:[{account:`2209`,debit:769692},{account:`1250`,credit:769692}],hints:[`التوريد يُقفل التزاماً.`],explanation:`مصلحة الضرائب - ضريبة كسب العمل مدين، والبنك دائن.`}]},takeaways:[`الوعاء = الإجمالي السنوي − حصة التأمينات − الإعفاء الشخصي.`,`الشرائح تصاعدية: كل جزء بسعره، والمتوسط أقل من السعر الحدي.`,`الضريبة المستقطعة التزام يُورَّد، لا مصروف على الشركة.`,`توريد نوفمبر 769,692 ج.م في 15 ديسمبر.`]},he={id:`p4e3`,part:4,number:3,title:`التأمينات الاجتماعية: حصتان وحد أدنى وأقصى`,subtitle:`أجر الاشتراك، وحصة العامل وحصة صاحب العمل، والتوريد للهيئة`,period:`نوفمبر - ديسمبر 2026`,minutes:30,objectives:[`أن تحدد أجر الاشتراك التأميني في حدوده الدنيا والقصوى`,`أن تحسب حصة العامل وحصة صاحب العمل`,`أن تسجّل حصة صاحب العمل حسب طبيعة عمل الموظف`,`أن تعرف لماذا تُعد التأمينات الاجتماعية نظام اشتراكات محددة للشركة`],situation:[`بعد إثبات المرتبات تبقّى قيد لم يُسجَّل: **حصة الشركة** في التأمينات الاجتماعية. أعدّت الموارد البشرية الجدول التالي من أجور الاشتراك المسجلة لكل موظف:`,{type:`table`,caption:`اشتراكات التأمينات عن نوفمبر 2026 (ج.م)`,headers:[`الفئة`,`إجمالي أجور الاشتراك`,`حصة العامل 11%`,`حصة صاحب العمل 18.75%`],rows:[[`عمال الخطوط (380 × 12,000)`,`4,560,000`,`501,600`,`855,000`],[`إشراف المصنع (40 × 16,700 حد أقصى)`,`668,000`,`73,480`,`125,250`],[`المقر الإداري`,`900,000`,`99,000`,`168,750`],[`فريق المبيعات`,`280,000`,`30,800`,`52,500`],[`**الإجمالي**`,`**6,408,000**`,`**704,880**`,`**1,201,500**`]]},`لاحظ أحمد أن أجر اشتراك المشرفين (16,700) أقل من مرتباتهم (28,750)، وأن مجموع أجور الاشتراك أقل من مجموع المرتبات. وتورد الشركة الحصتين معاً للهيئة القومية للتأمين الاجتماعي في 15 ديسمبر.`],explanation:[{type:`heading`,text:`{{term:insurable-wage|أجر الاشتراك}}`},`هو الأجر الذي تُحسب عليه اشتراكات التأمينات، وله **حد أدنى** و**حد أقصى** يُعدَّلان سنوياً. في 2026: الحد الأدنى **2,700** والحد الأقصى **16,700** ج.م شهرياً {{review:V14}}.`,`فإذا كان المرتب أعلى من الحد الأقصى، تُحسب الاشتراكات على الحد الأقصى فقط. وإذا كان أقل من الحد الأدنى، تُحسب على الحد الأدنى.`,{type:`heading`,text:`حصتان`},{type:`table`,headers:[``,`حصة العامل`,`حصة صاحب العمل`],rows:[[`النسبة من أجر الاشتراك`,`11%`,`18.75%`],[`من يتحملها؟`,`الموظف (تُخصم من مرتبه)`,`الشركة (تكلفة إضافية فوق المرتب)`],[`في الدفاتر`,`استقطاع ← التزام (سُجّل في قيد المرتبات)`,`تكلفة عمالة + التزام (قيد مستقل)`]]},`حصة صاحب العمل **تكلفة عمالة** تتبع طبيعة العمل مثل المرتب نفسه: حصة عمال الخطوط ← إنتاج تحت التشغيل، وحصة المشرفين ← تكاليف صناعية غير مباشرة، والمقر ← مصروف إداري، والمبيعات ← مصروف بيع.`,`تكلفة عامل الخط على الشركة شهرياً = 12,000 + 2,250 (18.75%) = **14,250** ج.م، بينما يتسلم هو 9,731.5.`,{type:`heading`,text:`{{term:defined-contribution|نظام الاشتراكات المحددة}}`},`من زاوية الشركة، التأمينات الاجتماعية **نظام اشتراكات محددة**: التزام الشركة ينتهي بسداد الاشتراك المحدد. أما المعاش نفسه وحساباته الاكتوارية فمسؤولية الهيئة لا الشركة. لذلك يكفي تسجيل الاشتراك مصروفاً (أو تكلفة) عند استحقاقه، دون حسابات اكتوارية في دفاتر الشركة.`],rule:{refs:[{id:`law:148-2019`,title:`قانون التأمينات الاجتماعية والمعاشات رقم 148 لسنة 2019`,counterpart:`ولائحته التنفيذية وقرارات تعديل حدود أجر الاشتراك`,text:`يحدد أجر الاشتراك وحديه الأدنى والأقصى وزيادتهما السنوية، ونسب اشتراك صاحب العمل والعامل، ويُلزم صاحب العمل بخصم حصة العامل وتوريد الحصتين للهيئة القومية للتأمين الاجتماعي في المواعيد المحددة. أعلنت الهيئة رفع الحدين إلى 2,700 و16,700 جنيه من 1 يناير 2026.`,review:`V14`},{id:`eas:38`,title:`معيار المحاسبة المصري رقم (38): نظم الاشتراكات المحددة`,counterpart:`IAS 19 (الفقرات 8 و28 و51)`,text:`في نظم الاشتراكات المحددة يقتصر التزام المنشأة على المبلغ الذي توافق على المساهمة به، ويتحمل الموظف المخاطر الاكتوارية ومخاطر الاستثمار. وتعترف المنشأة بالاشتراك المستحق مقابل الخدمة المؤداة التزاماً ومصروفاً (أو ضمن تكلفة أصل)، دون افتراضات اكتوارية.`}]},application:{entries:[{id:`p4e3-j1`,date:`2026-11-30`,description:`إثبات حصة الشركة في التأمينات الاجتماعية عن نوفمبر (18.75% من أجور الاشتراك)`,lines:[{account:`1204`,debit:855e3},{account:`1205`,debit:125250},{account:`5215`,debit:168750},{account:`5304`,debit:52500},{account:`2210`,credit:1201500}],steps:[`6,408,000 × 18.75% = 1,201,500`,`كل جزء يتبع طبيعة عمل الفئة`,`الالتزام للهيئة حتى التوريد`]},{id:`p4e3-j2`,date:`2026-12-15`,description:`توريد اشتراكات نوفمبر (حصة العاملين 704,880 + حصة الشركة 1,201,500) للهيئة القومية للتأمين الاجتماعي`,lines:[{account:`2210`,debit:1906380},{account:`1250`,credit:1906380}],steps:[`704,880 + 1,201,500 = 1,906,380`,`رصيد حساب الهيئة يصبح صفراً`]}],outro:[{type:`table`,caption:`التكلفة الكاملة لمرتبات نوفمبر على الشركة (ج.م)`,headers:[`البند`,`المبلغ`],rows:[[`المرتبات الإجمالية`,`7,460,000`],[`حصة الشركة في التأمينات`,`1,201,500`],[`إجمالي تكلفة العمالة`,`8,661,500`]]}]},mistake:{title:`حساب الاشتراك على المرتب الكامل، أو نسيان حصة صاحب العمل`,blocks:[`**الخطأ الأول**: حساب اشتراكات المشرفين على 28,750 بدلاً من الحد الأقصى 16,700. النتيجة: استقطاع زائد من الموظفين وسداد زائد للهيئة.`,`**الخطأ الثاني**: تسجيل حصة العامل وحدها والاكتفاء بها. حصة صاحب العمل (1.2 مليون) تكلفة إضافية لا تظهر في كشف المرتبات العادي، ونسيانها يُظهر تكلفة المنتج والمصروفات أقل من الحقيقة.`,`**الخطأ الثالث**: تحميل حصة الشركة كلها على مصروف إداري واحد، بما فيها حصة عمال الخطوط التي هي تكلفة إنتاج.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`لكل موظف: أجر الاشتراك = المرتب في حدود الحدين. ولكل كشف مرتبات: قيدان؛ قيد المرتبات وقيد حصة صاحب العمل، ثم قيد توريد واحد للحصتين.`}]},quiz:{questions:[{id:`p4e3-q1`,question:`موظف مرتبه 28,750 والحد الأقصى لأجر الاشتراك 16,700. على أي أجر تُحسب اشتراكاته؟`,options:[{text:`28,750`,explanation:`يتجاوز الحد الأقصى.`},{text:`16,700`,correct:!0,explanation:`صحيح.`},{text:`2,700`,explanation:`هذا الحد الأدنى.`},{text:`متوسط الحدين`,explanation:`لا يُحسب المتوسط.`}]},{id:`p4e3-q2`,question:`أجر اشتراك 12,000. كم حصة صاحب العمل بنسبة 18.75%؟`,options:[{text:`1,320`,explanation:`هذه حصة العامل 11%.`},{text:`2,250`,correct:!0,explanation:`صحيح.`},{text:`3,570`,explanation:`هذا مجموع الحصتين.`},{text:`1,875`,explanation:`راجع الضرب: 12,000 × 18.75%.`}]},{id:`p4e3-q3`,question:`أين تُسجَّل حصة الشركة في تأمينات عمال خطوط الإنتاج؟`,options:[{text:`مصروف إداري`,explanation:`تتبع طبيعة عمل الموظف.`},{text:`إنتاج تحت التشغيل`,correct:!0,explanation:`صحيح. جزء من تكلفة العمالة المباشرة.`},{text:`تُخصم من مرتب العامل`,explanation:`حصة الشركة لا تُخصم من العامل.`},{text:`حقوق الملكية`,explanation:`لا علاقة لها بحقوق الملكية.`}]},{id:`p4e3-q4`,question:`لماذا لا تحتاج الشركة حسابات اكتوارية للتأمينات الاجتماعية؟`,options:[{text:`لأنها نظام اشتراكات محددة؛ التزام الشركة ينتهي بالسداد`,correct:!0,explanation:`صحيح.`},{text:`لأن المبالغ صغيرة`,explanation:`الحجم ليس السبب.`},{text:`لأن المعيار يمنعها`,explanation:`المعيار يطلبها لنظم المزايا المحددة فقط.`},{text:`لأن الموظفين شباب`,explanation:`العمر ليس السبب.`}]},{id:`p4e3-q5`,question:`ما رصيد حساب الهيئة القومية للتأمين الاجتماعي بعد توريد الحصتين؟`,options:[{text:`704,880`,explanation:`وُرّدت حصة العاملين أيضاً.`},{text:`1,201,500`,explanation:`وُرّدت حصة الشركة أيضاً.`},{text:`صفر`,correct:!0,explanation:`صحيح.`},{text:`1,906,380`,explanation:`هذا ما وُرّد، والرصيد بعده صفر.`}]}],exercises:[{id:`p4e3-x1`,date:`2026-11-30`,prompt:`سجّل حصة الشركة في التأمينات (18.75%) لـ**المقر الإداري** وحده: أجور الاشتراك **900,000 ج.م**.`,solution:[{account:`5215`,debit:168750},{account:`2210`,credit:168750}],hints:[`900,000 × 18.75%.`,`مصروف إداري ← حصة الشركة في التأمينات.`],explanation:`حصة الشركة في التأمينات الاجتماعية 168,750 مدين، والهيئة القومية للتأمين الاجتماعي دائن.`},{id:`p4e3-x2`,date:`2026-12-15`,prompt:`سجّل توريد الحصتين للهيئة: حصة العاملين **704,880** وحصة الشركة **1,201,500**.`,solution:[{account:`2210`,debit:1906380},{account:`1250`,credit:1906380}],hints:[`الحصتان في حساب التزام واحد.`],explanation:`الهيئة القومية للتأمين الاجتماعي مدين 1,906,380، والبنك دائن.`}]},takeaways:[`أجر الاشتراك بين حد أدنى وأقصى (2,700 و16,700 في 2026).`,`حصة العامل 11% تُستقطع، وحصة الشركة 18.75% تكلفة إضافية.`,`حصة الشركة تتبع طبيعة عمل الموظف مثل المرتب.`,`تكلفة عمالة نوفمبر الكاملة 8,661,500 ج.م.`]},ge={id:`p4e4`,part:4,number:4,title:`ما وراء المرتب: مزايا العاملين`,subtitle:`الإجازات المستحقة، ومكافآت الأداء، ونظم المزايا المحددة، وحصة العاملين في الأرباح`,period:`نوفمبر 2026`,minutes:30,objectives:[`أن تصنّف مزايا العاملين: قصيرة الأجل، وما بعد انتهاء الخدمة، وطويلة الأجل، وإنهاء الخدمة`,`أن تسجّل التزام الإجازات المكتسبة غير المستخدمة`,`أن تعرف متى ينشأ التزام بمكافأة الأداء وتسجّله`,`أن تفرّق بين نظم الاشتراكات المحددة والمزايا المحددة`],situation:[`في 25 نوفمبر 2026 اعتمد مجلس الإدارة **نظام مكافأة أداء** وأعلنه لكل العاملين: إذا حققت الشركة مستهدفات الإنتاج والمبيعات للربع الأخير، يحصل كل موظف على **نصف شهر** من مرتبه في يناير 2027. ومؤشرات أكتوبر ونوفمبر تؤكد أن المستهدفات ستتحقق، وقدّرت الموارد البشرية إجمالي المكافأة للربع بـ**3,600,000 ج.م**.`,`وفي اليوم نفسه أبلغ نظام الموارد البشرية أن العاملين اكتسبوا منذ تعيينهم أيام إجازة سنوية لم يستخدموها، ويحق لهم ترحيلها أو صرف مقابلها عند ترك العمل. قيمتها بالأجر اليومي:`,{type:`table`,headers:[`الفئة`,`قيمة الإجازات المكتسبة غير المستخدمة (ج.م)`],rows:[[`العاملون بالمصنع (خطوط وإشراف)`,`700,000`],[`المقر الإداري وفريق المبيعات`,`300,000`],[`الإجمالي`,`1,000,000`]]},`سأل رئيس المجلس: «لم ندفع شيئاً من هذا بعد. هل نحتاج قيوداً؟»`],explanation:[{type:`heading`,text:`أربعة أنواع من مزايا العاملين`},{type:`table`,headers:[`النوع`,`أمثلة`,`القياس`],rows:[[`{{term:short-term-benefits|قصيرة الأجل}}`,`المرتبات، والتأمينات، والإجازات، والمكافآت المستحقة خلال 12 شهراً`,`بالمبلغ غير المخصوم عند أداء الخدمة`],[`ما بعد انتهاء الخدمة`,`المعاشات، ومكافآت نهاية الخدمة`,`اشتراكات محددة: بالاشتراك. مزايا محددة: حساب اكتواري`],[`طويلة الأجل أخرى`,`إجازات الأقدمية الطويلة، ومكافآت تُصرف بعد سنوات`,`حساب اكتواري مبسط`],[`مزايا إنهاء الخدمة`,`تعويضات التسريح الاختياري`,`عند الالتزام الذي لا يمكن سحبه`]]},{type:`heading`,text:`{{term:compensated-absences|الإجازات المستحقة}}`},`عندما يعمل الموظف يكتسب حقاً في أيام إجازة مدفوعة. إذا كانت الإجازة **تتراكم** (تُرحَّل أو يُصرف مقابلها)، فالشركة عليها **التزام** بقيمتها بمجرد اكتسابها، حتى لو لم يأخذها الموظف بعد. التكلفة تتبع طبيعة العمل: المصنع ← تكاليف صناعية، والباقي ← مصروف.`,{type:`heading`,text:`مكافأة الأداء`},`يُعترف بمكافأة الأداء عندما يكون على الشركة **التزام حالي قانوني أو {{term:constructive-obligation|استدلالي}}** بدفعها نتيجة أحداث ماضية، ويمكن تقديره بدرجة يُعتمد عليها. وإعلان المجلس للنظام للعاملين أنشأ توقعاً مشروعاً لديهم، فهو التزام استدلالي.`,`المكافأة تخص خدمة الربع كله (أكتوبر - ديسمبر). وفي 30 نوفمبر أدى العاملون شهرين من ثلاثة: 3,600,000 × 2/3 = **2,400,000**، منها 1,800,000 لعاملي المصنع و600,000 لغيرهم.`,{type:`heading`,text:`{{term:defined-benefit|نظم المزايا المحددة}}`},`لو وعدت الشركة موظفيها بمعاش أو مكافأة نهاية خدمة **بمبلغ محدد** (مثل شهر عن كل سنة خدمة)، تتحمل هي مخاطر الأعمار والرواتب المستقبلية، ويلزم **خبير اكتواري** لتقدير القيمة الحالية للالتزام. شركة النيل ليس لديها نظام كهذا حالياً، واشتراكها في التأمينات الاجتماعية نظام اشتراكات محددة كما رأينا.`,{type:`heading`,text:`حصة العاملين في الأرباح`},`يقرر قانون الشركات للعاملين في الشركات المساهمة نصيباً في الأرباح التي يتقرر توزيعها. ومعالجتها في المعايير المصرية (مصروف عند نشوء الالتزام أم توزيع ضمن حقوق الملكية) تحتاج دقة، وسنتناولها مع توزيع الأرباح في الجزء السادس {{review:V15}}.`],rule:{refs:[{id:`eas:38`,title:`معيار المحاسبة المصري رقم (38): الإجازات والمكافآت`,counterpart:`IAS 19 (الفقرات 13 و15 و19 و20)`,text:`تعترف المنشأة بالتكلفة المتوقعة للإجازات المدفوعة المتراكمة عندما يؤدي الموظفون خدمة تزيد استحقاقهم لها. وتعترف بالتكلفة المتوقعة لمدفوعات المشاركة في الأرباح والمكافآت فقط عندما يكون عليها التزام حالي قانوني أو استدلالي بسداد هذه المدفوعات نتيجة أحداث سابقة، ويمكن إجراء تقدير يُعتمد عليه للالتزام.`},{id:`law:159-1981:profit-share`,title:`حصة العاملين في الأرباح (قانون الشركات)`,counterpart:`قانون 159 لسنة 1981 ولائحته التنفيذية`,text:`يقرر القانون للعاملين في شركات المساهمة نصيباً في الأرباح التي يتقرر توزيعها، وفق نسبة وحد أقصى يحددهما القانون والنظام الأساسي. التفاصيل والمعالجة المحاسبية في الجزء السادس.`,review:`V15`}]},application:{entries:[{id:`p4e4-j1`,date:`2026-11-30`,description:`إثبات قيمة الإجازات السنوية المكتسبة غير المستخدمة حتى 30 نوفمبر`,lines:[{account:`1205`,debit:7e5},{account:`5216`,debit:3e5},{account:`2211`,credit:1e6}],steps:[`الإجازة متراكمة ← التزام عند اكتسابها`,`المصنع ← تكاليف صناعية غير مباشرة`,`المقر والمبيعات ← مصروفات مزايا العاملين`]},{id:`p4e4-j2`,date:`2026-11-30`,description:`استحقاق مكافأة الأداء عن أكتوبر ونوفمبر (ثلثا مكافأة الربع الأخير المقدرة)`,lines:[{account:`1205`,debit:18e5},{account:`5216`,debit:6e5},{account:`2211`,credit:24e5}],steps:[`الإعلان أنشأ التزاماً استدلالياً، والتحقق مرجح`,`3,600,000 × 2/3 = 2,400,000`,`تُصرف في يناير 2027 ← التزام متداول`]}],outro:[{type:`callout`,tone:`info`,title:`في ديسمبر`,text:`سيُستحق الثلث الأخير (1,200,000) وتُضاف إجازات ديسمبر، ثم تُراجع التقديرات في إقفال السنة (الجزء السادس).`}]},mistake:{title:`تأجيل المكافآت والإجازات حتى الصرف`,blocks:[`**الخطأ الأول**: تسجيل المكافأة في يناير عند الصرف. الخدمة أُديت في الربع الأخير، والتكلفة تخصه. التأجيل يُظهر ربح 2026 أعلى وربح 2027 أقل.`,`**الخطأ الثاني**: تسجيل المكافأة بمجرد التفكير فيها قبل اعتمادها وإعلانها. بلا التزام قانوني أو استدلالي لا يوجد التزام.`,`**الخطأ الثالث**: تجاهل الإجازات غير المستخدمة لأنها «أيام لا فلوس». إذا كانت تتراكم أو يُصرف مقابلها فهي التزام مالي حقيقي.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`في كل إقفال اسأل الموارد البشرية: ما الإجازات المتراكمة؟ وما المكافآت المعلنة أو المعتادة؟ ثم سجّل نصيب الفترة.`}]},quiz:{questions:[{id:`p4e4-q1`,question:`متى يُعترف بالتزام مكافأة الأداء؟`,options:[{text:`عند صرفها`,explanation:`التكلفة تخص فترة الخدمة لا تاريخ الصرف.`},{text:`عند وجود التزام قانوني أو استدلالي وإمكان تقديره بدرجة يُعتمد عليها`,correct:!0,explanation:`صحيح.`},{text:`عند اقتراحها من المدير المالي`,explanation:`الاقتراح وحده لا ينشئ التزاماً.`},{text:`في نهاية السنة فقط`,explanation:`يُعترف به في كل فترة يؤدي فيها العاملون الخدمة.`}]},{id:`p4e4-q2`,question:`مكافأة ربع سنوية مقدرة 3,600,000، ومضى شهران من الربع. كم يُستحق؟`,options:[{text:`3,600,000`,explanation:`الخدمة لم تكتمل.`},{text:`2,400,000`,correct:!0,explanation:`صحيح. ثلثا المبلغ.`},{text:`1,200,000`,explanation:`هذا الشهر الأخير فقط.`},{text:`صفر`,explanation:`الالتزام نشأ والخدمة أُديت جزئياً.`}]},{id:`p4e4-q3`,question:`أين تُسجَّل الإجازات المكتسبة لعاملي المصنع؟`,options:[{text:`تكاليف صناعية غير مباشرة`,correct:!0,explanation:`صحيح. جزء من تكلفة العمالة الصناعية.`},{text:`مصروفات إدارية`,explanation:`التكلفة تتبع طبيعة العمل.`},{text:`حقوق الملكية`,explanation:`لا علاقة لها بحقوق الملكية.`},{text:`لا تُسجَّل حتى يأخذ العامل إجازته`,explanation:`الإجازة المتراكمة التزام عند اكتسابها.`}]},{id:`p4e4-q4`,question:`ما الذي يميز نظام المزايا المحددة عن الاشتراكات المحددة؟`,options:[{text:`في المزايا المحددة تتحمل الشركة المخاطر الاكتوارية ومخاطر الاستثمار`,correct:!0,explanation:`صحيح، ولذلك يحتاج حساباً اكتوارياً.`},{text:`المزايا المحددة أرخص دائماً`,explanation:`التكلفة غير معروفة مسبقاً.`},{text:`لا فرق محاسبي`,explanation:`القياس مختلف تماماً.`},{text:`الاشتراكات المحددة تحتاج خبيراً اكتوارياً`,explanation:`العكس هو الصحيح.`}]},{id:`p4e4-q5`,question:`ما الالتزام الاستدلالي؟`,options:[{text:`التزام ينشأ من عقد مكتوب فقط`,explanation:`هذا التزام قانوني.`},{text:`التزام ينشأ من تصرفات المنشأة وإعلاناتها التي خلقت توقعاً مشروعاً لدى الآخرين`,correct:!0,explanation:`صحيح.`},{text:`التزام محتمل لا يُسجَّل`,explanation:`الالتزام الاستدلالي التزام حالي يُسجَّل.`},{text:`التزام ضريبي`,explanation:`ليس بالضرورة.`}]}],exercises:[{id:`p4e4-x1`,date:`2026-11-30`,prompt:`سجّل استحقاق مكافأة الأداء عن شهرين: **1,800,000** لعاملي المصنع و**600,000** للمقر والمبيعات.`,solution:[{account:`1205`,debit:18e5},{account:`5216`,debit:6e5},{account:`2211`,credit:24e5}],hints:[`المصنع ← تكاليف صناعية غير مباشرة.`,`الالتزام في مكافآت ومزايا عاملين مستحقة.`],explanation:`تكاليف صناعية غير مباشرة 1,800,000 ومصروفات مزايا العاملين 600,000 مدين، والمكافآت المستحقة 2,400,000 دائن.`}]},takeaways:[`المزايا قصيرة الأجل تُسجَّل عند أداء الخدمة، لا عند الصرف.`,`الإجازات المتراكمة التزام بمجرد اكتسابها.`,`المكافأة المعلنة التزام استدلالي يُستحق بقدر الخدمة المؤداة.`,`مزايا مستحقة في 30 نوفمبر: 3,400,000 ج.م.`]},_e={id:`p4e5`,part:4,number:5,title:`دفعة ملوثة: المخصصات`,subtitle:`شروط الاعتراف بالمخصص، وأفضل تقدير، والقيمة المتوقعة`,period:`نوفمبر 2026`,minutes:30,objectives:[`أن تعرّف المخصص وتفرّقه عن الالتزامات الأخرى وعن مخصصات تقييم الأصول`,`أن تطبق شروط الاعتراف الثلاثة`,`أن تقيس المخصص بأفضل تقدير باستخدام القيمة المتوقعة`,`أن تعرف ما لا يجوز تكوين مخصص له`],situation:[`في 20 نوفمبر 2026 اكتشف معمل الجودة في عينات محفوظة أن **دفعة من عصير المانجو** المنتجة في أكتوبر تحتوي على نسبة من مادة حافظة أعلى من الحد المسموح. الدفعة بيعت للموزعين وجزء منها على أرفف السوبر ماركت.`,`في 22 نوفمبر قرر مجلس الإدارة **استدعاء الدفعة بالكامل**، وأخطر الهيئة القومية لسلامة الغذاء، وأعلن الاستدعاء في الصحف ولكل العملاء، والتزم بسحب المنتج وإعدامه وتعويض العملاء بمنتج سليم.`,`قدّرت لجنة من الجودة والمبيعات والمالية التكلفة الإجمالية (نقل، وإعدام آمن، ومنتج بديل، وتعويضات للعملاء) بثلاثة سيناريوهات:`,{type:`table`,headers:[`السيناريو`,`الاحتمال`,`التكلفة (ج.م)`],rows:[[`استجابة سريعة، ومعظم المنتج ما زال في مخازن الموزعين`,`60%`,`1,000,000`],[`جزء كبير على أرفف المحلات ويحتاج جمعاً متفرقاً`,`30%`,`1,500,000`],[`مطالبات تعويض إضافية من سلاسل كبرى`,`10%`,`2,500,000`]]},`اقترح مدير المبيعات: «ولنُكوّن مخصصاً كذلك للخسائر التي قد تحدث في المبيعات الشهر القادم بسبب سمعة الاستدعاء.»`],explanation:[{type:`heading`,text:`ما المخصص؟`},`**{{term:provision|المخصص}}** التزام **غير مؤكد التوقيت أو المبلغ**. فهو يختلف عن الموردين أو المصروفات المستحقة التي نعرف مبلغها وموعدها تقريباً.`,`وانتبه للمصطلح: في الممارسة المصرية تُستخدم كلمة «مخصص» أيضاً لحسابات تخفيض الأصول مثل «مخصص الخسائر الائتمانية المتوقعة» (الجزء الثالث). تلك **تقييم لأصل** وليست التزاماً، ويحكمها معيار آخر. المخصص بمعنى المعيار 28 التزام في جانب الخصوم.`,{type:`heading`,text:`شروط الاعتراف الثلاثة (كلها معاً)`},{type:`list`,ordered:!0,items:[`**التزام حالي** (قانوني أو استدلالي) **نتيجة حدث ماضٍ**: بيع منتج مخالف + قرار الاستدعاء المُعلن ← نعم.`,`**من المرجح** أن يتطلب تسويته خروج موارد اقتصادية (أي احتمال أكبر من عدمه): الاستدعاء بدأ فعلاً ← نعم.`,`إمكانية **تقدير يُعتمد عليه** للمبلغ: السيناريوهات الثلاثة ← نعم.`]},{type:`heading`,text:`{{term:best-estimate|أفضل تقدير}}`},`يُقاس المخصص بأفضل تقدير للمبلغ اللازم لتسوية الالتزام. وعندما يتضمن الالتزام **عدداً كبيراً من البنود** (آلاف العبوات وعشرات العملاء)، تُستخدم **{{term:expected-value|القيمة المتوقعة}}**: كل نتيجة × احتمالها.`,{type:`table`,caption:`القيمة المتوقعة لتكلفة الاستدعاء (ج.م)`,headers:[`السيناريو`,`الاحتمال × التكلفة`,`المرجَّح`],rows:[[`الأول`,`60% × 1,000,000`,`600,000`],[`الثاني`,`30% × 1,500,000`,`450,000`],[`الثالث`,`10% × 2,500,000`,`250,000`],[`**القيمة المتوقعة**`,``,`**1,300,000**`]]},`أما للالتزام **المنفرد** (قضية واحدة مثلاً)، فأفضل تقدير غالباً هو **النتيجة الأرجح**، مع مراعاة النتائج الأخرى. والتسوية هنا خلال أسابيع، فلا حاجة لخصم القيمة الزمنية.`,{type:`heading`,text:`ما لا يجوز له مخصص`},{type:`list`,items:[`**خسائر التشغيل المستقبلية** (اقتراح مدير المبيعات): لا يوجد حدث ماضٍ يُلزم الشركة بها.`,`**صيانة دورية مستقبلية** للآلات: الشركة يمكنها تجنبها (ببيع الآلة مثلاً)، فلا التزام حالياً.`,`**«مخصصات احتياطية» عامة** لتنعيم الأرباح بين السنوات: ممنوعة تماماً.`]}],rule:{refs:[{id:`eas:28`,title:`معيار المحاسبة المصري رقم (28): المخصصات والأصول والالتزامات المحتملة`,counterpart:`IAS 37 (الفقرات 10 و14 و36 و39 و40 و63)`,text:`المخصص التزام غير مؤكد التوقيت أو المبلغ. ويُعترف به عندما يكون على المنشأة التزام حالي (قانوني أو استدلالي) نتيجة حدث سابق، ومن المرجح أن يتطلب سداده تدفقاً خارجاً لموارد ذات منافع اقتصادية، ويمكن تقدير قيمته بدرجة يُعتمد عليها. ويُقاس بأفضل تقدير للنفقات اللازمة لتسوية الالتزام؛ وتُستخدم القيمة المتوقعة عندما يتضمن المخصص عدداً كبيراً من البنود. ولا يُعترف بمخصصات لخسائر التشغيل المستقبلية.`}]},application:{entries:[{id:`p4e5-j1`,date:`2026-11-22`,description:`تكوين مخصص لتكلفة استدعاء دفعة عصير المانجو المخالفة`,lines:[{account:`5305`,debit:13e5},{account:`2212`,credit:13e5}],steps:[`الشروط الثلاثة متحققة`,`القيمة المتوقعة = 600,000 + 450,000 + 250,000 = 1,300,000`,`المصروف ضمن مصروفات البيع والتوزيع`,`لا مخصص لخسائر المبيعات المستقبلية`]}]},mistake:{title:`مخصصات بلا التزام حالي، أو تأجيل المخصص حتى تُدفع التكاليف`,blocks:[`**الخطأ الأول**: تكوين «مخصص خسائر مستقبلية» كما اقترح مدير المبيعات. لا حدث ماضياً يُلزم الشركة، فلا مخصص.`,`**الخطأ الثاني**: انتظار فواتير الاستدعاء لتسجيلها مصروفاً في ديسمبر. الالتزام نشأ في نوفمبر بالبيع والإعلان، ومصروفه يخص نوفمبر.`,`**الخطأ الثالث**: اختيار أسوأ سيناريو (2,500,000) «تحفظاً». المعيار يطلب أفضل تقدير، والمبالغة فيه تخالف الحياد وتُستخدم أحياناً لتنعيم الأرباح.`,`**الخطأ الرابع**: الخلط بين مخصص الاستدعاء (التزام) ومخصص الخسائر الائتمانية (تخفيض أصل) في العرض.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`اسأل ثلاثة أسئلة بالترتيب: ما **الحدث الماضي** الذي ألزمنا؟ هل الخروج **مرجح**؟ هل يمكن **تقديره**؟ ثم احسب أفضل تقدير بلا تفاؤل ولا تشاؤم.`}]},quiz:{questions:[{id:`p4e5-q1`,question:`أي مما يلي ليس شرطاً للاعتراف بالمخصص؟`,options:[{text:`التزام حالي نتيجة حدث ماضٍ`,explanation:`شرط أساسي.`},{text:`خروج موارد مرجح`,explanation:`شرط أساسي.`},{text:`سداد المبلغ قبل نهاية السنة`,correct:!0,explanation:`صحيح. توقيت السداد غير المؤكد هو طبيعة المخصص أصلاً.`},{text:`إمكانية تقدير يُعتمد عليه`,explanation:`شرط أساسي.`}]},{id:`p4e5-q2`,question:`ثلاثة سيناريوهات: 60% × 1 مليون، و30% × 1.5 مليون، و10% × 2.5 مليون. ما القيمة المتوقعة؟`,options:[{text:`1,000,000`,explanation:`هذه النتيجة الأرجح فقط.`},{text:`1,300,000`,correct:!0,explanation:`صحيح.`},{text:`1,666,667`,explanation:`هذا متوسط بسيط بلا ترجيح.`},{text:`2,500,000`,explanation:`هذا أسوأ سيناريو.`}]},{id:`p4e5-q3`,question:`اقترح مدير المبيعات مخصصاً لخسائر المبيعات المتوقعة الشهر القادم. ما الحكم؟`,options:[{text:`يُكوَّن تحفظاً`,explanation:`الحيطة لا تبرر الاعتراف بالتزام غير موجود.`},{text:`لا يجوز؛ خسائر التشغيل المستقبلية ليست التزاماً حالياً`,correct:!0,explanation:`صحيح.`},{text:`يُكوَّن بنصف المبلغ`,explanation:`لا أساس لذلك.`},{text:`يُفصح عنه كأصل محتمل`,explanation:`ليس أصلاً أصلاً.`}]},{id:`p4e5-q4`,question:`متى تُستخدم النتيجة الأرجح بدلاً من القيمة المتوقعة؟`,options:[{text:`عند قياس التزام منفرد مثل قضية واحدة`,correct:!0,explanation:`صحيح، مع مراعاة النتائج الأخرى.`},{text:`عند وجود آلاف البنود`,explanation:`هنا تُستخدم القيمة المتوقعة.`},{text:`دائماً`,explanation:`يتوقف على طبيعة الالتزام.`},{text:`أبداً`,explanation:`تُستخدم للالتزامات المنفردة.`}]},{id:`p4e5-q5`,question:`«مخصص الخسائر الائتمانية المتوقعة» من الجزء الثالث هو:`,options:[{text:`مخصص وفق المعيار 28 يظهر في الالتزامات`,explanation:`هو تخفيض لقيمة أصل لا التزام.`},{text:`تخفيض لقيمة أصل (العملاء) وفق معيار الأدوات المالية`,correct:!0,explanation:`صحيح؛ الاسم متشابه والطبيعة مختلفة.`},{text:`احتياطي في حقوق الملكية`,explanation:`ليس احتياطياً.`},{text:`التزام محتمل`,explanation:`ليس كذلك.`}]}],exercises:[{id:`p4e5-x1`,date:`2026-11-22`,prompt:`سجّل مخصص استدعاء المنتجات بالقيمة المتوقعة: 60% × **1,000,000**، و30% × **1,500,000**، و10% × **2,500,000**.`,solution:[{account:`5305`,debit:13e5},{account:`2212`,credit:13e5}],hints:[`احسب القيمة المتوقعة أولاً.`,`المصروف: مصروفات استدعاء منتجات.`],explanation:`مصروفات استدعاء منتجات مدين 1,300,000، ومخصص استدعاء منتجات دائن.`}]},takeaways:[`المخصص التزام غير مؤكد التوقيت أو المبلغ.`,`ثلاثة شروط معاً: التزام حالي من حدث ماضٍ، وخروج مرجح، وتقدير يُعتمد عليه.`,`أفضل تقدير: القيمة المتوقعة للبنود الكثيرة، والأرجح للالتزام المنفرد.`,`لا مخصصات لخسائر مستقبلية ولا لتنعيم الأرباح. مخصص الاستدعاء 1,300,000 ج.م.`]},ve={id:`p4e6`,part:4,number:6,title:`ما قد يحدث: الالتزامات والأصول المحتملة`,subtitle:`القضايا والمطالبات، والإفصاح، واستخدام المخصص ورده، والتعويض المؤكد`,period:`ديسمبر 2026`,minutes:30,objectives:[`أن تفرّق بين المخصص والالتزام المحتمل حسب درجة الاحتمال`,`أن تعرف متى يُفصح عن الالتزام المحتمل ومتى يُتجاهل`,`أن تعالج الأصل المحتمل، ومتى يصبح أصلاً يُعترف به`,`أن تسجّل استخدام المخصص ورد الزائد منه`],situation:[`ثلاثة أحداث في ديسمبر 2026:`,{type:`list`,ordered:!0,items:[`**3 ديسمبر**: رفع موزع سابق في الإسكندرية دعوى على الشركة يطالب بتعويض **5,000,000 ج.م**، مدعياً أن الشركة أنهت تعاقده دون إخطار كافٍ. رأي المستشار القانوني المكتوب: موقف الشركة قوي والعقد يسمح بالإنهاء، **احتمال الخسارة ممكن لكنه غير مرجح**.`,`**10 ديسمبر**: انتهى الاستدعاء. التكلفة الفعلية المسددة **1,150,000 ج.م**، أقل من المخصص (1,300,000)، ولا توجد مطالبات أخرى متوقعة.`,`**20 ديسمبر**: بعد أن قدّمت الشركة مطالبة لشركة التأمين عن تلف ماكينة التغليف (الجزء الثاني)، وصلها **خطاب نهائي** من شركة التأمين بقبول المطالبة وسداد **1,000,000 ج.م** في يناير. وكانت الشركة قد أبلغت مراقب الحسابات بالمطالبة في أكتوبر دون تسجيلها.`]}],explanation:[{type:`heading`,text:`سلّم الاحتمالات`},`المعيار يربط المعالجة بدرجة احتمال خروج الموارد:`,{type:`table`,headers:[`الاحتمال`,`المعالجة`],rows:[[`مرجح (أكبر من عدمه) ويمكن تقديره`,`**مخصص** يُعترف به في الميزانية`],[`ممكن لكنه غير مرجح`,`**{{term:contingent-liability|التزام محتمل}}**: لا قيد، **إفصاح** في الإيضاحات`],[`بعيد الاحتمال`,`لا قيد ولا إفصاح`]]},`دعوى الموزع السابق في الدرجة الثانية: لا قيد، لكن إيضاح يصف طبيعة الدعوى، وتقدير أثرها المالي (حتى 5 ملايين)، وأوجه عدم التأكد. ويُعاد التقييم في كل فترة؛ فإذا أصبحت الخسارة مرجحة يُكوَّن مخصص.`,{type:`callout`,tone:`law`,title:`نموذج إيضاح (مختصر)`,text:`«أقام أحد الموزعين السابقين دعوى ضد الشركة يطالب فيها بتعويض قدره 5 ملايين جنيه عن إنهاء التعاقد. وترى الإدارة، استناداً إلى رأي المستشار القانوني، أن موقف الشركة قوي، ولذلك لم يُكوَّن مخصص لهذه الدعوى.»`},{type:`heading`,text:`استخدام المخصص ورد الزائد`},`المخصص يُستخدم **فقط** للنفقات التي كُوّن من أجلها. التكلفة الفعلية 1,150,000 تُخصم منه، والباقي **150,000** لم يعد له حاجة، فيُرد بتخفيض المصروف نفسه. وهذا ليس خطأ في التقدير السابق؛ بل معلومة جديدة تُعالج في فترتها.`,{type:`heading`,text:`{{term:contingent-asset|الأصل المحتمل}}`},`المعيار غير متماثل عمداً: الأصول المحتملة **لا يُعترف بها** حتى تصبح **{{term:virtually-certain|مؤكدة تقريباً}}**، بينما الالتزامات يُعترف بها عند الترجيح. والسبب الحياد مع تجنب تسجيل دخل قد لا يتحقق.`,{type:`table`,headers:[`حالة مطالبة التأمين`,`المعالجة`],rows:[[`أكتوبر: مطالبة مقدمة، والنتيجة غير معروفة`,`لا قيد؛ إفصاح فقط إذا كان التدفق مرجحاً`],[`20 ديسمبر: خطاب قبول نهائي بالمبلغ`,`مؤكد تقريباً ← **أصل** (مدينون) و**دخل** في الأرباح أو الخسائر`]]},`ويُعرض التعويض دخلاً منفصلاً، ولا يُطرح من خسارة الاضمحلال التي سُجّلت في سبتمبر.`],rule:{refs:[{id:`eas:28`,title:`معيار المحاسبة المصري رقم (28): الالتزامات والأصول المحتملة`,counterpart:`IAS 37 (الفقرات 27 و28 و31 و33 و35 و59 و61 و86 و89)`,text:`لا تعترف المنشأة بالالتزام المحتمل، وتفصح عنه ما لم يكن احتمال التدفق الخارج بعيداً. ولا تعترف بالأصل المحتمل، وتفصح عنه إذا كان التدفق الداخل مرجحاً؛ وعندما يصبح تحقق الدخل مؤكداً تقريباً، لا يعود الأصل محتملاً ويُعترف به. وتُراجع المخصصات في نهاية كل فترة وتُعدَّل لأفضل تقدير حالي، ويُرد المخصص إذا لم يعد التدفق الخارج مرجحاً، ولا يُستخدم إلا للنفقات التي كُوّن من أجلها أصلاً.`},{id:`eas:10:compensation`,title:`تعويضات اضمحلال الأصول الثابتة أو فقدها`,counterpart:`IAS 16 (الفقرة 65)`,text:`تُدرج التعويضات من أطراف أخرى عن أصول ثابتة اضمحلت أو فُقدت ضمن الأرباح أو الخسائر عندما يصبح التعويض مستحق القبض.`}]},application:{intro:[`لا قيد للدعوى؛ إيضاح فقط. القيود الثلاثة التالية:`],entries:[{id:`p4e6-j1`,date:`2026-12-10`,description:`سداد التكاليف الفعلية لاستدعاء دفعة عصير المانجو من المخصص`,lines:[{account:`2212`,debit:115e4},{account:`1250`,credit:115e4}],steps:[`التكاليف من نفس النوع الذي كُوّن له المخصص ← تُحمَّل على المخصص`,`لا مصروف جديد`]},{id:`p4e6-j2`,date:`2026-12-10`,description:`رد الجزء غير المستخدم من مخصص الاستدعاء بعد انتهائه`,lines:[{account:`2212`,debit:15e4},{account:`5305`,credit:15e4}],steps:[`1,300,000 − 1,150,000 = 150,000`,`يُرد بتخفيض المصروف نفسه`,`رصيد المخصص يصبح صفراً`]},{id:`p4e6-j3`,date:`2026-12-20`,description:`إثبات تعويض شركة التأمين عن تلف ماكينة التغليف بعد خطاب القبول النهائي`,lines:[{account:`1240`,debit:1e6},{account:`4901`,credit:1e6}],steps:[`خطاب نهائي بالمبلغ ← مؤكد تقريباً`,`حق للشركة يُحصّل في يناير ← مدينون متنوعون`,`دخل في الأرباح أو الخسائر ← إيرادات أخرى، منفصلاً عن خسارة الاضمحلال`]}],outro:[{type:`table`,caption:`ملخص المعالجات في هذا الجزء`,headers:[`البند`,`المعالجة`,`الأثر على الربح`],rows:[[`استدعاء المنتجات`,`مخصص 1,300,000، ثم استخدام 1,150,000 ورد 150,000`,`صافي مصروف 1,150,000`],[`دعوى الموزع السابق`,`التزام محتمل: إيضاح فقط`,`لا شيء`],[`تعويض التأمين`,`أصل بعد التأكد شبه الكامل`,`دخل 1,000,000`]]},{type:`callout`,tone:`success`,title:`نهاية الجزء الرابع`,text:`أصبح لدى الشركة كشف مرتبات حقيقي بالضرائب والتأمينات، ومزايا عاملين مستحقة، ومنهج واضح للمخصصات والالتزامات المحتملة. الجزء الخامس: الشركة التابعة للتوزيع والشركة الشقيقة للتغليف.`}]},mistake:{title:`تسجيل كل قضية مخصصاً، أو تسجيل التعويض قبل تأكده`,blocks:[`**الخطأ الأول**: تكوين مخصص 5 ملايين لدعوى الموزع «تحفظاً» رغم أن الخسارة غير مرجحة. الصحيح إيضاح فقط.`,`**الخطأ الثاني**: إخفاء الدعوى تماماً لأنها «غير مرجحة». الإفصاح مطلوب ما لم يكن الاحتمال بعيداً.`,`**الخطأ الثالث**: تسجيل تعويض التأمين دخلاً في أكتوبر عند تقديم المطالبة. الأصل المحتمل لا يُسجَّل قبل أن يصبح مؤكداً تقريباً.`,`**الخطأ الرابع**: تحميل نفقات أخرى غير الاستدعاء على مخصص الاستدعاء لاستنفاد رصيده، أو ترك الرصيد الزائد معلقاً. المخصص لغرضه فقط، والزائد يُرد.`,{type:`callout`,tone:`info`,title:`كيف تتجنبه؟`,text:`احصل على رأي قانوني مكتوب لكل قضية يحدد درجة الاحتمال، وراجع كل مخصص في كل إقفال: هل ما زالت الحاجة قائمة؟ وهل التقدير ما زال أفضل تقدير؟`}]},quiz:{questions:[{id:`p4e6-q1`,question:`قضية بمطالبة 5 ملايين، والمستشار يرى الخسارة ممكنة وغير مرجحة. ما المعالجة؟`,options:[{text:`مخصص 5 ملايين`,explanation:`المخصص يتطلب أن يكون الخروج مرجحاً.`},{text:`إفصاح كالتزام محتمل دون قيد`,correct:!0,explanation:`صحيح.`},{text:`تجاهل تام`,explanation:`التجاهل للاحتمال البعيد فقط.`},{text:`مخصص بنصف المبلغ`,explanation:`لا يوجد أساس لذلك.`}]},{id:`p4e6-q2`,question:`مخصص 1,300,000 والتكلفة الفعلية 1,150,000 والاستدعاء انتهى. ما مصير الفرق؟`,options:[{text:`يبقى في المخصص لاستخدامات أخرى`,explanation:`المخصص لا يُستخدم إلا لغرضه.`},{text:`يُرد بتخفيض المصروف`,correct:!0,explanation:`صحيح.`},{text:`يُحوَّل إلى الأرباح المرحلة`,explanation:`الرد يمر بالأرباح أو الخسائر للفترة.`},{text:`يُعدَّل به رصيد العام السابق`,explanation:`ليس خطأ؛ معلومة جديدة تخص الفترة الحالية.`}]},{id:`p4e6-q3`,question:`متى يُعترف بتعويض التأمين أصلاً؟`,options:[{text:`عند تقديم المطالبة`,explanation:`النتيجة غير مؤكدة بعد.`},{text:`عندما يصبح تحصيله مؤكداً تقريباً`,correct:!0,explanation:`صحيح، كاستلام خطاب القبول النهائي.`},{text:`عند استلام النقدية فقط`,explanation:`يُعترف به قبل ذلك عند التأكد شبه الكامل.`},{text:`عندما يكون مرجحاً`,explanation:`الترجيح يكفي للإفصاح عن الأصل المحتمل، لا للاعتراف.`}]},{id:`p4e6-q4`,question:`لماذا يعامل المعيار الأصول المحتملة بحذر أكبر من الالتزامات؟`,options:[{text:`لتجنب الاعتراف بدخل قد لا يتحقق أبداً`,correct:!0,explanation:`صحيح.`},{text:`لأن الأصول أقل أهمية`,explanation:`ليس هذا السبب.`},{text:`خطأ؛ المعاملة متماثلة`,explanation:`المعاملة غير متماثلة عمداً.`},{text:`لتخفيض الضرائب`,explanation:`ليس هدف المعيار.`}]},{id:`p4e6-q5`,question:`كيف يُعرض تعويض التأمين عن الماكينة التي اضمحلت؟`,options:[{text:`يُطرح من خسارة الاضمحلال المسجلة سابقاً`,explanation:`يُعرض منفصلاً كدخل.`},{text:`دخل في الأرباح أو الخسائر عند استحقاقه`,correct:!0,explanation:`صحيح.`},{text:`يُضاف لتكلفة الماكينة`,explanation:`لا يرفع تكلفة الأصل.`},{text:`في الدخل الشامل الآخر`,explanation:`يمر بالأرباح أو الخسائر.`}]}],exercises:[{id:`p4e6-x1`,date:`2026-12-10`,prompt:`انتهى الاستدعاء. سجّل **قيداً واحداً** يُثبت سداد التكاليف الفعلية **1,150,000** من البنك ورد باقي المخصص (المخصص **1,300,000**).`,solution:[{account:`2212`,debit:13e5},{account:`1250`,credit:115e4},{account:`5305`,credit:15e4}],hints:[`المخصص يُقفل بالكامل.`,`الفرق يرد للمصروف.`],explanation:`مخصص الاستدعاء مدين 1,300,000؛ البنك دائن 1,150,000، ومصروفات الاستدعاء دائن 150,000.`},{id:`p4e6-x2`,date:`2026-12-20`,prompt:`وصل خطاب نهائي من شركة التأمين بسداد **1,000,000 ج.م** في يناير. سجّل القيد.`,solution:[{account:`1240`,debit:1e6},{account:`4901`,credit:1e6}],hints:[`حق مستحق القبض.`,`دخل في الأرباح أو الخسائر.`],explanation:`مدينون متنوعون مدين، وإيرادات أخرى دائن.`}]},takeaways:[`مرجح ← مخصص. ممكن ← إفصاح. بعيد ← لا شيء.`,`الأصل المحتمل لا يُعترف به إلا عند التأكد شبه الكامل.`,`المخصص يُستخدم لغرضه فقط، والزائد يُرد.`,`صافي تكلفة الاستدعاء 1,150,000، ودخل التعويض 1,000,000 ج.م.`]},ye={title:`أكاديمية النيل للمحاسبة`,parts:[{number:1,title:`الأساس`,description:`من عقد التأسيس لأول ميزان مراجعة: الشركة المساهمة، الإطار القانوني، المعايير، القيد المزدوج، دليل الحسابات، والدورة المحاسبية.`,status:`available`,topics:[`التأسيس كشركة مساهمة`,`الإطار القانوني والتنظيمي`,`المعايير المصرية والدولية`,`الإطار المفاهيمي`,`المعادلة المحاسبية والقيد المزدوج`,`دليل الحسابات`,`الدورة المحاسبية`],episodes:[{id:`p1e1`,number:1,title:`ميلاد شركة مساهمة`,file:`parts/part-1/ep-01.json`},{id:`p1e2`,number:2,title:`القواعد اللي بتحكم اللعبة`,file:`parts/part-1/ep-02.json`},{id:`p1e3`,number:3,title:`إمتى ن
